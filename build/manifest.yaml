  - slug: shopping-cart
    title: Shopping cart
    order: 6
    dependsOn:
      - catalog-browsing
      - localization
    priority: 0
    change:
      dir: openspec/changes/sx-shopping-cart
      specCapabilities:
        - shopping-cart
    canvas:
      problem: The storefront keeps one cart per shopper session that shoppers add to, remove from and re-quantify before checking out, and several of its rules (re-add resets quantity to 1, quantity 0 or non-numeric removes the line, count is distinct lines, prices re-read from the catalog) are undocumented.
      solution: "Build a session-scoped cart usable without sign-on: add by item id, remove, batch quantity update, item count, subtotal, read-time catalog resolution of price and description, silent dropping of unresolvable items, discard on sign-out, emptying after an order is placed, and the cart screen."
      userStories:
        - As a shopper, I want to add items to a cart without signing in, so that I can collect what I want before deciding to buy.
        - As a shopper, I want to change several quantities at once and see the subtotal, so that I know what my order will cost.
        - As a shopper, I want to remove an item from my cart, so that I only buy what I still want.
      acceptanceCriteria:
        - 'Cart screen — Empty cart is displayed: the message "Your Shopping Cart is Empty." is shown and no item rows, Update Cart, total or Check Out control are shown'
        - "One cart per shopper session — First cart access in a session: an empty cart is created for that session"
        - "Anonymous cart use — Anonymous shopper adds an item: the item is added and no sign-on is requested"
        - "Add item to cart — Item not yet in the cart: the cart contains one line for EST-6 with quantity 1"
        - "Remove item from cart — Item in the cart is removed: the cart holds only EST-1"
        - "Batch quantity update — Positive quantity: EST-6 has quantity 3"
        - "Non-numeric quantity treated as zero — Letters entered as quantity: EST-6 is removed from the cart and no error is shown"
        - "Cart item count — Count of a cart with multiple units: the count is 2"
        - "Cart line contents — Line total: the EST-6 line carries its item, product, category, name and attribute details, quantity 3, unit cost 18.50 and line total 55.50"
        - "Catalog resolution at read time — Catalog price changes after the item was added: the EST-6 line shows unit cost 20.00"
        - "Unresolvable cart items — One item cannot be resolved: only EST-6 is listed, the subtotal is 18.50, the count is 2, and no error is shown"
        - "Cart subtotal — Subtotal of several lines: the subtotal is 53.50"
        - "Empty cart after order placement — Order placed: the cart holds no lines and the item count is 0"
      outOfScope:
        - Persisting a cart across sessions or devices; the legacy system never did.
        - Discounts, tax and shipping in the cart subtotal.
        - Locale-switch rules (owned by localization) and order placement (owned by checkout).
      risksAssumptions:
        - Reset-to-1 on re-add, floating-point money with no rounding rule, and the count/listing disagreement for unresolvable items are open (design.md OQ-1 to OQ-7).
      techStack: []
      affectedCode: []
      screens:
        - "Cart screen: 'Your Shopping Cart is Empty.' when there are no items; otherwise each item (attribute and name linked to the item page), a Remove link, an editable quantity of at most 10 characters and the unit price, followed by an Update Cart button, the cart subtotal and a Check Out link to the order-information screen"
