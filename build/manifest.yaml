  - slug: catalog-browsing
    title: Catalog browsing and search
    order: 4
    dependsOn:
      - localization
    priority: 0
    change:
      dir: openspec/changes/sx-catalog-browsing
      specCapabilities:
        - catalog-browsing
    canvas:
      problem: Any visitor can browse a three-level pet catalog (category, product, item), search it by keyword and see an item's prices before adding it to the cart, but that behaviour is spread across a catalog data-access component, storefront pages and a page-fragment cache, and none of it is written down.
      solution: Build the locale-aware catalog data model (categories, products, items with per-locale details and list/unit prices), read-only lookups ordered by name, OR-of-substring keyword search, paged listings with previous/next navigation, anonymous access, and the home category map, category menu, category, product, item and search result screens.
      userStories:
        - As a visitor, I want to browse pets by category and product, so that I can find an animal I am interested in.
        - As a visitor, I want to search the catalog by keyword, so that I can find items without knowing their category.
        - As a visitor, I want to see an item's list price and my price, so that I know what I will be charged before adding it to the cart.
      acceptanceCriteria:
        - 'Catalog category records — Category details stored for two locales: the Japanese name and description are returned and the category identifier is "DOGS" in both locales'
        - 'Catalog product records — Product belongs to one category: "K9-BD-01" is included, and it is not included in the listing of any other category'
        - "Catalog item records — Item prices are held to two decimal places: the list price 18.50 and unit cost 12.00 are returned exactly, without floating-point rounding"
        - "Locale-scoped catalog visibility — Item without details in the shopper's locale is hidden: \"EST-15\" is not returned"
        - "Category listing — Categories listed alphabetically: they are returned in the order Birds, Cats, Dogs, Fish, Reptiles"
        - "Product listing for a category — Products of a category listed alphabetically: they are returned in the order Bulldog, Dalmation, Poodle"
        - 'Item listing for a product — Items of a product carry their own identifiers: both items are returned, each with product identifier "K9-BD-01" and category identifier "DOGS"'
        - "Single catalog entry lookup — Item found: its category, product, product name, image, description, attributes, list price and unit cost are returned"
        - 'Search keyword parsing — Duplicate keywords collapse: the keywords searched are exactly "dog" and "puppy"'
        - "Search keyword matching — Any keyword matches: items of both products are returned"
        - "Paged catalog listings — Middle page: the 3rd and 4th items are returned, a next page exists and starts at 4"
        - "Previous-page navigation — Previous from a full page: it starts at 2"
        - "Default storefront page size — Fresh listing: the first 2 products are shown and a Next link is offered"
        - "Anonymous catalog access — Visitor who is not signed on browses: the catalog content is shown and no sign-on is requested"
        - "Read-only catalog operations and failure behaviour — Catalog store unavailable: the request fails with a catalog error and no partial listing is returned"
        - "Cached catalog listings — Cached listing expires: the listing is regenerated and the new product appears"
        - "Catalog seed data — First entry into an empty store: the bundled catalog is loaded before the home page is shown"
        - 'Catalog browsing navigation — Browse to a bulldog: the Bulldog items such as "Male Adult Bulldog" are listed, each row with an Add to Cart action'
        - "Storefront home category map — Selecting a region: the product listing of the Fish category is shown"
        - 'Item detail page — Item detail displayed: the title reads "Male Adult Bulldog", the image is shown, "List Price: $18.50" and "Your Price: $12.00" are displayed, and an Add to Cart control is offered'
        - 'Category navigation menu — Menu on every page: a "Pets" menu lists Birds, Cats, Dogs, Fish and Reptiles, and selecting Cats opens the Cats product listing'
        - "Category product listing page — Category page with more products than one page: the first 2 products are shown with name and description, a Next link is shown and no Previous link is shown"
        - 'Product item listing page — Product page displayed: each row shows "Male Adult Bulldog" or "Female Puppy Bulldog" linked to its detail page, the item description, the list price and an Add to Cart control'
        - 'Search results page — Matching items displayed: the page shows "Items matching any of: bulldog" and one row per Bulldog item with name, description, unit cost and Add to Cart'
      outOfScope:
        - Catalog administration (create, edit or delete products); none exists in the legacy system.
        - Cart contents, the price charged at checkout and locale switching, which belong to shopping-cart, checkout and localization.
        - Per-locale suffixed tables and locale-aware keyword tokenising, which are unreachable legacy code.
      risksAssumptions:
        - Search case handling, which price the product listing shows, item ordering, previous-page arithmetic and cache keying are disputed in design.md.
        - Whether the rebuild keeps the catalog seeding facility is open (design.md Q6).
      techStack: []
      affectedCode: []
      screens:
        - "Item detail screen: the item's attribute and product name, its image, a List Price, a Your Price (the unit cost the customer pays) and an Add to Cart link"
        - "Home screen: a picture map linking to the Birds, Fish, Dogs, Reptiles and Cats categories"
