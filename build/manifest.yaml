  - slug: order-approval
    title: Order approval
    order: 8
    dependsOn:
      - sign-on
      - checkout
    priority: 0
    change:
      dir: openspec/changes/sx-order-approval
      specCapabilities:
        - order-approval
    canvas:
      problem: The legacy system decides which orders need a human decision, lets an administrator approve or deny them and feeds the outcome into fulfilment and notification, but none of it is written down outside a short user guide that disagrees with the code on the approval threshold.
      solution: Build automatic approval by per-locale threshold, the pending-order review workflow with batched approve/deny commits, idempotent application of decisions to PENDING orders only, hand-off of outcomes to fulfilment and notification, administrator order listing by status, the sales revenue and order-count reports, and the administrator screens.
      userStories:
        - As an administrator, I want to see pending orders and approve or deny them in one commit, so that orders over the automatic limit are reviewed.
        - As an administrator, I want a read-only view of approved, denied and completed orders, so that I can check what has been decided.
        - As an administrator, I want revenue and order-count charts by category for a date range, so that I can see how sales are going.
      acceptanceCriteria:
        - "Automatic approval threshold — Small US order is auto-approved: its status becomes APPROVED without administrator action and it does not appear among pending orders"
        - "Orders in other locales await review — Chinese-locale order of any value: it remains PENDING and is listed among pending orders"
        - 'Order summary for administrator review — Order summary fields: the summary carries the order identifier, user "j2ee", the order date, amount 612.50 and the current status'
        - "List orders by status — Pending orders requested: exactly the three pending orders are returned, each once, with a total count of 3"
        - "Order data loaded on start and refresh — Client start: orders of all four statuses and the sales chart data are loaded without any further action"
        - "Decisions take effect only on commit — Mixed commit: one approval batch containing 1001 and 1002 and one denial batch containing 1003 are submitted, and the order lists are reloaded"
        - "Asynchronous delivery of approval decisions — Decisions queued: one approval document with both entries is queued and success is returned before either order's status changes"
        - "Approval document structure — Wrong root: reading fails"
        - "Decisions apply only to pending orders — Duplicate decision: only order 1002 changes status and is notified, and order 1001 is left unchanged with no new supplier purchase order or notification"
        - "Applying an approval decision — Approval batch processed: order 1001 becomes APPROVED and a supplier purchase order is dispatched for it, order 1002 becomes DENIED with no supplier purchase order, and one notice listing both orders is sent for customer email"
        - "Warning on refresh with uncommitted changes — Refresh cancelled: no data is reloaded and order 1001 is still marked DENIED"
        - 'Busy state during server requests — Commit in progress: the status message reads "Updating data on the server..." and Approve, Deny, Commit and Refresh are disabled until the response arrives'
        - 'Server failure in the administrator client — Server unreachable: a "Fatal Error!" dialog shows the error and the client session ends'
        - 'Invalid administrator data requests — Unknown request type: it replies with an error stating it is unable to process an unknown request type "DELETE"'
        - "Sales revenue report — Revenue by category: Fish shows 60.00, Dogs shows 500.00 and the total is 560.00"
        - "Order-count report — Quantities by category: Fish shows 5, Dogs shows 1 and the total is 6"
        - "Report window and status coverage — Order on the boundary: the order is included"
        - 'Report date entry validation — Invalid date entered: the message "Dates must be in the format of MM/dd/yyyy" is shown and no report data is requested'
        - "Default report date range — First display of the sales charts: the start date shows 01/01/2001 and the end date shows 12/31/2002"
        - "Invalid report groups omitted — Group without a name: only the Fish group appears"
        - 'Administrator landing page — Landing page displayed: it shows the explanatory text, a "Launch Rich Client" control and a "logout" control'
        - "Order-management client workspace — Workspace opened: the pending-orders, non-pending-orders and sales views are available and Refresh, About and Exit can be used"
        - "Process Pending Orders display — Pending orders listed: exactly the two pending orders appear with their ID, User ID, Date, Amount and a yellow PENDING status"
        - "Process Pending Orders decisions — Bulk approve: all three rows show status APPROVED in green and nothing is submitted yet"
        - "View Non-Pending Orders display — Non-pending orders listed: the approved, denied and completed orders appear and the pending order does not"
        - "Sales charts view — Pie chart percentages: Fish is shown as 30% and Dogs as 70% of revenue"
        - "Order row date and amount display — Date shown without padding: its date is shown as 2/3/2002 and its amount as 612.50"
      outOfScope:
        - Administrator authentication itself (owned by sign-on).
        - Supplier fulfilment and customer email content; this capability only emits the triggers.
        - Reproducing JMS, XML/DTD wire formats or the Java Web Start rich client.
      risksAssumptions:
        - Auto-approval thresholds are bare literals (US under 500, Japan under 50000, every other locale including zh_CN never auto-approved) and the user guide disagrees (design.md D1).
        - The admin XML endpoint sits outside the administrator security constraint (discovery F4).
      techStack: []
      affectedCode: []
      screens:
        - "Administrator landing screen: explains that the administrator can view sales, revenue and orders by state and approve or deny pending orders, and offers two actions: launch the order-management client and log out"
        - "Sales screen: a pie chart of each category's percentage share of revenue and a bar chart of the number of orders per category, each with editable Start Date and End Date fields and a Get Data action that reloads that chart for the range"
        - "Orders by status list: for each order in a given status its id, the customer user id, the order date as M/D/YYYY, the order total value and the status; used for the non-pending view of approved, denied or committed (fulfilled) orders, kept separate from the pending view and reloaded on an explicit refresh action"
        - "Non-pending orders screen: orders that have been approved, denied or committed (fulfilled), separate from the pending-orders view, loaded on demand by a Refresh action"
        - "Process Pending Orders screen: PENDING orders in a table with columns ID, User ID, Date, Amount and Status, sortable by column, with Approve, Deny and Commit actions and colour-coded status (APPROVED green, DENIED red, PENDING yellow)"
        - "View Non-Pending Orders screen: a read-only list of APPROVED, COMPLETED and DENIED orders with the same columns as the pending-orders screen, sortable by column, with no way to change an order"
        - "Order views: a pending-orders view for approving or denying orders and a non-pending-orders view of approved, denied or committed orders, each reloadable on demand so the administrator sees the latest statuses including changes just committed"
