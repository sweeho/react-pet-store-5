  - slug: customer-notifications
    title: Customer notifications
    order: 11
    dependsOn:
      - localization
      - order-approval
      - order-fulfillment
    priority: 0
    change:
      dir: openspec/changes/sx-customer-notifications
      specCapabilities:
        - customer-notifications
    canvas:
      problem: Customers are emailed when their order is approved or denied, when part of it ships and when it completes, but the triggers, switches, content and failure handling sit across the order centre's mail producers, a shared mailer and a deployment guide.
      solution: Build the three order-status emails (approval decision, shipment, order completed) with a deployment switch each, asynchronous delivery through a queued mail request, mail request validation and formatting, sender and mail-server configuration, log-and-discard on send failure, and localized content in en_US, ja_JP and zh_CN.
      userStories:
        - As a customer, I want an email telling me whether my order was approved or denied, so that I know whether it will be fulfilled.
        - As a customer, I want an email listing what has shipped, so that I know what to expect.
        - As an operator, I want each kind of email switchable, so that a deployment can turn notifications off.
      acceptanceCriteria:
        - "Order approval decision notification — Order approved: one email with subject `Java Pet Store Order Status: 1001` is sent to `ann@example.com` stating the order was approved"
        - "Shipment notification — Partial shipment: one email with subject `Java Pet Store Order Shipped: 1001` is sent to the order's email address listing those two lines only"
        - "Order completed notification — Order completes: one email with subject `Java Pet Store Order COMPLETED: 1001` is sent to the order's email address listing all three lines"
        - "Notification sequence over an order's life — Order fulfilled in two shipments: the customer receives four emails in total: one approval, two shipment and one completion email"
        - "Independently switchable notification kinds — Shipment emails switched off: no shipment email is sent, the invoice is still applied to the order, and the other two kinds continue to be sent when their triggers occur"
        - "Missing or invalid notification switch fails fast — Switch not configured: start-up fails with a configuration error naming the missing switch and no completed-order email is sent"
        - "Asynchronous email delivery — Mail server slow: the approval is recorded without waiting for the mail server, and the approval email is sent later by the mail-sending service"
        - "Mail request structure and validation — Request missing its subject: no email is sent and processing of the request fails with a validation error"
        - "Outgoing email format — Email headers and body: the sent email has To `ann@example.com`, subject `S`, an HTML body `<b>hello</b>` encoded as UTF-8, and a sent date of 2026-09-26T10:00:00Z"
        - "Configured sender and mail server — Default sender: its From address is `customerservice@javapetstoredemo.com` and it is submitted to the configured mail server"
        - "Send failure handling — Mail server down: the failure is logged, the request is not retried, and the order's approval remains recorded"
        - "Notifications rendered in the order's locale — Japanese-locale order: the shipment email body is rendered with the ja_JP wording"
        - 'Approval decision email content — Approved order email displayed: it thanks the customer for the order, shows order id 1001, and states "approved! We will now fulfill your order."'
        - "Shipment email content — Shipment of two lines displayed: it shows order id 1001, states that this part of the order has shipped, and shows a table with headers Category, Product #, Quantity, Unit Price and two rows `FISH | FI-SW-01 | 2 | $16.50` and `DOGS | K9-BD-01 | 1 | $18.50`"
      outOfScope:
        - Retry, dead-lettering or operator alerting for failed sends; the legacy system has none.
        - Emails other than these three, such as account or password mail.
        - Partner (supplier) document exchange, owned by b2b-document-exchange.
      risksAssumptions:
        - A failed send is logged and discarded, so a customer can silently miss a notification.
      techStack: []
      affectedCode: []
      screens:
        - "Approval decision email: thanks the customer, shows the order id, and states either 'approved! We will now fulfill your order.' when APPROVED or 'denied unfortunately. Sorry we could not place your order.' when DENIED (ja_JP and zh_CN carry translated equivalents)"
        - "Shipment email: the order id, a statement that this part of the order has shipped, and the shipment contents in a table with columns Category, Product #, Quantity and Unit Price"
