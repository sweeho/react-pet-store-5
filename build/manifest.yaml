  - slug: supplier-inventory
    title: Supplier inventory
    order: 10
    dependsOn:
      - sign-on
      - order-fulfillment
    priority: 0
    change:
      dir: openspec/changes/sx-supplier-inventory
      specCapabilities:
        - supplier-inventory
    canvas:
      problem: The supplier keeps a stock level per catalog item that staff maintain through a small web interface, and updating stock is also what retries back-ordered supplier orders and sends their invoices; none of this is documented beyond the demo usage guide.
      solution: Build the supplier stock record, the batch stock update (absolute replacement, selected rows only, blank and negative values ignored per row), a single unit of work that re-attempts pending supplier orders and sends invoices after an update, the initial stock load, and the supplier home, inventory, inventory-unavailable and confirmation screens.
      userStories:
        - As supplier staff, I want to see every item's stock and set new quantities for the rows I tick, so that stock levels match the warehouse.
        - As supplier staff, I want back-ordered orders to ship automatically when I restock, so that customers are not left waiting.
      acceptanceCriteria:
        - "Supplier stock record — Stock record created for an item: exactly one stock record for EST-1 exists with quantity 10000"
        - "Stock update applies only to selected rows — Selected row with a new quantity is replaced: EST-3 has quantity 25"
        - "Negative stock quantity is ignored per row — Negative value skipped, rest of batch applied: EST-7 still has quantity 40, EST-8 has quantity 30, and the update confirmation is shown"
        - "Stock update re-attempts pending supplier orders — Back-ordered order ships after restock: the order's EST-9 line is shipped, EST-9 has quantity 15, and one invoice is sent for that order"
        - "Initial stock load — Load into empty inventory: stock records EST-1 through EST-29 exist, each with quantity 10000"
        - "Supplier home screen — Entry point shows the home screen: the home screen is shown with the back-order explanation and the Display Inventory and Logout actions"
        - "Inventory update screen — Every stock record is listed: two rows are shown, EST-1 with existing quantity 10000 and EST-2 with existing quantity 7, each with an empty New Quantity input and an unticked Update checkbox, and one Submit control is offered"
        - "Inventory unavailable state — Empty inventory: the message that there are no items in inventory is shown and no table or Submit control is shown"
        - "Inventory update confirmation screen — Confirmation after update: a screen stating that the inventory was updated successfully is shown with Display Inventory and Logout actions"
      outOfScope:
        - Supplier order fulfilment and invoice content (owned by order-fulfillment).
        - Authentication, roles and logout (owned by sign-on).
        - Additive stock receipts, stock history or an audit trail; none exist in the legacy system.
      risksAssumptions:
        - The initial-load endpoint is unguarded, invoice failures are swallowed, non-numeric input is unhandled and pending-order priority is undefined (design.md).
      techStack: []
      affectedCode: []
      screens:
        - "Inventory update screen: every stock record with its item identifier and existing quantity, a new-quantity entry field and an update selector per item, and a single submit action for all changes"
        - "Inventory unavailable state: a message that there are no items in inventory instead of the update form"
        - "Inventory screen: the current quantity of each item, a new quantity per item, a mark for which rows to update, and a submit that persists only the marked rows"
        - "Inventory screen: the current quantity of every inventory item, a new quantity and an update mark per item, and a submit that persists new quantities only for marked items, applying all marked changes in one submission"
    evidence:
