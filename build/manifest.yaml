  - slug: order-fulfillment
    title: Order fulfillment
    order: 9
    dependsOn:
      - b2b-document-exchange
      - checkout
      - order-approval
    priority: 0
    change:
      dir: openspec/changes/sx-order-fulfillment
      specCapabilities:
        - order-fulfillment
    canvas:
      problem: An order's life after placement (intake at the order processing centre, workflow status from PENDING to COMPLETED, supplier purchase orders on approval, fulfilment from stock, partial shipments and invoices) is documented only in legacy code, deployment descriptors and demo docs.
      solution: Build the purchase order record and its line items, the per-order workflow status and lifecycle, intake at the order centre, supplier purchase order generation on approval, supplier fulfilment from stock with whole-line shipment, invoicing and invoice-driven completion, with an atomicity and retry contract for every asynchronous step.
      userStories:
        - As the store, I want each approved order turned into a supplier purchase order automatically, so that stock is shipped without manual work.
        - As a supplier, I want to ship the lines I have stock for and invoice them, so that customers receive what is available while the rest waits.
        - As an administrator, I want an order to be marked completed once every line is invoiced, so that its status reflects reality.
      acceptanceCriteria:
        - "Order capture is separated from order processing and supplier fulfilment — A placed order flows to the supplier and is invoiced back: the storefront submission returns without waiting for fulfilment, the supplier receives a purchase order for it, and the order processing centre receives an invoice for every shipment the supplier makes"
        - "Purchase order record — Order stored under its incoming identifier: it is retrievable by identifier `1001` with its user id, email, date, locale, total value, contact, address, credit card and both line items"
        - "Purchase order creation is atomic — Lines start unshipped: both stored lines have shipped quantity 0 and carry their incoming category, product, item, line number, quantity and unit price"
        - 'Single stored contact serves as billing and shipping contact — Billing contact differs from shipping contact on intake: both the billing and the shipping contact read back as "B. Receiver"'
        - "Purchase order deletion removes its dependents — Deleting an order: none of the contact, address, credit card or line items remain stored"
        - "Purchase order snapshot — Snapshot read after the loading transaction ends: the snapshot still returns both lines with their shipped quantities 0 and 2 and all header, contact and card fields"
        - "Line item attributes and immutability — Catalog price change does not alter a stored line: the stored line still carries unit price 16.50"
        - "Line item creation requires an initial shipped quantity — Line copied with a stated shipped quantity: the new line has 4 units of `EST-2` at 12.00, the same category, product and line number, and shipped quantity 0"
        - "Order workflow status record — One status per order: exactly one status, APPROVED, is returned"
        - "Order workflow lifecycle — Approval: its status becomes APPROVED"
        - "Starting order workflow tracking — Tracking started for a new order: a record for `1001` exists with status PENDING"
        - "Reading and updating order workflow status — Status update of an existing order: reading the status of `1001` returns APPROVED"
        - "Listing orders by workflow status — Orders listed by status: exactly `1001` and `1003` are returned"
        - "Workflow tracking operations are transactional — Status change rolled back with its triggering step: the status of `1001` is still PENDING"
        - "Order intake at the order processing centre — New order received: order `1001` is stored and its workflow status is PENDING before approval is evaluated"
        - "Supplier purchase order generation on approval — Approved order produces one supplier purchase order: its status is APPROVED and exactly one supplier purchase order for `1001` is sent containing the ship-to block and both lines"
        - "Batched customer status notification after an approval batch — Mixed approval batch: one supplier purchase order for `1001` is sent first, followed by one notification covering both `1001` and `1002`"
        - "Recording supplier shipments against an order — Invoice applied to matching lines: the `EST-1` line has shipped quantity 2 and the `EST-6` line still has shipped quantity 0"
        - "Order completion evaluation on invoice receipt — Final invoice completes the order: the status of `1001` becomes COMPLETED and one completed-order notice for `1001` is raised"
        - "Order processing steps are atomic and retried — Failure while sending after a status change: `1001` remains PENDING, no supplier purchase order or notification for the batch is delivered, and the batch is processed again later"
        - "Supplier purchase order record — Supplier orders listed by status: `1001` and `1003` are each returned exactly once"
        - "Supplier purchase order creation — Supplier order created as pending: supplier order `1001` has status PENDING, one shipping contact, and two lines each with shipped quantity 0"
        - "Supplier purchase order statuses — Fulfilled supplier order: its status becomes COMPLETED"
        - "Supplier purchase order deletion removes its dependents — Deleting a supplier order: none of the contact, address or line items remain stored"
        - "Supplier handling of a received purchase order — Nothing in stock on receipt: `1001` is stored as PENDING and no invoice is sent"
        - "Whole-line shipment from stock — Insufficient stock for a line: no units of the line ship and stock of `EST-1` remains 3"
        - "Partial shipment across lines and supplier order completion — One of two lines can ship: the `EST-1` line is shipped, the `EST-6` line is not, and the order stays PENDING"
        - "Supplier invoice content — Invoice lists only this attempt's lines: the invoice for that attempt lists only the `EST-6` line, the original order date and today's date as shipping date"
        - "Re-fulfilment of pending supplier orders on stock update — Stock update releases a waiting order: the supplier order ships and becomes COMPLETED, an invoice is sent, and the customer order becomes COMPLETED without further administrator action"
        - "Supplier message channels — Invoice published after stock update: its invoice is published on the invoice channel and received by the order processing centre"
        - "Workflow step failures preserve their root cause — Handler fails: a workflow-step error is raised whose root cause is the connection error"
        - "Configured dependencies fail fast — Missing configured channel: a dependency-resolution error carrying the underlying cause is raised immediately and no fallback channel is used"
      outOfScope:
        - The approval decision itself (auto-approval thresholds, admin approval), owned by order-approval.
        - Customer notification content and mail transport, owned by customer-notifications.
        - The supplier stock table and its edit surface, owned by supplier-inventory.
        - Wire-compatible XML documents or JMS; the rebuild is a single monolith.
      risksAssumptions:
        - The single stored contact reused as billing and shipping (discovery F3), exact-equality completion that never completes an over-shipped order, and plain-text card storage are flagged in design.md.
      techStack: []
      affectedCode: []
