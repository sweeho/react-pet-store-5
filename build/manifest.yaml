  - slug: checkout
    title: Checkout and order placement
    order: 7
    dependsOn:
      - sign-on
      - customer-account
      - shopping-cart
      - b2b-document-exchange
    priority: 0
    change:
      dir: openspec/changes/sx-checkout
      specCapabilities:
        - checkout
    canvas:
      problem: A signed-in customer turns a cart into an order by confirming billing and shipping details and receives an order id immediately while the order is handed to order processing asynchronously; the order id sequence, empty-cart rejection, contact snapshot and transactional hand-off are stated nowhere.
      solution: Build the order information form pre-filled from the account, required-field rules for billing and shipping, empty-cart rejection, purchase order contents, lines and total, the card attachment, order id generation, persistence of the order snapshot, a transactional asynchronous hand-off to order processing, error routing and the order complete screen.
      userStories:
        - As a signed-in customer, I want the billing and shipping form pre-filled from my account, so that checking out is quick.
        - As a customer, I want an order number as soon as I submit, so that I can refer to my order.
        - As a customer, I want to be told if my cart is empty when I try to order, so that I do not place an empty order.
      acceptanceCriteria:
        - "Checkout hands the order off asynchronously — Customer checks out a non-empty cart: the order information form is presented, pre-filled from the customer's account"
        - "Order information screen — Form is displayed pre-filled: the Billing Information and Shipping Information sections each show those values in the first name, last name, street address, city, state/province, postal code, country, telephone and e-mail inputs, and a Submit control is shown"
        - "Required billing and shipping contact fields — A required shipping field is blank: no order is placed and the telephone number is reported as missing"
        - "Empty-cart order rejection — Order submitted with an empty cart: no order is handed to order processing and the Order Error explaining the empty cart and the possible re-submission is shown"
        - 'Purchase order contents — Purchase order is populated at submission: the purchase order carries a new order id, user id "j2ee", contact e-mail "bill@example.com", the current timestamp as order date, both contacts, a credit card and locale en_US'
        - "Order lines and total — Two-line cart: line 0 is EST-1 quantity 2 unit cost 16.50, line 1 is EST-6 quantity 1 unit cost 18.50, and the order total is 51.50"
        - "Credit card attached to every order — Order carries a card: the purchase order handed to order processing includes a card number, card type and expiry date"
        - "Order hand-off to order processing — Successful hand-off: exactly one message containing the purchase order XML is published on the order-processing queue, and afterwards the cart is empty"
        - "Order message is enqueued within the caller's unit of work — Caller rolls back after enqueueing: the message is not delivered to order processing"
        - "Enqueue failure is raised, never silent — Queue cannot be reached: an error is raised to the caller, the caller's unit of work is aborted, and no connection is left open"
        - 'Order complete screen — Confirmation after a successful order: it shows "Your Order is Complete", the order id "10017" and a statement that a confirmation e-mail will be sent to "jane@example.com"'
        - 'Order identifier format — First and subsequent orders: they receive order ids "10011", "10012" and "10013"'
        - 'Per-prefix identifier counters — New prefix: a counter for "2002" is created and "20021" is returned'
        - 'Atomic identifier issuance — Concurrent requests for the same prefix: one receives "100121" and the other "100122", and the counter holds 22'
        - "Identifier counter record — Duplicate counter name: the insert is rejected by the uniqueness constraint"
        - "Stored purchase order total — Supplied total is persisted verbatim: the stored order value is 51.50, read from the supplied total and not re-derived from the lines"
        - "Stored purchase order contact and payment — Order contact is a snapshot: the stored order still holds the address supplied with the order"
        - "Order placement is one transaction — Failure inside order placement: the transaction is rolled back, including the order id increment and the enqueued message, and the order complete screen is not shown"
        - "Error screen selection by failure kind — Mapped failure: the empty-cart Order Error screen is shown"
        - "Consistent reads while rendering a screen — Transaction unavailable: the page is still rendered and delivered"
      outOfScope:
        - Order approval, supplier fulfilment and the confirmation email itself, which belong to order processing and notification.
        - Payment authorisation; the legacy code never charges a card.
        - Tax, shipping charges and discounts; the legacy code has none.
      risksAssumptions:
        - The hard-coded credit card, the partly swallowed hand-off failure and the broken missing-field path are open (design.md OQ-1 to OQ-7).
        - The legacy order total is summed in float while the cart subtotal uses double (discovery F2).
      techStack: []
      affectedCode: []
      screens:
        - "Order information screen: a Billing Information section and a Shipping Information section, each with first name, last name, street address (2 lines), city, state/province, zip code, country, telephone and e-mail, both pre-filled from the customer's account contact information, and a Submit control that places the order"
        - "Order complete screen: 'Your Order is Complete' with the order id and a statement that a confirmation e-mail will be sent to the order's e-mail address"
