  - slug: localization
    title: Localization
    order: 1
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-localization
      specCapabilities:
        - localization
    canvas:
      problem: The legacy storefront serves customers in US English, Japanese and Simplified Chinese, but its locale rules (default locale, switching, per-locale pages, catalog rows, prices, emails and form options) are spread across the front controller, catalog, cart, profile, orders and email templates and are written down nowhere.
      solution: "Build the storefront locale model: en_US, ja_JP and zh_CN with en_US as default, a session locale that can be switched from every page and returns the visitor to the page they were on, preferred-language application at sign-on and profile save, per-locale pages with default-locale fallback, per-locale catalog data and prices with no conversion, per-locale state/province options, UTF-8 request handling and localized order emails."
      userStories:
        - As a shopper, I want to switch the storefront language from any page, so that I can read the catalog in my own language without losing my place.
        - As a returning customer, I want the store to switch to my preferred language when I sign in, so that I do not have to change it every visit.
        - As a Japanese shopper, I want prices shown in the format and currency of my locale, so that I understand what I will pay.
      acceptanceCriteria:
        - "Supported storefront locales — Every page exists in every supported locale: that page is rendered with content authored for the requested locale"
        - "Default session locale — New visitor receives the default locale: the session locale is set to `en_US` and the request is processed in `en_US`"
        - "Locale identifier interpretation — Two-part identifier: the result is the Japanese language with country Japan"
        - "Language switching from every page — Switching language on a product page: the same product page is shown again in Japanese, the session locale is `ja_JP`, and the cart's item details are subsequently shown in `ja_JP`"
        - 'Rejected locale change — Unparseable locale code: the request fails with the error "Unable to change language to ja" and the session locale remains `en_US`'
        - "Locale change reaches server-side business state — Business operation after a switch: it reads `zh_CN`"
        - "Preferred language applied at sign-on and profile save — Customer with a Japanese preference signs on: the session locale and the cart locale become `ja_JP`"
        - "Customer preferred language — Profile created without a language: its preferred language is `en_US`"
        - "Locale-specific page resolution — Request locale overrides session locale: the Japanese definition of the page is rendered and the session locale remains `en_US`"
        - "Locale-specific catalog content — Item shown in the requested locale: the Japanese name, description, image and price are returned"
        - "Locale-specific price display — Same item viewed in two locales: the English page shows 18.50 in US currency format and the Japanese page shows 2000 in Japanese currency format, with no conversion between them"
        - "Shopping cart locale — Cart before any locale is set: item names and prices are taken from the `en_US` catalog details"
        - "Purchase order locale — Order submitted without a locale: its recorded locale is `en_US`"
        - "Localized customer emails — Japanese order: the email is rendered from the Japanese shipment template"
        - "Email price formats — Price in an English email: the unit price reads `$1,234.50`"
        - "Locale-specific state and province options — Japanese order form: the state/province choices are Tokyo, Osaka and Nagano"
        - "UTF-8 request and response encoding — Japanese text on account creation: the stored and redisplayed name is identical to the submitted Japanese text"
        - "Administrator client string catalogue — German administrator: labels, tooltips and mnemonics are taken from the German catalogue"
        - "Locale selection screen — Locale selection screen is displayed: it shows a choice list with the options US English, German, Japanese and Simplified Chinese, and a Change Locale control"
      outOfScope:
        - The core rules of catalog, cart, customer, sign-on, order processing and notification; this capability owns only their locale dimension.
        - Currency conversion; each locale carries its own price row.
        - The WAF demo locale page's German (de_DE) option, which the storefront does not support.
      risksAssumptions:
        - The zh_CN dollar price format, emails that fail rather than fall back, and locale variant parsing are open questions in design.md.
      techStack: []
      affectedCode: []
      screens:
        - "Locale selection screen: a form offering US English (en_US), German (de_DE), Japanese (ja_JP) and Simplified Chinese (zh_CN), and after a successful change a confirmation page showing the locale now in effect (legacy WAF demo page; the German option conflicts with the supported-locale list)"
