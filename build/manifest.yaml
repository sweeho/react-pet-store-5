  - slug: b2b-document-exchange
    title: Partner document exchange
    order: 2
    dependsOn: []
    priority: 0
    change:
      dir: openspec/changes/sx-b2b-document-exchange
      specCapabilities:
        - b2b-document-exchange
    canvas:
      problem: The legacy system exchanges purchase orders, supplier orders and invoices with its supplier as XML documents over asynchronous channels, and those formats are a trading-partner contract documented only in code, DTDs and XSDs.
      solution: Specify and build the document formats (PurchaseOrder, SupplierOrder, TPASupplierOrder, TPAInvoice, TPALineItem and their embedded contact, address, card and line elements), their validation and read-side rejection rules, partner order and invoice intake, and the asynchronous exchange (one supplier message per approved order, invoice fan-out to fulfilment and notification, atomic intake with redelivery).
      userStories:
        - As a supplier partner, I want to receive orders and send invoices in the document formats I already use, so that I can keep trading without changing my systems.
        - As the order centre, I want every inbound document validated against its declared schema, so that malformed partner documents are caught at intake.
        - As the order centre, I want supplier-order and invoice validation switchable per deployment, with an invalid supplier order refused when it is on, so that no order built from a bad document is persisted.
      acceptanceCriteria:
        - "Purchase order document structure — Purchase order written with two line items: the root `PurchaseOrder` element contains `OrderId`, `UserId`, `EmailId`, `OrderDate`, `ShippingInfo`, `BillingInfo`, `TotalPrice`, `CreditCard` and two `LineItem` elements, in that order"
        - "Purchase order document root check — Wrong root element: reading fails with `PurchaseOrder element expected.` and no order is produced"
        - "Purchase order date handling — Order date written: `OrderDate` contains `2002-03-15`"
        - "Contact information element — Empty email accepted: the contact is accepted with an empty email"
        - "Address element output — No second street line: exactly one `StreetName` element is produced, followed by `City`, `State`, `ZipCode` and `Country`"
        - "Address element input — Empty city: reading fails with `City element: content expected.`"
        - "Credit card element — Credit card round trip: the three values are unchanged and appear in the order `CardNumber`, `CardType`, `ExpiryDate`"
        - "Order line item element — Non-numeric quantity: reading fails and no line item is produced"
        - "Line item export excludes shipped quantity — Partly shipped line exported: the element carries quantity 5 and no shipped-quantity value"
        - "Internal supplier order document — Wrong root element: reading fails with `SupplierOrder element expected.`"
        - "Internal supplier order date handling — Unparseable supplier order date: the order date is set to the current date and reading continues"
        - "Partner supplier order document — Partner order built for an approved order: it carries the order id, order date, the nine shipping-address fields in order, and two line items each with category id, product id, item id, line number, quantity and unit price"
        - "Partner supplier order intake — Partner-format order received: an internal supplier order with the same order id, date, shipping contact and two line items is produced"
        - "Partner invoice document — Invoice for a shipment: it contains `OrderId` 1001, `UserId` `j2ee`, `OrderDate`, `ShippingDate` and two line items, in that order"
        - "Partner invoice intake — Valid invoice received: it reads order 1001 and the shipped quantities EST-1 → 2 and EST-2 → 1"
        - "Partner line item values — Zero unit price: the line item is accepted"
        - "Unique item per partner document — Duplicate item id: validation reports an error"
        - "Partner document dates — Shipping date written: `ShippingDate` contains `2002-03-16`"
        - "Required document values — Missing user id: building fails with an error naming `UserId`"
        - "Document encoding — Non-ASCII name: the document declares UTF-8 encoding and the name is encoded in UTF-8"
        - "Configurable document validation — Invoice validation switched off: only the purchase order is validated against its document type"
        - "Document type check — Mismatched document type: it is rejected with `Document not of type`"
        - "Malformed and invalid document handling — Malformed document: parsing fails and the document is not processed"
        - "Supplier order document validation — Invalid supplier order with validation enabled: the order is not persisted"
        - "Supplier order document validation — Validation disabled by deployment: the supplier-order document is processed without being validated against its schema"
        - "Schema resolution — Deployment catalog overrides bundled mapping: the schema is loaded from the deployment catalog's location"
        - "Asynchronous partner exchange — Approval yields supplier messages: two separate supplier purchase order messages are delivered to the supplier inbox"
        - "Supplier order intake is atomic — Invoice publication fails: no supplier order is recorded and the message is redelivered"
        - "Supplier invoice publication — Stock arrival ships pending orders: two invoice messages are published"
        - "Legacy version 1.0 document formats — Version 1.0 purchase order received: its ship-to and bill-to addresses, card and two line items are read and its locale is `en_US`"
      outOfScope:
        - What order fulfilment does with an invoice after intake (shipped-quantity bookkeeping, order status).
        - Customer email content on invoice receipt.
        - Supplier inventory and pending-order logic, beyond the fact that an invoice is published per shipment.
      risksAssumptions:
        - Eleven disputed or low-confidence points (design.md R1-R11) need a human ruling, including the unresolved version 1.0 formats.
        - order-fulfillment's design rules out wire-compatible XML/JMS while this capability keeps the formats; a human must settle which applies.
      techStack: []
      affectedCode: []
