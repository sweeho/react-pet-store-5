  - slug: customer-account
    title: Customer account and profile
    order: 5
    dependsOn:
      - sign-on
      - catalog-browsing
      - localization
    priority: 0
    change:
      dir: openspec/changes/sx-customer-account
      specCapabilities:
        - customer-account
    canvas:
      problem: What a customer account holds (status, contact information with postal address, credit card on file, and profile preferences for language, favourite category, My List and banners) and how it is created, edited, displayed and personalised is spread across four EJB components and the storefront web tier and is written down nowhere.
      solution: Build the customer data model (one customer per user id owning one account and one profile), all-or-nothing creation with defaults and cascading deletion, account registration and update forms with required-field rules, choice lists and an empty-field check, card expiry handling, the account information page, the My List panel and the pet-tips banner driven by profile preferences.
      userStories:
        - As a new customer, I want to enter my contact details, card and preferences once when I register, so that checkout can be pre-filled later.
        - As a signed-in customer, I want to view and edit my account information, so that my details stay current.
        - As a customer, I want a My List of products from my favourite category and pet tips I can switch on or off, so that the store feels personal.
      acceptanceCriteria:
        - 'One customer per user id — Customer created for a new user id: one customer record exists for "j2ee" with exactly one account and exactly one profile'
        - 'Account composition and status — Account read after creation: it carries a status of "active", one contact-information record and one credit-card record'
        - "Contact information record — Contact information stored with its address: reading it back returns the same four values and the same postal address"
        - "Postal address record — Two identical addresses: they are two distinct records with different identities"
        - "Credit card on file — Same card number on two records: both records exist with different identities"
        - 'Card expiry month and year — Expiry split into month and year: the month is "07" and the year is "2004"'
        - 'Malformed expiry fallback — Expiry without a separator: the month is reported as "01" and the year as "2010"'
        - "Account initialised on customer creation — New customer's account: the account status is \"active\", the contact information, its postal address and the credit card all exist with every field empty"
        - "Profile defaults on customer creation — New customer's profile: preferred language is \"en_US\", favourite category is empty, My List is on and banner is on"
        - 'Atomic customer creation — Profile creation fails: creation fails and no customer, account, contact information, address, credit card or profile exists for "newbie"'
        - "Cascading deletion of customer data — Customer deleted: none of those six records remain"
        - 'Customer lookup — Lookup by user id: the "ACID" customer is returned'
        - "Account created with supplied details — Seeded account: the account carries exactly the supplied status, contact information and card"
        - "Contact information creation paths — Created from a complete value: the names, telephone and email are copied and a new postal address record is created with the supplied address values"
        - 'Field-level read and update of account data — Update a single contact field: the telephone reads "555-000-0000" and every other contact field is unchanged'
        - "Account data access is enforced by the caller — Internal read without a role: the data store returns the record and any access decision is the calling layer's"
        - "Account registration and update — Account created at registration: a customer is created and every submitted contact, address, card and profile value is stored on it"
        - "Required contact fields on the account form — Required field missing: the submission is rejected and city is reported as missing"
        - "Profile preferences on the account form — Preferences unticked: both preferences are stored as off"
        - "Account form reference choices — Creation form defaults: language defaults to English, favourite category defaults to Birds and every choice list above is offered"
        - 'Empty-field check before submission — Validated field left empty: submission is blocked and the message "First Name is empty." is shown'
        - "My List panel — My List on: the panel lists the first 10 Fish products, each linking to its product page"
        - "Pet-tips banner — Banner for a matching category: the cats pet-tips banner is shown"
        - 'Account information page — Account page displayed: the page shows each stored contact field, the card type and card number, expiry month "07" and year "2004", the preferred language, the favourite category, "Yes" for My List and "No" for banners'
      outOfScope:
        - Credential creation, authentication and the protected-page gate (owned by sign-on).
        - Payment authorisation; the legacy system never charges the card on file.
      risksAssumptions:
        - Card data handling (design.md Q1) needs a decision before implementation; the legacy card number is stored and shown in plain text.
        - Reference lists are inconsistent between create and edit forms and the legacy expiry fallback (01/2010) is a defect candidate.
      techStack: []
      affectedCode: []
      screens:
        - "Account information screen: the signed-on customer's contact information, credit card type, card number and expiry month/year, preferred language, favourite category, and Yes/No for the My List and pet-tips banner preferences, with a link to edit the account"
