  - slug: sign-on
    title: Sign-on and access control
    order: 3
    dependsOn:
      - localization
    priority: 0
    change:
      dir: openspec/changes/sx-sign-on
      specCapabilities:
        - sign-on
    canvas:
      problem: Shoppers must sign on before seeing their account or checking out while catalog, search and cart stay anonymous, and the administration and supplier applications use a separate role-based sign-in; these credential, gating, cookie and session rules live in a servlet filter, deployment descriptors and entity-bean checks.
      solution: Build the credential store with its creation rules, sign-on with return to the originally requested page and the remember-user-name cookie, the configurable protected-page gate, two-step registration, sign-out that keeps the language, per-application session timeouts, administrator-only access to the admin and supplier surfaces, and the sign-in, sign-in error and page header screens.
      userStories:
        - As a shopper, I want to browse and fill my cart without signing in, so that I only have to identify myself when I check out or view my account.
        - As a returning customer, I want the store to remember my user name, so that signing in is quicker.
        - As a customer who was sent to sign in, I want to land back on the page I asked for, so that I can carry on where I was.
        - As an administrator, I want the admin console and supplier inventory restricted to my role, so that customers cannot reach them.
      acceptanceCriteria:
        - 'Sign-in screen — A remembered user name is present: the returning-customer user name field is pre-filled with "alice", the password field is empty, and the "Remember My User Name" checkbox is checked'
        - 'Sign-in error screen — Unknown credentials submitted: the "Sign-in Error" screen is shown with the not-found message and an invitation to try again, and the shopper is not signed on'
        - 'Storefront page header — Anonymous shopper views a page: the header shows the logo, search box, Account and Cart links, and a "Sign in" link, and no "Sign out" link'
        - 'Sign-on credential record — Credential created: exactly one credential with user id "carol" is stored'
        - 'Unique user id — Duplicate user id: no second credential is created and the "User Creation Error" screen asks for another user name'
        - "User id length limit — 26-character user id: creation fails and no credential is stored"
        - "User id wildcard characters forbidden — User id containing a percent sign: creation fails and no credential is stored"
        - "Password length limit — Password over the maximum: creation fails and no credential is stored"
        - "Credential authentication — Correct password: authentication succeeds"
        - 'Sign-on submission and return to the requested page — Valid credentials after being gated: the session is signed on as "alice" and the shopper is redirected to the account page'
        - 'Remember user name — Remember selected: a user-name cookie with value "alice" and a lifetime of 31 days is set'
        - "Protected storefront pages — Anonymous shopper opens checkout: the sign-in screen is shown instead"
        - "Protected-page gate — Signed-on user requests a protected page: the account page is served without showing the sign-on page"
        - "Exact protected-path matching — Query string ignored: the request is gated"
        - "Configurable sign-on protection — Duplicate protected-page name: only the first path is protected and a warning is logged"
        - "Storefront protection ignores configured roles — Role configured on a protected page: the page is served"
        - "Anonymous access to sign-on services — Anonymous account creation: the credential is created without any prior sign-on"
        - "Anonymous catalog and cart access — Anonymous shopper adds to cart: the item is added and no sign-on is requested"
        - "Data-layer access enforced by callers — Internal caller reads a purchase order: the data layer returns it without a role check of its own"
        - 'Two-step customer registration — Registration started from checkout: the session is signed on as "dave" and the order-information page is shown'
        - 'Storefront sign-out — Sign out with items in the cart: the "You are signed out" page is shown in Japanese, the session is no longer signed on, and the cart is empty'
        - "Storefront session idle timeout — Idle beyond 15 minutes: the session has ended and the sign-in screen is shown"
        - "Administration console restricted to administrators — Unauthenticated request for the console: the administrator sign-in form is shown instead"
        - "Administrator role assignment — Member of the administrator group: the console is shown"
        - "Administrative sign-in failure — Wrong administrator password: the login error page is shown with a link back to sign in"
        - "Administrator sign-out — Administrator signs out: the session ends and the administration landing page is shown"
        - "Administrator session idle timeout — Idle administrator: the administrator sign-in form is shown"
        - "Administration data service requires a session — Expired session calls the data service: no data is returned and the reply says the session timed out and to sign in again"
        - "Session-bound administration client launch — Client launched from the console: a launch descriptor bound to their session is returned and the client's order requests succeed without another sign-in"
        - "Supplier inventory restricted to administrators — Supplier user without the role: a message says they are not authorised to update orders and no update form is shown"
        - "Supplier sign-out — Supplier logs out: the session ends and a page with a link to re-enter the supplier application is shown"
      outOfScope:
        - Customer profile content and validation (owned by customer-account).
        - Supplier inventory and order management behaviour beyond access control.
        - Single sign-on across the storefront and the admin or supplier realms; the legacy system has none.
      risksAssumptions:
        - The legacy password maximum length is redacted in the source and passwords are stored in plain text; design.md OQ-1 to OQ-8 need a decision.
      techStack: []
      affectedCode: []
      screens:
        - "Sign-in error screen: tells the shopper that the user name and password were not found and invites them to try again"
        - "Sign-in screen: a returning-customer form (user name, password, Remember My User Name checkbox) and a new-account form (user name, password, password repeat); the user name is pre-filled and the remember box ticked when a remembered-user-name cookie is present; unknown credentials lead to a sign-in error stating the user name and password were not found"
        - "Page header (every page): store logo linking home, a keyword search box, Account and Cart links, and a Sign out link when signed on or a Sign in link otherwise"
