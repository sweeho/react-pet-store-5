  - record_key: ORDER-APPROVAL-INTEGRATION-0001
    kind: integration
    capability_key: order-approval
    requirement: >
      The system SHALL, when an administrator submits approval or denial decisions for
      pending orders, deliver those decisions to order processing as an asynchronous
      message whose body is the order-approval XML document text, sent to the
      order-approval queue.
    confidence: medium
    confidence_basis: >
      Caller, sender and queue binding are all visible. Single pass and single source
      for the delivery behaviour, so not high.
    risk_class: operational
    basis: >
      The admin business delegate serialises the OrderApproval document and sends it via
      the same async sender; the admin application's deployment binds the sender's queue
      reference to the order-approval queue instead of the order queue. The same
      component therefore routes to a different destination per deploying application.
