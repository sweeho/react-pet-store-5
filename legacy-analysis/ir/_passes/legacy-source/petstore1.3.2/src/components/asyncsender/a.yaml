records:
  - record_key: CHECKOUT-INTEGRATION-0001
    kind: integration
    capability_key: checkout
    requirement: >
      The system SHALL, when a customer places an order, hand the purchase order to
      order processing as an asynchronous message whose body is the purchase order's
      XML document text, delivered to the order-intake queue, so that order placement
      does not wait for order processing to complete.
    confidence: medium
    confidence_basis: >
      The send path, its caller and the queue binding are all visible in source and
      deployment descriptor, so the behaviour is not guessed. Not high: only one pass
      has been run, and the delivery rule has a single source (this bean) rather than
      two independent enforcement points.
    risk_class: operational
    basis: >
      The order action builds the purchase order, serialises it with toXML() and passes
      it to the async sender, which wraps the string in a text message and sends it to
      the queue it resolved at creation. The storefront deployment binds that queue
      reference to the order-processing centre's order queue.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 79
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;

            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
