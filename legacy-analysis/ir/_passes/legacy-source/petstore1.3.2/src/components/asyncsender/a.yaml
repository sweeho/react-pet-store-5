  - record_key: CHECKOUT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL enqueue an outbound order or approval message as part of the
      caller's unit of work, so that the message becomes visible to its consumer only
      if that unit of work commits.
      GIVEN a message has been handed to the sender inside a unit of work
      WHEN that unit of work rolls back
      THEN the message SHALL NOT be delivered.
    confidence: medium
    confidence_basis: >
      The transaction attribute is declared and the session is created transacted, two
      consistent signals. Held at medium because the effective behaviour depends on the
      container enlisting the JMS session in the caller's transaction, which cannot be
      observed from source alone, and only one pass has run.
    risk_class: operational
    basis: >
      The deployment descriptor declares the send method with transaction attribute
      Required, and the bean creates a transacted queue session. Filed under checkout
      as the closest capability; it applies equally to the order-approval send path.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 122
        line_end: 132
        excerpt: |
              <container-transaction>
                <method>
                  <ejb-name>AsyncSenderEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>sendAMessage</method-name>
                  <method-params>
                    <method-param>java.lang.String</method-param>
                  </method-params>
                </method>
                <trans-attribute>Required</trans-attribute>
              </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 75
        line_end: 75
        excerpt: |
              session = qConnect.createQueueSession(true,0);
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required
      jms.session: transacted (createQueueSession(true, 0))

  - record_key: CHECKOUT-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL treat a failure to enqueue an outbound message as an error
      raised to the caller, not as a silent success.
      GIVEN the messaging connection, session or send fails
      WHEN a message is being enqueued
      THEN the system SHALL release the messaging connection and raise an error that
      aborts the caller's unit of work.
    confidence: medium
    confidence_basis: >
      The catch-and-rethrow is explicit in the bean. Medium rather than high because a
      system exception rolling back the caller's transaction is container behaviour, and
      one caller (the storefront order action) does not visibly handle the error, so the
      end-to-end effect on the customer is inferred.
    risk_class: operational
    basis: >
      Any exception during connection, session creation or send is logged and rethrown
      as an EJBException; the connection is closed in a finally block. Initialisation
      failure to locate the queue or factory likewise raises an EJBException at bean
      creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 80
        line_end: 89
        excerpt: |
              }catch  (Exception e) {
                e.printStackTrace();
                throw new EJBException("askMDBToSendAMessage: Error!",e);
              } finally {
                try {
                          if( qConnect != null ) {
                    qConnect.close();
                          }
                } catch(Exception e) {}
                  }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 66
