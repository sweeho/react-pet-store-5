      exception: javax.ejb.EJBException (system exception)

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
    description: >
      Lines 155-167: the storefront order action catches ServiceLocatorException,
      XMLDocumentException and CreateException around the async send, only logs them
      (the rethrows are commented out), and then empties the cart and returns a
      successful order response with the order id. So if the sender cannot be located
      or created, or the purchase order cannot be serialised, the customer is told the
      order was placed while no message ever reaches order processing. This contradicts
      the sender's own fail-loudly behaviour (CHECKOUT-BUSINESS-RULE-0002). A human must
      decide whether the rebuild should reject order placement when handoff to order
      processing fails (recommended) or preserve the legacy silent-loss behaviour.
      The admin caller (AdminRequestBD.updateOrders) does rethrow as AdminBDException.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
    description: >
      Lines 71-121: every method of the sender, including sendAMessage, is declared
      <unchecked/> with use-caller-identity, so the component itself enforces no
      authorisation; any code in the deploying application can enqueue arbitrary text
      onto the order or order-approval queue. Whether access control is expected to be
      enforced solely upstream (storefront sign-on, admin-only pages) needs to be
      confirmed by a human; no requirement was emitted for it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/asyncsender
    description: >
      No legacy-analysis/sources/**/extracted.md documents exist in the repository, so
      no document trace could be cited for this module. The message is sent with default
      JMS delivery mode, priority and time-to-live (none set in code); whether
      persistent/guaranteed delivery was a business requirement is not stated anywhere
      in source and cannot be determined here.
