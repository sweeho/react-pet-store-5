records:
  - record_key: CHECKOUT-INTEGRATION-0001
    kind: integration
    capability_key: checkout
    requirement: >
      The system SHALL, when a customer order is placed, hand the order to order
      processing asynchronously by publishing the purchase order, serialized as an
      XML text document, as a single message on the order-processing queue, without
      waiting for order processing to act on it.
    confidence: medium
    confidence_basis: >
      The send mechanism (one text message per call, queue resolved by logical name)
      is unambiguous in the bean. That the logical queue is the order queue for the
      storefront depends on a vendor deployment descriptor outside this module, so the
      rule has one programmatic source plus one binding; pass A has not been compared.
    risk_class: operational
    basis: >
      The generic sender takes a string and sends it as a JMS TextMessage to the
      queue bound to its logical queue reference. The storefront order action calls it
      with purchaseOrder.toXML(), and the storefront deployment binds the logical queue
      to jms/opc/OrderQueue.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 68
        line_end: 79
        excerpt: |
          public void sendAMessage(String msg)  {
            QueueSession session = null;
            QueueConnection qConnect = null;
            QueueSender qSender = null;

            try {
              qConnect = qFactory.createQueueConnection();
              session = qConnect.createQueueSession(true,0);
              qSender = session.createSender(q);
              TextMessage jmsMsg = session.createTextMessage();
              jmsMsg.setText(msg);
              qSender.send(jmsMsg);
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 149
        line_end: 153
        excerpt: |
                AsyncSenderLocalHome home = (AsyncSenderLocalHome)
                  sl.getLocalHome(JNDINames.ASYNCSENDER_LOCAL_EJB_HOME);

                AsyncSender  sender= home.create();
                sender.sendAMessage(purchaseOrder.toXML());
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/sun-j2ee-ri.xml
        line_start: 496
        line_end: 499
        excerpt: |
                <resource-env-ref>
                  <resource-env-ref-name>jms/AsyncSenderQueue</resource-env-ref-name>
                  <jndi-name>jms/opc/OrderQueue</jndi-name>
