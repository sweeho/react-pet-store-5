      caller: OrderEJBAction

  - record_key: ORDER-APPROVAL-INTEGRATION-0001
    kind: integration
    capability_key: order-approval
    requirement: >
      The system SHALL, when an administrator submits order approval or denial
      decisions, deliver those decisions asynchronously to order processing by
      publishing them, serialized as an XML text document, as a single message on the
      order-approval queue.
    confidence: medium
    confidence_basis: >
      Same generic sender as CHECKOUT-INTEGRATION-0001; the queue identity comes from
      the admin application's vendor deployment descriptor, a single binding outside
      this module. Content of the approval document is not visible here.
    risk_class: operational
    basis: >
      The admin business delegate's updateOrders calls sendAMessage(oa.toXML()), and
      the admin deployment binds the sender's logical queue to jms/opc/OrderApprovalQueue.
    traces:
