  - record_key: CHECKOUT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL enqueue an outbound order-processing message only as part of
      the caller's unit of work: the send SHALL join the caller's transaction (or start
      one if none exists), so that the message is not delivered if that unit of work
      is rolled back.
    confidence: medium
    confidence_basis: >
      The declarative transaction attribute is explicit and the session is created as
      transacted, two consistent signals. Graded medium rather than high because the
      explicit transacted-session flag inside a container transaction is
      container-dependent (see finding) and pass A has not been compared. Filed under
      checkout as the closest capability; the rule applies equally to the admin
      approval path.
    risk_class: operational
    basis: >
      ejb-jar.xml declares trans-attribute Required on sendAMessage, and the bean
      opens the queue session with transacted=true.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
        line_start: 122
        line_end: 132
        excerpt: |
              <container-transaction>
                <method>
                  <ejb-name>AsyncSenderEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>sendAMessage</method-name>
                  <method-params>
                    <method-param>java.lang.String</method-param>
                  </method-params>
                </method>
                <trans-attribute>Required</trans-attribute>
              </container-transaction>
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 75
        line_end: 75
        excerpt: |
                session = qConnect.createQueueSession(true,0);
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required
      ejb.transaction_type: Container

  - record_key: CHECKOUT-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: checkout
    requirement: >
      GIVEN an outbound order-processing message is being sent
      WHEN the messaging destination cannot be resolved or the message cannot be sent
      THEN the system SHALL raise a failure to the caller (marking the enclosing unit
      of work for rollback) rather than silently discarding the message, and SHALL
      release the messaging connection in all cases.
    confidence: medium
    confidence_basis: >
      The throw and cleanup are explicit in the bean. Whether the failure actually
      reaches the customer is decided by callers outside this module, and one caller
      swallows a related failure (see conflict finding), so end-to-end behaviour is
      not established here.
    risk_class: operational
    basis: >
      ejbCreate wraps a lookup failure in EJBException; sendAMessage wraps any send
      exception in EJBException (a system exception, which rolls back a container
      transaction) and closes the connection in finally.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 58
        line_end: 66
        excerpt: |
          public void ejbCreate( ) throws CreateException {
                try {
              ServiceLocator serviceLocator = new ServiceLocator();
              qFactory = serviceLocator.getQueueConnectionFactory(JNDINames.QUEUE_CONNECTION_FACTORY);
              q = serviceLocator.getQueue(JNDINames.ASYNC_SENDER_QUEUE);
                } catch (ServiceLocatorException sle) {
              throw new EJBException("AsyncSenderEJB.ejbCreate failed", sle);
                }
          }
      - path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
        line_start: 80
        line_end: 89
        excerpt: |
              }catch  (Exception e) {
                e.printStackTrace();
                throw new EJBException("askMDBToSendAMessage: Error!",e);
              } finally {
                try {
                          if( qConnect != null ) {
                    qConnect.close();
                          }
                } catch(Exception e) {}
                  }
    stack_metadata:
      ejb.bean: AsyncSenderEJB
      ejb.transaction: Required

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
    description: >
      The sender itself raises on failure, but the storefront order action (lines
      155-157) catches ServiceLocatorException from locating the sender, prints it and
      continues (the rethrow is commented out: "// throw new AdminBDException"). The
      admin path (AdminRequestBD.updateOrders) rethrows the same failure. So a customer
      order can be confirmed without ever reaching the order queue, while an admin
      approval cannot. A human must decide whether order placement must fail when the
      order cannot be queued.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/asyncsender/src/com/sun/j2ee/blueprints/asyncsender/ejb/AsyncSenderEJB.java
    description: >
      Line 75 creates a transacted session (createQueueSession(true,0)) but never calls
      session.commit(), relying on the container-managed Required transaction to
      enlist the send. Outside a JTA transaction the message would never be
      committed. The intended delivery guarantee (at-most-once tied to the caller's
      transaction vs. independent send) is not stated anywhere; a human should confirm
      the rebuild should make enqueue atomic with order persistence.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/asyncsender/src/ejb-jar.xml
    description: >
      All methods, including sendAMessage, are declared <unchecked/> (lines 71-121) and
      the bean uses caller identity, so any co-deployed component may post arbitrary
      text to the order or order-approval queue. No authorisation rule is expressed;
      reliance on local-only access is implicit. Confirm whether the rebuild needs an
      explicit restriction. No legacy-analysis/sources/**/extracted.md documents exist
      in the tree, so no document evidence was available for this module.
