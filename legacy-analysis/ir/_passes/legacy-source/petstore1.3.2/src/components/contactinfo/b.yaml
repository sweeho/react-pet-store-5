  - record_key: B2BDOC-INTEG-0001
    kind: integration
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL represent contact information in exchanged XML documents as a
      ContactInfo element containing, in this order, FamilyName, GivenName, Address,
      Email and Phone child elements, all mandatory, identified by the public identifier
      "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD ContactInfo 1.1//EN".
    confidence: high
    confidence_basis: >
      The element order and presence are stated in the DTD and independently implemented
      in the serializer (toDOM) and parser (fromDOM), which walk the same sequence. Two
      independent layers agree within this pass.
    risk_class: operational
    basis: >
      DTD content model (FamilyName, GivenName, Address, Email, Phone); toDOM appends in
      that order; fromDOM reads first FamilyName then successive siblings in that order.
      The DTD is included by the purchase-order DTD for ShippingInfo and BillingInfo
      (outside this shard), which is why the contact element matters to partner exchange.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
        line_start: 38
        line_end: 46
        excerpt: |
          <!ELEMENT ContactInfo (FamilyName, GivenName, Address, Email, Phone)>
          <!ELEMENT FamilyName (#PCDATA)>
          <!ELEMENT GivenName (#PCDATA)>
          <!ELEMENT Email (#PCDATA)>
          <!ELEMENT Phone (#PCDATA)>

          <!ENTITY % Address PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Address 1.1//EN"
           "/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd">
          %Address;
