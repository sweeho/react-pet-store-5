  - record_key: CUSTACCT-RULE-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN contact information is supplied as a complete value (names, telephone, email
      and address)
      WHEN a contact-information record is created from it
      THEN the system SHALL copy the name, telephone and email fields and SHALL create a
      new address record from the supplied address, rather than linking to any existing
      address.
    confidence: medium
    confidence_basis: >
      Directly readable in the create/post-create pair; single source (code only), so
      medium.
    risk_class: operational
    basis: >
      The value-based create copies givenName, familyName, phone->telephone and email;
      post-create creates a fresh address from contactInfo.getAddress() and links it.
      Note the XML/value field is "phone" while the stored field is "telephone" — same
      datum, two names.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 109
        line_end: 127
        excerpt: |
            public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
              setGivenName(contactInfo.getGivenName());
              setFamilyName(contactInfo.getFamilyName());
              setTelephone(contactInfo.getPhone());
              setEmail(contactInfo.getEmail());
              return null;
            }

            public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
              try {
                ServiceLocator serviceLocator = new ServiceLocator();
                AddressLocalHome adh = (AddressLocalHome)
                    serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
                AddressLocal address = adh.create(contactInfo.getAddress());
                setAddress(address);
              } catch (ServiceLocatorException ne) {
                throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
              }
            }
    stack_metadata:
      ejb.bean: ContactInfoEJB
      ejb.transaction: Required

  - record_key: CUSTACCT-RULE-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN no contact details are supplied
      WHEN a contact-information record is created
      THEN the system SHALL create it with empty name, telephone and email values and
      SHALL create and attach a new empty address record, so that a contact record never
      exists without an address.
    confidence: medium
    confidence_basis: >
      Readable in the no-argument create pair; the "never without an address" intent is
      inferred from every create path attaching one, not stated anywhere. Single source.
    risk_class: operational
    basis: >
      The no-arg ejbCreate sets nothing; ejbPostCreate creates an empty address and links
      it. A caller outside this shard (customer AccountEJB) uses this path to create a
      blank contact for a new account. The third create path (explicit fields plus an
      existing address) links the supplied address instead of creating one.
