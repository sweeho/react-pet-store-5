  - record_key: B2BDOC-RULE-0001
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      WHEN a ContactInfo element is read from an exchanged XML document
      THEN the system SHALL reject it if FamilyName, GivenName or Phone has empty content,
      SHALL accept an empty Email, and SHALL reject any node that is not a ContactInfo
      element with the error "ContactInfo element expected.".
    confidence: medium
    confidence_basis: >
      The emptiness checks are explicit per-field flags in the parser, and the helper they
      call throws "<tag> element: content expected." when a non-optional element is
      empty. Graded medium, not high: only one layer enforces it (the DTD allows empty
      #PCDATA for all four), and the Email flag carries a commented-out "false", so the
      optional-email behaviour may have been a workaround rather than a rule.
    risk_class: operational
    basis: >
      fromDOM calls getContentAsString(child, false) for FamilyName, GivenName and Phone
      and getContentAsString(child, true /*false*/) for Email. The xmldocuments helper
      (outside this shard, XMLDocumentUtils.getContent lines 153-166) throws when
      optional is false and the text buffer is empty. A non-ContactInfo node reaches the
      final throw.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
        line_start: 143
        line_end: 161
        excerpt: |
            public static ContactInfo fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CONTACTINFO)) {
                Element child;
                ContactInfo contactInfo = new ContactInfo();
                child = XMLDocumentUtils.getFirstChild(element, XML_FAMILY_NAME, false);
                contactInfo.familyName = XMLDocumentUtils.getContentAsString(child, false);
                child = child = XMLDocumentUtils.getNextSibling(child, XML_GIVEN_NAME, false);
                contactInfo.givenName = XMLDocumentUtils.getContentAsString(child, false);
                child =  XMLDocumentUtils.getNextSibling(child, Address.XML_ADDRESS, false);
                contactInfo.address = Address.fromDOM(child);
                child = XMLDocumentUtils.getNextSibling(child, XML_EMAIL, false);
                contactInfo.email = XMLDocumentUtils.getContentAsString(child, true /*false*/);
                child = XMLDocumentUtils.getNextSibling(child, XML_PHONE, false);
                contactInfo.phone = XMLDocumentUtils.getContentAsString(child, false);
                return contactInfo;
              }
              throw new XMLDocumentException(XML_CONTACTINFO + " element expected.");
            }
    stack_metadata:
      framework: DOM
      declarative_validator: none (programmatic in fromDOM)

findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
    description: >
      Line 155 parses Email with optional=true but leaves "/*false*/" in a comment, while
      FamilyName, GivenName and Phone are mandatory-non-empty. Whether an empty email is a
      deliberate business allowance (e.g. partner documents without email) or a
      temporary workaround left in place is not stated. A human needs to decide whether
      the rebuild requires a non-empty email in exchanged documents.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd
    description: >
      The DTD declares FamilyName, GivenName, Email and Phone as #PCDATA, which permits
      empty content, whereas the parser rejects empty FamilyName, GivenName and Phone.
      DTD validation and programmatic parsing therefore disagree on whether blank names
      or phone are valid; decide which layer is authoritative.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
    description: >
      No format, length or presence validation of email or telephone exists anywhere in
      this module: all three create paths and every setter store values as given, and the
      no-argument create produces a record with null names, telephone and email. If such
      rules exist they live in callers (web forms, customer or order components) and must
      be sourced there; this module alone gives no basis for a required-field or format
      rule on stored contact data.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
    description: >
      toDOM (line 137) and toString (line 166) dereference address without a null check,
      so a contact value with no address cannot be serialised. This implies an address is
      mandatory in every outgoing document, consistent with the DTD, but it is enforced
      only by failure, not by a validation message. Confirm the rebuild should treat a
      missing address as a hard validation error.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
    description: >
      This module's descriptor also declares the AddressEJB entity (lines 85-124) with its
      own transaction attributes, duplicating what the address component presumably
      declares. Which declaration governs at deployment could not be established from
      this shard; address-level requirements were left to the address module and not
      emitted here.
