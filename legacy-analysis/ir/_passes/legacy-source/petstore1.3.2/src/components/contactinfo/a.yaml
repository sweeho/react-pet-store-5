      Explicit in the parser, single source. The Email relaxation is marked only by an
      inline comment "true /*false*/" showing it was changed from mandatory to optional,
      with no stated reason; the DTD (#PCDATA) cannot express non-empty either way.
    risk_class: operational
    basis: >
      getContentAsString(child, false) throws "<tag> element: content expected." on empty
      content for FamilyName, GivenName and Phone; Email is read with optional=true.
      A non-ContactInfo root element raises "ContactInfo element expected.".
