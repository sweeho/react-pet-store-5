  - record_key: CUSTOMER-ACCOUNT-RULE-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN a Contact Information record is created with no data supplied
      WHEN creation completes
      THEN the system SHALL create and attach a new empty Address to it, so that a
      Contact Information record never exists without an Address.
    confidence: medium
    confidence_basis: >
      Behaviour is explicit in code and has a visible caller (new customer account
      creation in the customer component), but it is a single source; the empty-address
      default is inferred from a no-argument Address create whose body is outside this shard.
    risk_class: operational
    basis: >
      The no-argument create sets no fields and, in post-create, looks up the Address home
      and creates an Address with no arguments, then attaches it. Creation fails if the
      Address home cannot be located. AccountEJB (customer component) calls this no-arg
      create when a customer account is created.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 77
        line_end: 91
        excerpt: |
          public Object ejbCreate () throws CreateException {
            return null;
          }

          public void ejbPostCreate () throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create();
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 84
        line_end: 85
        excerpt: |
          ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
          ContactInfoLocal contactInfo = cih.create();
    stack_metadata:
      ejb.bean: ContactInfoEJB
      ejb.method: ejbCreate()/ejbPostCreate()
      jndi: java:comp/env/ejb/Address

  - record_key: CHECKOUT-RULE-0001
    kind: business-rule
    capability_key: checkout
    requirement: >
      GIVEN contact details (given name, family name, telephone, email and address) are
      supplied as a single value, such as the shipping contact of an order
      WHEN a Contact Information record is created from them
      THEN the system SHALL copy the four name/phone/email values and SHALL create a new,
      separate Address record from the supplied address rather than sharing an existing one.
    confidence: medium
    confidence_basis: >
      Code path is explicit and has visible callers (purchase order and supplier order
      creation, which pass their shipping info), but single-source; filed under checkout
      because the callers are order records, which is a judgement call between checkout
      and order-fulfillment.
    risk_class: operational
    basis: >
      ejbCreate(ContactInfo) copies givenName, familyName, phone->telephone and email;
      ejbPostCreate(ContactInfo) creates a new Address from contactInfo.getAddress().
      PurchaseOrderEJB and SupplierOrderEJB call create(getShippingInfo()). Each order
      therefore holds its own snapshot copy of the contact and address, not a reference
      to the customer's profile contact.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfoEJB.java
        line_start: 109
        line_end: 127
        excerpt: |
          public Object ejbCreate(ContactInfo contactInfo) throws CreateException {
            setGivenName(contactInfo.getGivenName());
            setFamilyName(contactInfo.getFamilyName());
            setTelephone(contactInfo.getPhone());
            setEmail(contactInfo.getEmail());
            return null;
          }

          public void ejbPostCreate(ContactInfo contactInfo) throws CreateException {
            try {
              ServiceLocator serviceLocator = new ServiceLocator();
              AddressLocalHome adh = (AddressLocalHome)
                  serviceLocator.getLocalHome(JNDINames.ADDR_EJB);
              AddressLocal address = adh.create(contactInfo.getAddress());
              setAddress(address);
            } catch (ServiceLocatorException ne) {
              throw new CreateException("ContactInfoEJB error: ServiceLocator exception looking up address");
            }
          }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 215
        line_end: 218
        excerpt: |
          ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
              serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
          ContactInfoLocal cinfoloc = (ContactInfoLocal)
              cinforef.create(purchaseOrder.getShippingInfo());
    stack_metadata:
      ejb.bean: ContactInfoEJB
      ejb.method: ejbCreate(ContactInfo)/ejbPostCreate(ContactInfo)
      ejb.transaction: Required

