  - record_key: CUSTOMER-ACCOUNT-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL associate each Contact Information record with exactly one Address,
      and SHALL delete that Address when the owning Contact Information record is deleted.
    confidence: medium
    confidence_basis: >
      Declared once, in the deployment descriptor relationship (one-to-one with
      cascade-delete on the Address side); no schema foreign key in this shard to
      corroborate, so single-source medium.
    risk_class: operational
    basis: >
      The ejb-relation between ContactInfoEJB and AddressEJB is One-to-One with
      <cascade-delete/> on the AddressEJB role, so removing a contact info removes its
      address. The relationship is navigable only from ContactInfo (cmr-field "address").
    traces:
