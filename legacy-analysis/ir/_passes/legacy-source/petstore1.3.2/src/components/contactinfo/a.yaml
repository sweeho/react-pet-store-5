findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
    description: >
      The no-argument create() (used by customer account creation) is declared in
      ContactInfoLocalHome but is absent from this descriptor's method-permission and
      container-transaction lists, which name only the five-argument and value-object
      create variants (lines 224-243 and ~433-455). Its effective transaction and
      permission therefore depend on container defaults or on the customer component's
      own ejb-jar.xml, which also declares ContactInfoEJB. A human should confirm which
      descriptor is deployed and whether account creation relies on an outer transaction.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
    description: >
      Line 155 reads Email with optional=true and a comment "/*false*/", i.e. the email
      was deliberately relaxed from mandatory to optional in exchanged documents, with no
      reason recorded. The persistent entity and create paths impose no required-field
      rules at all. Decide whether the rebuild should require a non-empty email (for
      customer notifications) or keep it optional, and whether name/phone are mandatory
      outside XML exchange.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/com/sun/j2ee/blueprints/contactinfo/ejb/ContactInfo.java
    description: >
      The same datum is named "telephone" in the persistent entity and "phone" in the
      value object and XML ("Phone"); mapping is done in ContactInfoEJB create/getData.
      Not a behavioural conflict, but the rebuild must pick one name. Also toDOM() and
      toString() dereference address without a null check, so a contact without an address
      cannot be serialized; the no-arg create path always attaches one, but the value-object
      constructor does not guarantee it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/contactinfo/src/ejb-jar.xml
    description: >
      No field lengths, formats (email syntax, phone format) or nullability constraints
      exist in this module and no DDL is in this shard. Validation, if any, lives in the
      web tier or database scripts of other modules; the other pass/reconciliation should
      check there before treating contact fields as unconstrained.
