records:
  - record_key: CUSTOMER-ACCOUNT-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL persist a Contact Information record consisting of a family name,
      a given name, a telephone number, an email address, and exactly one postal Address.
    confidence: medium
    confidence_basis: >
      The field set is declared in two places in this module (deployment descriptor
      persistent fields and the entity's abstract accessors), but both are the same layer
      (container-managed persistence); no DDL is in this shard to confirm column
      nullability or lengths, so medium rather than high. Pass B not yet compared.
    risk_class: operational
    basis: >
      Four persistent string fields (telephone, familyName, email, givenName) and a
      container-managed relationship field "address" are declared in ejb-jar.xml and
      mirrored by abstract getters/setters in ContactInfoEJB. No length, format or
      nullability constraint is declared anywhere in the module.
    traces:
