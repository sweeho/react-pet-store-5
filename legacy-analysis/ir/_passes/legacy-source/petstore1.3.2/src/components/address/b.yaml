records:
  - record_key: CUSTOMER-ACCOUNT-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL persist a postal address as a record holding six text
      attributes: first street line, second street line, city, state or
      province, postal (zip) code, and country.
    confidence: medium
    confidence_basis: >
      Declared persistent-field list and the programmatic accessors agree on the
      same six fields (two places in the same component). Not high because no DDL
      for the backing table is in this shard, so column types, lengths and
      nullability cannot be seen, and pass A has not been compared.
    risk_class: operational
    basis: >
      The deployment descriptor declares exactly six container-managed fields,
      and the bean class declares matching abstract getters/setters, all typed
      String. The address is embedded in contact information (used for customer
      profile and for billing/shipping on orders); filed under customer-account
      as the owning capability of the stored record.
