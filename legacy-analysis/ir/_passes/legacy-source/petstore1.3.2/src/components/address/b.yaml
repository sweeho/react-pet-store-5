  - record_key: CUSTOMER-ACCOUNT-ENTITY-0002
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL give each stored address a system-generated identity with
      no business key, so that two addresses with identical field values are
      distinct records.
    confidence: medium
    confidence_basis: >
      The descriptor declares an unknown (Object) primary-key class and every
      create path returns null for the key, which together mean the container
      generates it. Medium because the physical key column and generator are
      vendor mapping not present in the shard.
    risk_class: operational
    basis: >
      prim-key-class is java.lang.Object (EJB 2.0 unknown primary key) and none of
      the three create methods derives a key from the address fields; no finder
      other than by primary key is declared, so addresses are never looked up by
      content.
    traces:
