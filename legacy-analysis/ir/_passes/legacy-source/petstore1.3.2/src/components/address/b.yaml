  - record_key: CUSTOMER-ACCOUNT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL allow an address to be created either empty, from six
      individual field values, or by copying another address value, and SHALL
      NOT itself reject any field as missing or malformed at the point of storage.
      GIVEN an address is created with a null field WHEN it is stored THEN the
      store accepts it unchanged.
    confidence: low
    confidence_basis: >
      The absence of validation is visible in the create methods, but required-field
      checks may live in callers or in the physical schema, neither of which is in
      this shard. The empty-create path's callers are not established here.
    risk_class: operational
    basis: >
      Three create methods copy arguments straight into fields with no checks;
      the no-argument create sets nothing. Field-level validation observed outside
      the shard (the customer web form) is the caller's responsibility, not this
      component's.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 73
        line_end: 82
