records:
  - record_key: CUSTOMER-ACCOUNT-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL persist a postal Address consisting of six text fields: first
      street line, second street line, city, state (or province), postal (zip) code and
      country. Each Address SHALL be identified by a system-generated identifier that
      carries no business meaning.
    confidence: medium
    confidence_basis: >
      The six-field shape is declared in three places (deployment descriptor persistent
      fields, the entity's abstract accessors, and the generated INSERT statement in the
      petstore application's persistence mapping), so the field set itself is solid.
      Held at medium because all three are the same persistence layer, no DDL with
      types, lengths or NULL constraints exists in this shard, and pass B has not been
      compared. The "system-generated identifier" part rests on an unknown primary key
      class (java.lang.Object) plus ejbCreate returning null, which is container
      behaviour, not an explicit statement.
    risk_class: operational
    basis: >
      ejb-jar.xml declares an entity with container-managed persistence and six
      cmp-fields (zipCode, streetName2, state, streetName1, city, country) and
      prim-key-class java.lang.Object; AddressEJB declares matching abstract
      getters/setters. The RI mapping inserts into AddressEJBTable with a container
      primary key column "__PMPrimaryKey" plus the six columns. The Address is reached
      through Contact Information (customer profile, billing and shipping), hence
      customer-account.
