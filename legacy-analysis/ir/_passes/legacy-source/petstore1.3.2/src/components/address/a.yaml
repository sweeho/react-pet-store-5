  - record_key: CUSTOMER-ACCOUNT-REQUIREMENT-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL allow any authenticated or unauthenticated internal caller to
      create, read, update and delete an Address without a role check; access to an
      Address SHALL be controlled only by access to the record that owns it (customer
      contact information, purchase order or supplier order).
    confidence: medium
    confidence_basis: >
      The descriptor explicitly marks every home and component method unchecked, which
      is a stated (declarative) permission, so better than low. Not high: only one
      source, and the second half of the sentence (owner controls access) is an
      inference from the entity exposing only local interfaces, not something written
      down. Filed under customer-account rather than sign-on because it concerns the
      address data, not sign-on; sign-on is the alternative home.
    risk_class: operational
    basis: >
      ejb-jar.xml assembly-descriptor lists create, remove, findByPrimaryKey, getData and
      every getter/setter under a single <unchecked/> method-permission, and the bean
      runs with the caller's identity. Only local (in-JVM) interfaces are declared.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
        line_start: 81
        line_end: 95
        excerpt: |2
                <security-identity>
                  <description></description>
                  <use-caller-identity></use-caller-identity>
                </security-identity>
              </entity>
            </enterprise-beans>
            <assembly-descriptor>
              <method-permission>
                <unchecked />
                <method>
                  <ejb-name>AddressEJB</ejb-name>
                  <method-intf>Local</method-intf>
                  <method-name>getCity</method-name>
                  <method-params />
                </method>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocalHome.java
        line_start: 43
        line_end: 53
        excerpt: |
          public interface AddressLocalHome extends javax.ejb.EJBLocalHome {

            public AddressLocal create(String streetName1, String streetName2, String city,
                                       String state, String zipCode, String country) throws CreateException;

            public AddressLocal create(Address address) throws CreateException;

            public AddressLocal create() throws CreateException;

            public AddressLocal findByPrimaryKey(Object key) throws FinderException;
          }
    stack_metadata:
      ejb.method_permission: unchecked (all methods)
      ejb.security_identity: use-caller-identity
      ejb.interfaces: local only

  - record_key: B2B-DOCUMENT-EXCHANGE-ENTITY-0001
    kind: entity
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL define an Address document element whose children appear in this
      fixed order: StreetName (required), a second StreetName (optional), City
      (required), State (required), ZipCode (required), Country (optional per the
      declared schema). Each child SHALL carry text content only. The schema SHALL be
      identified by the public identifier
      "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Address 1.1//EN".
    confidence: medium
    confidence_basis: >
      The content model is declared in the DTD and the public identifier is registered
      in the shared entity catalog, so the format is stated, not inferred. Held at
      medium because the parser in the same module contradicts the DTD on Country
      optionality (see B2B-DOCUMENT-EXCHANGE-BUSINESS-RULE-0002 and the conflict
      finding), so the record is disputed on that one element.
    risk_class: operational
    basis: >
      Address.dtd content model; Address.java declares the matching DTD public/system
      IDs and element names. The DTD is included by the ContactInfo DTD, which is part of
      the purchase-order document exchanged with the order centre.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
        line_start: 38
        line_end: 43
        excerpt: |
          <!ELEMENT Address (StreetName, StreetName?, City, State, ZipCode, Country?)>
          <!ELEMENT StreetName (#PCDATA)>
          <!ELEMENT City (#PCDATA)>
          <!ELEMENT State (#PCDATA)>
          <!ELEMENT ZipCode (#PCDATA)>
          <!ELEMENT Country (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 54
        line_end: 61
        excerpt: |
          public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Address 1.1//EN";
          public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd";
          public static final String XML_ADDRESS = "Address";
          public static final String XML_STREET_NAME = "StreetName";
          public static final String XML_CITY = "City";
          public static final String XML_STATE = "State";
          public static final String XML_COUNTRY = "Country";
          public static final String XML_ZIPCODE = "ZipCode";
    stack_metadata:
      dtd.public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD Address 1.1//EN"
      dtd.system_id: /com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
      disputed: true

  - record_key: B2B-DOCUMENT-EXCHANGE-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL write an Address as an Address element containing, in order,
      StreetName (first street line), City, State, ZipCode and Country. GIVEN the second
      street line is absent or empty WHEN the Address is written THEN no second
      StreetName element SHALL be emitted; otherwise it SHALL be emitted immediately
      after the first. GIVEN any other field is absent WHEN the Address is written THEN
      its element SHALL still be emitted with empty content.
    confidence: medium
    confidence_basis: >
      Single programmatic source (the serializer), read directly and unambiguous; the
      empty-content behaviour for absent values is confirmed in the shared XML helper.
      Not high because only one layer states it and pass B has not been compared. Note
      the Country element is always written although the DTD makes it optional.
    risk_class: operational
    basis: >
      Address.toDOM appends StreetName, conditionally a second StreetName, then City,
      State, ZipCode, Country. XMLDocumentUtils.appendChild writes "" when the value is
      null.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 144
        line_end: 155
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_ADDRESS);
            XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName1);
            if (streetName2 != null && !streetName2.equals("")) {
              XMLDocumentUtils.appendChild(document, root, XML_STREET_NAME, streetName2);
            }
            XMLDocumentUtils.appendChild(document, root, XML_CITY, city);
            XMLDocumentUtils.appendChild(document, root, XML_STATE, state);
            XMLDocumentUtils.appendChild(document, root, XML_ZIPCODE, zipCode);
            XMLDocumentUtils.appendChild(document, root, XML_COUNTRY, country);
            return root;
          }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 297
        line_end: 302
        excerpt: |
          public static void appendChild(Document document, Node root, String name, String value) {
                Node node = document.createElement(name);
                node.appendChild(document.createTextNode(value != null ? value : ""));
                root.appendChild(node);
                return;
          }
    stack_metadata:
      java.method: Address.toDOM

  - record_key: B2B-DOCUMENT-EXCHANGE-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL reject an incoming Address document element unless it is named
      Address and contains, in order, a non-empty StreetName, an optional second
      non-empty StreetName, and non-empty City, State, ZipCode and Country elements.
      GIVEN any required element is missing, out of order, or has empty text content
      WHEN the Address is read THEN reading SHALL fail with an error naming the
      expected element (for example "City element expected after StreetName." or
      "ZipCode element: content expected.").
    confidence: medium
    confidence_basis: >
      The parser and its helper are read directly, and the optional flags (false = must
      be present and non-empty) are unambiguous in XMLDocumentUtils. Not high, and
      marked disputed, because the declared schema makes Country optional while this
      parser requires it; which one the rebuild honours is a human decision.
    risk_class: operational
    basis: >
      Address.fromDOM calls getFirstChild/getNextSibling/getContentAsString with
      optional=false for every element except the second StreetName lookup
      (optional=true). XMLDocumentUtils throws XMLDocumentException when a non-optional
      element is not the next element sibling or has zero-length text content. A wrong
      root element raises "Address element expected.".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
        line_start: 157
        line_end: 180
        excerpt: |
          public static Address fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ADDRESS)) {
              Element child;
              Address address = new Address();
              child = XMLDocumentUtils.getFirstChild(element, XML_STREET_NAME, false);
              address.streetName1 = XMLDocumentUtils.getContentAsString(child, false);
              Element optionalChild = XMLDocumentUtils.getNextSibling(child, XML_STREET_NAME, true);
              if (optionalChild != null) {
                address.streetName2 = XMLDocumentUtils.getContentAsString(optionalChild, false);
                child = optionalChild;
              }
              child = XMLDocumentUtils.getNextSibling(child, XML_CITY, false);
              address.city = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_STATE, false);
              address.state = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_ZIPCODE, false);
              address.zipCode = XMLDocumentUtils.getContentAsString(child, false);
              child = XMLDocumentUtils.getNextSibling(child, XML_COUNTRY, false);
              address.country = XMLDocumentUtils.getContentAsString(child, false);
              return address;
            }
            throw new XMLDocumentException(XML_ADDRESS + " element expected.");
          }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 138
        line_end: 164
        excerpt: |
          public static Element getNextSibling(Element element, String name, boolean optional) throws XMLDocumentException {
                for (Node sibling = element.getNextSibling(); sibling != null; sibling = sibling.getNextSibling()) {
              if (sibling.getNodeType() == Node.ELEMENT_NODE) {
                        if (((Element) sibling).getTagName().equals(name)) {
                  return (Element) sibling;
                        }
                        break;
              }
                }
                if (!optional) {
              throw new XMLDocumentException(name + " element expected after " + element.getTagName() + ".");
                }
                return null;
          }

          public static String getContent(Element element, boolean optional) throws XMLDocumentException {
                StringBuffer buffer = new StringBuffer();
                for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
              if (child.getNodeType() == Node.TEXT_NODE || child.getNodeType() == Node.CDATA_SECTION_NODE) {
                        try {
                  buffer.append(((Text) child).getData());
                        } catch (DOMException e) {}
              }
                }
                if (!optional && buffer.length() == 0) {
              throw new XMLDocumentException(element.getTagName() + " element: content expected.");
                }
    stack_metadata:
      java.method: Address.fromDOM
      disputed: true

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/rsrc/schemas/Address.dtd
    description: >
      The Address DTD (line 38) declares Country as optional ("Country?"), but
      Address.fromDOM (Address.java lines 175-176) reads Country with optional=false and
      rejects a document without a non-empty Country, and Address.toDOM (line 153) always
      writes it. A partner document that is valid against the published schema but omits
      Country is rejected by the parser. A human must decide whether Country is required
      in the partner document format. Records B2B-DOCUMENT-EXCHANGE-ENTITY-0001 and
      B2B-DOCUMENT-EXCHANGE-BUSINESS-RULE-0002 are marked disputed on this point.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/Address.java
    description: >
      Serialization and parsing are not symmetric. toDOM (lines 144-155) writes an
      empty City/State/ZipCode/Country/StreetName element when the value is null or
      empty (XMLDocumentUtils.appendChild writes ""), but fromDOM (lines 157-180)
      rejects any of those elements with empty content. An Address stored with an empty
      required field (possible, since persistence applies no validation, see
      CUSTOMER-ACCOUNT-BUSINESS-RULE-0001) produces a document the system itself cannot
      read back. Also, an empty second street line is dropped on write and read back as
      null. A human must decide where required-field validation belongs in the rebuild
      (at capture, at persistence, or at document exchange).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/ejb-jar.xml
    description: >
      No column types, lengths, NULL constraints or format rules (postal code pattern,
      state/province code list, country code standard) exist for Address anywhere in
      this module; the only DDL-like evidence is the RI-generated SQL in
      apps/petstore/src/sun-j2ee-ri.xml, which names columns but not types. Whether
      country is free text or a code, and whether state/zip are US-only concepts or
      generic province/postal code (the web tier calls them stateOrProvince and
      postalCode), cannot be resolved from this shard. A human should confirm the
      intended address model for international (Japanese, Chinese) customers.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressLocalHome.java
    description: >
      The empty create() (line 50) is reachable (ContactInfoEJB line 86), and every
      setter is exposed, so an Address can be created and later mutated field by field.
      Whether an Address is meant to be edited in place or treated as an immutable value
      copied into each owning record (contact info, purchase order, supplier order)
      cannot be determined from this module alone; the owning modules decide. The
      rebuild's data model depends on the answer (embedded columns vs shared table).
