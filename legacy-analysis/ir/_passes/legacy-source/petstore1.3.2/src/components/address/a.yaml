  - record_key: CUSTOMER-ACCOUNT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL store Address field values exactly as supplied, applying no
      validation, trimming, case normalisation or format check at the point of
      persistence. GIVEN an Address is created WHEN any field is empty or absent THEN
      the record SHALL still be created with that field empty or absent.
    confidence: low
    confidence_basis: >
      This is a rule by absence: the create and setter paths contain no checks, and no
      declarative validator exists in this module. Absence in this shard does not prove
      absence in the application; validation of required address fields exists upstream
      in the web tier (another shard), so the rebuild may need it at a different layer.
      Graded low because the requirement records what the code does not do rather than a
      stated intent.
    risk_class: operational
    basis: >
      All three create paths copy arguments straight into the persistent fields with no
      condition, and a no-argument create produces an Address with every field unset.
      The no-argument create is reachable: ContactInfoEJB calls adh.create() and then
      populates fields afterwards.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/address/src/com/sun/j2ee/blueprints/address/ejb/AddressEJB.java
        line_start: 73
        line_end: 101
        excerpt: |
          public Object ejbCreate(String streetName1, String streetName2, String city,
                                  String state, String zipCode, String country) throws CreateException {
                                    setStreetName1(streetName1);
                                    setStreetName2(streetName2);
                                    setCity(city);
                                    setState(state);
                                    setZipCode(zipCode);
                                    setCountry(country);
                                    return null;
          }

          public void ejbPostCreate(String streetName1, String streetName2, String city,
                                    String state, String zipCode, String country) throws CreateException { }

          public Object ejbCreate(Address address) throws CreateException {
            setStreetName1(address.getStreetName1());
            setStreetName2(address.getStreetName2());
            setCity(address.getCity());
            setState(address.getState());
            setZipCode(address.getZipCode());
            setCountry(address.getCountry());
            return null;
          }

          public void ejbPostCreate(Address address) throws CreateException { }

          public Object ejbCreate() throws CreateException {
            return null;
          }
