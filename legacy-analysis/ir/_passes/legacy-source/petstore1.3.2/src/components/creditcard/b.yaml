  - record_key: B2B-DOCUMENT-EXCHANGE-INTEGRATION-0001
    kind: integration
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL represent a payment card in exchanged order documents as a
      "CreditCard" element containing "CardNumber", "CardType" and "ExpiryDate" child
      elements, in that order, each carrying text content.
    confidence: medium
    confidence_basis: >
      The module's own DTD and its serializer agree on names and order, and the
      purchase-order document embeds this element. Medium, not high, because a second
      purchase-order DTD elsewhere declares a different child order (see findings).
    risk_class: regulated
    basis: >
      CreditCard.dtd declares (CardNumber, CardType, ExpiryDate); toDOM writes the
      children in that order and fromDOM reads them in that order. PurchaseOrder.java
      calls creditCard.toDOM / CreditCard.fromDOM, so the full card number travels in
      the order document. Filed under b2b-document-exchange because the element exists
      to be embedded in the purchase-order XML format.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT CreditCard (CardNumber, CardType, ExpiryDate)>
          <!ELEMENT CardNumber (#PCDATA)>
          <!ELEMENT CardType (#PCDATA)>
          <!ELEMENT ExpiryDate (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 108
        line_end: 114
        excerpt: |
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_CREDITCARD);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_NUMBER, cardNumber);
              XMLDocumentUtils.appendChild(document, root, XML_CARD_TYPE, cardType);
              XMLDocumentUtils.appendChild(document, root, XML_EXPIRYDATE, expiryDate);
              return root;
            }
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
        line_start: 270
        line_end: 270
        excerpt: |
              root.appendChild(creditCard.toDOM(document));
    stack_metadata:
      framework: DOM / DTD
      dtd.public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD CreditCard 1.1//EN"

  - record_key: B2B-DOCUMENT-EXCHANGE-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      GIVEN an incoming document node that is not a "CreditCard" element
      WHEN the system reads payment card data from it
      THEN the system SHALL reject it with the error "CreditCard element expected."
    confidence: medium
    confidence_basis: >
      Single explicit code path with a literal message; nothing else in the module
      restates it. Child elements are read with the not-required flag, so missing
      children are tolerated, but that tolerance depends on a helper outside this
      module that I did not read.
    risk_class: operational
    basis: >
      fromDOM checks node type and tag name, otherwise throws XMLDocumentException with
      the message XML_CREDITCARD + " element expected.".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
        line_start: 116
        line_end: 130
        excerpt: |
            public static CreditCard fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_CREDITCARD)) {
                Element child;
                CreditCard creditCard = new CreditCard();
                child = XMLDocumentUtils.getFirstChild(element, XML_CARD_NUMBER, false);
                creditCard.cardNumber = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_CARD_TYPE, false);
                creditCard.cardType = XMLDocumentUtils.getContentAsString(child, false);
                child = XMLDocumentUtils.getNextSibling(child, XML_EXPIRYDATE, false);
                creditCard.expiryDate = XMLDocumentUtils.getContentAsString(child, false);
                return creditCard;
              }
              throw new XMLDocumentException(XML_CREDITCARD + " element expected.");
            }
    stack_metadata:
      framework: DOM

findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCard.java
    description: >
      Argument-order mismatch. The value-object constructor is
      CreditCard(cardNumber, expiryDate, cardType) (CreditCard.java:68), but the
      customer web action calls new CreditCard(creditCardNumber, creditCardType,
      expiryDate) (CustomerHTMLAction.java:176-178), and the entity create is
      (cardNumber, cardType, expiryDate). Taken literally, cards entered through the
      profile form are saved with type and expiry swapped. A human must confirm
      whether this defect is live in the deployed application and state the intended
      field mapping for the rebuild (presumably number/type/expiry as named).
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/rsrc/schemas/CreditCard.dtd
    description: >
      Two DTDs disagree on CreditCard child order. This module's CreditCard.dtd (and
      the serializer) use (CardNumber, CardType, ExpiryDate); the xmldocuments
      PurchaseOrder.dtd line 74 declares (CardNumber, ExpiryDate, CardType). The
      purchaseorder module's DTD imports this module's DTD. Decide which order the
      partner document format mandates.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
    description: >
      No validation of card number (length, digits, checksum), card type (allowed
      values) or expiry (format, not-in-past) exists in this module; all fields are
      free strings and the no-argument create allows a record with all three empty.
      Allowed card types appear only as UI options outside this shard. The rebuild
      needs an explicit decision on validation rules.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
    description: >
      All methods are declared unchecked (ejb-jar.xml lines 76-82) and the card number
      is stored and serialized into order documents in clear text with no masking.
      This is regulated cardholder data; a human must decide the access control,
      storage protection and masking requirements for the rebuild rather than
      carrying the legacy behaviour forward.
