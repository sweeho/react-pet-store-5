records:
  - record_key: CUSTOMER-ACCOUNT-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL persist a credit card record holding exactly three attributes:
      card number, card type and expiry date, each stored as free text. A credit card
      record SHALL be identified by a system-generated key, not by the card number,
      so two records may carry the same card number.
    confidence: medium
    confidence_basis: >
      The three fields are declared in the persistence descriptor and repeated in the
      bean's abstract accessors, so the attribute list is well supported. Not high
      because no DDL for the table exists in this module, so column types, lengths and
      NOT NULL constraints cannot be seen, and the key-generation behaviour is inferred
      from an Object primary-key class plus a create method returning null (the
      container supplies the key) rather than stated anywhere.
    risk_class: regulated
    basis: >
      ejb-jar.xml declares cmp-fields expiryDate, cardType, cardNumber with
      prim-key-class java.lang.Object; CreditCardEJB exposes String accessors for the
      same three fields and every ejbCreate returns null, leaving key generation to the
      container. No field carries a uniqueness or format constraint. The entity is
      referenced from the customer account (credit card on file) and also from the
      purchase order component; it is filed under customer-account per the capability
      list ("credit card on file").
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/ejb-jar.xml
        line_start: 52
        line_end: 68
        excerpt: |
                <persistence-type>Container</persistence-type>
                <prim-key-class>java.lang.Object</prim-key-class>
                <reentrant>False</reentrant>
                <cmp-version>2.x</cmp-version>
                <abstract-schema-name>CreditCard</abstract-schema-name>
                <cmp-field>
                  <description>no description</description>
                  <field-name>expiryDate</field-name>
                </cmp-field>
                <cmp-field>
                  <description>no description</description>
                  <field-name>cardType</field-name>
                </cmp-field>
                <cmp-field>
                  <description>no description</description>
                  <field-name>cardNumber</field-name>
                </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 50
        line_end: 57
        excerpt: |
            public abstract String getCardNumber();
            public abstract void setCardNumber(String cardNumber);

            public abstract String getCardType();
            public abstract void setCardType(String cardType);

            public abstract String getExpiryDate();
            public abstract void setExpiryDate(String expiryDate);
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: CreditCardEJB
      ejb.transaction: Required
      db.object: CreditCard (abstract schema; no DDL in module)

  - record_key: CUSTOMER-ACCOUNT-REQ-0001
    kind: requirement
    capability_key: customer-account
    requirement: >
      The system SHALL allow a credit card record to be created either empty, or from a
      card number, card type and expiry date, or by copying an existing credit card
      value, and SHALL store the supplied values as given without validating them.
      The system SHALL allow card number, card type and expiry date to be updated
      individually after creation, and SHALL return a detached copy of all three values
      on request.
    confidence: medium
    confidence_basis: >
      The three creation paths, per-field setters and the copy method are all directly
      visible in the home interface and bean. Medium, not high, because "without
      validating" is an absence observed only in this module; validation may exist in
      a calling layer (the web action that builds the expiry date) which is outside
      this shard.
    risk_class: regulated
    basis: >
      CreditCardLocalHome declares create(), create(number, type, expiry) and
      create(CreditCard); the corresponding ejbCreate methods assign values with no
      checks. CreditCardLocal exposes setters for all three fields and getData(),
      which builds a new CreditCard value object from the stored fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardLocalHome.java
        line_start: 45
        line_end: 49
        excerpt: |
              public CreditCardLocal create() throws CreateException;
              public CreditCardLocal create(String cardNumber, String cardType, String expiryDate) throws CreateException;
              public CreditCardLocal create(CreditCard creditCard) throws CreateException;

              public CreditCardLocal findByPrimaryKey(Object key) throws FinderException;
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 62
        line_end: 84
        excerpt: |
            public Object ejbCreate(String cardNumber, String cardType,
                                    String expiryDate) throws CreateException {
                                      setCardNumber(cardNumber);
                                      setCardType(cardType);
                                      setExpiryDate(expiryDate);
                                      return null;
            }

            public void ejbPostCreate(String cardNumber, String cardType,
                                      String expiryDate) throws CreateException { }

            public Object ejbCreate(CreditCard creditCard) throws CreateException {
              setCardNumber(creditCard.getCardNumber());
              setCardType(creditCard.getCardType());
              setExpiryDate(creditCard.getExpiryDate());
              return null;
            }

            public void ejbPostCreate(CreditCard creditCard) throws CreateException { }

            public Object ejbCreate() throws CreateException {
              return null;
            }
      - path: legacy-source/petstore1.3.2/src/components/creditcard/src/com/sun/j2ee/blueprints/creditcard/ejb/CreditCardEJB.java
        line_start: 109
        line_end: 115
        excerpt: |
            public CreditCard getData() {
              CreditCard creditCard = new CreditCard();
              creditCard.setCardNumber(getCardNumber());
              creditCard.setCardType(getCardType());
              creditCard.setExpiryDate(getExpiryDate());
              return creditCard;
            }
    stack_metadata:
