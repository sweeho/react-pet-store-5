records:
  - record_key: CUSTOMER-NOTIFICATIONS-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL let an operator switch each kind of customer email (order
      approval/denial, shipment invoice, order completion) on or off through a
      deployment-time boolean setting, read when the sending component starts.
      GIVEN a notification switch setting is missing or is not a boolean
      WHEN the component that sends that email starts
      THEN the system SHALL fail that component's start-up with an error, and SHALL NOT
      fall back to a default of on or off.
    confidence: medium
    confidence_basis: >
      The boolean lookup and its failure behaviour are directly visible in this module,
      and its own comment names the confirmation-mail switch as a use. The link to the
      three email kinds comes from callers in another shard (JNDINames and the mail
      message beans), which I checked only far enough to confirm they call this lookup
      and rethrow its error. Not high because this pass is the only one so far, the rule
      has a single source for the "no default" behaviour, and the deployed switch values
      are redacted in the descriptor I saw, so I cannot state the shipped default.
    risk_class: operational
    basis: >
      getBoolean(envName) looks up a named environment entry, casts it to Boolean and
      wraps any lookup or cast failure in ServiceLocatorException. It has no default
      value. The method comment names the SEND_CONFIRMATION_MAIL property. In the
      order-processing app, MailInvoiceMDB reads SEND_CONFIRMATION_MAIL through this
      method during ejbCreate and turns a ServiceLocatorException into an EJBException.
      It sends mail only when the flag is true. JNDINames declares three such switches:
      SendConfirmationMail, SendApprovalMail and SendCompletedOrderMail.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/ejb/ServiceLocator.java
        line_start: 213
        line_end: 227
        excerpt: |
              /**
               * @return the boolean value corresponding
               * to the env entry such as SEND_CONFIRMATION_MAIL property.
               */
              public boolean getBoolean(String envName) throws ServiceLocatorException {
                Boolean bool = null;
                try {
                  bool = (Boolean)ic.lookup(envName);
                } catch (NamingException ne) {
                      throw new ServiceLocatorException(ne);
                } catch (Exception e) {
                      throw new ServiceLocatorException(e);
                }
                return bool.booleanValue();
              }
      - path: legacy-source/petstore1.3.2/src/components/servicelocator/src/com/sun/j2ee/blueprints/servicelocator/web/ServiceLocator.java
        line_start: 274
        line_end: 288
        excerpt: |
