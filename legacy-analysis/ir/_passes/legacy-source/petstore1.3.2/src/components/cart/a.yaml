  - record_key: SHOPPING_CART-BR-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL let a shopper set the quantity of a cart item to a new value.
      GIVEN a new quantity less than or equal to 0
      WHEN the shopper updates the item's quantity
      THEN the system SHALL remove the item from the cart.
      GIVEN a new quantity greater than 0
      WHEN the shopper updates the item's quantity
      THEN the cart SHALL hold the item with exactly that quantity.
    confidence: medium
    confidence_basis: >
      The threshold (> 0) is explicit in code and confirmed by an in-line comment,
      so the rule's intent is stated, not inferred. Single source only; no upper
      bound or declarative validation exists in this module to corroborate it.
    risk_class: operational
    basis: >
      updateItemQuantity removes the entry, then re-inserts it only when newQty > 0,
      with the comment "remove item if it is less than or equal to 0".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |2
              public void updateItemQuantity (String itemID, int newQty) {
                  cart.remove(itemID);
                  // remove item if it is less than or equal to 0
                  if (newQty > 0) cart.put(itemID, new Integer(newQty));
              }
    stack_metadata:
      ejb.bean: ShoppingCartEJB
      ejb.transaction: Required

  - record_key: SHOPPING_CART-BR-0002
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute the cart subtotal as the sum, over every cart line,
      of the item's current catalog list price multiplied by the line quantity. The
      price SHALL be read from the catalog at the time the subtotal is requested
      (not captured when the item was added), and no rounding SHALL be applied in
      the calculation.
    confidence: medium
    confidence_basis: >
      The formula appears in two places in this module (the bean's subtotal and the
      cart value object's total cost) and they agree, but both are the same layer
      (Java), and the price-source behaviour depends on the catalog component,
      which is outside this shard. Not low because the formula is explicit.
    risk_class: financial
    basis: >
      getSubTotal re-reads items via getItems(), which fetches each item from the
      catalog and uses item.getListCost() as unitCost; it then sums
      unitCost * quantity into a double. ShoppingCartModel.getTotalCost sums
      CartItem.getTotalCost() = quantity * unitCost. Neither path rounds.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |2
             public Double getSubTotal() {
                  Collection items = getItems();
                  if (items == null) return null;
                  // put the subtotal in the request
                  double ret = 0.0d;
                  // total up the quantities
                  for (Iterator it =items.iterator(); it.hasNext(); ) {
                      CartItem i = (CartItem) it.next();
                      ret += (i.getUnitCost() * i.getQuantity()) ;
                  }
                  return new Double(ret);
             }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 94
        line_end: 102
        excerpt: |2
                         item = catalog.getItem(key, locale);
                         // convert catalog item to cart item
                         CartItem ci = new CartItem(item.getItemId(),
                                                item.getProductId(),
                                                item.getCategory(),
                                                item.getProductName(),
                                                item.getAttribute(),
                                                value.intValue(),
                                                item.getListCost());
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
        line_start: 79
