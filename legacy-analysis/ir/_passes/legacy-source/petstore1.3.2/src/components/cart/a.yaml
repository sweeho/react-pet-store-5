  - record_key: SHOPPING_CART-BR-0004
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL list and total the cart using only items it can currently
      resolve in the catalog.
      GIVEN a cart holds an item identifier that the catalog cannot return
      WHEN the cart contents or subtotal are requested
      THEN that item SHALL be omitted from the listing and from the subtotal, the
      request SHALL still succeed, and the item SHALL remain in the cart's stored
      contents (and in the item count).
    confidence: low
    confidence_basis: >
      This is error-path behaviour: a caught exception logged to stdout and
      otherwise ignored. It is certain what the code does, but there is no sign it
      was a deliberate rule rather than defensive coding, so low.
    risk_class: financial
    basis: >
      getItems catches CatalogException per item, prints it and continues without
      adding the CartItem; the underlying cart map is not modified, so getCount
      still counts the item while getSubTotal (built from getItems) excludes it.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
