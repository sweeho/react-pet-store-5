    kind: requirement
    capability_key: shopping-cart
    requirement: >
      The system SHALL let a shopper add a catalog item to their cart by item
      identifier, placing it in the cart with a quantity of 1.
      GIVEN the item is already in the cart with any quantity
      WHEN the shopper adds the same item again
      THEN the cart SHALL hold that item once, with its quantity reset to 1
      (the quantity is not incremented).
    confidence: medium
    confidence_basis: >
      Single source: the bean method body is unambiguous about storing 1 under the
      item key, so the value is certain. Not high because only one layer states it
      and pass B has not been compared. The "reset to 1" edge case is a direct
      consequence of a map put, and could be an unintended side effect rather than
      a business decision (see findings).
    risk_class: operational
    basis: >
      addItem(itemID) puts Integer(1) under the item id in the cart map; a map put
      replaces any existing entry, so re-adding overwrites the prior quantity. The
      local interface exposes only the single-argument addItem.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 113
        excerpt: |2
              public void addItem (String itemID) {
                  cart.put(itemID, new Integer(1));
              }
