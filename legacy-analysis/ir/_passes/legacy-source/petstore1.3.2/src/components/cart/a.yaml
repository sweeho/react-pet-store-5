findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Lines 111-113: adding an item already in the cart resets its quantity to 1
      instead of incrementing it. A human must decide whether "add to cart" on an
      existing line should increment (common expectation) or reset (legacy
      behaviour, recorded in SHOPPING_CART-REQ-0001).
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Dead code: lines 115-117, addItem(String itemID, int qty), is not declared on
      the ShoppingCartLocal interface and has no container-transaction entry, so no
      client can reach it. It would add an item with an arbitrary (unvalidated,
      possibly zero or negative) quantity. No requirement emitted; confirm it can be
      dropped. Likewise ShoppingCartLocalHome lines 53-56 carry a commented-out
      create(HashMap startingCart), suggesting cart pre-population was once planned.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Lines 123-127: updateItemQuantity does not check that the item is already in
      the cart, so updating an absent item with a positive quantity adds it. There
      is also no upper bound on quantity in this module. A human must decide whether
      update-of-absent-item is allowed and whether a maximum quantity applies
      (quantity parsing/validation, if any, is in the web tier outside this shard).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Lines 133-144: money is summed in a binary double with no rounding or currency
      scale, and prices are re-read from the catalog on every request, so a price
      change between viewing the cart and checkout changes the subtotal. Decide the
      rebuild's rounding rule (decimal type, scale, rounding mode) and whether the
      price should be locked when the item is added.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Lines 104-106: an item the catalog cannot resolve (e.g. discontinued, or not
      offered in the current locale) is silently dropped from the listing and the
      subtotal but still counted by getCount and still held in the cart, so count
      and listing can disagree. Decide whether such items should be removed, shown
      as unavailable, or block checkout.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Lines 64 and 88: the cart is a HashMap, so the order of lines returned by
      getItems is undefined and can change between requests. No display order is
      specified; decide one (e.g. insertion order) for the rebuild.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
    description: >
      ShoppingCartModel (total cost, size, shallow copy) duplicates the bean's
      subtotal/count logic; no caller exists inside this shard, so which path the
      web tier actually displays cannot be established here. The two formulas agree
      (quantity x unit cost, summed, unrounded), so no conflict is recorded.
