findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Adding an item already in the cart resets its quantity to 1 instead of incrementing it
      (lines 111-113). A human must decide whether the rebuild keeps reset-to-1 or increments.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Item count (getCount, lines 129-131) counts every stored id, but getItems/getSubTotal
      (lines 83-109, 133-144) silently drop ids the catalog cannot resolve. A cart can report
      N items while listing and pricing fewer. Decide whether unresolved items should be
      removed, shown as unavailable, or raise an error.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      Cart subtotal is computed in binary floating point with no rounding (lines 133-144);
      discovery finding F2 reports the order total uses different arithmetic. The rebuild
      needs one decided money type and rounding rule for cart subtotal and order total.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/model/ShoppingCartModel.java
    description: >
      ShoppingCartModel has no caller in the searched tree, and addItem(String,int) is not on
      the local interface. Both are recorded as disputed/low; confirm they are dead before
      dropping them.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
    description: >
      No maximum quantity and no check that the item id exists in the catalog are enforced
      when adding or updating (lines 111-127). Any limit would have to come from the web tier
      (outside this shard). A human should state whether the rebuild needs a quantity cap.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/cart
    description: >
      No legacy-analysis/sources/**/extracted.md documents exist in the tree, so no document
      trace pointers could be cited for this module.
