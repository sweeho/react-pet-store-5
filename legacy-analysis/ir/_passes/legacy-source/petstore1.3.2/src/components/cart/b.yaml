  - record_key: CART-RULE-0001
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL add a catalog item to the cart with a quantity of 1.
      GIVEN the item is already in the cart with quantity N
      WHEN the shopper adds the same item again
      THEN the line quantity SHALL become 1 (it is replaced, not incremented to N+1).
    confidence: medium
    confidence_basis: >
      The code is unambiguous (Map.put overwrites) and reachable from the cart add action. Not
      high because the reset-to-1 behaviour on a repeat add may be unintended; no comment,
      test or document confirms it was deliberate. Raised as an ambiguity finding.
    risk_class: financial
    basis: >
      addItem(String) puts Integer(1) under the item id, overwriting any existing quantity.
      The petstore cart action calls it for the ADD_ITEM event.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 111
        line_end: 113
        excerpt: |
              public void addItem (String itemID) {
                  cart.put(itemID, new Integer(1));
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 68
        line_end: 70
        excerpt: |
                    case  CartEvent.ADD_ITEM  : {
                        cart.addItem(ce.getItemId());
                    }
