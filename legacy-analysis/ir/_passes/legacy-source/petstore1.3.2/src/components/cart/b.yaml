  - record_key: CART-RULE-0006
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL resolve each cart line's description and price from the catalog at the
      time the cart is read, in the cart's current locale, rather than capturing them when the
      item is added.
      GIVEN a cart line whose item cannot be retrieved from the catalog
      WHEN the cart contents or subtotal are read
      THEN that line SHALL be omitted from the listed items and from the subtotal, without
      an error being shown to the shopper.
    confidence: medium
    confidence_basis: >
      The lookup-at-read-time and swallow-on-error behaviour are explicit in one method. The
      omission is only logged to stdout; whether it is intended or a latent defect cannot be
      determined, and getCount still counts the omitted line (see finding).
    risk_class: financial
    basis: >
      getItems iterates the stored ids, calls the catalog for each with the stored locale,
      builds a CartItem from the catalog data, and on CatalogException prints and continues.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 83
        line_end: 109
        excerpt: |
             public Collection getItems() {
                 // get a catalog helper using local EJB Access
                 CatalogHelper catalog = new CatalogHelper(false);
                 HashMap map = getDetails();
                 ArrayList items = new ArrayList();
                 Iterator it = map.keySet().iterator();
                 while (it.hasNext()) {
                     String key = (String)it.next();
                     Integer value = (Integer)map.get(key);
                     Item item = null;
                     try {
                         item = catalog.getItem(key, locale);
                         // convert catalog item to cart item
                         CartItem ci = new CartItem(item.getItemId(),
                                                item.getProductId(),
                                                item.getCategory(),
                                                item.getProductName(),
                                                item.getAttribute(),
                                                value.intValue(),
                                                item.getListCost());
                         items.add(ci);
                     } catch (CatalogException cce) {
                         System.out.println("ShoppingCartEJB caught: " + cce);
                     }
                 }
                 return items;
             }
    stack_metadata:
      ejb.method: getItems()
      ejb.local-ref: ejb/Catalog -> CatalogEJB

