  - record_key: CART-RULE-0003
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL set a cart line's quantity to the new quantity the shopper enters.
      GIVEN a new quantity less than or equal to 0
      WHEN the shopper updates the cart
      THEN the line SHALL be removed from the cart.
      GIVEN a new quantity greater than 0 for an item not currently in the cart
      WHEN the shopper updates the cart
      THEN the item SHALL be added with that quantity.
    confidence: medium
    confidence_basis: >
      The <= 0 removal rule is stated in both code and an inline comment in the same method,
      and is reachable via UPDATE_ITEMS. It is still one enforcement point. The add-on-update
      edge case follows from the code but may be unintended. No upper bound on quantity is
      enforced in this module.
    risk_class: financial
    basis: >
      updateItemQuantity always removes the entry, then re-inserts it only when newQty > 0.
      The cart action applies it for every item id in the UPDATE_ITEMS map.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 123
        line_end: 127
        excerpt: |
              public void updateItemQuantity (String itemID, int newQty) {
                  cart.remove(itemID);
                  // remove item if it is less than or equal to 0
                  if (newQty > 0) cart.put(itemID, new Integer(newQty));
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/CartEJBAction.java
        line_start: 78
        line_end: 86
        excerpt: |
                    case  CartEvent.UPDATE_ITEMS : {
                        Map items = ce.getItems();
                        Iterator it = null;
                        if (items != null) it = items.keySet().iterator();
                        while ((it != null) && it.hasNext()) {
                            String itemId = (String)it.next();
                            int quantity = ((Integer)items.get(itemId)).intValue();
                            cart.updateItemQuantity(itemId, quantity);
                        }
    stack_metadata:
      ejb.method: updateItemQuantity(String,int)
