records:
  - record_key: CART-ENTITY-0001
    kind: entity
    capability_key: shopping-cart
    requirement: >
      The system SHALL hold one shopping cart per shopper session, keyed by catalog item
      identifier, where each cart line records exactly one item identifier and one integer
      quantity; the same item SHALL NOT appear on two lines.
    confidence: medium
    confidence_basis: >
      The one-line-per-item shape follows directly from the map keyed by item id, a single
      programmatic source. Per-session scope is declared (stateful session bean) and obtained
      through a per-client facade, but session lifetime and expiry are not visible in this module.
    risk_class: operational
    basis: >
      The cart state is a HashMap from item id to Integer quantity, created empty when the
      bean is created. The bean is declared Stateful, so state lives with one client session.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 64
        line_end: 70
        excerpt: |
