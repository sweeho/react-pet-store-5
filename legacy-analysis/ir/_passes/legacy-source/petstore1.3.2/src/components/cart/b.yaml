  - record_key: CART-RULE-0005
    kind: business-rule
    capability_key: shopping-cart
    requirement: >
      The system SHALL compute the cart subtotal as the sum, over every cart line that can be
      resolved in the catalog, of the item's current list price multiplied by its quantity,
      with no rounding step, discount, tax or shipping applied.
    confidence: low
    confidence_basis: >
      The formula is explicit and reachable (the cart page formats cart.subTotal as currency),
      but it is computed in binary floating point with no rounding, and the discovery report
      (F2) notes the order total uses different arithmetic. Two paths computing money
      differently is a disputed rule per the playbook, so this cannot be graded higher.
    risk_class: financial
    basis: >
      getSubTotal sums unitCost * quantity over getItems() in a double. unitCost is populated
      from the catalog item's list cost. Display rounding happens only in the JSP currency
      formatter.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 133
        line_end: 144
        excerpt: |
             public Double getSubTotal() {
                  Collection items = getItems();
                  if (items == null) return null;
                  // put the subtotal in the request
                  double ret = 0.0d;
                  // total up the quantities
                  for (Iterator it =items.iterator(); it.hasNext(); ) {
                      CartItem i = (CartItem) it.next();
                      ret += (i.getUnitCost() * i.getQuantity()) ;
                  }
                  return new Double(ret);
             }
      - path: legacy-source/petstore1.3.2/src/components/cart/src/com/sun/j2ee/blueprints/cart/ejb/ShoppingCartLocalEJB.java
        line_start: 96
        line_end: 102
