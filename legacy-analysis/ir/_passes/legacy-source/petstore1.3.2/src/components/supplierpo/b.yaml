findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
    description: SupplierOrder.fromDOM (lines 217-223) replaces an unparseable OrderDate with the current date, marked '// FIX ME!'. A human must decide whether the rebuild should reject such documents (as the DTD-validated contract implies) or keep the silent substitution.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
    description: SupplierOrderEJB.getData (line 209) calls supplierOrder.setShippingInfo(supplierOrder.getShippingInfo()) on the freshly built object, so the returned order always has null shipping info even though a persisted ContactInfo exists; it also omits status. Any caller serialising getData() via toDOM would fail on shippingInfo.toDOM. Likely a defect; decide whether the rebuild should return the persisted shipping contact.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
    description: APPROVED and DENIED are defined for supplier purchase orders but no writer of those values was found in this module or the supplier fulfilment facade (only PENDING and COMPLETED). Whether supplier POs ever pass through approval, or these were copied from the customer order lifecycle, is unresolved.
