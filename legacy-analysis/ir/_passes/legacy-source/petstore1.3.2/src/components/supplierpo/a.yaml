  - record_key: b2b-document-exchange-entity-0001
    kind: entity
    capability_key: b2b-document-exchange
    requirement: >
      The supplier order document SHALL consist, in this order, of an OrderId, an OrderDate,
      a ShippingInfo element wrapping one ContactInfo, and one or more LineItem elements.
    confidence: high
    confidence_basis: >
      The structure is enforced in two independent places: the DTD content model (which
      requires at least one LineItem) and the serializer and parser, which emit and read the
      elements in the same order.
    risk_class: operational
    basis: >
      The DTD declares SupplierOrder (OrderId, OrderDate, ShippingInfo, LineItem+) and pulls
      ContactInfo and LineItem from their own public DTDs. toDOM writes the elements in the
      same sequence, and fromDOM reads them positionally with getNextSibling.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/rsrc/schemas/SupplierOrder.dtd
        line_start: 38
        line_end: 52
        excerpt: |
          <!ELEMENT SupplierOrder (OrderId, OrderDate, ShippingInfo, LineItem+)>

          <!ELEMENT OrderId (#PCDATA)>

          <!ELEMENT OrderDate (#PCDATA)>

          <!ELEMENT ShippingInfo (ContactInfo)>

          <!ENTITY % ContactInfo PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD ContactInfo 1.1//EN"
           "/com/sun/j2ee/blueprints/contactinfo/rsrc/schemas/ContactInfo.dtd">
          %ContactInfo;

          <!ENTITY % LineItem PUBLIC "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD LineItem 1.1//EN"
           "/com/sun/j2ee/blueprints/lineitem/rsrc/schemas/LineItem.dtd">
          %LineItem;
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrder.java
        line_start: 189
        line_end: 202
        excerpt: |
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_SUPPLIERORDER);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERID, orderId);
              XMLDocumentUtils.appendChild(document, root, XML_ORDERDATE,
                                           dateFormat.format(orderDate));
              Element element = (Element) document.createElement(XML_SHIPPINGINFO);
              element.appendChild(shippingInfo.toDOM(document));
              root.appendChild(element);
              for (Iterator i = lineItems.iterator(); i.hasNext();) {
                LineItem lineItem = (LineItem) i.next();
                root.appendChild(lineItem.toDOM(document));
              }
              return root;
            }
