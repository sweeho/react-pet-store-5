      The lifecycle is stated only in a class comment. Nothing in this shard enforces the
      transitions: setPoStatus accepts any string. Outside the shard, the supplier fulfilment
      code moves a supplier PO straight from PENDING to COMPLETED using a different constants
      class, so the documented path may not be the real one (see findings).
    risk_class: operational
    basis: >
      OrderStatusNames defines four string constants and a comment describing the allowed
      transitions. The local interface exposes an unconstrained setPoStatus(String).
