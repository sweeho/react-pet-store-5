  - record_key: order-fulfillment-business-rule-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      WHEN a supplier purchase order is created, the system SHALL store a new shipping
      contact from the order's shipping info and a new line item for every incoming line,
      each with quantity shipped initialised to 0. The order, its contact and its line
      items SHALL be created in one transaction.
    confidence: medium
    confidence_basis: >
      The zero literal is passed in the post-create step and matches the line item bean's
      create(lineItem, qty) signature, which sets quantityShipped from qty (checked outside
      the shard, in lineitem). The transaction attribute is declarative. It is one code path
      and has not been cross-checked with the other pass.
    risk_class: operational
    basis: >
      ejbPostCreate creates a contact from getShippingInfo(), then iterates the line items
      and calls lineItemref.create(li, 0) for each. The create method on the local home is
      declared with trans-attribute Required, so a failure (CreateException) rolls back
      the whole creation.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
