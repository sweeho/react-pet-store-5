findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/SupplierOrderEJB.java
    description: >
      getData() (line 209) calls supplierOrder.setShippingInfo(supplierOrder.getShippingInfo())
      on a newly created object, so the returned order always has a null shipping contact.
      The persisted contactInfo relation is never read. Calling toDOM/toXML on that result
      would throw a NullPointerException at shippingInfo.toDOM. A human needs to decide
      whether "read back a supplier order including its shipping contact" is a requirement.
      The persisted relation says it is; this accessor loses the contact.
