  - record_key: ORDER-FULFILLMENT-BR-0004
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >-
      The system SHALL, on receipt of a supplier invoice for a purchase order, add each invoiced
      shipped quantity to the shipped quantity of the order's line item with the matching item id,
      and SHALL ignore invoiced item ids that match no line of the order.
    confidence: medium
    confidence_basis: >-
      A single programmatic source. The caller (the invoice message consumer in the order processing
      centre) was confirmed by search, but it sits outside this shard and was not read in full.
    risk_class: financial
    basis: >-
      processInvoice iterates the order's line items; where the invoice map contains the line's
      itemId it sets quantityShipped = quantityShipped + shipped. Map keys that match no line are
      never read. Called from InvoiceMDB (apps/opc) per a repository search.
    traces:
      - path: >-
          legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 68
        line_end: 91
        excerpt: |2
            /**
             * This method processes invoice information received from supplier by opc. Its
             * job is to update the LineItem fields for the received invoices.
             * Additionally it checks if all invoices of the given PO are shipped,
             * it will return true to indicate all invoices for a purchase order have
             * been joined together and the order is completely fulfilled.
             *
             * @param <Code>po</Code>
             * @param <Code>lineItemIds</Code>
             *
             * @return true or false to indicate if order is completely done
             */
            public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

              //set the quantity of line items shipped in the PO
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(lineItemIds.containsKey(li.getItemId())) {
                            Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                    li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                    }
              }//end while
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: PurchaseOrderHelper (plain helper)
      db.object: PurchaseOrder (abstract schema)
      jms.queue: invoice queue via InvoiceMDB (outside shard)
  - record_key: ORDER-FULFILLMENT-BR-0005
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >-
      The system SHALL treat a purchase order as completely fulfilled only when, for every line
      item, the shipped quantity equals the ordered quantity.

      GIVEN a purchase order where any line's shipped quantity differs from its ordered quantity
      (under- or over-shipped)

      WHEN an invoice is processed

      THEN the order SHALL NOT be reported as completely fulfilled.
    confidence: medium
    confidence_basis: >-
      A single programmatic source with an explicit equality test. The over-shipment consequence
      follows from `!=` and is not stated as intended anywhere (see finding).
    risk_class: financial
    basis: >-
      After applying the invoice, processInvoice returns false if any line has getQuantity() !=
      getQuantityShipped(), otherwise true. The Javadoc states true means 'the order is completely
      fulfilled'.
