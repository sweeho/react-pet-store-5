findings:
  - kind: conflict
    path: >-
      legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: >-
      Billing information on an inbound purchase order is parsed (PurchaseOrder.fromDOM) but never
      persisted; only shipping info is stored, and getData() returns it as both billing and shipping
      (line 268, marked XXX). A human must decide whether the rebuild stores distinct billing and
      shipping contacts (as the document format and checkout imply) or keeps the single-contact
      behaviour. See CHECKOUT-BR-0002.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
    description: >-
      Order completion uses strict equality quantity == quantityShipped (line 98). If an invoice
      over-ships a line, the order can never be reported complete. Nothing states whether
      over-shipment is possible or how it should be treated. Decide: equality, >=, or reject
      over-shipment.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
    description: >-
      An unparseable or missing OrderDate is silently replaced with the current date (lines 297-303)
      instead of rejecting the document. For a validated document the DTD only requires #PCDATA, so
      a bad date passes validation. Decide whether the rebuild should reject such orders.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: >-
      The order total is held as a float (poValue, TotalPrice parsed via getContentAsFloat) and
      stored as supplied with no recomputation or rounding rule in this module. The monetary
      precision and rounding the rebuild must use are not stated anywhere in this shard.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/ejb-jar.xml
    description: >-
      All beans in this descriptor have <unchecked/> method permissions (lines 402-436); access
      control is left entirely to the callers. Who may create or read purchase orders cannot be
      established from this module.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/rsrc/schemas/PurchaseOrder.dtd
    description: >-
      The DTD and the descriptor comment require at least one line item, but
      PurchaseOrderEJB.ejbPostCreate accepts an empty collection and PurchaseOrder.toDOM would throw
      on a null lineItems list. Whether the minimum is enforced depends on the validation flag
      passed by the caller (outside this shard).
