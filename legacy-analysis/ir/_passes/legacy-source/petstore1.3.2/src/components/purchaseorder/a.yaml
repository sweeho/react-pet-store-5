  - record_key: B2B-DOCUMENT-EXCHANGE-BR-0001
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >-
      The system SHALL exchange purchase orders as an XML document whose root element is
      PurchaseOrder, carrying, in this order, OrderId, UserId, EmailId, OrderDate, ShippingInfo,
      BillingInfo, TotalPrice, CreditCard and one or more LineItem elements, with an optional locale
      attribute defaulting to en_US.
    confidence: high
    confidence_basis: >-
      The structure is stated by the DTD and implemented identically by the serializer and parser,
      which read elements in the same fixed sibling order.
    risk_class: operational
    basis: >-
      The DTD content model fixes element order and requires LineItem+; the locale attribute
      defaults to en_US. toDOM writes and fromDOM reads elements in the same order.
    traces:
      - path: >-
          legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/rsrc/schemas/PurchaseOrder.dtd
