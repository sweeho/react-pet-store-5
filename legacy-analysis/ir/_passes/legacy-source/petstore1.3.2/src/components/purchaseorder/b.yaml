  - record_key: ORDER-FULFILLMENT-RULE-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: WHEN a purchase order is created, the system SHALL store, in a single transaction, the order header, one contact record taken from the order's SHIPPING information, the order's credit card, and one order line per line on the incoming order with shipped quantity initialised to zero; IF any dependent record cannot be created, THEN the whole purchase order creation SHALL fail.
    confidence: high
    confidence_basis: The creation sequence is explicit code in ejbPostCreate, the zero shipped-quantity is the literal argument to the line-item create (confirmed against the LineItem bean's create signature, which assigns it to quantityShipped), and the transaction attribute on create is declared Required. Code plus descriptor agree.
    risk_class: operational
    basis: ejbPostCreate creates ContactInfo from getShippingInfo(), CreditCard from getCreditCard(), and for each LineItem calls lineItemref.create(li, 0); a lookup failure throws CreateException. Descriptor sets create to trans-attribute Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
        line_start: 211
        line_end: 238
        excerpt: |2
            public void ejbPostCreate(PurchaseOrder purchaseOrder)
                                                   throws CreateException {
                try {
                    ServiceLocator serviceLocator = new ServiceLocator();
                    ContactInfoLocalHome cinforef = (ContactInfoLocalHome)
                        serviceLocator.getLocalHome(JNDINames.CINFO_EJB);
                    ContactInfoLocal cinfoloc = (ContactInfoLocal)
                        cinforef.create(purchaseOrder.getShippingInfo());
                    setContactInfo(cinfoloc);
                    CreditCardLocalHome cardref = (CreditCardLocalHome)
                        serviceLocator.getLocalHome(JNDINames.CARD_EJB);
                    CreditCardLocal cardloc = (CreditCardLocal)
                        cardref.create(purchaseOrder.getCreditCard());
                    setCreditCard(cardloc);
                    LineItemLocalHome lineItemref = (LineItemLocalHome)
                        serviceLocator.getLocalHome(JNDINames.LI_EJB);
                    Collection litems = purchaseOrder.getLineItems();
                    Iterator it = litems.iterator();
                    while((it != null) && (it.hasNext())) {
                        LineItem li = (LineItem) it.next();
                        LineItemLocal lineItemloc = (LineItemLocal)
                            lineItemref.create(li, 0);
                        addLineItem(lineItemloc);
                    }
                } catch(ServiceLocatorException ne) {
                    throw new CreateException("ServiceLocator Ex while persisting PO CMR :" + ne.getMessage());
                }
            }
