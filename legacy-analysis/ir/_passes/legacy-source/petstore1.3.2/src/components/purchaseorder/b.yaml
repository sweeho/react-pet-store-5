  - record_key: ORDER-FULFILLMENT-RULE-0005
    kind: business-rule
    capability_key: order-fulfillment
    requirement: WHEN a supplier invoice is received for a purchase order, the system SHALL add the invoiced shipped quantity for each item identifier on the invoice to the shipped quantity of every order line of that purchase order carrying that item identifier, and SHALL then report the purchase order as completely fulfilled only if, for EVERY order line, the shipped quantity equals the ordered quantity.
    confidence: high
    confidence_basis: Explicit, commented code with a single live caller (InvoiceMDB) that uses the boolean result to decide order completion; the rule is not bare-literal and reachability is established.
    risk_class: operational
    basis: processInvoice increments li.setQuantityShipped(li.getQuantityShipped() + shipped) for each line whose itemId is a key in the invoice map, then returns false on the first line with getQuantity() != getQuantityShipped(), else true. Called from InvoiceMDB.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
        line_start: 68
        line_end: 103
        excerpt: |2
            /**
             * This method processes invoice information received from supplier by opc. Its
             * job is to update the LineItem fields for the received invoices.
             * Additionally it checks if all invoices of the given PO are shipped,
             * it will return true to indicate all invoices for a purchase order have
             * been joined together and the order is completely fulfilled.
             *
             * @param <Code>po</Code>
             * @param <Code>lineItemIds</Code>
             *
             * @return true or false to indicate if order is completely done
             */
            public boolean processInvoice(PurchaseOrderLocal po, Map lineItemIds) {

              //set the quantity of line items shipped in the PO
              Collection liColl = po.getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(lineItemIds.containsKey(li.getItemId())) {
                            Integer shipped = (Integer) lineItemIds.get(li.getItemId());
                    li.setQuantityShipped(li.getQuantityShipped() + shipped.intValue());
                    }
              }//end while

              // now loop through all LIs and see if all are shipped completely
              liColl = po.getLineItems();
              liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItemLocal li = (LineItemLocal) liIt.next();
                if(li.getQuantity() != li.getQuantityShipped()) {
                    return false;
                    }
              }//end while
              return true;
            }
