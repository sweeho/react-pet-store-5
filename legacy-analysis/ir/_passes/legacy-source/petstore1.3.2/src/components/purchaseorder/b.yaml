  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: Billing and shipping contact diverge. The purchase-order document and value object carry separate ShippingInfo and BillingInfo, but persistence stores only the shipping contact (ejbPostCreate lines 215-219) and read-back returns that one contact as both billing and shipping (getData lines 267-268, marked // XXX). Any billing address that differs from shipping is lost once the order is stored. A human must decide whether the rebuild must store both contacts (likely intended) or preserve the single-contact behaviour.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
    description: processInvoice matches invoice quantities to order lines by item identifier, not line number. If one order carries two lines for the same item, both lines get the full invoiced quantity, which double-counts shipment. Whether duplicate item lines can occur on one order (the cart may merge them upstream) is not visible here; decide whether matching should be per line number.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderHelper.java
    description: Over-shipment (accumulated shipped > ordered) permanently prevents an order from being reported complete because completeness uses exact equality. There is no guard or error. Decide whether completion should be shipped >= ordered, or whether over-shipment must be rejected.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrder.java
    description: fromDOM tests element.getAttribute("locale") != null, but DOM getAttribute returns an empty string, not null, when the attribute is absent. With DTD validation on, the parser supplies the en_US default; with validation off (the consumer's flag is configurable), an absent locale is passed as "" to XMLDocumentUtils.getLocaleFromString, whose behaviour for an empty string is outside this shard. Confirm the resulting locale.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/purchaseorder/src/com/sun/j2ee/blueprints/purchaseorder/ejb/PurchaseOrderEJB.java
    description: Money is held as single-precision float (poValue, TotalPrice, unit prices). No rounding rule or currency is recorded on the order; only the locale is. The rebuild needs an explicit decision on currency and precision for order totals.
