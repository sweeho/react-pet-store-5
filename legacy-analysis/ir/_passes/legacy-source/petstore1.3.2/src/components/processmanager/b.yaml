findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
    description: >
      The documented lifecycle (OrderStatusNames.java:44-46, pending->approved->
      shippedPart->completed or pending->denied) is not enforced by the component that
      owns the status. updateStatus (ProcessManagerEJB.java:73-76) writes any string
      with no check of the current status or of the allowed set, and the DDL
      (sun-j2ee-ri.xml:471) has no CHECK constraint and allows a NULL status. Guarding
      is left to callers: OrderApprovalMDB skips non-PENDING orders, but InvoiceMDB
      sets SHIPPED_PART / COMPLETED unconditionally, so an out-of-order or repeated
      invoice could move COMPLETED back to SHIPPED_PART, or set a DENIED order to
      SHIPPED_PART. A human must decide whether the rebuild enforces the state machine
      centrally (recommended) or preserves the permissive legacy behaviour.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
    description: >
      The same status vocabulary is reused outside the customer-order workflow: the
      supplier purchase order sets its own status to OrderStatusNames.PENDING
      (supplierpo SupplierOrderEJB.java:154) and to COMPLETED in the supplier's
      fulfilment facade. It is unresolved whether supplier purchase orders are meant
      to share the customer-order lifecycle or merely borrow the string constants. A
      human should decide whether the rebuild keeps one shared status set or two.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
    description: >
      Every method of both components is declared <unchecked/> (ejb-jar.xml:103-261)
      and both use the caller's identity, so the workflow store imposes no role
      restriction of its own; any local caller may create workflows or change status.
      Access control is presumably provided by the callers (message consumers and the
      admin facade), which is outside this module. A human should confirm that status
      changes in the rebuild are restricted to the order-processing and admin paths.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
    description: >
      The component exposes no operation to remove a workflow record (the remove
      methods in ejb-jar.xml are container lifecycle methods with no business caller
      found in this module), and the status set has no terminal archival state. It is
      unresolved whether completed or denied order workflows are ever purged; no
      retention rule is visible in this module.
