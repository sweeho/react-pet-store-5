  - record_key: order-fulfillment-business-rule-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL represent an order's workflow status as exactly one of
      PENDING, APPROVED, DENIED, SHIPPED_PART or COMPLETED, where PENDING means
      placed but not yet approved, APPROVED means approved, DENIED means denied,
      SHIPPED_PART means part of the order has shipped, and COMPLETED means the whole
      order has shipped.
    confidence: medium
    confidence_basis: >
      Single source: a constants class with javadoc meanings. The values are used
      consistently by callers in the order processing centre, but nothing in the
      schema or the setter restricts status to this set (see findings).
    risk_class: operational
    basis: >
      OrderStatusNames is documented as "the central location to store the names of
      the status that an order can be in" and defines five string constants with a
      one-line meaning each.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 41
        line_end: 67
        excerpt: |
          /**
           * This class is the central location to store the names of the
           * status that an order can be in.
           * The states an order goes through are:
           * pending->approved->shippedPart(shipped part of order)->completed(whole order shipped)  or
           * pending->denied
           */
          public class OrderStatusNames {

              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";


              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";


              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";

          }
    stack_metadata:
      framework: Java constants class

  - record_key: order-fulfillment-workflow-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL move an order through the lifecycle
      PENDING -> APPROVED -> SHIPPED_PART -> COMPLETED, or PENDING -> DENIED.
      GIVEN an order in PENDING WHEN it is approved THEN its status SHALL become APPROVED;
      GIVEN an order in PENDING WHEN it is denied THEN its status SHALL become DENIED;
      GIVEN an approved order WHEN only part of it has shipped THEN its status SHALL become SHIPPED_PART;
      GIVEN an approved order WHEN all of it has shipped THEN its status SHALL become COMPLETED.
    confidence: low
    confidence_basis: >
      The lifecycle is stated only in a javadoc comment in this module. The component
      itself does not enforce it: updateStatus writes any string without checking the
      current status. The only guard observed is outside the module (the approval
      handler skips non-PENDING orders); the invoice handler sets SHIPPED_PART or
      COMPLETED without checking the prior status. Graded low because the stated
      state machine is not enforced by the code that owns the status.
    risk_class: operational
    basis: >
      Javadoc on OrderStatusNames states the two paths. Callers in the order
      processing centre create the record as PENDING, move PENDING orders to the
      approval decision, and set SHIPPED_PART / COMPLETED on invoice receipt.
