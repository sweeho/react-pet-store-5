  - record_key: order-fulfillment-integration-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL hand the outcome of each order-processing step to a
      configurable transition handler, selected by name, which receives either a
      single XML document, a batch of XML documents, or both; a handler that cannot
      be created or that fails SHALL surface a transition error carrying the root cause.
    confidence: low
    confidence_basis: >
      The module defines only the contract (interface, parameter holder, factory,
      error type); which handler runs and what it sends is configured and implemented
      elsewhere, so the concrete behaviour cannot be seen from this module. Filed under
      order-fulfillment as the closest capability; the handlers carry partner documents
      and could equally belong to b2b-document-exchange.
    risk_class: operational
    basis: >
      TransitionDelegate declares setup() and doTransition(TransitionInfo);
      TransitionInfo carries an XML message and/or an XML message batch;
      TransitionDelegateFactory instantiates a delegate by class name and wraps any
      failure in TransitionException, which exposes the root cause.
