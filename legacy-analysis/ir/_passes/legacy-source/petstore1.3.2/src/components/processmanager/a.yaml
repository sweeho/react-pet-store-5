  - record_key: order-fulfillment-INTEGRATION-0001
    kind: integration
    capability_key: order-fulfillment
    requirement: >
      The system SHALL advance an order to its next workflow step by handing a step
      handler either a single XML business document, a batch of XML business documents,
      or both; each handler SHALL be able to prepare itself before use, and a failure in
      preparing or performing a step SHALL be reported as a workflow-step error that
      preserves the underlying cause.
    confidence: low
    confidence_basis: >
      This is a framework contract with no business content of its own; which steps
      exist and what they do is defined by implementations outside this module. The
      capability home is a best fit, not a clean one.
    risk_class: operational
    basis: >
      The step-handler contract has setup and doTransition; its parameter object carries
      one XML message and/or a collection of XML messages; handlers are resolved by
      class name and any resolution failure is wrapped in TransitionException, whose
      getRootCause unwraps nested causes. Filed under order-fulfillment as the closest
      listed capability (it is workflow plumbing shared by order approval, fulfillment
      and notifications).
