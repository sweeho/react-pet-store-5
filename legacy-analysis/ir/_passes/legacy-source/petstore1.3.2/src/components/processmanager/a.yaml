  - record_key: order-fulfillment-REQ-0002
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL allow the current status of an existing order to be replaced
      with a new status.
      GIVEN no tracking record exists for the order identifier
      WHEN a status update is requested
      THEN the system SHALL fail the update with a not-found error.
    confidence: medium
    confidence_basis: >
      Behaviour is directly visible in a single method and its declared exception; no
      second independent source. The absence of transition validation is recorded as a
      finding rather than folded into this requirement.
    risk_class: operational
    basis: >
      updateStatus looks the record up by primary key (FinderException if absent) and
      overwrites the status unconditionally.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 70
        line_end: 76
        excerpt: |
              /**
               * Business method used to keep track of an order in the workflow process
               */
              public void updateStatus(String orderId, String status) throws FinderException {
                ManagerLocal manager = mlh.findByPrimaryKey(orderId);
                manager.setStatus(status);
              }
    stack_metadata:
