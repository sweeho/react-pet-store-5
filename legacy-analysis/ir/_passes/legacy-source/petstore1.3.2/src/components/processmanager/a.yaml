  - record_key: order-fulfillment-BR-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL recognise exactly these order statuses: PENDING (placed, not yet
      approved), APPROVED, DENIED, SHIPPED_PART (part of the order shipped) and
      COMPLETED (whole order shipped).
    confidence: medium
    confidence_basis: >
      Single authoritative source (a constants class with per-value comments); callers
      outside the module use these constants, but the stored status field is free text
      and nothing in this module rejects a value outside the list.
    risk_class: operational
    basis: >
      The status names are centralised in one constants class, each documented with its
      business meaning.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
        line_start: 50
        line_end: 65
        excerpt: |
              /** for orders that have been placed but not yet approved */
              public static final String PENDING = "PENDING";

              /** for orders that have been approved */
              public  static final String APPROVED = "APPROVED";

              /** for orders that have been denied */
              public  static final String DENIED = "DENIED";


              /** for orders that have been partially completed*/
              public  static final String SHIPPED_PART = "SHIPPED_PART";


              /** for orders that have been completed*/
              public  static final String COMPLETED = "COMPLETED";
    stack_metadata:
      framework: EJB 2.0

  - record_key: order-fulfillment-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL move an order through the lifecycle PENDING -> APPROVED ->
      SHIPPED_PART -> COMPLETED, or PENDING -> DENIED, where SHIPPED_PART means part of
      the order has shipped and COMPLETED means the whole order has shipped.
    confidence: low
    confidence_basis: >
      The lifecycle is stated only in a class comment; this module does not enforce it
      (the status update accepts any value from any prior status). Whether SHIPPED_PART
      can be skipped (PENDING/APPROVED straight to COMPLETED) or repeated, and whether
      DENIED and COMPLETED are terminal, cannot be seen here.
    risk_class: operational
    basis: >
      Javadoc on the status constants class describes the two paths through the state
      machine.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
