  - record_key: order-fulfillment-REQ-0001
    kind: requirement
    capability_key: order-fulfillment
    requirement: >
      The system SHALL start workflow tracking for a newly received purchase order by
      creating its tracking record with the order identifier and an initial status.
      GIVEN a tracking record already exists for an order identifier
      WHEN tracking is started again for the same identifier
      THEN the system SHALL reject the request with a creation error and leave the
      existing record unchanged.
    confidence: medium
    confidence_basis: >
      Creation is explicit and documented; duplicate rejection follows from the order
      identifier being the primary key and CreateException being the declared failure,
      but no explicit duplicate check or message exists, so the error-path half rests
      on container key semantics.
    risk_class: operational
    basis: >
      createManager is documented as the entry point "when new purchase orders are
      recieved"; it creates the entity keyed by orderId and declares CreateException.
      The initial status is supplied by the caller (PENDING at the only caller seen,
      outside this module).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
        line_start: 62
        line_end: 68
        excerpt: |
              /**
               * Business method used for when new purchase orders are recieved
               * and want to start the workflow process to fullfil the order
               */
              public void createManager(String orderId, String status) throws CreateException {
                ManagerLocal manager = mlh.create(orderId, status);
              }
      - path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
