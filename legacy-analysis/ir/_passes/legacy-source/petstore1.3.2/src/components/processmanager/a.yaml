findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/ProcessManagerEJB.java
    description: >
      updateStatus (lines 73-76) overwrites the status with any string from any prior
      status: no check against the five known statuses and no check that the move is a
      legal lifecycle transition (e.g. COMPLETED -> PENDING, DENIED -> APPROVED are
      accepted). The only guard seen is in a caller outside this module (opc
      OrderApprovalMDB refuses a change unless the current status is PENDING). A human
      must decide whether the rebuild enforces the lifecycle centrally, and which
      transitions are legal.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
    description: >
      The lifecycle exists only as a comment (lines 41-47). Unresolved: whether an order
      may go straight to COMPLETED without SHIPPED_PART (the invoice handler outside this
      module appears to choose between the two per invoice), whether SHIPPED_PART may
      repeat, whether DENIED and COMPLETED are terminal, and whether an order can be
      cancelled. Needs SME confirmation.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/ejb/OrderStatusNames.java
    description: >
      A second class with the same name exists in
      legacy-source/petstore1.3.2/src/components/supplierpo/src/com/sun/j2ee/blueprints/supplierpo/ejb/OrderStatusNames.java
      and is used for supplier purchase-order status. Whether the two vocabularies are
      identical, and whether customer-order status and supplier-PO status are meant to
      be the same set, was not compared in this shard; the reconciling pass should check.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
    description: >
      Every method of both beans is under <unchecked/> method-permission (lines 103-261),
      including status updates and the admin listing. Authorisation for "admin only"
      order listing and approval/denial is therefore not enforced in this module; if it
      exists it is in the web/admin tier. A human should confirm where the administrator
      restriction is enforced before relying on it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/ejb-jar.xml
    description: >
      No DDL constrains the tracking table. The table is generated at deploy time from
      the mapping in legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
      (ManagerEJBTable with orderId, status); no NOT NULL or CHECK on status was found,
      so an empty or unknown status is storable. The relationship between this tracking
      record's orderId and the purchase-order record of the same id is by value only
      (no foreign key). Decide whether the rebuild adds these constraints.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/processmanager/src/com/sun/j2ee/blueprints/processmanager/transitions/TransitionDelegateFactory.java
    description: >
      Step handlers are instantiated by class name via reflection (line 51); the class
      names come from deployment configuration outside this module. The actual set of
      workflow steps, their ordering and their failure/retry behaviour cannot be
      recovered from this module and must be read from the opc and supplier apps.
