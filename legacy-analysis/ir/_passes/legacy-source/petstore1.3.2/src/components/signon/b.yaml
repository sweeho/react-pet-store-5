  - record_key: SIGN-ON-BUSINESS-RULE-0007
    kind: business-rule
    capability_key: sign-on
    requirement: "The system SHALL, when the user selects 'remember user name' at sign-on, store the entered user name in a browser cookie that expires after 31 days; and when the option is not selected, SHALL delete any previously stored user-name cookie."
    confidence: low
    confidence_basis: "The 31-day lifetime is a bare literal (2678400 seconds) with only a comment saying 'one month'; no configuration. The cookie is set before authentication, so it is written even on failed sign-on, which may or may not be intended."
    risk_class: operational
    basis: "If j_remember_username is present a cookie bp_signon=userName with maxAge 2678400 is added; otherwise any bp_signon cookie is re-sent with maxAge 0. This happens before authenticate() is called."
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 166
        line_end: 186
        excerpt: "        // check if the user wants userName set in cookie\n        String rememberUserName = hreq.getParameter(REMEMBER_USERNAME);\n        if (rememberUserName != null) {\n          // set a cookie with the username in it\n          Cookie userNameCookie = new Cookie(COOKIE_NAME, userName);\n          // set cookie to last for one month\n          userNameCookie.setMaxAge(2678400);\n          hres.addCookie(userNameCookie);\n        } else {\n            // see if the cookie exists and remove accordingly\n            Cookie[] cookies = hreq.getCookies();\n            if (cookies != null) {\n                for (int loop=0; loop < cookies.length; loop++) {\n                    if (cookies[loop].getName().equals(COOKIE_NAME)) {\n                        cookies[loop].setMaxAge(0);\n                        hres.addCookie(cookies[loop]);\n\n                    }\n                }\n            }\n        }\n"
    stack_metadata:
      framework: "Servlet Filter"
      cookie: "bp_signon"
