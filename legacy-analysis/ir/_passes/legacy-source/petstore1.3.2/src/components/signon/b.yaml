  - record_key: SIGN-ON-BUSINESS-RULE-0005
    kind: business-rule
    capability_key: sign-on
    requirement: "The system SHALL authenticate a user only when a user record exists for the supplied user name and the supplied password exactly matches the stored password (case-sensitive). GIVEN no user record exists for the supplied user name WHEN sign-on is attempted THEN authentication SHALL fail without an error being raised."
    confidence: medium
    confidence_basis: "Both the lookup and the comparison are read directly from code, one source only. Exact, case-sensitive equality is a direct consequence of String.equals."
    risk_class: regulated
    basis: "authenticate() finds the user by primary key and returns matchPassword(password); FinderException returns false. matchPassword is password.equals(getPassword())."
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: "    public boolean authenticate(String userName, String password) {\n        try {\n            UserLocal user = ulh.findByPrimaryKey(userName);\n            return user.matchPassword(password);\n        } catch (FinderException fe) {\n            return false; // User not found, so authentication failed.\n        }\n    }\n"
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: "    public boolean matchPassword(String password) {\n        return password.equals(getPassword());\n    }\n"
    stack_metadata:
      ejb.bean: "SignOnEJB, UserEJB"
      ejb.transaction: "Required"
  - record_key: SIGN-ON-WORKFLOW-0001
    kind: workflow
    capability_key: sign-on
    requirement: "The system SHALL, when a user who is not signed on requests a page whose path exactly matches a configured protected resource, remember the requested page and show the sign-on page instead; requests for pages that are not protected, or from users already signed on, SHALL be served normally."
    confidence: medium
    confidence_basis: "The request gate is fully visible in code; the list of protected pages and the login page come from a configuration file outside this module, so which pages are protected is not determinable here."
    risk_class: regulated
    basis: "doFilter serves the request if the session flag j_signon is true; otherwise iterates protected resources and on urlPattern.equals(targetURL) stores ORIGINAL_URL in session and forwards to the configured sign-on page."
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 108
        line_end: 155
        excerpt: "     public  void doFilter(ServletRequest request, ServletResponse  response, FilterChain chain)\n        throws IOException, ServletException {\n        HttpServletRequest hreq = (HttpServletRequest)request;\n        String currentURI = hreq.getRequestURL().toString();\n        String currentURL = hreq.getRequestURI();\n        // get everything after the context root\n        int firstSlash = currentURL.indexOf(\"/\",1); // jump past the starting slash\n        String targetURL = null;\n        if (firstSlash != -1) targetURL = currentURL.substring(firstSlash + 1, currentURL.length());\n\n        if ((targetURL != null) && targetURL.equals(FORM_SIGNON_URL)) {\n            validateSignOn(request, response, chain);\n            // jump out of this method\n            return;\n        }\n\n        // check if the user is signed on\n        boolean signedOn = false;\n        if (hreq.getSession().getAttribute(SIGNED_ON_USER) != null) {\n            signedOn =((Boolean)hreq.getSession().getAttribute(SIGNED_ON_USER)).booleanValue();\n        } else {\n            hreq.getSession().setAttribute(SIGNED_ON_USER, new Boolean(false));\n        }\n        // jump to the resource if signed on\n        if (signedOn) {\n                chain.doFilter(request,response);\n                return;\n        }\n        // find out if the patterns match the target URL\n        Iterator it = null;\n        if (protectedResources != null) it = protectedResources.keySet().iterator();\n        while ((it != null) && it.hasNext()) {\n            String protectedName = (String)it.next();\n            ProtectedResource resource  = (ProtectedResource)protectedResources.get(protectedName);\n            String urlPattern = resource.getURLPattern();\n\n            // now check agains the targetURL\n            if (urlPattern.equals(targetURL)) {\n                // put the orginal url in the session so others can access\n                hreq.getSession().setAttribute(ORIGINAL_URL,  targetURL);\n                config.getServletContext().getRequestDispatcher(\"/\" + signOnPage).forward(request, response);\n                // Jump out of the filter and go to the next page\n                return;\n            }\n        }\n        // No matches if we made it to here\n        chain.doFilter(request,response);\n    }\n"
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 88
        line_end: 102
        excerpt: "    public void init(FilterConfig config) throws ServletException {\n        this.config = config;\n        URL protectedResourcesURL = null;\n        try {\n            protectedResourcesURL = config.getServletContext().getResource(\"/WEB-INF/signon-config.xml\");\n            if (protectedResourcesURL != null) {\n                SignOnDAO dao = new SignOnDAO(protectedResourcesURL);\n                signOnErrorPage = dao.getSignOnErrorPage();\n                signOnPage = dao.getSignOnPage();\n                protectedResources = dao.getProtectedResources();\n            }\n        } catch (java.net.MalformedURLException ex) {\n            System.err.println(\"SignonFilter: malformed URL exception: \" + ex);\n        }\n    }\n"
    stack_metadata:
      framework: "Servlet Filter"
