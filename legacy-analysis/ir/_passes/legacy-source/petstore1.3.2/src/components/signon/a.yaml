      directly; both the success and failure branches are explicit.
    risk_class: regulated
    basis: SignOnFilter intercepts the path j_signon_check and calls validateSignOn, which reads
      j_username / j_password, calls SignOnEJB.authenticate, and on success sets session attributes
      j_signon_username=userName and j_signon=true then sendRedirect(session j_signon_original_url);
      on failure sendRedirect(signOnErrorPage).
