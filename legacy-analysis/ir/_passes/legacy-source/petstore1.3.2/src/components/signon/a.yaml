  - record_key: SIGN-ON-BR-0006
    kind: business-rule
    capability_key: sign-on
    requirement: The system SHALL require sign-on for each configured protected page. GIVEN a user who
      is not signed on WHEN they request a page whose path (after the application root) exactly
      equals a protected page's configured URL pattern THEN the system SHALL remember the requested
      page and show the sign-on page instead. GIVEN a signed-on user, or a page that is not
      protected, THEN the request SHALL proceed normally.
    confidence: high
    confidence_basis: Declared protection list (configuration) and programmatic enforcement in the
      filter are both present and read directly; matching semantics (exact string equality) are
      explicit in code.
    risk_class: regulated
    basis: doFilter treats the session as signed-on only when j_signon is true (initialising it to false
      otherwise), passes through if signed on, and otherwise iterates configured protected resources
      comparing urlPattern.equals(targetURL); on a match it stores j_signon_original_url and
      forwards to the sign-on page. No wildcard or prefix matching is performed. Roles attached to a
      protected resource are loaded but never checked (see finding).
