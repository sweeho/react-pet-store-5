  - record_key: SIGN-ON-BR-0007
    kind: business-rule
    capability_key: sign-on
    requirement: The system SHALL offer to remember the user id on the sign-on form. GIVEN the user
      ticks 'remember user id' WHEN the sign-on form is submitted THEN the system SHALL store the
      entered user id in a browser cookie that lasts 31 days. GIVEN the box is not ticked WHEN the
      form is submitted THEN the system SHALL delete any previously stored user id cookie.
    confidence: medium
    confidence_basis: The cookie handling is explicit in a single place; the 31-day lifetime is a bare
      literal (2678400 seconds) with only an inline comment ('one month'). The cookie is written
      before the credential check, so it is also set on failed sign-on; whether that is intended is
      unresolved.
    risk_class: presentational
    basis: "validateSignOn: if j_remember_username is present, add cookie bp_signon=userName with maxAge
      2678400; else set maxAge 0 on any existing bp_signon cookie. This runs before authenticate()."
