  - record_key: SIGN-ON-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: The system SHALL let an administrator configure, without code changes, the sign-on
      page, the sign-on error page, and the list of protected pages (each with a name, a URL pattern
      and the roles allowed to see it). GIVEN two protected pages configured with the same name THEN
      only the first SHALL take effect and a warning SHALL be logged.
    confidence: medium
    confidence_basis: Configuration loading is read directly, but the configuration file itself lives
      outside this shard and the roles element has no consumer in this module.
    risk_class: operational
    basis: SignOnFilter.init loads /WEB-INF/signon-config.xml via SignOnDAO, which reads
      signon-form-login-page, signon-form-error-page, and each security-constraint's
      web-resource-collection (web-resource-name, url-pattern) and auth-constraint/role-name.
      Duplicate resource names are skipped with a 'Non Fatal errror' message.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnFilter.java
        line_start: 88
        line_end: 102
        excerpt: >2
              public void init(FilterConfig config) throws ServletException {
                  this.config = config;
                  URL protectedResourcesURL = null;
                  try {
                      protectedResourcesURL = config.getServletContext().getResource("/WEB-INF/signon-config.xml");
                      if (protectedResourcesURL != null) {
                          SignOnDAO dao = new SignOnDAO(protectedResourcesURL);
                          signOnErrorPage = dao.getSignOnErrorPage();
                          signOnPage = dao.getSignOnPage();
                          protectedResources = dao.getProtectedResources();
                      }
                  } catch (java.net.MalformedURLException ex) {
                      System.err.println("SignonFilter: malformed URL exception: " + ex);
                  }
              }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/web/SignOnDAO.java
        line_start: 127
        line_end: 163
        excerpt: >2
              private HashMap getProtectedResources(Element root) {
                  HashMap resources = new HashMap();
                  // get the signon page and signon error page
                  signOnLoginPage = getTagValue(root, SIGNON_FORM_LOGIN_PAGE ).trim();
                  signOnErrorPage = getTagValue(root, SIGNON_FORM_ERROR_PAGE ).trim();

                  // get protected pages //
                  NodeList outterList = root.getElementsByTagName(SECURITY_CONSTRAINT);
                  for (int outterLoop = 0; outterLoop < outterList.getLength(); outterLoop++) {
                      Element element = (Element)outterList.item(outterLoop);
                      // get  roles that can see this page
                      ArrayList roles = new ArrayList();
                      NodeList roleList = element.getElementsByTagName(AUTH_CONSTRAINT);
                      for (int roleLoop = 0; roleLoop < roleList.getLength(); roleLoop++) {
                                  Node  roleNode = roleList.item(roleLoop);
                                  String roleName = getSubTagValue(roleNode, ROLE_NAME);
                                  if ((roleName != null) && !roleName.equals("")) roles.add(roleName);
                      }

                      NodeList list = element.getElementsByTagName(WEB_RESOURCE_COLLECTION);
                      for (int loop = 0; loop < list.getLength(); loop++) {
                          Node node = list.item(loop);
                          if (node != null) {
                              String resourceName = getSubTagValue(node, WEB_RESOURCE_NAME);
                              String urlPattern = getSubTagValue(node, URL_PATTERN);
                              ProtectedResource resource = new ProtectedResource(resourceName, urlPattern, roles);
                              if (!resources.containsKey(resourceName)) {
                                   resources.put(resourceName, resource);
                              } else {
                                  System.err.println("*** Non Fatal errror: Protected Resource " + resourceName +
                                                 " defined more than once in screen definitions file");
                              }
                          }
                      }
                  }
                  return resources;
              }
    stack_metadata:
      framework: Servlet Filter + DOM parser
      config: /WEB-INF/signon-config.xml
