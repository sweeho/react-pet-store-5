  - record_key: SIGN-ON-BR-0005
    kind: business-rule
    capability_key: sign-on
    requirement: The system SHALL authenticate a user only when a user account with the supplied user id
      exists and the supplied password exactly equals the stored password (case-sensitive). GIVEN a
      user id that does not exist WHEN sign-on is attempted THEN authentication SHALL fail.
    confidence: high
    confidence_basis: "Enforced in two cooperating places read directly: the session bean treats a
      failed lookup as authentication failure, and the entity performs an exact String.equals
      comparison."
    risk_class: regulated
    basis: SignOnEJB.authenticate finds the user by primary key and returns
      user.matchPassword(password); FinderException returns false. UserEJB.matchPassword returns
      password.equals(getPassword()). A null supplied password would raise an exception rather than
      return false (see finding).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/ejb/SignOnEJB.java
        line_start: 71
        line_end: 78
        excerpt: |2
              public boolean authenticate(String userName, String password) {
                  try {
                      UserLocal user = ulh.findByPrimaryKey(userName);
                      return user.matchPassword(password);
                  } catch (FinderException fe) {
                      return false; // User not found, so authentication failed.
                  }
              }
      - path: legacy-source/petstore1.3.2/src/components/signon/src/com/sun/j2ee/blueprints/signon/user/ejb/UserEJB.java
        line_start: 88
        line_end: 90
        excerpt: |2
              public boolean matchPassword(String password) {
                  return password.equals(getPassword());
              }
    stack_metadata:
      framework: EJB 2.0
      ejb.bean: SignOnEJB (stateless), UserEJB
      ejb.transaction: Required
  - record_key: SIGN-ON-WF-0001
    kind: workflow
    capability_key: sign-on
    requirement: The system SHALL process a sign-on form submission (user id and password) as follows.
      GIVEN valid credentials WHEN the form is submitted THEN the system SHALL record the user id
      and a signed-on flag of true in the user's session and redirect the user to the page they
      originally requested. GIVEN invalid credentials WHEN the form is submitted THEN the system
      SHALL redirect the user to the configured sign-on error page and leave the session not signed
      on.
    confidence: high
