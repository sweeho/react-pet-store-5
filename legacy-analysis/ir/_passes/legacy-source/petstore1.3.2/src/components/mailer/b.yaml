  - record_key: customer-notifications-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL send each customer email to the recipient address(es) given in the
      request, with the request's subject, with the request's content as an HTML body, and
      stamped with the time of sending.
    confidence: medium
    confidence_basis: >
      Single source (MailHelper), fully visible. The HTML content type is a bare literal with no
      configuration, but its effect is unambiguous.
    risk_class: presentational
    basis: >
      MailHelper sets TO recipients from InternetAddress.parse(emailAddress, false) (a
      comma-separated list, non-strict parsing), sets the subject, sets content type
      "text/html", adds X-Mailer header and sets the sent date to now.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 76
        line_end: 85
        excerpt: |
                  msg.setRecipients(Message.RecipientType.TO,
                           InternetAddress.parse(emailAddress, false));
                  msg.setSubject(subject);
                  String contentType = "text/html";
                      StringBuffer sb = new StringBuffer(mailContent);
                    msg.setDataHandler(new DataHandler(
                                        new ByteArrayDataSource(sb.toString(), contentType)));
                  msg.setHeader("X-Mailer", "JavaMailer");
