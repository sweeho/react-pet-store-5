  - record_key: customer-notifications-RULE-0003
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL send all customer emails from a single configured sender address (the
      customer-service mailbox), not from an address supplied in the mail request.
    confidence: low
    confidence_basis: >
      The code only calls setFrom() with no argument, which takes the sender from the mail
      session configuration; the actual address comes from a deployment descriptor outside this
      shard and is an environment-specific demo value. Low because the value is a bare
      configuration literal with no other source.
    risk_class: presentational
    basis: >
      msg.setFrom() with no argument uses the session's mail.from; the OPC deployment binds the
      mail session with mail-from customerservice@javapetstoredemo.com. The Mail document has no
      From field.
