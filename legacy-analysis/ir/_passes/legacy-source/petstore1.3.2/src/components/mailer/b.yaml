      declarative_validator: Mail.dtd (DTD validation)

  - record_key: customer-notifications-RULE-0002
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      GIVEN a valid mail request WHEN sending the email fails for any reason (mail session
      unavailable, unparseable recipient address, transport error) THEN the system SHALL log the
      failure and discard the request without retrying and without surfacing an error to the
      customer or the order process.
    confidence: medium
    confidence_basis: >
      The swallow is explicit in code, and every exception in the send path is collapsed into
      one checked exception, so the behaviour is certain. Graded medium rather than high because
      the commented-out rethrow and its comment suggest this is a demo convenience, not intended
      production behaviour (see finding).
    risk_class: operational
    basis: >
      MailHelper catches Exception, prints to stderr and throws MailerAppException("Failure while
      sending mail"); MailerMDB catches MailerAppException and does nothing, so the transaction
      commits and the queue message is consumed.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 86
        line_end: 89
        excerpt: |
                } catch (Exception e) {
