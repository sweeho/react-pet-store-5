records:
  - record_key: customer-notifications-INTEGRATION-0001
    kind: integration
    capability_key: customer-notifications
    requirement: >
      The system SHALL deliver customer emails asynchronously: other components SHALL enqueue a
      mail request on a dedicated mail queue, and a mail consumer SHALL take each request off
      that queue and send one email per request.
    confidence: medium
    confidence_basis: >
      The consumer, its queue destination type and the queue binding are all declared and the
      code path is short and fully visible. Not high because the producers of mail requests live
      outside this shard and I could not confirm from here which events enqueue mail, and the
      second pass has not been compared.
    risk_class: operational
    basis: >
      ejb-jar.xml declares a message-driven consumer on a javax.jms.Queue; the OPC deployment
      descriptor binds it to jms/opc/MailQueue; onMessage reads the text payload, parses it into a
      Mail and sends it.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 56
        excerpt: |
              <message-driven>
                <description>opc node to process PurchaseOrders from the Java Pet Store</description>
                <display-name>MailerMDB</display-name>
                <ejb-name>MailerMDB</ejb-name>
                <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
                <transaction-type>Container</transaction-type>
                <message-driven-destination>
                  <destination-type>javax.jms.Queue</destination-type>
                </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 82
        excerpt: |
            public void onMessage(Message recvMsg) {
              TextMessage textMessage = null;
              String xmlMailMessage = null;
              Mail recMail = null;
              try {
                textMessage = (TextMessage)recvMsg;
                xmlMailMessage = textMessage.getText();
                recMail = Mail.fromXML(xmlMailMessage);
                sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
        line_start: 377
        line_end: 378
        excerpt: |
                <ejb-name>MailerMDB</ejb-name>
                <jndi-name>jms/opc/MailQueue</jndi-name>
    stack_metadata:
      framework: J2EE 1.3 EJB 2.0
      ejb.bean: MailerMDB (message-driven)
      ejb.transaction: Required
      jms.queue: jms/opc/MailQueue

  - record_key: customer-notifications-ENTITY-0001
    kind: entity
    capability_key: customer-notifications
    requirement: >
      The system SHALL represent a mail request as a document with exactly three text fields, in
      this order: recipient Address, Subject and Content. All three SHALL be present.
    confidence: medium
    confidence_basis: >
      Enforced in two places inside this module (DTD content model and the ordered DOM reader),
      which would justify high, but the pass-agreement condition of the rubric cannot be checked
      by this pass, so medium.
    risk_class: operational
    basis: >
      Mail.dtd declares Mail (Address, Subject, Content) with each element #PCDATA; Mail.fromDOM
      reads Address as first child then Subject and Content as successive siblings and rejects
      any root other than Mail.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 154
        line_end: 164
        excerpt: |
            private static Mail fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_MAIL)) {
                Element child;
                Mail mail = new Mail();
                mail.address = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ADDRESS, false), false);
                mail.subject = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_SUBJECT, false), false);
                mail.content = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_CONTENT, false), false);
                return mail;
              }
              throw new XMLDocumentException(XML_MAIL + " element expected.");
            }
    stack_metadata:
      db.object: none (transient message payload)
      xml.dtd_public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD OPC Mail 1.0//EN"

  - record_key: customer-notifications-RULE-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL validate every incoming mail request against the mail document schema
      before sending. GIVEN a mail request that is not well-formed or does not match the schema
      WHEN it is consumed THEN no email SHALL be sent and the consumption SHALL fail so that the
      request is rolled back to the queue rather than acknowledged.
    confidence: medium
    confidence_basis: >
      Validation is on by a hard-coded constant and the failure path throws out of a
      transaction-Required listener, both visible. The redelivery consequence depends on
      container/queue settings not in this shard (retry count, dead-letter), so the exact
      after-effect is inferred, not seen.
    risk_class: operational
    basis: >
      VALIDATING = true is passed by fromXML(String); XMLDocumentException is rethrown as
      EJBException in onMessage; onMessage runs with trans-attribute Required.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 54
        line_end: 54
        excerpt: |
            public static final boolean VALIDATING = true;
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 86
        line_end: 90
        excerpt: |
              } catch (XMLDocumentException xde) {
                throw new EJBException("MailerMDB.onMessage" + xde);
              } catch(JMSException je) {
                throw new EJBException("MailerMDB.onMessage" + je);
              }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 71
        line_end: 80
        excerpt: |
              <container-transaction>
                <method>
                  <ejb-name>MailerMDB</ejb-name>
                  <method-name>onMessage</method-name>
                  <method-params>
                    <method-param>javax.jms.Message</method-param>
