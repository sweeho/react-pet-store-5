findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
    description: >
      Lines 83-85: the rethrow on mail-send failure is commented out with "ignore since user
      probably forgot to set up mail server". Failed customer emails are therefore silently lost
      (logged to stderr only, no retry, no dead-letter). A human must decide whether the rebuild
      keeps fire-and-forget or requires retry / failure tracking for customer notifications.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
    description: >
      Line 82 passes Locale.getDefault() (the server's locale, not the customer's) to sendMail,
      and MailHelper.createAndSendMail ignores the locale parameter entirely. Any localization of
      the email must therefore happen upstream when the Content is built. Whether the rebuild
      needs per-customer locale in the mailer (e.g. charset for Japanese/Chinese content — the
      HTML body is sent with no explicit charset) needs a decision.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
    description: >
      Line 49 describes the mailer as "opc node to process PurchaseOrders from the Java Pet
      Store", which does not match what the bean does (send email). Treated as a copy-paste
      description; flagged in case it signals a different intended role.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
    description: >
      Mail.main (lines 167-184) is a developer command-line round-trip utility with no caller in
      this module; treated as dead/test code and no requirement emitted from it. The toXML
      serializers are only used by producers outside this shard. No legacy-analysis/sources
      documents (extracted.md) exist in the tree, so no document traces could be cited.
