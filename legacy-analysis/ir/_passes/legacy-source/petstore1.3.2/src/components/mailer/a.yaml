  - record_key: customer-notifications-BUSINESS-RULE-0004
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      GIVEN an email request that is not a text message or does not conform to the email
      request structure WHEN it is received THEN the system SHALL fail processing of that
      request with an error and SHALL NOT send any email for it.
    confidence: medium
    confidence_basis: >
      The exception paths are explicit in onMessage. What happens after the failure
      (redelivery count, dead-letter handling) is container configuration not present in
      this module, so the requirement stops at "fail with an error"; single pass.
    risk_class: operational
    basis: >
      XMLDocumentException and JMSException are rethrown as EJBException under a
      Required container transaction, which rolls the transaction back. A non-text
      message raises ClassCastException at the (TextMessage) cast, which is uncaught and
      also a system exception. The send is never reached in either case.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 79
        line_end: 90
        excerpt: |2
                textMessage = (TextMessage)recvMsg;
                xmlMailMessage = textMessage.getText();
                recMail = Mail.fromXML(xmlMailMessage);
                sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
              } catch (MailerAppException me) {
                //throw new EJBException("MailerMDB.onMessage" + me);
                //ignore since user probably forgot to set up mail server
              } catch (XMLDocumentException xde) {
                throw new EJBException("MailerMDB.onMessage" + xde);
              } catch(JMSException je) {
                throw new EJBException("MailerMDB.onMessage" + je);
              }
