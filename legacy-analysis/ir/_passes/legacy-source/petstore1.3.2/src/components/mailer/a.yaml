  - record_key: customer-notifications-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL address each notification email to the single recipient named in
      the request (as the To recipient), SHALL send it from the mail service's configured
      default sender, and SHALL stamp it with the time of sending.
    confidence: medium
    confidence_basis: >
      Directly visible in one method with no ambiguity about the behaviour; single source
      and single pass, so not high. The sender address itself is container configuration
      not present in this module.
    risk_class: operational
    basis: >
      MailHelper looks up the container-provided mail session, calls setFrom() with no
      argument (session default from address), sets the TO recipients from
      InternetAddress.parse(emailAddress, false) (non-strict parsing, which would also
      accept a comma-separated list), sets the subject and setSentDate(new Date()), adds
      header X-Mailer: JavaMailer, and sends.
    traces:
