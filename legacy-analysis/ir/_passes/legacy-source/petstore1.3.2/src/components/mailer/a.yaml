findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
    description: >
      Send failures are swallowed with no retry and no alert (MailerMDB.java 83-85); the
      comment says this is because "user probably forgot to set up mail server", i.e. a
      demo convenience. A human must decide whether the rebuild keeps fire-and-forget
      delivery or requires retry / dead-lettering / an operator alert for failed customer
      notifications.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
    description: >
      A locale is passed into createAndSendMail (always the server default locale, from
      MailerMDB.java 82) but is never used (MailHelper.java 70-90). Email language is
      therefore decided entirely by the producer that builds the subject and body in
      apps/opc; this module applies no localization. Confirm with the OPC extraction that
      localized templates live there.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
    description: >
      The recipient is parsed non-strictly (InternetAddress.parse(emailAddress, false),
      line 76-77), which accepts a comma-separated list and loosely formed addresses. No
      address-format validation exists in this module. A human should decide whether the
      rebuild validates the recipient address and whether multiple recipients are allowed.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
    description: >
      The bean description reads "opc node to process PurchaseOrders from the Java Pet
      Store" (line 49), but the bean only sends email. Almost certainly a copy-paste
      description; recorded so no one derives a purchase-order requirement from it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
    description: >
      Mail.main (lines 167-184) is a command-line round-trip test utility with no caller
      in the application; treated as dead/developer code and no requirement was emitted
      from it. Mail.toXML serialization is used by producers outside this shard, not by
      this module.
