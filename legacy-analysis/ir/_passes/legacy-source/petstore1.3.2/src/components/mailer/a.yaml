  - record_key: customer-notifications-BUSINESS-RULE-0003
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      GIVEN a well-formed email request WHEN the email cannot be sent (mail service
      unavailable, invalid address, or any other send failure) THEN the system SHALL log
      the failure, SHALL NOT retry the send, and SHALL treat the request as consumed so
      that order processing is not affected.
    confidence: medium
    confidence_basis: >
      The catch-and-ignore is explicit and commented, and MailHelper converts every
      exception into MailerAppException, so the path is certain. Held at medium, not high,
      because the comment frames it as a demo convenience ("user probably forgot to set up
      mail server"), so whether silent loss is the intended business behaviour is a human
      decision (see findings).
    risk_class: operational
    basis: >
      MailHelper catches Exception, prints to stderr and throws MailerAppException
      ("Failure while sending mail"). MailerMDB catches MailerAppException and does
      nothing; the rethrow as EJBException is commented out. The transaction therefore
      commits and the message is not redelivered.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 86
        line_end: 89
        excerpt: |2
                  } catch (Exception e) {
