      ejb.bean: MailerMDB (message-driven)
      ejb.transaction: Required (onMessage)
      jms.queue: jms/opc/MailQueue

  - record_key: customer-notifications-ENTITY-0001
    kind: entity
    capability_key: customer-notifications
    requirement: >
      The system SHALL represent an email request as a document with exactly three
      required text fields, in this order: recipient address, subject, and body content.
      The system SHALL validate each incoming request against this structure and SHALL
      reject a request whose root element is not a mail request or whose fields are
      missing or out of order.
    confidence: medium
    confidence_basis: >
      Enforced in two places inside this module (the DTD content model and the
      programmatic fromDOM walk, with validating parsing switched on by default). Held
      at medium because this is one pass of two and not yet corroborated.
    risk_class: operational
    basis: >
      Mail.dtd declares Mail as (Address, Subject, Content), all #PCDATA. Mail.fromXML(String)
      parses with VALIDATING = true against the DTD public id, and fromDOM requires the root
      tag Mail and walks Address, then Subject, then Content as successive siblings,
      throwing "Mail element expected." otherwise.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd
        line_start: 38
        line_end: 41
        excerpt: |2
          <!ELEMENT Mail (Address, Subject, Content)>
          <!ELEMENT Address (#PCDATA)>
          <!ELEMENT Subject (#PCDATA)>
          <!ELEMENT Content (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 154
        line_end: 165
        excerpt: |2
            private static Mail fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_MAIL)) {
                Element child;
                Mail mail = new Mail();
                mail.address = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ADDRESS, false), false);
                mail.subject = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_SUBJECT, false), false);
                mail.content = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_CONTENT, false), false);
                return mail;
              }
              throw new XMLDocumentException(XML_MAIL + " element expected.");
            }
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/Mail.java
        line_start: 52
        line_end: 54
        excerpt: |2
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD OPC Mail 1.0//EN";
            public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/mailer/rsrc/schemas/Mail.dtd";
            public static final boolean VALIDATING = true;
    stack_metadata:
      db.object: none (transient message document)
      declarative_validator: Mail.dtd (DTD OPC Mail 1.0)

  - record_key: customer-notifications-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: customer-notifications
    requirement: >
      The system SHALL send every customer notification email with an HTML body
      (content type text/html) encoded as UTF-8, using the request body content verbatim.
    confidence: low
    confidence_basis: >
      Both values are bare literals in the send path with no configuration or comment
      stating they are intended. The HTML body format is reachable and certain as
      behaviour; whether the rebuild must keep HTML-only (no plain-text alternative) is
      not stated anywhere.
    risk_class: presentational
    basis: >
      MailHelper hard-codes contentType = "text/html" and wraps the content in a
      ByteArrayDataSource, which encodes the string with getBytes("UTF-8"). No multipart
      or plain-text alternative is produced.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailHelper.java
        line_start: 79
        line_end: 82
        excerpt: |2
                      String contentType = "text/html";
                          StringBuffer sb = new StringBuffer(mailContent);
                        msg.setDataHandler(new DataHandler(
                                            new ByteArrayDataSource(sb.toString(), contentType)));
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/ByteArrayDataSource.java
