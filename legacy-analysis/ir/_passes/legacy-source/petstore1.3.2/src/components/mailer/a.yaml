records:
  - record_key: customer-notifications-INTEGRATION-0001
    kind: integration
    capability_key: customer-notifications
    requirement: >
      The system SHALL accept asynchronous email requests from the order-processing
      notification producers, each request carrying a recipient address, a subject and
      a body, and SHALL send exactly one email per request to the given recipient with
      the given subject and body.
    confidence: medium
    confidence_basis: >
      The consume-and-send path is fully visible in this module and the listener is
      deployed against the order-processing mail queue in the OPC deployment descriptor,
      so reachability is established. Not high: this is a single pass, and the producers
      (the OPC Mail*MDBs) are outside this shard, so which business events trigger a
      request is not verified here.
    risk_class: operational
    basis: >
      onMessage reads the text of the incoming message, parses it as a Mail document and
      calls sendMail with the parsed address, subject and content. The OPC vendor
      descriptor binds MailerMDB to jms/opc/MailQueue, and the discovery report records
      opc.Mail*MDB -> jms/opc/MailQueue -> MailerMDB. The ejb-jar declares the bean as a
      queue consumer with container-managed transactions.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/com/sun/j2ee/blueprints/mailer/ejb/MailerMDB.java
        line_start: 74
        line_end: 82
        excerpt: |2
            public void onMessage(Message recvMsg) {
              TextMessage textMessage = null;
              String xmlMailMessage = null;
              Mail recMail = null;
              try {
                textMessage = (TextMessage)recvMsg;
                xmlMailMessage = textMessage.getText();
                recMail = Mail.fromXML(xmlMailMessage);
                sendMail(recMail.getAddress(), recMail.getSubject(), recMail.getContent(),  Locale.getDefault());
      - path: legacy-source/petstore1.3.2/src/components/mailer/src/ejb-jar.xml
        line_start: 48
        line_end: 56
        excerpt: |2
              <message-driven>
                <description>opc node to process PurchaseOrders from the Java Pet Store</description>
                <display-name>MailerMDB</display-name>
                <ejb-name>MailerMDB</ejb-name>
                <ejb-class>com.sun.j2ee.blueprints.mailer.ejb.MailerMDB</ejb-class>
                <transaction-type>Container</transaction-type>
                <message-driven-destination>
                  <destination-type>javax.jms.Queue</destination-type>
                </message-driven-destination>
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/sun-j2ee-ri.xml
        line_start: 377
        line_end: 378
