    requirement: >
      WHEN a Customer is deleted, THEN the system SHALL also delete that Customer's Account and
      Profile. WHEN an Account is deleted, THEN the system SHALL also delete its contact
      information and credit card. WHEN contact information is deleted, THEN the system SHALL
      also delete its address.
    confidence: medium
    confidence_basis: >
      The cascade is stated declaratively, one relation at a time, in the descriptor, and
      that is the only source. I found no code path that deletes a Customer, so this
      behaviour may never run in practice.
