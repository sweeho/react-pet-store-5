  - record_key: CUSTOMER-ACCOUNT-RULE-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      The system SHALL create a Customer, its Account (with contact information and credit
      card) and its Profile as a single all-or-nothing unit. GIVEN the Account or the Profile
      cannot be created, WHEN a Customer is being created, THEN customer creation SHALL fail
      and leave no partial Customer behind.
    confidence: low
    confidence_basis: >
      This is inferred. The creation method is declared transactional (Required), and a
      lookup failure in the post-create hook raises a creation error. Container rollback is
      implied, not stated. I did not check whether a caller catches the error and continues.
    risk_class: operational
    basis: >
      LocalHome.create(String) on CustomerEJB carries trans-attribute Required.
      ejbPostCreate turns a NamingException into a CreateException.
