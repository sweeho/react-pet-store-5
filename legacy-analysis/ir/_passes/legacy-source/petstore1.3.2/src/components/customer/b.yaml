findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
    description: >
      The account status "disabled" is defined (line 49), but nothing in legacy-source sets
      it or reads account status. The only assignment uses "active". A human needs to decide
      whether disabling accounts is a real requirement (for example, blocking sign-on or
      checkout for a disabled account) or dead scaffolding.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
    description: >
      Every method on all six beans is marked <unchecked/> (no role restriction), with
      use-caller-identity. Access to customer data, including the credit card, is therefore
      not enforced at the data layer. The access-control rules must come from the web tier
      (sign-on capability, another shard). Someone needs to confirm where that restriction is
      enforced, and which customer data only the owning customer may read.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
    description: >
      There is no DDL or field-level constraint in this module for contact information,
      address or credit card (required-ness, lengths, email/phone/zip formats, card number
      format, expiry format). The credit card number and expiry date are plain Strings with
      no sign of masking or encryption. The ContactInfo, Address and CreditCard bean classes
      live in other components (contactinfo, address, creditcard). Validation rules must be
      taken from those shards or from the web forms, and the handling of stored card data
      needs a human decision (regulated).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
    description: >
      Customer deletion cascades to Account/Profile, and on to ContactInfo/CreditCard/Address
      (relationships section). I found no caller that deletes a Customer. It is unresolved
      whether account deletion is a supported business operation or only an artefact of the
      container relationship declaration.
