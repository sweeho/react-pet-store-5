    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL keep one Customer record per user id. The user id SHALL be the
      Customer's unique identifier. Each Customer SHALL own exactly one Account and exactly
      one Profile.
    confidence: medium
    confidence_basis: >
      The descriptor declares the primary key and the one-to-one relations, and the bean
      class repeats them, so the evidence is consistent. It is not high because I cannot see
      pass A, and the key's uniqueness comes from the container's primary-key semantics, not
      from DDL. There is no DDL in this module.
    risk_class: operational
    basis: >
      CustomerEJB's primary key is the single CMP field userId (String). CMR fields account
      and profile are declared One-to-One in the relationships section.
    traces:
