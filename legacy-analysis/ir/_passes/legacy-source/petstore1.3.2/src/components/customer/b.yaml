  - record_key: CUSTOMER-ACCOUNT-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      WHEN a Customer is created for a user id, THEN the system SHALL create a new Account
      for that Customer with status "active", and the new Account SHALL start with an empty
      contact-information record and an empty credit-card record.
    confidence: medium
    confidence_basis: >
      The rule is explicit, unconditional code in the post-create hook, with one source only.
      I did not trace which screen triggers creation. That is outside this shard (the
      petstore app calls create(userId)).
    risk_class: operational
    basis: >
      CustomerEJB.ejbPostCreate creates the Account with AccountLocalHome.Active ("active").
      AccountEJB.ejbPostCreate(String) then creates a blank ContactInfo and a blank CreditCard
      and links them.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 79
        excerpt: |
              public void ejbPostCreate(String userId) throws CreateException {
                  try {
                  InitialContext ic = new InitialContext();
                  AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
                  AccountLocal account = alh.create(AccountLocalHome.Active);
                  setAccount(account);
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
        excerpt: |
              public static final String Active = "active";
              public static final String Disabled = "disabled";
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 89
        excerpt: |
              public void ejbPostCreate(String status) throws CreateException {
                  setStatus(status);
                  try {
                      InitialContext ic = new InitialContext();
                      ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                      ContactInfoLocal contactInfo = cih.create();
                      setContactInfo(contactInfo);
                      CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                      CreditCardLocal creditCard = cch.create();
                      setCreditCard(creditCard);
    stack_metadata:
      ejb.bean: CustomerEJB, AccountEJB
      ejb.transaction: Required

