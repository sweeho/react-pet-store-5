  - record_key: customer-account-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN a new customer is created for a user id
      WHEN the customer record is created
      THEN the system SHALL create an Account for it with status "active".
    confidence: medium
    confidence_basis: >
      A single programmatic source (post-create logic) using a named constant. The
      separate bulk-load path also uses the same constant, but that path is outside
      this shard. No test or configuration states the rule.
    risk_class: operational
    basis: >
      Customer post-create looks up the account home and calls create with
      AccountLocalHome.Active, whose value is "active".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 74
        line_end: 79
        excerpt: |
              public void ejbPostCreate(String userId) throws CreateException {
                  try {
                  InitialContext ic = new InitialContext();
                  AccountLocalHome alh = (AccountLocalHome) ic.lookup("java:comp/env/ejb/Account");
                  AccountLocal account = alh.create(AccountLocalHome.Active);
                  setAccount(account);
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountLocalHome.java
        line_start: 48
        line_end: 49
        excerpt: |
              public static final String Active = "active";
              public static final String Disabled = "disabled";
    stack_metadata:
      ejb.bean: CustomerEJB
      ejb.transaction: Required

  - record_key: customer-account-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN a new customer is created
      WHEN its profile is initialised
      THEN the system SHALL set preferred language to "en_US", favourite category
      to none, My List preference to enabled and banner preference to enabled.
    confidence: medium
    confidence_basis: >
      Defaults are named constants on one interface and applied in one place.
      Values are unambiguous; there is a single source and no test. The values are
