  - record_key: customer-account-BUSINESS-RULE-0006
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN a customer is being created
      WHEN its account or profile cannot be created
      THEN the system SHALL fail the customer creation as a whole, leaving no
      partially created customer.
    confidence: medium
    confidence_basis: >
      The failure is raised in code and every customer-module operation runs with
      a Required transaction, so all-or-nothing follows from the container. The
      atomicity is inferred from the transaction attribute, not stated as a rule.
    risk_class: operational
    basis: >
      CustomerEJB.ejbPostCreate converts a lookup failure into CreateException;
      all 80 container-transaction entries in the descriptor use Required.
