      Declared in the descriptor (cmp-field status, two one-to-one relations) and
      mirrored by the bean's abstract accessors. No DDL in this module, so column
      nullability and lengths are unknown.
    risk_class: operational
    basis: >
      Account entity has CMP field status and CMR fields contactInfo and creditCard,
      each declared multiplicity One on both sides.
