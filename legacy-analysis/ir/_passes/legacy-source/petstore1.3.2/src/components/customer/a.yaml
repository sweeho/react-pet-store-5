records:
  - record_key: customer-account-ENTITY-0001
    kind: entity
    capability_key: customer-account
    requirement: >
      The system SHALL maintain a Customer record identified by a unique user id,
      and each Customer SHALL own exactly one Account and exactly one Profile.
    confidence: high
    confidence_basis: >
      Stated declaratively (primary-key field and one-to-one relationships in the
      deployment descriptor) and programmatically (CMP/CMR accessors on the bean
      class). Two independent layers agree. Not yet cross-checked against pass B.
    risk_class: operational
    basis: >
      userId is the declared primary key of the Customer entity; the Customer has
      account and profile relationship fields, each declared with multiplicity One
      on both sides.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/ejb-jar.xml
        line_start: 53
        line_end: 61
        excerpt: |
                <prim-key-class>java.lang.String</prim-key-class>
                <reentrant>False</reentrant>
                <cmp-version>2.x</cmp-version>
                <abstract-schema-name>Customer</abstract-schema-name>
                <cmp-field>
                  <description>no description</description>
                  <field-name>userId</field-name>
                </cmp-field>
                <primkey-field>userId</primkey-field>
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/ejb/CustomerEJB.java
        line_start: 57
        line_end: 65
        excerpt: |
              public abstract String getUserId();
              public abstract void setUserId(String userId);

              // CMR Fields
              public abstract AccountLocal getAccount();
              public abstract void setAccount(AccountLocal account);

              public abstract ProfileLocal getProfile();
              public abstract void setProfile(ProfileLocal profile);
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: CustomerEJB
      db.object: Customer (abstract schema)

  - record_key: customer-account-ENTITY-0002
