  - record_key: customer-account-BUSINESS-RULE-0003
    kind: business-rule
    capability_key: customer-account
    requirement: >
      GIVEN an account is created with only a status
      WHEN the account is initialised
      THEN the system SHALL attach a new, empty contact-information record and a
      new, empty credit-card record to it, so that every account always has both.
    confidence: medium
    confidence_basis: >
      One programmatic source; the alternate create path (status plus supplied
      contact info and card) is used by the bulk loader outside this shard. Both
      paths end with both relations set, which supports the invariant, but it is
      not enforced declaratively (no NOT NULL visible).
    risk_class: operational
    basis: >
      AccountEJB.ejbPostCreate(status) creates ContactInfo and CreditCard through
      their homes with no arguments and sets both relations; the three-argument
      variant sets the supplied ones.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/customer/src/com/sun/j2ee/blueprints/customer/account/ejb/AccountEJB.java
        line_start: 80
        line_end: 99
        excerpt: |
              public void ejbPostCreate(String status) throws CreateException {
                  setStatus(status);
                  try {
                      InitialContext ic = new InitialContext();
                      ContactInfoLocalHome cih = (ContactInfoLocalHome) ic.lookup("java:comp/env/ejb/ContactInfo");
                      ContactInfoLocal contactInfo = cih.create();
                      setContactInfo(contactInfo);
                      CreditCardLocalHome cch = (CreditCardLocalHome) ic.lookup("java:comp/env/ejb/CreditCard");
                      CreditCardLocal creditCard = cch.create();
                      setCreditCard(creditCard);
                  } catch (javax.naming.NamingException ne) {
                      throw new CreateException("ContactInfoEJB error: naming exception looking up contact info or credit card");
                  }

              }

              public void ejbPostCreate(String status, ContactInfoLocal contactInfo, CreditCardLocal creditCard) throws CreateException {
                  setContactInfo(contactInfo);
                  setCreditCard(creditCard);
              }
    stack_metadata:
      ejb.bean: AccountEJB
      ejb.transaction: Required

  - record_key: customer-account-BUSINESS-RULE-0004
