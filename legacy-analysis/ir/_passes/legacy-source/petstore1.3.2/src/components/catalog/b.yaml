  - record_key: catalog-browsing-ENTITY-0003
    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL model a catalog Item (a purchasable variant of a Product) carrying: its
      category identifier, product identifier, product name, item identifier, image location,
      description, up to five free-text attributes, a list price and a unit cost. The image,
      description and prices SHALL be held per locale. GIVEN no description is supplied WHEN an
      Item is created THEN its description SHALL read "none".
    confidence: medium
    confidence_basis: >
      Field list is explicit in the model and matches the SELECT column lists in both DAOs. The
      "none" default is a field initialiser that every constructor path overwrites (even with null),
      so it is only effective if some caller bypasses the constructor; kept at medium because the
      per-locale placement of price comes from table aliases, not DDL.
    risk_class: financial
    basis: >
      Item.java fields and constructor. Item queries select image/descn from item_details (aliased b)
      filtered by b.locale; listprice/unitcost are unqualified columns, so which table owns price
      (item vs item_details) cannot be confirmed without the DDL.
