  - record_key: catalog-browsing-BR-0006
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL return every catalog list (categories, products, items, search results) one
      page at a time, given a zero-based start position and a page size. Each page SHALL report
      whether a next page exists (true only if at least one further row exists beyond the page) and
      whether a previous page exists (true when start > 0). The next page SHALL start at
      start + rows-on-this-page, and the previous page SHALL start at max(start - rows-on-this-page, 0).
      GIVEN start is negative or beyond the last row WHEN a page is requested THEN the system SHALL
      return an empty page with no next or previous page.
    confidence: high
    confidence_basis: >
      The same paging loop appears in both DAO implementations for all four list operations, and
      the navigation arithmetic is in the shared Page model. Note that "previous" start arithmetic
      uses the current page's row count, not the requested size (see findings).
