findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
    description: >
      Item list by product (getItems, lines 317-320 here and GenericCatalogDAO.java 319-322) passes
      the product id into the Item's category slot and the selected catid into its productId slot
      (constructor order is category, productId, productName, itemId). getItem and searchItems map
      them correctly. So items returned from "list items of a product" report category and product
      swapped. A human must decide whether any screen reads those two fields from this list (a live
      bug) and confirm the rebuild should return the correct values.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
    description: >
      Keyword search case sensitivity differs between implementations. Cloudscape DAO lower-cases each
      keyword (CloudscapeCatalogDAO.java 392) before `lower(...) like ?`; Generic DAO (lines 361-365)
      does not, so any keyword containing upper-case letters matches nothing under the Generic DAO.
      Which DAO is deployed is redacted in ejb-jar.xml (lines 60-61). Decide whether search is
      case-insensitive (recorded as disputed in catalog-browsing-BR-0009).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/ejb-jar.xml
    description: >
      The env-entry values for param/CatalogDAOClass and param/CatalogDAODatabase (lines 60-67) are
      redacted in this copy, and a commented-out alternative (oracle) exists. The active DAO class and
      database dialect cannot be determined from the source, which leaves search case sensitivity and
      the exact SQL in use unresolved.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
    description: >
      Page-size edge case: the paging loop is a do/while with `--count > 0`, so a request with page
      size 0 or negative still returns one row (lines 197-201; same in every list method of both
      DAOs). Decide whether the rebuild should return an empty page or reject non-positive sizes.
      Also, getStartOfPreviousPage uses the current page's row count, so from a short last page the
      "previous" start lands mid-page rather than on the prior page boundary (Page.java 89-91).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
    description: >
      Item listing (GET_ITEMS, lines 89-95) and keyword search (lines 96-110) have no ORDER BY, so
      paged results have no guaranteed order and pages may overlap or skip rows between requests.
      Decide the intended ordering for the rebuild (categories and products are ordered by name).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
    description: >
      getLocaleFromString (lines 359-386) never parses a variant (variantIndex is fixed at -1), and for
      a three-part string such as "en_US_X" leaves country null, which the Locale constructor rejects
      with a NullPointerException. It also returns null for a bare language ("en"). setCount (line 106)
      throws on a non-numeric count. Decide the rebuild's handling of malformed locale and paging input.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/util/DatabaseNames.java
    description: >
      getTableName (lines 55-65) maps Japan/China locales to _ja/_zh tables but has no caller anywhere
      in the legacy tree; the live queries use per-locale rows instead. Probably dead code; recorded as
      localization-BR-0003 (disputed, low). Confirm it can be dropped.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
    description: >
      Minor divergence in whitespace handling: Cloudscape getProducts trims product name and
      description (lines 238-240) while Generic getProducts does not (GenericCatalogDAO.java 252-254),
      and neither trims category names. If the store uses fixed-width CHAR columns, displayed names
      would differ by DAO. Low impact; confirm column types in the DDL.
