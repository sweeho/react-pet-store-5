  - record_key: localization-BR-0002
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL accept a locale as text in the form language_COUNTRY (for example en_US).
      GIVEN the text "default" (any case) THEN the server's default locale SHALL be used. GIVEN text
      with no underscore, or no text, THEN no locale SHALL be resolved.
    confidence: low
    confidence_basis: >
      Single source, and the parser is visibly incomplete: its doc comment promises a variant part
      that is never parsed, and a three-part string leaves country unset (see findings). What happens
      downstream with an unresolved (null) locale is not handled in this module.
    risk_class: operational
    basis: >
      CatalogHelper.getLocaleFromString.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 359
        line_end: 386
        excerpt: |
              private Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                      if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                      } else {
                          return null;
                      }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {

                      variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                      return new Locale(language, country, variant);
                  } else {
                      return new Locale(language, country);
                  }
              }

