    kind: entity
    capability_key: catalog-browsing
    requirement: >
      The system SHALL maintain catalog categories, each with a stable identifier and a
      name and description that are held per locale, and each category SHALL contain one
      or more products.
    confidence: medium
    confidence_basis: >
      The shape comes from the model class and the SQL join, which agree. The DDL for
      category / category_details is not in this module, so keys and NOT NULL constraints
      could not be confirmed. "One or more products" is stated only in a class comment.
    risk_class: operational
    basis: >
      The Category model has id, name and description fields. The SQL joins category to
      category_details on catid and filters on locale, so name and description are
      per-locale while the catid is not.
