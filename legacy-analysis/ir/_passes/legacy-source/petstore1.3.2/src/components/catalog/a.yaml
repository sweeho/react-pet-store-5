findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
    description: >
      getItems (lines 317-320; same in GenericCatalogDAO.java 319-322) builds
      Item(productID, catid, ...). The Item constructor's order is (category, productId,
      ...), so items listed for a product carry the product ID in the category field and
      the category ID in the product ID field. getItem and searchItems map correctly. A
      human must confirm the intended mapping (almost certainly category=catid,
      productId=productID) and check whether any screen or the cart relies on the swapped
      values.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/GenericCatalogDAO.java
    description: >
      Search keyword case handling differs between the two DAO implementations.
      CloudscapeCatalogDAO lower-cases each keyword before binding (lines 392-401).
      GenericCatalogDAO binds keywords as typed (lines 361-365), while the SQL lower-cases
      the columns (apps/petstore CatalogDAOSQL.xml), so an upper-case keyword never matches
      on the generic path. Which DAO runs is set by param/CatalogDAOClass in ejb-jar.xml
      line 61, and that value is redacted in this tree, so the effective behaviour cannot
      be determined. Decide whether search is case-insensitive (recommended) and which
      implementation is authoritative.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/ejb-jar.xml
    description: >
      The active DAO implementation (param/CatalogDAOClass, line 61) and database dialect
      (param/CatalogDAODatabase, line 67) are redacted. It is unknown whether production
      used the hard-coded Cloudscape SQL or the externalised generic SQL (cloudscape or
      oracle section). Their result mappings also differ slightly: Cloudscape getProducts
      trims name and description (lines 238-240), generic does not (252-254).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
    description: >
      Item listings (GET_ITEMS, lines 89-95) and search results (SEARCH_ITEMS, lines 96-110)
      have no ORDER BY, so their display order is whatever the database returns and may
      differ between pages. Paging over an unordered result can skip or repeat rows. A
      human must decide the intended sort order.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/dao/CloudscapeCatalogDAO.java
    description: >
      Search matches keywords against the category identifier (lower(catid)), not the
      localized category name, and against the localized product name and item description
      only. A Japanese or Chinese shopper can therefore match categories only by their
      internal (English) IDs. Decide whether that is intended.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Page.java
    description: >
      getStartOfPreviousPage (lines 89-91) subtracts the current page's size, not the
      requested page size. Coming back from a short final page lands mid-page (for example
      count=10, start=20 with 3 results gives previous start 17). The commented-out
      containingListSize code (lines 47-79, marked XXX) shows the total-count design was
      abandoned. Confirm the intended previous-page behaviour.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/model/Item.java
    description: >
      List price and unit cost are carried as Java doubles (lines 59-60). Currency and
      rounding are not defined anywhere in this module. The rebuild needs a decision on
      decimal representation and on whether prices differ by locale (prices are read from
      the item table, not the locale-specific item_details, so they appear
      locale-independent).
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/util/DatabaseNames.java
    description: >
      Dead code. DatabaseNames.getTableName (US base table, JAPAN "_ja" suffix, CHINA
      "_zh" suffix) and JNDINames.USE_CATALOG_EJB have no callers anywhere in
      legacy-source. Locale separation is actually done through a locale column on the
      *_details tables. No requirement was emitted from them. If a batch or loader outside
      the tree still uses per-locale suffixed tables, a human should say so.
