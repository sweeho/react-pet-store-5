  - record_key: CATALOG-BR-0010
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL accept a locale in the form language_COUNTRY (for example en_US,
      ja_JP, zh_CN), and SHALL treat the value "default" (any case) as the server's
      default locale. GIVEN a locale value with no underscore WHEN catalog data is
      requested THEN no locale is resolved.
    confidence: low
    confidence_basis: >
      Single hand-written parser. The variant handling is unreachable (variantIndex is
      never assigned), and a three-part string produces a malformed country. What happens
      downstream with a null locale (a NullPointerException in the DAO on
      locale.toString()) is inferred, not observed.
    risk_class: operational
    basis: >
      getLocaleFromString returns Locale.getDefault() for "default", null when there is no
      '_', and otherwise new Locale(language, country).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/catalog/src/com/sun/j2ee/blueprints/catalog/client/CatalogHelper.java
        line_start: 359
        line_end: 386
        excerpt: |2
              private Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                      if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                      } else {
                          return null;
                      }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {

                      variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                      return new Locale(language, country, variant);
                  } else {
                      return new Locale(language, country);
                  }
              }

