      The DDL (column types, precision of listprice/unitcost, nullability of attr1..attr5)
      is not in this module.
    risk_class: financial
    basis: >
      Item.java declares the fields. GET_ITEM reads image, descn and attr1..attr5 from
      item_details (joined on b.locale) and listprice and unitcost from the item tables.
