    kind: integration
    capability_key: catalog-browsing
    requirement: >
      The system SHALL treat the catalog as read-only in this module. GIVEN the catalog data
      store is unavailable or a query fails WHEN catalog data is requested THEN the request
      SHALL fail with a catalog error, and no partial result SHALL be returned.
    confidence: medium
