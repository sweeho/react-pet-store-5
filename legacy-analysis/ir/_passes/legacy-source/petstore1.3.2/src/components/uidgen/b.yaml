records:
  - record_key: CHECKOUT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL form each generated identifier by concatenating the requested
      prefix with the decimal value of that prefix's counter after incrementing it by one,
      with no separator and no zero-padding.
    confidence: medium
    confidence_basis: >
      The rule is stated in a single place (the counter's next-value method); there is no
      schema constraint, test or document restating the format. Not high because only one
      source exists and pass A has not been compared.
    risk_class: operational
    basis: >
      getNextValue reads the stored counter, adds 1, stores it, and returns
      name + String.valueOf(count). The counter's name is the prefix passed in by the caller.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
        line_start: 67
        line_end: 70
        excerpt: |2
              public String getNextValue() {
                  int count = getCounter() + 1;
                  setCounter(count);
                  return getName() + String.valueOf(count);
      - path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
        line_start: 67
        line_end: 68
        excerpt: |2
              public String getUniqueId(String idPrefix) {
                  return getCounter(idPrefix).getNextValue();
    stack_metadata:
