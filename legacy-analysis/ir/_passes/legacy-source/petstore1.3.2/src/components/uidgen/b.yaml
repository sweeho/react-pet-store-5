findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/sun-j2ee-ri.xml
    description: >
      Lines 631-632 set create-table-deploy and delete-table-undeploy to true for
      CounterEJBTable, so a redeploy drops the counters and order identifiers restart at
      "10011" and repeat identifiers already issued. A human must decide whether order-id
      uniqueness must survive restarts/redeploys (almost certainly yes for the rebuild) or
      whether this was reference-implementation convenience only.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/counter/ejb/CounterEJB.java
    description: >
      Identifiers are prefix + count with no separator or padding (lines 68-70). Across
      different prefixes this is not collision-free (prefix "100" count 11 and prefix
      "1001" count 1 both yield "10011"). Only prefix "1001" is used today. Also the counter
      is a Java int with no overflow handling. Decide whether the rebuild must preserve the
      exact "1001"+N format (e.g. for partner document exchange or existing order numbers)
      or may use any unique identifier.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/uidgen/src/com/sun/j2ee/blueprints/uidgen/ejb/UniqueIdGeneratorEJB.java
    description: >
      Find-or-create (lines 78-80) is not guarded against two concurrent first requests for
      the same prefix: both may miss the finder and both call create, the second failing on
      the primary key and surfacing as "Could not create counter". Whether this race matters
      depends on container isolation, which the source does not show. Also the interface
      comment (UniqueIdGeneratorLocal.java line 42) says the prefix must not be null, but
      nothing enforces it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
    description: >
      The caller swallows generator creation/lookup failures (lines 105-109 printStackTrace)
      and then dereferences a null generator at line 110, so an unavailable generator causes
      an unhandled null-pointer failure during order placement rather than a defined error.
      Outside this shard; recorded so the checkout owner decides the intended failure behaviour.
