      ejb.bean: CounterEJB, UniqueIdGeneratorEJB

  - record_key: CHECKOUT-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL maintain one independent counter per identifier prefix, creating it
      on first use with a starting value of 0, so that the first identifier issued for a
      prefix ends in "1".
      GIVEN no counter exists for a prefix WHEN an identifier is requested for that prefix
      THEN a counter for the prefix SHALL be created at 0 and the identifier returned SHALL be
      the prefix followed by "1".
    confidence: medium
    confidence_basis: >
      Find-or-create and the initial value 0 are each visible in one code location; the
      initial value is a bare literal with no configuration. Medium rather than low because
      the code path is unambiguous and reachable from checkout.
    risk_class: operational
    basis: >
      getCounter looks the counter up by name and, on a finder failure, creates it;
      ejbCreate sets the counter to 0. getNextValue then increments before returning.
    traces:
