    kind: business-rule
    capability_key: localization
    requirement: "The system SHALL interpret a stored locale string as follows: \"default\" (any case) SHALL mean the server's default locale; a string of the form language_COUNTRY SHALL mean that language and country; a string with no underscore SHALL yield no locale."
    confidence: low
