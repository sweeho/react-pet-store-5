  - record_key: B2B-RULE-0001
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: The system SHALL require each exchanged line item's quantity to be a positive integer (at least 1), its line number to be a non-negative integer, and its unit price to be a decimal greater than or equal to zero. GIVEN a line item with unit price 0.0 WHEN the document is validated against the schema THEN it SHALL be accepted.
    confidence: low
    confidence_basis: Enforced only in the XSD, which is used only when a document is built/validated in XSD mode; the DTD types all six as free text. The zero-price acceptance contradicts the type name positiveDecimal, so intended behaviour is uncertain.
    risk_class: financial
    basis: TPALineItem.xsd types lineNo as xsd:nonNegativeInteger, quantity as xsd:positiveInteger and unitPrice as positiveDecimal, a restriction of xsd:decimal with minInclusive 0.0. The builder takes quantity as int and unitPrice as float with no range check.
    traces:
