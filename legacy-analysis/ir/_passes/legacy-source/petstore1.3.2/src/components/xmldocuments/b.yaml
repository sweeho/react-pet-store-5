  - record_key: B2B-ENTITY-0002
    kind: entity
    capability_key: b2b-document-exchange
    requirement: "The system SHALL represent a supplier invoice as a document containing, in this order: an order id, a user id, an order date, a shipping date, and one or more line items. The invoice SHALL carry a locale that defaults to en_US when not supplied."
    confidence: medium
    confidence_basis: Element sequence agrees across DTD, XSD and the builder. The locale default is declared only in the DTD and is absent from the XSD, so that part has a single source (raised as a conflict finding).
    risk_class: financial
    basis: TPAInvoice.dtd declares Invoice (OrderId, UserId, OrderDate, ShippingDate, LineItems) with locale CDATA default "en_US"; TPAInvoice.xsd declares the same sequence without a locale attribute; TPAInvoiceXDE.copyDocument appends children in the same order.
