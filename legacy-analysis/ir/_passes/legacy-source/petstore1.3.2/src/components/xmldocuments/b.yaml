  - record_key: B2B-RULE-0002
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: The system SHALL NOT allow the same item id to appear on more than one line item within a single supplier order or a single supplier invoice. GIVEN two line items with the same item id in one document WHEN it is validated against the schema THEN validation SHALL report an error.
    confidence: low
    confidence_basis: Declared only as an xsd:unique constraint in two XSDs; the DTDs cannot express it and no Java code checks it. It is only enforced in XSD validation mode, and validation errors are logged rather than rejected (see B2B-RULE-0006), so its runtime effect is doubtful.
    risk_class: operational
    basis: xsd:unique name="itemIdUniqueness" over tpali:LineItem/@itemId inside LineItems in both TPASupplierOrder.xsd and TPAInvoice.xsd.
