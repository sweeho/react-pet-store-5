  - record_key: B2B-REQ-0001
    kind: requirement
    capability_key: b2b-document-exchange
    requirement: The system SHALL be able to produce each supplier order and supplier invoice document in either of two schema formats (DTD-declared or XML-Schema-declared), selected per document editor. In DTD format the output SHALL declare the document type public identifier; the schema location SHALL be taken from the configured entity catalog when it maps the identifier, and otherwise from the built-in default location.
    confidence: medium
    confidence_basis: Identical logic in both TPA editors plus the shared serializer. The XSD branch that would write xsi:schemaLocation is commented out, so XSD-format output carries no schema reference at all; that part is certain from code but its intent is not.
    risk_class: operational
    basis: TPA editor constructors take (entityCatalogURL, xsdValidation), resolve systemId via CustomEntityResolver.mapEntityURI of the XSD or DTD public id, falling back to a hard-coded resource path. serialize() sets DOCTYPE_PUBLIC/DOCTYPE_SYSTEM only when !xsdSupport; the schemaLocation branch is commented out.
    traces:
