  - record_key: B2B-ENTITY-0001
    kind: entity
    capability_key: b2b-document-exchange
    requirement: "The system SHALL represent a supplier order sent to a supplier as a document containing, in this order: an order id, an order date, a shipping address, and one or more line items. The shipping address SHALL contain first name, last name, street, city, state, country, zip code, email and phone, all required and in that order."
    confidence: medium
    confidence_basis: The structure is declared independently in a DTD and an XSD and is built in the same order by the document editor, so three sources agree. Graded medium rather than high only because this is a single pass and cross-pass agreement is not yet known.
    risk_class: operational
    basis: TPASupplierOrder.dtd and TPASupplierOrder.xsd both declare the root sequence OrderId, OrderDate, ShippingAddress, LineItems(LineItem+) and the nine-field address; TPASupplierOrderXDE.copyDocument appends children in the same order.
