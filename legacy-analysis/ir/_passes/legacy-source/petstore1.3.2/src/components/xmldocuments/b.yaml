  - record_key: B2B-ENTITY-0003
    kind: entity
    capability_key: b2b-document-exchange
    requirement: "The system SHALL represent each line item exchanged with a supplier (on supplier orders and invoices) with six required values: category id, product id, item id, line number, quantity and unit price."
    confidence: medium
    confidence_basis: 'All six attributes are #REQUIRED in the DTD, use="required" in the XSD, and always written by the shared line-item builder. Single pass, so not high.'
