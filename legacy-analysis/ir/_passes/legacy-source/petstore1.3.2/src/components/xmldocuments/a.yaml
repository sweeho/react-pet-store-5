    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL resolve the schemas of exchanged documents from copies bundled with the application, keyed by document type identifier. A deployment SHALL be able to supply additional or overriding mappings. When an identifier has no mapping, the system SHALL try the schema location named in the document.
