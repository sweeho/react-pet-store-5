  - record_key: localization-business-rule-0012
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL interpret a locale carried in an exchanged document as language_COUNTRY (for example en_US or ja_JP), and SHALL treat the value "default" (in any letter case) as the server's default locale. GIVEN a locale value with no underscore (for example "en") WHEN it is interpreted THEN no locale is produced.
    confidence: low
    confidence_basis: >
      The parsing is explicit, but it is buggy for three-part values: the country is never set, and the variant index is never assigned. The code cannot show what should happen for a bare language code or a variant. The only caller seen is the purchase order component. Low because the intended behaviour beyond language_COUNTRY is not recoverable.
    risk_class: presentational
    basis: >
      getLocaleFromString returns null for null input, returns Locale.getDefault() for "default", returns null when there is no underscore, and otherwise splits the value at the first underscore into language and country. The purchase order document's locale attribute defaults to en_US in the DTDs.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 644
        line_end: 678
        excerpt: |2
            public static Locale getLocaleFromString(String localeString) {
                  if (localeString == null) {
                return null;
                  }
                  if (localeString.toLowerCase().equals("default")) {
                return Locale.getDefault();
                  }
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) {
                return null;
                  }
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                } else {
                          return null;
                }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) {
                countryIndex = localeString.indexOf('_', countryIndex +1);
                  }
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {
                variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                return new Locale(language, country, variant);
                  } else {
                return new Locale(language, country);
                  }
            }
    stack_metadata:
      class: com.sun.j2ee.blueprints.xmldocuments.XMLDocumentUtils
      caller: components/purchaseorder PurchaseOrder.java line 140

