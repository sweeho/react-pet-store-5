  - record_key: b2b-document-exchange-business-rule-0003
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL give every line item in a supplier order or invoice document a category id, product id, item id, line number, quantity and unit price, all mandatory. The line number SHALL be a non-negative integer, the quantity SHALL be a whole number of at least 1, and the unit price SHALL be a decimal number greater than or equal to 0.
    confidence: medium
    confidence_basis: >
      The DTD and the XSD both make all six attributes mandatory. The numeric ranges come from the XSD alone and are not repeated in the code that builds line items. The code does not check them before writing. The legacy parser also does not reject documents that fail validation (see b2b-document-exchange-business-rule-0008). Medium, not high, because the ranges have one source and are not visibly enforced.
    risk_class: financial
    basis: >
      TPALineItem.xsd types lineNo as xsd:nonNegativeInteger, quantity as xsd:positiveInteger and unitPrice as positiveDecimal, which is a decimal with minInclusive 0.0. So despite the type name, a zero price is valid. TPALineItem.dtd marks all six attributes #REQUIRED.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPALineItem.xsd
        line_start: 10
        line_end: 23
        excerpt: |
