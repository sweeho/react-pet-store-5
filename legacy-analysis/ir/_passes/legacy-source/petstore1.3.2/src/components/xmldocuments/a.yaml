  - record_key: b2b-document-exchange-business-rule-0006
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL write each line item's quantity as a whole number and its unit price as a decimal number in the partner document.
    confidence: low
    confidence_basis: >
      What the code does is clear: it takes the quantity as an integer and the price as a single-precision binary float, and prints the float with its default text form. No rounding rule, scale or currency is stated anywhere. Those default forms can produce values the schema rejects (see findings). The intended price precision is unknown, so the grade is low.
    risk_class: financial
    basis: >
      TPALineItemUtils.addLineItem takes int quantity and float unitPrice. It writes them with Long.toString(quantity) and Float.toString(unitPrice), and applies no rounding or formatting.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
        line_start: 64
        line_end: 77
        excerpt: |2
            public static void addLineItem(Document document, Element lineItemsElement,
                                           String categoryId, String productId, String itemId, String lineNo,
                                           int quantity, float unitPrice) {
              Element lineItemElement = document.createElementNS(XML_NAMESPACE, XML_LINEITEM);
              lineItemElement.setAttributeNS("http://www.w3.org/2000/xmlns/", "xmlns:" + XML_PREFIX, XML_NAMESPACE);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_CATEGORYID, categoryId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_PRODUCTID, productId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_ITEMID, itemId);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_LINENO, lineNo);
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_QUANTITY, Long.toString(quantity));
              lineItemElement.setAttributeNS(XML_NAMESPACE, XML_UNITPRICE, Float.toString(unitPrice));
              lineItemsElement.appendChild(lineItemElement);
              return;
            }
    stack_metadata:
      framework: JAXP DOM
      class: com.sun.j2ee.blueprints.xmldocuments.tpa.TPALineItemUtils

