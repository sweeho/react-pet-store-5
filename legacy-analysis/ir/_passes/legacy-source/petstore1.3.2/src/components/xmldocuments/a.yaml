  - record_key: order-approval-business-rule-0008
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL reject an order approval entry that lacks an order id or an order status. GIVEN an order approval document in which an Order has an empty or missing OrderId or OrderStatus WHEN the document is read THEN reading fails with an error naming the missing element.
    confidence: medium
    confidence_basis: >
      The read path calls the content getters with optional=false, and those getters throw when an element is missing or has empty text. The DTD also makes both elements mandatory. The code path is clear, and the grade is medium only because this is a single pass.
    risk_class: operational
    basis: >
      ChangedOrder.fromDOM reads OrderId and then OrderStatus as non-optional. XMLDocumentUtils.getContent throws "<tag> element: content expected." when there is no text, and getNextSibling throws "<name> element expected after <tag>." when the element is absent.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/ChangedOrder.java
        line_start: 80
        line_end: 90
        excerpt: |2
            public static ChangedOrder fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_ORDER)) {
                Element child;
                ChangedOrder changedOrder = new ChangedOrder();
                changedOrder.orderId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_ORDERID, false), false);
                changedOrder.orderStatus = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_ORDERSTATUS, false), false);
                return changedOrder;
              }
              throw new XMLDocumentException(XML_ORDER + " element expected.");
            }
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
        line_start: 153
        line_end: 166
        excerpt: |2
            public static String getContent(Element element, boolean optional) throws XMLDocumentException {
                  StringBuffer buffer = new StringBuffer();
                  for (Node child = element.getFirstChild(); child != null; child = child.getNextSibling()) {
                if (child.getNodeType() == Node.TEXT_NODE || child.getNodeType() == Node.CDATA_SECTION_NODE) {
                          try {
                    buffer.append(((Text) child).getData());
                          } catch (DOMException e) {}
                }
                  }
                  if (!optional && buffer.length() == 0) {
                throw new XMLDocumentException(element.getTagName() + " element: content expected.");
                  }
                  return buffer.toString();
            }
    stack_metadata:
      framework: JAXP DOM
      class: com.sun.j2ee.blueprints.xmldocuments.ChangedOrder

  - record_key: b2b-document-exchange-business-rule-0009
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL reject an inbound XML document that is not well-formed, or whose declared document type differs from the type expected at that point. GIVEN an inbound document that declares no document type WHEN it is read with document-type checking THEN the legacy system accepts it without a type check. GIVEN an inbound document that breaks its schema without being malformed (for example a missing required element) WHEN it is read with validation on THEN the legacy system logs the error and continues. It does not reject the document.
    confidence: medium
    confidence_basis: >
      The code paths are explicit, and the comments say the missing-doctype acceptance is a deliberate workaround. Whether the "log and continue" handling of validity errors is the intended business behaviour is not stated, and it is raised as a finding. Medium because this is a single pass over a single source.
