findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
    description: >
      The schemas declare required elements, numeric ranges and item-id uniqueness. The parser's ErrorHandler.error() (lines 525-528 and 594-597), however, only prints non-fatal validation errors and returns, so a malformed-by-schema but well-formed document is accepted. checkDocumentType (626-634) also returns true when there is no DOCTYPE. A human must decide whether the rebuild rejects schema-invalid partner documents (the declared intent) or reproduces the lenient legacy behaviour.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
    description: >
      TPALineItemUtils writes line-item attributes with setAttributeNS(XML_NAMESPACE, ...), which makes them namespace-qualified. TPALineItem.xsd declares no attributeFormDefault, so it expects unqualified attributes, and the xsd:unique field selects an unqualified @itemId. Generated documents may therefore fail XSD validation, and the uniqueness constraint may never match. Decide the intended wire form.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPALineItemUtils.java
    description: >
      The unit price is a Java float written with Float.toString (line 74). Prices of 10,000,000 or more come out in scientific notation (for example "1.0E7"), which is not a valid xsd:decimal. Values such as 19.99 also carry binary rounding error before reaching the partner. The schema type "positiveDecimal" uses minInclusive 0.0, so a zero price is allowed despite the name. Decide the price scale, rounding, and whether zero is a legal unit price.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/OrderApproval.dtd
    description: >
      OrderStatus is free text (#PCDATA, with a "FIXME should be attribute" comment), and ChangedOrder accepts any string. The allowed status values (approved, denied, and so on) are not defined in this shard. The admin caller comments "Assumes values of OrderStatus are the same for both schemas". The status vocabulary must be taken from the order-approval / process manager components.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPAInvoice.dtd
    description: >
      TPAInvoice.dtd gives Invoice a locale attribute defaulting to en_US, but TPAInvoice.xsd has no locale attribute. Which schema is used depends on the XSD validation flag passed to TPAInvoiceXDE, so whether an invoice carries a locale depends on configuration. Decide whether invoice locale is part of the contract.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas/SupplierOrder.dtd
    description: >
      The 1.0 SupplierOrder.dtd content model requires a lowercase "lineitem+" element, but the LineItem.dtd it includes declares "LineItem" (capitalised). No document could be valid against it, which supports the view that the 1.0 DTDs are unused.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/rsrc/schemas
    description: >
      The version 1.0 DTDs (Invoice, PurchaseOrder, SupplierOrder, LineItem) and the local Mail.dtd have no Java caller in the tree. They appear only in EntityCatalog.properties files, and the catalog maps the OPC Mail public id to the mailer component's copy, not this one. XMLDocumentEditorFactory also has no caller. Treated as probably dead. Only the 1.0 PurchaseOrder shape was emitted as a record (disputed, low). Confirm with deployment descriptors or batch jobs before dropping.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/CustomEntityResolver.java
    description: >
      When a document type identifier is not in the catalog, the resolver opens the system id as a URL (resolveEntityFromURL, lines 111-157), and may fetch a schema over the network from a location named by the inbound partner document. Decide whether the rebuild restricts resolution to bundled schemas only.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/XMLDocumentUtils.java
    description: >
      getLocaleFromString (644-678) mishandles three-part values such as "en_US_WIN": the country stays null and variantIndex is never set, so construction receives a null country. A bare language code such as "ja" yields null. Decide which locale forms partner documents may carry.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/tpa/TPASupplierOrderXDE.java
    description: >
      Dates are formatted with SimpleDateFormat("yyyy-MM-dd") in the JVM default time zone, so an order placed near midnight may carry a different calendar date depending on server time zone. The intended time zone for order and shipping dates is not stated.
