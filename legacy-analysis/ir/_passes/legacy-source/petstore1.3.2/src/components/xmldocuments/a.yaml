# Spec extraction SX-0001, pass A, shard legacy-source/petstore1.3.2/src/components/xmldocuments
# No legacy-analysis/sources/**/extracted.md exists in the tree, so no document traces are cited.
# Reachability notes (checked read-only outside the shard):
#   - tpa/TPAInvoiceXDE is imported by apps/supplier (SupplierOrderMDB, OrderFulfillmentFacadeEJB).
#   - tpa/TPASupplierOrderXDE is imported by apps/opc (OrderApprovalMDB).
#   - ChangedOrder / OrderApproval are used by apps/admin (ApplRequestProcessor) and apps/opc.
#   - XMLDocumentUtils.getLocaleFromString is used by components/purchaseorder (PurchaseOrder.java).
#   - XMLDocumentEditorFactory and the "1.0" DTDs (Invoice, Purchase Order, Supplier Order, Line Item)
#     have no Java caller; they appear only in EntityCatalog.properties files.
records:
  - record_key: b2b-document-exchange-integration-0001
    kind: integration
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL send each supplier purchase order to the supplier as a document containing, in this order: an order id, an order date, a shipping address, and a list of one or more line items. The shipping address SHALL carry first name, last name, street, city, state, country, zip code, email and phone, in that order, and every one of those nine fields SHALL be present.
    confidence: medium
    confidence_basis: >
      The structure is stated in three independent places that agree: the XML Schema, the DTD, and the builder class that assembles the document in the same order. Graded medium rather than high because this is pass A only and the other pass has not been compared yet.
    risk_class: operational
    basis: >
      TPASupplierOrder.xsd declares a sequence of OrderId, OrderDate, ShippingAddress and LineItems, where LineItems holds one or more LineItem elements (minOccurs 1). The address type lists nine required string elements. TPASupplierOrder.dtd declares the same content model. TPASupplierOrderXDE appends the four children in the same order and writes all nine address fields.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/xmldocuments/src/com/sun/j2ee/blueprints/xmldocuments/rsrc/schemas/TPASupplierOrder.xsd
        line_start: 11
