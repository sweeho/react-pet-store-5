      The system SHALL NOT allow two line items with the same item id in one supplier order document or one invoice document. GIVEN a supplier order or invoice with two line items that have the same item id WHEN the document is validated against its schema THEN the document is invalid.
    confidence: low
    confidence_basis: >
      The constraint is declared in both XSDs. It may never take effect, however. The selector reads an unqualified @itemId, but the line-item builder writes itemId as a namespace-qualified attribute. Validation errors are also only logged, not raised. Nothing in the shard shows the rule being enforced, so the grade is low.
