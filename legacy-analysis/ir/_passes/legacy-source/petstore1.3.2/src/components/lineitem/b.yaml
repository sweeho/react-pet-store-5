findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
    description: >
      No validation anywhere in this module: ordered quantity may be zero or negative,
      quantity shipped may be negative or exceed the ordered quantity, and ids/line number
      may be null. Callers elsewhere compare quantity with quantityShipped for completion,
      so an over-shipment would never read as complete. A human must decide whether the
      rebuild enforces 0 <= quantityShipped <= quantity and quantity > 0.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >
      Unit price is stored and exchanged as a binary float (ejb-jar create signature
      "float", LineItem.unitPrice float), and line totals computed by callers multiply
      quantity by it. No currency, scale or rounding rule is stated. The rebuild needs a
      decision on decimal precision and rounding for unit price and line totals.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >
      Primary key class is java.lang.Object (unknown/container-generated key, lines 54 and
      ejbCreate returns null). No uniqueness of line number within an order is enforced in
      this module and no DDL is present. Whether (order, lineNumber) must be unique cannot
      be determined here; line number is also typed as text, not an integer.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >
      method-permission is <unchecked/> for all methods (lines 86-92), so any caller in
      the container may read line items and change quantity shipped. Access is limited in
      practice only by the bean being local-only. A human should decide which roles may
      update shipped quantities in the rebuild (supplier staff / order centre only?).
