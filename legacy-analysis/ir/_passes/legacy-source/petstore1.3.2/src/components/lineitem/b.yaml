  - record_key: B2B-DOCUMENT-EXCHANGE-INTEGRATION-0001
    kind: integration
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL represent a line item in exchanged XML documents as a LineItem
      element containing, in this exact order, CategoryId, ProductId, ItemId, LineNum,
      Quantity and UnitPrice, each as text content, all six mandatory.
    confidence: medium
    confidence_basis: >
      Enforced in two independent places in this module: the DTD content model and the
      order-sensitive serializer/parser. Not high because pass-agreement cannot be
      established from this pass alone.
    risk_class: operational
    basis: >
      LineItem.dtd declares the sequence (CategoryId, ProductId, ItemId, LineNum,
      Quantity, UnitPrice). toDOM writes the children in that order; fromDOM reads the
      first child then each next sibling by expected name, so order is significant on
      parse as well. Public identifier "-//Sun Microsystems, Inc. - J2EE Blueprints
      Group//DTD LineItem 1.1//EN".
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 50
        excerpt: |
          <!ELEMENT LineItem (CategoryId, ProductId, ItemId, LineNum, Quantity, UnitPrice)>

          <!ELEMENT CategoryId (#PCDATA)>

          <!ELEMENT ProductId (#PCDATA)>

          <!ELEMENT ItemId (#PCDATA)>

          <!ELEMENT LineNum (#PCDATA)>

          <!ELEMENT Quantity (#PCDATA)>

          <!ELEMENT UnitPrice (#PCDATA)>
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 137
        line_end: 146
        excerpt: |
          public Node toDOM(Document document) {
            Element root = document.createElement(XML_LINEITEM);
            XMLDocumentUtils.appendChild(document, root, XML_CATEGORYID, categoryId);
            XMLDocumentUtils.appendChild(document, root, XML_PRODUCTID, productId);
            XMLDocumentUtils.appendChild(document, root, XML_ITEMID, itemId);
            XMLDocumentUtils.appendChild(document, root, XML_LINENUM, lineNumber);
            XMLDocumentUtils.appendChild(document, root, XML_QUANTITY, quantity);
            XMLDocumentUtils.appendChild(document, root, XML_UNITPRICE, unitPrice);
            return root;
          }
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 148
        line_end: 158
        excerpt: |
          public static LineItem fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_LINEITEM)) {
              Element child;
              LineItem lineItem = new LineItem();
              lineItem.categoryId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_CATEGORYID, false), false);
              lineItem.productId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_PRODUCTID, false), false);
              lineItem.itemId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_ITEMID, false), false);
              lineItem.lineNumber = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_LINENUM, false), false);
              lineItem.quantity = XMLDocumentUtils.getContentAsInt(child = XMLDocumentUtils.getNextSibling(child, XML_QUANTITY, false), false);
              lineItem.unitPrice = XMLDocumentUtils.getContentAsFloat(child = XMLDocumentUtils.getNextSibling(child, XML_UNITPRICE, false), false);
    stack_metadata:
      framework: DOM / DTD
      dtd.public_id: "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD LineItem 1.1//EN"
      dtd.system_id: /com/sun/j2ee/blueprints/lineitem/rsrc/schemas/LineItem.dtd

  - record_key: B2B-DOCUMENT-EXCHANGE-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      GIVEN an incoming document node offered as a line item
      WHEN the node is not an element named LineItem
      THEN the system SHALL reject it with the error "LineItem element expected."
      and SHALL NOT produce a line item. Quantity SHALL be parsed as an integer and
      UnitPrice as a decimal number.
    confidence: medium
    confidence_basis: >
      Single source (fromDOM) but explicit and unambiguous. The failure behaviour for a
      missing or non-numeric child is delegated to XMLDocumentUtils (outside this module)
      and is therefore not asserted here.
    risk_class: operational
    basis: >
      fromDOM checks node type and tag name, throws XMLDocumentException with the literal
      message otherwise; uses getContentAsInt for Quantity and getContentAsFloat for
      UnitPrice.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 148
        line_end: 162
        excerpt: |
          public static LineItem fromDOM(Node node) throws XMLDocumentException {
            Element element;
            if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_LINEITEM)) {
          ...
              lineItem.quantity = XMLDocumentUtils.getContentAsInt(child = XMLDocumentUtils.getNextSibling(child, XML_QUANTITY, false), false);
              lineItem.unitPrice = XMLDocumentUtils.getContentAsFloat(child = XMLDocumentUtils.getNextSibling(child, XML_UNITPRICE, false), false);
              return lineItem;
            }
            throw new XMLDocumentException(XML_LINEITEM + " element expected.");
          }
    stack_metadata:
      framework: DOM

  - record_key: B2B-DOCUMENT-EXCHANGE-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >
      The system SHALL NOT include the quantity already shipped when a stored line item is
      exported as a line description (and therefore in exchanged XML); only category,
      product, item, line number, ordered quantity and unit price SHALL be carried.
    confidence: medium
    confidence_basis: >
      Omission is consistent across three places (getData, the value class fields, and the
      DTD). Graded medium because an omission could be accidental rather than intended;
      intent is not documented.
    risk_class: operational
    basis: >
      getData copies six attributes and not quantityShipped; the LineItem value class has
      no shipped field; the DTD has no shipped element.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 171
        line_end: 180
        excerpt: |
          public LineItem getData() {
            LineItem lineItem = new LineItem();
            lineItem.setCategoryId(getCategoryId());
            lineItem.setProductId(getProductId());
            lineItem.setItemId(getItemId());
            lineItem.setLineNumber(getLineNumber());
            lineItem.setQuantity(getQuantity());
            lineItem.setUnitPrice(getUnitPrice());
            return lineItem;
          }
