records:
  - record_key: ORDER-FULFILLMENT-ENTITY-0001
    kind: entity
    capability_key: order-fulfillment
    requirement: >
      The system SHALL persist each order line as a line item carrying a category
      identifier, a product identifier, an item identifier, a line number, an ordered
      quantity (whole number), a unit price, and a quantity already shipped (whole number).
    confidence: medium
    confidence_basis: >
      The attribute set is declared twice in this module (persisted-field list in the
      deployment descriptor and the abstract accessors on the bean class) and they agree.
      Not graded high because pass A's reading is not visible to this pass, and because
      no DDL for the backing table is present in this module, so column types, nullability
      and lengths cannot be confirmed.
    risk_class: financial
    basis: >
      ejb-jar.xml declares seven container-managed fields; LineItemEJB declares matching
      abstract getters/setters with types String (ids, line number), int (quantity,
      quantityShipped) and float (unitPrice).
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 58
        line_end: 78
        excerpt: |
          <cmp-field>
            <field-name>categoryId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>productId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>itemId</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>lineNumber</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantity</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>unitPrice</field-name>
          </cmp-field>
          <cmp-field>
            <field-name>quantityShipped</field-name>
          </cmp-field>
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 106
        line_end: 136
        excerpt: |
          public abstract int getQuantity();
          ...
          public abstract float getUnitPrice();
          ...
          public abstract int getQuantityShipped();
    stack_metadata:
      framework: EJB 2.0 CMP
      ejb.bean: LineItemEJB
      ejb.transaction: Required
      db.object: LineItem (abstract-schema-name)

  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      After a line item is created, the system SHALL allow only its quantity-shipped value
      to be changed; category, product, item, line number, ordered quantity and unit price
      SHALL be read-only for the life of the line item.
    confidence: medium
    confidence_basis: >
      The only mutator exposed to callers is setQuantityShipped, and the deployment
      descriptor assigns a transaction only to that setter. Single-module evidence; the
      bean class itself still has other setters (used only inside creation), so
      immutability is by interface restriction rather than an explicit check.
    risk_class: financial
    basis: >
      LineItemLocal exposes getters for every attribute and exactly one setter,
      setQuantityShipped(int). Callers outside this module (purchase-order and supplier
      order-fulfillment code) use it to accumulate or complete shipped quantities.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemLocal.java
        line_start: 48
        line_end: 58
        excerpt: |
          public interface LineItemLocal extends EJBLocalObject{

            public String getCategoryId();
            public String getProductId();
            public String getItemId();
            public String getLineNumber();
            public int getQuantity();
            public float getUnitPrice();
            public int getQuantityShipped();
            public void setQuantityShipped(int qty);
            public LineItem getData();
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
        line_start: 156
        line_end: 166
        excerpt: |
          <container-transaction>
           <method>
             <ejb-name>LineItemEJB</ejb-name>
             <method-intf>Local</method-intf>
             <method-name>setQuantityShipped</method-name>
             <method-params>
               <method-param>int</method-param>
             </method-params>
           </method>
           <trans-attribute>Required</trans-attribute>
          </container-transaction>
    stack_metadata:
      ejb.bean: LineItemEJB
      ejb.transaction: Required

  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL require the initial quantity-shipped value to be supplied when a
      line item is created, either alongside all other attributes or together with an
      existing line description whose category, product, item, line number, quantity and
      unit price are copied unchanged.
    confidence: medium
    confidence_basis: >
      Both creation paths are visible in the local home and the bean and agree. Graded
      medium, not high, because the module does not show which caller uses which path or
      what initial shipped value callers pass (typically expected to be 0, but not
      enforced here).
    risk_class: operational
    basis: >
      Two create signatures: one with seven explicit values including qtyShipped, and one
      taking a LineItem value object plus a separate shipped quantity; the second copies
      every field from the value object and sets quantityShipped from the argument.
    traces:
      - path: legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
        line_start: 141
        line_end: 167
