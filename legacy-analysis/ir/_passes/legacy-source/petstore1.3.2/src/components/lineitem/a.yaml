    kind: entity
    capability_key: order-fulfillment
    requirement: >-
      The system SHALL persist each order line item with a category id, a product id, an item id, a
      line number, an ordered quantity (integer), a unit price, and a quantity shipped (integer).
    confidence: medium
    confidence_basis: >-
      The field set is declared in the deployment descriptor and matched one-for-one by the bean
      accessors and the create method, but both are in this one component and there is no DDL in the
      shard, so column types, lengths and nullability cannot be seen. The other pass has not been
      compared.
    risk_class: operational
    basis: >-
      Seven container-managed persistent fields are declared; the bean declares matching abstract
      accessors and the full create method sets all seven. Line number is typed as a String, not an
      integer. The entity is used by both the customer purchase order and the supplier order
      components (outside this shard).
