  - record_key: order-fulfillment-business-rule-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >-
      GIVEN an existing line item WHEN a new line item is created from it with a stated shipped
      quantity THEN the system SHALL copy the category, product, item, line number, ordered quantity
      and unit price unchanged and SHALL set the quantity shipped to the stated value rather than
      the source's.
    confidence: medium
    confidence_basis: >-
      Directly visible in one create method; the business purpose (supplier order lines are created
      from purchase-order lines with shipped = 0) is inferred from a caller outside this shard, not
      verified end to end.
    risk_class: operational
    basis: >-
      The second create method copies six fields from the supplied LineItem value and sets
      quantityShipped from the separate qty argument. The LineItem value object has no
      quantityShipped field, so the shipped count can never be carried over from the source.
