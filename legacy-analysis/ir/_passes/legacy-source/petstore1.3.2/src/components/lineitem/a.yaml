  - record_key: b2b-document-exchange-integration-0001
    kind: integration
    capability_key: b2b-document-exchange
    requirement: >-
      The system SHALL represent a line item in exchanged order documents as a LineItem element
      containing, in this order and each exactly once, CategoryId, ProductId, ItemId, LineNum,
      Quantity and UnitPrice, each as text content.
    confidence: high
    confidence_basis: >-
      Stated in two independent places that agree: the DTD content model and the serializer/parser
      that emit and read the elements in the same order with none optional. Pass B not yet compared,
      so this is provisional.
    risk_class: operational
    basis: >-
      The DTD declares a strict sequence of six mandatory PCDATA children. toDOM appends them in
      that order; fromDOM reads them as first-child then next-sibling in the same order with
      optional=false. The document is identified by a public id at version 1.1.
    traces:
      - path: >-
          legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/rsrc/schemas/LineItem.dtd
        line_start: 38
        line_end: 50
        excerpt: |
          <!ELEMENT LineItem (CategoryId, ProductId, ItemId, LineNum, Quantity, UnitPrice)>

          <!ELEMENT CategoryId (#PCDATA)>

          <!ELEMENT ProductId (#PCDATA)>

          <!ELEMENT ItemId (#PCDATA)>

          <!ELEMENT LineNum (#PCDATA)>

          <!ELEMENT Quantity (#PCDATA)>

          <!ELEMENT UnitPrice (#PCDATA)>
      - path: >-
          legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 54
        line_end: 62
        excerpt: |2
            public static final String DTD_PUBLIC_ID = "-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD LineItem 1.1//EN";
            public static final String DTD_SYSTEM_ID = "/com/sun/j2ee/blueprints/lineitem/rsrc/schemas/LineItem.dtd";
            public static final String XML_LINEITEM = "LineItem";
            public static final String XML_CATEGORYID = "CategoryId";
            public static final String XML_PRODUCTID = "ProductId";
            public static final String XML_ITEMID = "ItemId";
            public static final String XML_LINENUM = "LineNum";
            public static final String XML_QUANTITY = "Quantity";
            public static final String XML_UNITPRICE = "UnitPrice";
      - path: >-
          legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 137
        line_end: 146
        excerpt: |2
            public Node toDOM(Document document) {
              Element root = document.createElement(XML_LINEITEM);
              XMLDocumentUtils.appendChild(document, root, XML_CATEGORYID, categoryId);
              XMLDocumentUtils.appendChild(document, root, XML_PRODUCTID, productId);
              XMLDocumentUtils.appendChild(document, root, XML_ITEMID, itemId);
              XMLDocumentUtils.appendChild(document, root, XML_LINENUM, lineNumber);
              XMLDocumentUtils.appendChild(document, root, XML_QUANTITY, quantity);
              XMLDocumentUtils.appendChild(document, root, XML_UNITPRICE, unitPrice);
              return root;
            }
    stack_metadata:
      framework: J2EE XML documents
      dtd.public_id: '-//Sun Microsystems, Inc. - J2EE Blueprints Group//DTD LineItem 1.1//EN'
  - record_key: b2b-document-exchange-business-rule-0001
    kind: business-rule
    capability_key: b2b-document-exchange
    requirement: >-
      GIVEN an incoming line item document fragment WHEN the element is not named LineItem, or any
      of its six child elements is missing or out of order, or Quantity is not an integer, or
      UnitPrice is not a decimal number THEN the system SHALL reject the fragment with a document
      error.
    confidence: medium
    confidence_basis: >-
      The element-name check and the required-child parsing are visible in this shard; the
      integer/float format errors come from the shared XML utility in another component, which was
      read but not traced in this shard.
    risk_class: operational
    basis: >-
      fromDOM throws 'LineItem element expected.' when the node is not a LineItem element; every
      child read is non-optional, Quantity is parsed with getContentAsInt and UnitPrice with
      getContentAsFloat, which throw a content-format error on unparseable text.
    traces:
      - path: >-
          legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
        line_start: 148
        line_end: 163
        excerpt: |2
            public static LineItem fromDOM(Node node) throws XMLDocumentException {
              Element element;
              if (node.getNodeType() == Node.ELEMENT_NODE && (element = ((Element) node)).getTagName().equals(XML_LINEITEM)) {
                Element child;
                LineItem lineItem = new LineItem();
                lineItem.categoryId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getFirstChild(element, XML_CATEGORYID, false), false);
                lineItem.productId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_PRODUCTID, false), false);
                lineItem.itemId = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_ITEMID, false), false);
                lineItem.lineNumber = XMLDocumentUtils.getContentAsString(child = XMLDocumentUtils.getNextSibling(child, XML_LINENUM, false), false);
                lineItem.quantity = XMLDocumentUtils.getContentAsInt(child = XMLDocumentUtils.getNextSibling(child, XML_QUANTITY, false), false);
                lineItem.unitPrice = XMLDocumentUtils.getContentAsFloat(child = XMLDocumentUtils.getNextSibling(child, XML_UNITPRICE, false), false);
                return lineItem;
              }
              throw new XMLDocumentException(XML_LINEITEM + " element expected.");
            }
          }
    stack_metadata:
      framework: J2EE XML documents
