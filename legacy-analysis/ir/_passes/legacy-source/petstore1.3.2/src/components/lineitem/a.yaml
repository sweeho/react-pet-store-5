findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >-
      The line item entity declares java.lang.Object as its primary-key class with no primkey-field,
      so identity is container-generated. Nothing enforces that a line number is unique within an
      order, or that the (order, line number) pair is unique. A human must decide whether the
      rebuild SHALL enforce unique line numbers per order.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
    description: >-
      No validation exists on quantity, unit price or quantity shipped: create accepts zero or
      negative quantities and prices, and setQuantityShipped accepts any integer, including a value
      greater than the ordered quantity (callers outside this shard add shipped amounts without a
      cap). Decide whether the rebuild SHALL require quantity > 0, price >= 0 and 0 <=
      quantityShipped <= quantity.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItem.java
    description: >-
      Unit price is held as a single-precision float in the entity, value object and XML parser.
      This loses cents precision for larger amounts. The rebuild needs an explicit decision on the
      money representation (integer minor units or fixed decimal) and rounding rule; the legacy
      behaviour gives none.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/components/lineitem/src/ejb-jar.xml
    description: >-
      Method permission for all line item methods is <unchecked/> with caller identity propagated,
      so the entity itself enforces no role. Access control depends entirely on the calling
      components; confirm in the purchaseorder/supplierpo/app shards that no unauthenticated path
      reaches line item updates.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/components/lineitem/src/com/sun/j2ee/blueprints/lineitem/ejb/LineItemEJB.java
    description: >-
      Line number is stored and exchanged as a free-text String, not an integer; ordering of line
      items within an order therefore cannot rely on numeric sort. Decide whether the rebuild treats
      line number as an integer sequence.
