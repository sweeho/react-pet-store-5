findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
    description: Every order is created with a hard-coded credit card (1234-2334 / Duke Express / 10/2001) under a 'XXXX this needs to be part of the form' comment (lines 79-82). The customer's card on file is never used and the checkout form has no card fields. A human must decide where the order's payment card comes from (card on file, entered at checkout, or both).
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/OrderHTMLAction.java
    description: Required billing/shipping fields are collected into a MissingFormDataException stored under request attribute 'missing_form_data_exception', and extractContactInfo returns null (lines 150-153), but nothing in this module reads that attribute and the event is still sent; OrderEJBAction then dereferences billTo.getEmail() (OrderEJBAction.java 117). CustomerHTMLAction has the same pattern (lines 245-248; CustomerEJBAction 116). The intended user-facing validation error behaviour must be specified.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
    description: Credit card validation re-tests creditCardNumber for the type, expiry month and expiry year checks (lines 151-174, and the year check reports 'Credit Card Expiry Month'); the missing-field lists built in extractCreditCard and extractProfileInfo are discarded. Decide which card and profile fields are really required.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CreateUserHTMLAction.java
    description: The sign-up form collects a repeated password (j_password_2, signon.jsp 167-171) and the action reads it (line 78, redacted in this copy), but only userName and password are checked for null (line 84) and no comparison is visible. Confirm whether password confirmation must match; also no password strength or user-name format rules exist anywhere in this module.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/create_customer.jsp
    description: "Card type and expiry lists disagree: create form offers value 'Meow Club' (line 146, label 'Meow Card'), edit form offers 'Meow Card' (edit_customer.jsp 232), seed data uses 'Meow Card' and 'VISA' (Populate-UTF8.xml 105, 163). Expiry years are 2001-2004 on create (169-172) vs 2002-2005 on edit (edit_customer.jsp 260-263). Seed expiry is '04/04' (MM/YY) while the form action composes MM/YYYY. Authoritative card types and expiry format need an owner decision."
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/enter_order_information.jsp
    description: "Country values disagree: account forms and seed data store 'USA' (create_customer.jsp 105, edit_customer.jsp 163) while the order form offers 'United States' (lines 152, 294), so pre-selection of a US customer's country cannot match. The English and Japanese shipping country lists omit China (en 294-296, ja 306-308) although billing includes it; the Chinese form includes it in both. Decide whether shipping to China is allowed."
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/product.jsp
    description: The product screen shows the list price (listCost, line 107) next to Add to Cart, while search results and the cart show and charge the unit cost (search.jsp 116, cart.jsp 85; OrderEJBAction 137). A shopper can see one price on the product page and be charged another. Decide which price is displayed where.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
    description: Order total is accumulated as a Java float (lines 123, 137-138) from decimal(10,2) prices with no rounding rule, tax or shipping. Specify currency precision/rounding and whether tax and shipping apply.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
    description: Failure to look up/create the unique id generator is only printed (lines 105-109) and then dereferenced at line 110; failure to send the order XML (lines 155-164) is only printed, after which the cart is emptied and a confirmation with an order id is shown (166-168). An order can be confirmed to the shopper yet never reach order processing. Required failure behaviour needs a decision.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
    description: Only enter_order_information.screen is protected for checkout; order.do (the submission endpoint) and cart.do are not in the protected list (lines 49-79). A direct POST to order.do without sign-on would create an order with a null user id (OrderEJBAction 114-116). Confirm order submission must require sign-on.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/tools/populate/PopulateServlet.java
    description: /Populate (web.xml 155-158) has no security constraint and forcefully=true drops and recreates the catalog tables (lines 158-160). populating.jsp (line 47) also writes the raw 'forcefully' request parameter into a META refresh tag. Decide whether data seeding exists in the rebuild and who may trigger it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/general_error.jsp
    description: The general error page prints the exception message and full stack trace to the shopper (lines 59-73). Decide what error detail may be shown to end users.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/customer.jsp
    description: The account screen displays the full credit card number (line 133) and the edit form pre-fills it; the card is stored as plain VARCHAR (sun-j2ee-ri.xml 112). A regulated-data decision (masking, storage) is required before rebuilding ACCT-SCR-0001.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
    description: "Unreachable or broken declarations: SignOffEvent -> SignOffEJBAction (lines 53-56) name classes that do not exist in this module (sign-off is handled entirely by SignOffHTMLAction); screen 'signon_create' points to create_user.jsp which does not exist in any language (screendefinitions_*.xml 182); the GeneralFailureException mapping (line 112) targets 'error.screen' although the defined screen is 'general_error', and names a petstore.controller.exceptions.GeneralFailureException class not present in this module. No requirements were emitted from these; confirm they are dead."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/category.jsp
    description: The English category page is cached application-wide under the fixed name 'page' for 5 minutes (line 47), while the Japanese and Chinese category pages are not cached at all. If the WAF cache is keyed only by name, every category would show the first cached category's products. Cache keying lives in the WAF shard; confirm the intended behaviour.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/Populate-UTF8.xml
    description: Seed item EST-15 (line 882) has English and Chinese details but no Japanese details, so under CAT-BR-0001 it is invisible in the Japanese store. Confirm whether this is intended.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/signon.jsp
    description: When no remembered user name exists, the sign-in form is pre-filled with demo user name 'j2ee' and a demo password (lines 91-109). Treated as demo scaffolding and not emitted as a requirement; confirm.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/flow/handlers/CreateUserFlowHandler.java
    description: After account creation the handler reads the session's original URL and calls equals() on it (lines 67-69) with no null check; a shopper who signs up without first being redirected from a protected page has no original URL. The intended post-sign-up landing page in that case is unspecified.
