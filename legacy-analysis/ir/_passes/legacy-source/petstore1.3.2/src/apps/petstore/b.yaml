  - record_key: CAT-REQ-0001
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL seed the catalog, customer accounts and sign-on users from a bundled data set the first time the store is entered, when they are not already present. WHEN a forced repopulation is requested THEN the system SHALL drop and recreate the catalog tables and reload the seed data, and SHALL end the requester's session.
    confidence: medium
    confidence_basis: Control flow is explicit in the servlet and the entry page; filed under catalog-browsing because no listed capability covers data seeding. Whether a rebuild needs this at all is a product decision.
    risk_class: operational
