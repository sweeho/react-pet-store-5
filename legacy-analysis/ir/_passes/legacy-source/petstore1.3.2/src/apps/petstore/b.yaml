records:
  - record_key: CAT-ENT-0001
    kind: entity
    capability_key: catalog-browsing
    requirement: The system SHALL hold catalog categories identified by a category id of up to 10 characters, each with per-locale details (name of up to 80 characters, required; optional image reference and description of up to 255 characters), with at most one details row per category and locale.
    confidence: medium
    confidence_basis: Stated in DDL (primary key, NOT NULL, foreign key), the strongest evidence available; only one source in this module, and the populate DDL is a seeding script rather than the production schema, so it cannot be graded high.
    risk_class: operational
    basis: The populate DDL creates category(catid char(10) PK) and category_details keyed by (catid, locale) with name NOT NULL and a foreign key back to category.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 51
        line_end: 52
        excerpt: |2
                  create table category (catid char(10) not null,
                    constraint pk_category primary key (catid))
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 66
        line_end: 71
        excerpt: |2
                  create table category_details (catid char(10) not null,
                    name varchar(80) not null, image varchar(255) null,
                    descn varchar(255) null, locale char(10) not null,
                    constraint pk_category_details primary key (catid, locale),
                      constraint fk_category_details_1 foreign key (catid)
                      references category (catid))
    stack_metadata:
      db.object: category, category_details
      database: cloudscape (oracle variant also declared)
  - record_key: CAT-ENT-0002
    kind: entity
    capability_key: catalog-browsing
    requirement: The system SHALL hold products identified by a product id of up to 10 characters, each belonging to exactly one category, with per-locale details (name required, up to 80 characters; optional image and description), at most one details row per product and locale.
    confidence: medium
    confidence_basis: DDL constraints are explicit; single source (seeding DDL) in this shard.
    risk_class: operational
    basis: product has productid PK and NOT NULL catid with FK to category; product_details keyed by (productid, locale) with name NOT NULL.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 85
        line_end: 90
        excerpt: |2
                  create table product (
                    productid char(10) not null,
                    catid char(10) not null,
                    constraint pk_product primary key (productid),
                      constraint fk_product_1 foreign key (catid)
                      references category (catid))
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 104
        line_end: 112
        excerpt: |2
                  create table product_details (
                    productid char(10) not null,
                    locale char(10) not null,
                    name varchar(80) not null,
                    image varchar(255) null,
                    descn varchar(255) null,
                    constraint pk_product_details primary key (productid, locale),
                      constraint fk_product_details_1 foreign key (productid)
                      references product (productid))
    stack_metadata:
      db.object: product, product_details
  - record_key: CAT-ENT-0003
    kind: entity
    capability_key: catalog-browsing
    requirement: The system SHALL hold sellable items identified by an item id of up to 10 characters, each belonging to exactly one product, with per-locale details carrying a list price and a unit cost (both required, 2 decimal places, up to 10 digits), a required image and description, and up to five optional descriptive attributes of up to 80 characters each.
    confidence: medium
    confidence_basis: Explicit DDL; single source. Prices being per locale is structural (locale is part of the key) rather than stated anywhere as a rule.
    risk_class: financial
    basis: item_details has listprice/unitcost decimal(10,2) NOT NULL, image and descn NOT NULL, attr1..attr5 nullable, keyed by (itemid, locale) with FK to item.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 126
        line_end: 132
        excerpt: |2
                  create table item (
                    itemid char(10) not null,
                    productid char(10) not null,
                    constraint pk_item primary key (itemid),
                      constraint fk_item_1 foreign key (productid)
                      references product (productid)
                  )
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/populate/PopulateSQL.xml
        line_start: 146
        line_end: 161
        excerpt: |2
                  create table item_details (
                    itemid char(10) not null,
                    listprice decimal(10,2) not null,
                    unitcost decimal(10,2) not null,
                    locale char(10) not null,
                    image char(255) not null,
                    descn varchar(255) not null,
                    attr1 varchar(80) null,
                    attr2 varchar(80) null,
                    attr3 varchar(80) null,
                    attr4 varchar(80) null,
                    attr5 varchar(80) null,
                    constraint pk_item_details primary key (itemid, locale),
                        constraint fk_item_details_1 foreign key (itemid)
                        references item (itemid)
                  )
    stack_metadata:
      db.object: item, item_details
  - record_key: CAT-BR-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL show a catalog category, product or item in a locale only when localized details exist for that locale. GIVEN an item has no details row for the shopper's current locale WHEN the shopper browses or searches in that locale THEN the item SHALL NOT be listed.
    confidence: medium
    confidence_basis: Follows directly from the inner joins filtered on locale in every catalog query; the behaviour is structural and not stated as an intended rule anywhere, hence not high.
    risk_class: presentational
    basis: Every catalog query joins the details tables and filters on locale = ?; item queries additionally require item and product details to share the locale.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 92
        line_end: 101
        excerpt: |2
                  <SQLStatement method="GET_ITEM">
                      <SQLFragment parameterNb="2">
                          select catid, a.productid, name, b.image, b.descn, attr1, attr2, attr3,
                                  attr4, attr5, listprice, unitcost
                              from (((item a join item_details b on a.itemid=b.itemid)
                                  join product_details c on a.productid=c.productid)
                                  join product d on d.productid=c.productid and b.locale = c.locale)
                              where b.locale = ? and a.itemid = ?
                      </SQLFragment>
                  </SQLStatement>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 77
        excerpt: |2
                  <SQLStatement method="GET_CATEGORIES">
                      <SQLFragment parameterNb="1">
                          select a.catid, name, descn
                              from (category a join category_details b on a.catid=b.catid) 
                              where locale = ?  order by name
                      </SQLFragment>
                  </SQLStatement>
    stack_metadata:
      db.object: CatalogDAOSQL GET_ITEM / GET_CATEGORIES
      framework: Fast Lane Reader DAO
  - record_key: CAT-BR-0002
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL list categories, and the products within a category, ordered by their localized name.
    confidence: medium
    confidence_basis: Explicit ORDER BY clauses in both database variants; single layer.
    risk_class: presentational
    basis: GET_CATEGORIES and GET_PRODUCTS both end in 'order by name'. Items within a product (GET_ITEMS) carry no ORDER BY, so their order is unspecified.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 71
        line_end: 91
        excerpt: |2
                  <SQLStatement method="GET_CATEGORIES">
                      <SQLFragment parameterNb="1">
                          select a.catid, name, descn
                              from (category a join category_details b on a.catid=b.catid) 
                              where locale = ?  order by name
                      </SQLFragment>
                  </SQLStatement>
                  <SQLStatement method="GET_PRODUCT">
                      <SQLFragment parameterNb="2">
                          select name, descn
                              from (product a join product_details b on a.productid=b.productid)
                              where locale = ? and a.productid = ? 
                      </SQLFragment>
                  </SQLStatement>
                  <SQLStatement method="GET_PRODUCTS">
                      <SQLFragment parameterNb="2">
                          select a.productid, name, descn
                              from (product a join product_details b on a.productid=b.productid)
                              where locale = ? and a.catid = ? order by name
                      </SQLFragment>
                  </SQLStatement>
    stack_metadata:
      db.object: CatalogDAOSQL GET_CATEGORIES / GET_PRODUCTS
  - record_key: CAT-BR-0003
    kind: business-rule
    capability_key: catalog-browsing
    requirement: The system SHALL let a shopper search items by keywords, matching case-insensitively against the product name, the category id or the item description, and returning items that match ANY of the keywords in the shopper's current locale. GIVEN the keyword field is empty or nothing matches THEN the system SHALL show a 'no results' message.
    confidence: medium
    confidence_basis: The OR-of-keywords semantics is visible in the SQL fragments and restated on the results page; how keywords are split and wrapped in wildcards happens in the catalog component outside this shard, so substring vs whole-word matching is not confirmed here.
    risk_class: presentational
    basis: SEARCH_ITEMS applies lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?, with a VARIABLE fragment OR-ing one more group per keyword; search.jsp shows 'No results' for empty keywords or size 0 and 'Items matching any of'.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 127
        excerpt: |2
                  <SQLStatement method="SEARCH_ITEMS">
                      <SQLFragment parameterNb="4">
                          select catid, a.productid, name, a.itemid, b.image, b.descn, attr1, 
                                  attr2, attr3, attr4, attr5, listprice, unitcost 
                              from (((item a join item_details b on a.itemid=b.itemid)
                                  join product_details c on a.productid=c.productid)
                                  join product d on d.productid=c.productid and b.locale = c.locale)
                              where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
                      </SQLFragment>
                      <SQLFragment parameterNb="3" occurrence="VARIABLE">
                          or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)  
                      </SQLFragment>
                      <SQLFragment parameterNb="0">
                          )
                      </SQLFragment>
                  </SQLStatement>
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/search.jsp
        line_start: 78
        line_end: 89
        excerpt: |
          <c:choose>
           <c:when test="${param.keywords == '' || pageResults.size == 0}">
            <p class="petstore_title">
              No results were found for your search.
            </p>
           </c:when>
           <c:otherwise>
            <p class="petstore_title">
             Search Results:
            </p>
            <p class="petstore">
             Items matching any of: <b><c:out value="${param.keywords}" /></b>
    stack_metadata:
      jsp.page: search.jsp
      db.object: CatalogDAOSQL SEARCH_ITEMS
