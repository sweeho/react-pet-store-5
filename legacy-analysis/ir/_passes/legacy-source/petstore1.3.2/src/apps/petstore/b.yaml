  - record_key: CHK-BR-0002
    kind: business-rule
    capability_key: checkout
    requirement: The system SHALL compute the order total as the sum over cart lines of unit cost multiplied by quantity, with no tax, shipping charge or discount applied.
    confidence: low
    confidence_basis: The sum is explicit, but it is accumulated in single-precision floating point with no rounding step, and nothing states whether tax or shipping were intentionally omitted.
    risk_class: financial
    basis: OrderEJBAction iterates cart items, totalCost += cost * quantity (float), and sets it as the purchase order total price.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 122
        line_end: 146
        excerpt: |2
              int lineItemCount = 0;
              float totalCost = 0;
              // Add the items from the shopping cart
              ShoppingCartLocal cart = scf.getShoppingCart();
              Locale locale = (Locale)machine.getAttribute(PetstoreKeys.LOCALE);
              purchaseOrder.setLocale(locale);
              Collection items = cart.getItems();
              // if the cart is empty throw an exception saying so
              if (items.size() == 0) {
                throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
              }
              Iterator it = items.iterator();
              while (it.hasNext()) {
                CartItem item = (CartItem)it.next();

                float cost = new Float(item.getUnitCost()).floatValue();
                totalCost += (cost*item.getQuantity());
                purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                       item.getProductId(),
                                                       item.getItemId(),
                                                       (lineItemCount++) + "",
                                                       item.getQuantity(),
                                                       cost));
              }
              purchaseOrder.setTotalPrice(totalCost);
    stack_metadata:
      ejb.bean: ShoppingControllerEJB / OrderEJBAction
      ejb.transaction: Required
