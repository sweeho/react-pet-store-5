    requirement: WHEN a shopper signs out THEN the system SHALL end their session (discarding cart and sign-on state), keep their current display language, and show a signed-out confirmation with a link to sign in again.
    confidence: medium
    confidence_basis: Explicit in the sign-off action and its mapped screen; single implementation.
    risk_class: regulated
    basis: SignOffHTMLAction saves the locale, invalidates the session, creates a new session, restores the locale and re-initialises components; signoff.do maps to signoff.screen with 'You are signed out'.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/SignOffHTMLAction.java
        line_start: 69
        line_end: 82
        excerpt: |2
              public Event perform(HttpServletRequest request)
                  throws HTMLActionException {
                  // kill the session thus prompting a signoff
                  HttpSession session = request.getSession();
                  Locale locale = (Locale)session.getAttribute(WebKeys.LOCALE);
                  session.invalidate();
                  session = null;
                  session = request.getSession(true);
                  session.setAttribute(WebKeys.LOCALE, locale);
                  // create a new Component Manager
                  PetstoreComponentManager pcm = new PetstoreComponentManager();
                  pcm.init(session);
                  return new ChangeLocaleEvent(locale);
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 82
        line_end: 84
        excerpt: |2
