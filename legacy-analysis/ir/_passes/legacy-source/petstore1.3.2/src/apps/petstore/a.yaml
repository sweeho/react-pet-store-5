    kind: business-rule
    capability_key: customer-account
    requirement: The system SHALL require, for account contact information, a non-blank last name, first
      name, street address, city, state/province, postal code and telephone number; street address
      line 2 and e-mail SHALL be optional, and a blank line 2 SHALL be stored as absent.
    confidence: medium
    confidence_basis: The required list is explicit in code, but the consequence of a missing field is
      broken (the error is stored and processing continues with no contact info; see findings), so
      what the user actually experiences is not established.
    risk_class: operational
    basis: extractContactInfo adds each blank required field to missingFields and returns null with a
      MissingFormDataException request attribute.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 182
