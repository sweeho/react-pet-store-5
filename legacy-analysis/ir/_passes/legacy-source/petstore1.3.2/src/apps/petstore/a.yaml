records:
  - record_key: sign-on-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: The system SHALL require a signed-on user before showing the account details screen,
      before processing an account (customer profile) change, before showing the order-information
      (checkout) entry screen, and before showing the sign-on welcome screen; an anonymous visitor
      requesting any of these SHALL be sent to the sign-on form first. All other pages (catalog,
      search, cart) SHALL be available without signing on.
    confidence: medium
    confidence_basis: "Single declarative source (the sign-on configuration). The filter that enforces
      it lives in the signon component, outside this shard, so I could see the protected list but
      not the enforcement code or its matching semantics (exact match vs. suffix match). Not high:
      one layer only."
    risk_class: operational
    basis: The sign-on configuration lists exactly four protected resources; the sign-on filter is
      mapped to every URL in web.xml. The banner's 'Account' link and the cart's 'Check Out' link
      point at protected resources.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/signon-config.xml
        line_start: 49
        line_end: 79
        excerpt: |2
