  - record_key: sign-on-REQ-0004
    kind: requirement
    capability_key: sign-on
    requirement: WHEN a user signs out THEN the system SHALL discard the user's session state (including
      the shopping cart), keep the user's currently selected language, start a fresh empty cart, and
      show a 'You are signed out' screen with a link to sign in again.
    confidence: medium
    confidence_basis: Single code path plus its declared target screen; behaviour is clear from the
      action. The separately mapped sign-off EJB event is dead (see findings), so this web-tier path
      is the only effective one.
    risk_class: operational
    basis: SignOffHTMLAction invalidates the session, re-creates it with the saved locale and
      re-initialises the component manager (new cart); mappings route signoff.do to signoff.screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/SignOffHTMLAction.java
        line_start: 69
        line_end: 82
        excerpt: |2
              public Event perform(HttpServletRequest request)
                  throws HTMLActionException {
                  // kill the session thus prompting a signoff
                  HttpSession session = request.getSession();
                  Locale locale = (Locale)session.getAttribute(WebKeys.LOCALE);
                  session.invalidate();
                  session = null;
                  session = request.getSession(true);
                  session.setAttribute(WebKeys.LOCALE, locale);
                  // create a new Component Manager
                  PetstoreComponentManager pcm = new PetstoreComponentManager();
                  pcm.init(session);
                  return new ChangeLocaleEvent(locale);
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
