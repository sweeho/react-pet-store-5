        line_start: 64
        line_end: 73
        excerpt: |2
              public String processFlow(HttpServletRequest request)
                  throws FlowHandlerException {

                  String forwardScreen = (String)request.getSession().getAttribute(SignOnFilter.ORIGINAL_URL);

                  if (forwardScreen.equals("customer.do")) {
                      return "MAIN_SCREEN";
                  }
                  return forwardScreen;
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/web/actions/CustomerHTMLAction.java
        line_start: 256
        line_end: 266
        excerpt: |2
              public void doEnd(HttpServletRequest request, EventResponse eventResponse) {
                  // put the signed on ok in the sesion if creating a customer
                  if (eventType == CustomerEvent.CREATE) {
                      // remove the SIGNED_ON_USER_SESSION_KEY
                      if (request.getSession().getAttribute(SignOnFilter.SIGNED_ON_USER) != null) {
                          request.getSession().removeAttribute(SignOnFilter.SIGNED_ON_USER);
                      }
                      request.getSession().setAttribute(SignOnFilter.SIGNED_ON_USER, new Boolean(true));
                  }
                  eventType = -1;
              }
