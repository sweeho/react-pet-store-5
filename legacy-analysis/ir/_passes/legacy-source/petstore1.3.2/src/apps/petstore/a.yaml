  - record_key: catalog-browsing-REQ-0004
    kind: requirement
    capability_key: catalog-browsing
    requirement: The system SHALL search items in the current language by keywords, returning an item
      when any keyword matches, case-insensitively, the product name, the category id or the item
      description. Results SHALL show attribute and product name (linked to the item), description,
      unit price and 'Add to Cart', paged with Previous/Next. GIVEN the keyword field is empty OR
      nothing matches THEN the system SHALL show 'No results were found for your search.'
    confidence: medium
    confidence_basis: SQL and page agree. Keyword splitting and wildcard wrapping of the LIKE parameters
      are done in the catalog component outside this shard, so 'contains' vs 'equals' matching is
      inferred, not seen.
    risk_class: operational
    basis: SEARCH_ITEMS ORs lower(name)/lower(catid)/lower(descn) LIKE ? per keyword; search.jsp handles
      the empty/no-result case.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/CatalogDAOSQL.xml
        line_start: 112
        line_end: 127
        excerpt: |2
                  <SQLStatement method="SEARCH_ITEMS">
                      <SQLFragment parameterNb="4">
                          select catid, a.productid, name, a.itemid, b.image, b.descn, attr1, 
                                  attr2, attr3, attr4, attr5, listprice, unitcost 
                              from (((item a join item_details b on a.itemid=b.itemid)
                                  join product_details c on a.productid=c.productid)
                                  join product d on d.productid=c.productid and b.locale = c.locale)
                              where b.locale = ? and ((lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)
                      </SQLFragment>
                      <SQLFragment parameterNb="3" occurrence="VARIABLE">
                          or (lower(name) like ? or lower(catid) like ? or lower(b.descn) like ?)  
                      </SQLFragment>
                      <SQLFragment parameterNb="0">
                          )
                      </SQLFragment>
                  </SQLStatement>
