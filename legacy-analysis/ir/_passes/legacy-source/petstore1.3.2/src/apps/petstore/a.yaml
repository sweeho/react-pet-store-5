  - record_key: checkout-BR-0003
    kind: business-rule
    capability_key: checkout
    requirement: The system SHALL compute the order total as the sum over cart lines of unit cost
      multiplied by quantity, and SHALL record each line with its category, product, item, a line
      number starting at 0 in cart order, quantity and unit cost.
    confidence: medium
    confidence_basis: "Explicit in one code path. Rounding is not specified: the sum is accumulated in
      binary floating point with no rounding step, so the exact cents of the total are an
      implementation artefact (see findings). Not raised to high because no second source (e.g. a
      stored total in the order store) is visible here."
    risk_class: financial
    basis: "Loop over cart items: totalCost += cost*quantity; LineItem(category, productId, itemId,
      lineItemCount++, quantity, cost); setTotalPrice(totalCost)."
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/OrderEJBAction.java
        line_start: 122
        line_end: 146
        excerpt: |2
              int lineItemCount = 0;
              float totalCost = 0;
              // Add the items from the shopping cart
              ShoppingCartLocal cart = scf.getShoppingCart();
              Locale locale = (Locale)machine.getAttribute(PetstoreKeys.LOCALE);
              purchaseOrder.setLocale(locale);
              Collection items = cart.getItems();
              // if the cart is empty throw an exception saying so
              if (items.size() == 0) {
                throw new ShoppingCartEmptyOrderException("Shopping cart is empty");
              }
              Iterator it = items.iterator();
              while (it.hasNext()) {
                CartItem item = (CartItem)it.next();

                float cost = new Float(item.getUnitCost()).floatValue();
                totalCost += (cost*item.getQuantity());
                purchaseOrder.addLineItem(new LineItem(item.getCategory(),
                                                       item.getProductId(),
                                                       item.getItemId(),
                                                       (lineItemCount++) + "",
                                                       item.getQuantity(),
                                                       cost));
              }
              purchaseOrder.setTotalPrice(totalCost);
    stack_metadata:
      ejb.action: OrderEJBAction
      numeric_type: float
