  - record_key: sign-on-WF-0001
    kind: workflow
    capability_key: sign-on
    requirement: "The system SHALL run new-customer registration as: (1) create sign-on account, (2)
      show the create-customer profile form, (3) on successful profile submission mark the user as
      signed on and (4) return the user to the page they originally requested before signing on.
      GIVEN the originally requested page was the account-change action WHEN registration completes
      THEN the system SHALL go to the main (home) screen instead."
    confidence: medium
    confidence_basis: Chain is declared in the URL mappings and implemented in the flow handler and
      action; consistent, but the 'original URL' attribute is populated by the signon component
      outside this shard.
    risk_class: operational
    basis: createuser.do forwards to create_customer.screen; createcustomer.do uses
      CreateUserFlowHandler which returns MAIN_SCREEN when the original URL is customer.do, else the
      original URL; CustomerHTMLAction.doEnd sets SIGNED_ON_USER=true after a create.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/mappings.xml
        line_start: 86
        line_end: 95
        excerpt: |2
