    requirement: >-
      WHEN one or more orders change from PENDING to an approval decision, the system SHALL send each affected customer
      one email to the email address on the order, with subject 'Java Pet Store Order Status: <orderId>' and a body
      rendered in the order's locale that states whether the order was approved or denied.
    confidence: medium
