    risk_class: operational
    basis: >-
      MailOrderApprovalMDB.doWork iterates the ChangedOrder list, looks up the PO email and locale, formats the
      ChangedOrder with the OrderApproval stylesheet and builds a Mail(email, MAIL_SUBJECT + orderId, html); the
      delegate sends each mail to the mailer queue.
    traces:
