findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
    description: >-
      Every <env-entry-value> in ejb-jar.xml is redacted («REDACTED:secret-finding-N»). This hides the default for all
      three customer-email switches (SendApprovalMail, SendConfirmationMail, SendCompletedOrderMail), all XML validation
      switches, XSDValidation, and the OrderApprovalTD transition-delegate class name. These are configuration
      booleans/class names, not secrets. A human should recover the original values so the default-on/off state of each
      email and validation can be specified.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/opc/src/ejb-jar.xml
    description: >-
      The assembly-descriptor grants <unchecked/> method-permission on every OPCAdminFacadeEJB method
      (getOrdersByStatus, getChartInfo), so the order centre itself does not restrict order listing or revenue reporting
      to administrators; the discovery capability list says these are administrator functions. Decide whether the
      rebuild must enforce an administrator role at the service boundary (recommended) or whether access control was
      intentionally delegated to the calling admin client.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
    description: >-
      Auto-approval thresholds (en_US < 500, ja_JP < 50000) are literals in a method its own comment calls a 'stub for
      converting currency' for demos. zh_CN orders can never be auto-approved. Human must decide whether these
      thresholds are real business policy, whether they should be configurable, and what the zh_CN rule should be.
  - kind: unparseable
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
    description: >-
      LocaleUtil.getLocaleFromString is defective for three-part strings (e.g. 'en_US_POSIX'): country is only assigned
      when there is no second underscore, so new Locale(language, null) throws NullPointerException; variantIndex is
      never assigned so variants are never parsed. Not specified as a requirement; the rebuild should parse
      language_COUNTRY[_variant] correctly.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
    description: >-
      The supplier purchase order ship-to address sends only streetName1, although the order store has streetName2
      (AddressEJBTable). Decide whether dropping the second address line is intended or a defect to correct in the
      rebuild.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/TPAInvoiceXDE.java
    description: >-
      Invoice line items are collected into a map keyed by itemId, so an invoice listing the same itemId twice keeps
