  - record_key: order-approval-BR-0002
    kind: business-rule
    capability_key: order-approval
    requirement: >-
      The system SHALL apply an approval decision (e.g. APPROVED or DENIED) only to an order whose current status is
      PENDING. GIVEN an approval decision for an order already APPROVED, DENIED, SHIPPED_PART or COMPLETED WHEN the
      decision is processed THEN the system SHALL ignore it silently: no status change, no supplier purchase order and
      no customer notification. A single approval message MAY carry decisions for several orders; each SHALL be
      evaluated independently.
    confidence: medium
    confidence_basis: >-
      Explicit guard with an explanatory comment, but enforced in one place only (no schema constraint or second check),
      so it cannot reach high on a single pass.
    risk_class: operational
    basis: >-
      OrderApprovalMDB.doWork iterates every ChangedOrder in the OrderApproval document, reads the current status from
      the process manager and 'continue's unless it equals PENDING ('only PENDING orders can be updated ... already
      processed so dont process again'). Only orders passing the guard are added to the customer-notification list and
      have their status updated.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 185
        line_end: 228
        excerpt: |2
            private WorkResult doWork(String xmlMessage) throws XMLDocumentException, FinderException  {

              ArrayList supplierPoList = new ArrayList();
              PurchaseOrderLocal po = null;
              OrderApproval approval = null;

              approval = OrderApproval.fromXML(xmlMessage, entityCatalogURL, validateXmlOrderApproval);

              //generate list of valid orders to return
              OrderApproval oaMailList = new OrderApproval();
              String xmlMailOrderApprovals = null;
              Collection coll = approval.getOrdersList();
              Iterator it = coll.iterator();

              while(it!= null && it.hasNext()) {
                ChangedOrder co = (ChangedOrder) it.next();
                // only PENDING orders can be updated
                //if order alreay APPROVED or DENIED or COMPLETED, then order
                //already processed so dont process again
                String curStatus = processManager.getStatus(co.getOrderId());
                if(!curStatus.equals(OrderStatusNames.PENDING)) {
                  continue;
                }
                //generate list of valid orders to return
                //list contains orders to notify the customer of
                //order status changes. List is sent to customer
                //relations for emailing.
                oaMailList.addOrder(co);

                //update process manager
                //for this purchase order workflow
                processManager.updateStatus(co.getOrderId(), co.getOrderStatus());

                //for all approved orders, send a PO to supplier
                if(co.getOrderStatus().equals(OrderStatusNames.APPROVED)) {
                  po = poHome.findByPrimaryKey(co.getOrderId());
                  String xmlPO = getXmlPO(po, supplierOrderXDE);
                  supplierPoList.add(xmlPO);
                }
              }//end while

              xmlMailOrderApprovals = oaMailList.toXML();
              return new WorkResult(xmlMailOrderApprovals, supplierPoList);
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      ejb.transaction: Required
      jms.queue: jms/opc/OrderApprovalQueue
  - record_key: order-approval-WF-0003
    kind: workflow
    capability_key: order-approval
    requirement: >-
      WHEN an approval decision for a PENDING order is processed, the system SHALL (1) set the order status to the
      decided status, (2) if the status is APPROVED, generate a supplier purchase order for that order and dispatch it
      to the supplier, and (3) after all orders in the batch are processed, send one batched notice listing every order
      whose status changed to customer relations so that each customer is emailed. Automatic approvals and administrator
      decisions SHALL follow this same path.
    confidence: medium
    confidence_basis: >-
      The sequence is explicit in code and the wiring (which queues) is confirmed by ejb-jar.xml and sun-j2ee-ri.xml,
      but the transition delegate class for this step is chosen by an env-entry whose value is redacted in this tree, so
      the configured delegate cannot be confirmed to be OrderApprovalTD.
    risk_class: operational
    basis: >-
      doWork updates the process manager and collects supplier POs for APPROVED orders; doTransition hands both lists to
      the transition delegate. OrderApprovalTD sends each supplier PO to the supplier PurchaseOrderQueue and then one
      message with all order approvals to the OrderApprovalMailQueue. PurchaseOrderMDB routes auto-approvals into the
      same OrderApprovalQueue.
