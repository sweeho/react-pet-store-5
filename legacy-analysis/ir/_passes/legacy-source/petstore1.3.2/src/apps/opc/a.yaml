  - record_key: localization-BR-0001
    kind: business-rule
    capability_key: localization
    requirement: >-
      The system SHALL render each customer email using the template for the order's locale, and SHALL provide templates
      for en_US, ja_JP and zh_CN for all three email types. GIVEN an order whose locale has no template WHEN an email is
      generated THEN generation SHALL fail ('No style sheet found for locale') rather than fall back to a default
      language. GIVEN the order locale cannot be determined THEN the locale-neutral default template SHALL be used.
    confidence: medium
    confidence_basis: >-
      Lookup and failure are explicit in MailContentXDE and the template set is visible on disk; whether the no-fallback
      failure was intended is not stated.
    risk_class: presentational
    basis: >-
      getStyleSheetPath appends '_' + locale.toString() before the extension when locale is non-null, else uses the base
      path; getTransformer throws FormatterException when the resource is missing, which the MDBs wrap in EJBException
      (rollback).
    traces:
      - path: >-
          legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailContentXDE.java
        line_start: 136
        line_end: 165
        excerpt: |2
            private Transformer getTransformer(Locale locale) throws FormatterException {
              Transformer transformer = (Transformer) transformers.get(locale);
              if (transformer == null) {
                InputStream stream = getClass().getResourceAsStream(getStyleSheetPath(styleSheetPath, locale));
                if (stream != null) {
                  try {
                    transformer = transformerFactory.newTransformer(new StreamSource(stream));
                    transformers.put(locale, transformer);
                  } catch (Exception exception) {
                    throw new FormatterException(exception);
                  }
                } else {
                  throw new FormatterException("No style sheet found for locale: " + locale);
                }
              }
              return transformer;
            }

            private String getStyleSheetPath(String styleSheetPath, Locale locale) {
              if (locale != null) {
                int i = styleSheetPath.lastIndexOf('.');
                if (i >= 0) {
                  String suffix = styleSheetPath.substring(i);
                  String base = styleSheetPath.substring(0, i);
                  return base + "_" + locale.toString() + suffix;
                }
                return styleSheetPath + "_" + locale.toString();
              }
              return styleSheetPath;
            }
