records:
  - record_key: order-approval-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >-
      The system SHALL automatically approve a newly received order, without administrator review, when (a) the order
      locale is en_US and the order total is strictly less than 500, or (b) the order locale is ja_JP and the order
      total is strictly less than 50000. Every other order (any other locale, including zh_CN, or a total at or above
      the threshold) SHALL remain PENDING for administrator approval or denial. GIVEN an en_US order totalling exactly
      500 WHEN it is received THEN it SHALL NOT be auto-approved. GIVEN a zh_CN order of any total WHEN it is received
      THEN it SHALL NOT be auto-approved.
    confidence: low
    confidence_basis: >-
      The thresholds 500 and 50000 are bare literals with no configuration, test or comment giving their unit; the
      method comment calls it 'just a stub for converting currency' used 'for demonstrating the petstore'. The logic
      itself is unambiguous in a single place, but whether these are business thresholds or demo scaffolding cannot be
      decided from source.
    risk_class: financial
    basis: >-
      canIApprove compares PurchaseOrder.getTotalPrice() with a strict less-than against 500 for Locale.US and 50000 for
      Locale.JAPAN and returns false for every other locale. doWork calls it after persisting the order; if true it
      builds an APPROVED ChangedOrder and forwards it to the order-approval queue, otherwise it returns null and
      onMessage sends nothing ('else wait for admin to approve/deny orders').
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 178
        line_end: 191
        excerpt: |2
            /**
             * Just a stub for converting currency. This method is used for
             * demonstrating the petstore, so that smaller orders can flow through
             * the system without having to fire up the admin Gui to approve orders
             */
            private boolean canIApprove(PurchaseOrder purchaseOrder) {
              Locale locale = purchaseOrder.getLocale();
              if (locale.equals(Locale.US)) {
                if (purchaseOrder.getTotalPrice() < 500) return true;
              } else if (locale.equals(Locale.JAPAN))  {
                if (purchaseOrder.getTotalPrice() < 50000) return true;
              }
              return false;
            }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 151
