  - record_key: order-approval-REQ-0005
    kind: requirement
    capability_key: order-approval
    requirement: >-
      The system SHALL produce an administrator sales chart over an order-date window, where both the start and end
      instants are inclusive. WHEN the request type is REVENUE the system SHALL sum quantity x unit price per line; for
      any other request type it SHALL sum line quantities. WHEN no category is given the totals SHALL be grouped by
      category id; WHEN a category is given only lines of that category SHALL be counted, grouped by item id. All orders
      in the window SHALL be counted regardless of their approval or fulfilment status.
    confidence: medium
    confidence_basis: >-
      Aggregation logic and the inclusive date bounds are each stated once (Java and declared finder SQL respectively).
      Revenue is accumulated in single-precision float, so rounding of large totals is implementation-defined; no test
      or specification confirms whether cancelled/denied orders were meant to be excluded.
    risk_class: financial
    basis: >-
      getChartInfo calls findPOBetweenDates(start, end) whose SQL is poDate >= ? AND poDate <= ?, iterates every line of
      every PO, and accumulates Float(quantity*unitPrice) for 'REVENUE' or Integer(quantity) otherwise, keyed by
      categoryId (categ == null) or itemId (categ matches). No status filter is applied.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 159
        line_end: 256
        excerpt: |2
              /**
               * Business method in remote interface. Given start, end dates, this
               * returns a <code>HashMap</code> of revenue / orders in the given period
               * @param request  Represents the type of request - ORDERS/REVENUE
               * @param start    Represents the start date in mm/dd/yyyy format
               * @param end      Represents the end date in mm/dd/yyyy format
               * @param categ    Represents the sub-classification
               * @return <code>HashMap</code> of the required details
               * @throws <code>OPCAdminFacadeException</code> for all errors
               */
              public Map getChartInfo(String request,
                                      Date start,
                                      Date end,
                                      String categ)
                  throws OPCAdminFacadeException {
                  String id;
                  Float tmpValue;
                  Integer tmpQty;
                  PurchaseOrderLocal po;

                  Map chartDetails = new HashMap();

                  try {
                      PurchaseOrderLocalHome pohome = getPO();
                      Collection poColl =
                          pohome.findPOBetweenDates(start.getTime(), end.getTime());

                      Iterator it = poColl.iterator();
                      while((it!= null) && (it.hasNext())) {
                          po = (PurchaseOrderLocal) it.next();
                          Collection liColl = po.getAllItems();
                          Iterator lit = liColl.iterator();
                          while((lit!=null) && (lit.hasNext())) {
                              LineItem loc = (LineItem) lit.next();
                              if(request.equals("REVENUE")) {
                                  if(categ == null) {
                                      id = loc.getCategoryId();
                                      if(chartDetails.containsKey(id)) {
                                          tmpValue = (Float) chartDetails.get(id);
                                          chartDetails.put(id,
                                               new Float(tmpValue.floatValue() +
                                               (loc.getQuantity()*loc.getUnitPrice())));
                                      } else {
                                          chartDetails.put(id, new Float((loc.getQuantity()*
                                                                  loc.getUnitPrice())));
                                      }
                                  } else {
                                      if(loc.getCategoryId().equals(categ)) {
                                          id = loc.getItemId();
                                          if(chartDetails.containsKey(id)) {
                                              tmpValue = (Float) chartDetails.get(id);
                                              chartDetails.put(id,
                                                new Float(tmpValue.floatValue() +
                                                (loc.getQuantity()*loc.getUnitPrice())));
                                          } else {
                                              chartDetails.put(id,
                                               new Float(loc.getQuantity()*loc.getUnitPrice()));
                                          }
                                      }
                                  }
                              } else {
                                  if(categ == null) {
                                      id = loc.getCategoryId();
                                      if(chartDetails.containsKey(id)) {
                                          tmpQty = (Integer) chartDetails.get(id);
                                          chartDetails.put(id,
                                               new Integer(tmpQty.intValue() +
                                                           loc.getQuantity()));
                                      } else {
                                          chartDetails.put(id, new
                                                           Integer(loc.getQuantity()));
                                      }
                                  } else {
                                      if(loc.getCategoryId().equals(categ)) {
                                          id = loc.getItemId();
                                          if(chartDetails.containsKey(id)) {
                                              tmpQty = (Integer) chartDetails.get(id);
                                              chartDetails.put(id,
                                                      new Integer(tmpQty.intValue() +
                                                      loc.getQuantity()));
                                          } else {
                                              chartDetails.put(id,
                                                     new Integer(loc.getQuantity()));
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  } catch(FinderException fe) {
                      System.err.println("finder Ex while getChart :" +
                              fe.getMessage());
                      throw new OPCAdminFacadeException("Unable to find PurchaseOrders"+
                                                        " in given period : " +
                                                        fe.getMessage());
                  }
                  return(chartDetails);
              }
