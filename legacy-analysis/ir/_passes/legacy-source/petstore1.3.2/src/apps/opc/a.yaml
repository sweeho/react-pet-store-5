  - record_key: order-approval-REQ-0004
    kind: requirement
    capability_key: order-approval
    requirement: >-
      The system SHALL let an administrator list all orders in a given status (for example PENDING). For each order the
      list SHALL show the order id, the customer user id, the order date formatted as M/D/YYYY (no zero padding), the
      order value, and the requested status. GIVEN an order in the status whose purchase order cannot be found WHEN the
      list is requested THEN the whole request SHALL fail with an error stating the orders of the given status could not
      be found.
    confidence: medium
    confidence_basis: >-
      Single source (the admin facade), backed by a declared finder query on the status table. The caller (admin client)
      is outside this shard, so how the list is presented and which statuses are actually requested is not visible here.
    risk_class: operational
    basis: >-
      getOrdersByStatus asks the process manager for orders in the status (finder SQL: SELECT DISTINCT orderId FROM
      ManagerEJBTable WHERE status = ?), loads each purchase order, formats the date with getMonth()+1 / getDate() /
      getYear()+1900 and builds OrderDetails(poId, poUserId, date, poValue, status). A FinderException is rethrown as
      OPCAdminFacadeException.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/admin/ejb/OPCAdminFacadeEJB.java
        line_start: 131
        line_end: 157
        excerpt: |2
              public OrdersTO getOrdersByStatus(String status)
                                                        throws OPCAdminFacadeException {
                  OrdersTO.MutableOrdersTO retVal = new OrdersTO.MutableOrdersTO();
                  PurchaseOrderLocal po;
                  ProcessManagerLocal mgr = getProcMgr();

                  try {
                      PurchaseOrderLocalHome pohome = getPO();
                      Collection orders = mgr.getOrdersByStatus(status);
                      Iterator it = orders.iterator();
                      while((it!= null) && (it.hasNext())) {
                          ManagerLocal mgrEjb = (ManagerLocal) it.next();
                          po = pohome.findByPrimaryKey(mgrEjb.getOrderId());
                          Date gotDate = new Date(po.getPoDate());
                          String podate = (gotDate.getMonth()+1) + "/" +
                              gotDate.getDate() + "/" + (gotDate.getYear()+1900);
                          retVal.add(new OrderDetails(po.getPoId(), po.getPoUserId(),
                                                      podate, po.getPoValue(), status));
                      }
                  } catch(FinderException fe) {
                      System.err.println("finder Ex while getOrdByStat :" + fe.getMessage());
                      throw new OPCAdminFacadeException("Unable to find PurchaseOrders"+
                                                        " of given status : " +
                                                        fe.getMessage());
                  }
                  return(retVal);
              }
