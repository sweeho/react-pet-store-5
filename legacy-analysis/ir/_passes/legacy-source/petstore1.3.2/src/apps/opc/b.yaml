records:
  - record_key: ORDER-APPROVAL-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: |
      The system SHALL automatically approve a newly received order, without administrator review, when the order locale is en_US and the order total price is strictly less than 500, or when the order locale is ja_JP and the order total price is strictly less than 50000. Every other order SHALL remain PENDING until an administrator approves or denies it.
    confidence: low
    confidence_basis: |
      The thresholds are bare literals (500, 50000) with no configuration, no test and no second enforcing location visible in this module; the method comment calls it 'just a stub for converting currency' used 'for demonstrating the petstore', so it is unclear whether the rebuild should keep it as a business rule. Single source, pass A not visible.
    risk_class: financial
    basis: |
      canIApprove() in the purchase-order intake compares getTotalPrice() against 500 for Locale.US and 50000 for Locale.JAPAN with strict '<'; when it returns true an APPROVED ChangedOrder is produced and forwarded to the approval step, otherwise nothing is sent and the order waits for the administrator (comment at line 126). Comparison is on the order total in the order's own currency; no currency conversion is performed.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 183
        line_end: 191
        excerpt: |2
            private boolean canIApprove(PurchaseOrder purchaseOrder) {
              Locale locale = purchaseOrder.getLocale();
              if (locale.equals(Locale.US)) {
                if (purchaseOrder.getTotalPrice() < 500) return true;
              } else if (locale.equals(Locale.JAPAN))  {
                if (purchaseOrder.getTotalPrice() < 50000) return true;
              }
              return false;
            }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 158
        line_end: 164
