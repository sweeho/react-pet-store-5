  - record_key: LOCALIZATION-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: localization
    requirement: |
      WHEN resolving the locale stored on an order for notification purposes, the system SHALL treat the value 'default' (case-insensitive) as the server default locale, SHALL interpret a value of the form 'language_COUNTRY' as that language and country, and SHALL treat a missing value or a value without an underscore as no locale.
    confidence: medium
    confidence_basis: |
      Explicit in a single utility; three-part values are mishandled (see findings), so behaviour beyond two parts is not a requirement.
    risk_class: presentational
    basis: |
      LocaleUtil.getLocaleFromString().
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
        line_start: 48
        line_end: 75
        excerpt: |2
            public static Locale getLocaleFromString(String localeString) {
              if (localeString == null) return null;
              if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
              int languageIndex = localeString.indexOf('_');
              if (languageIndex  == -1) return null;
              int countryIndex = localeString.indexOf('_', languageIndex +1);
              String country = null;
              if (countryIndex  == -1) {
                if (localeString.length() > languageIndex) {
                  country = localeString.substring(languageIndex +1, localeString.length());
                } else {
                  return null;
                }
              }
              int variantIndex = -1;
              if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
              String language = localeString.substring(0, languageIndex);
              String variant = null;
              if (variantIndex  != -1) {
                variant = localeString.substring(variantIndex +1, localeString.length());
              }
              if (variant != null) {
                return new Locale(language, country, variant);
              } else {
                return new Locale(language, country);
              }

            }
