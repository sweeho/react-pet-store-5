    description: |
      The auto-approval thresholds (en_US < 500, ja_JP < 50000) sit in a method described as 'just a stub ... for demonstrating the petstore'. zh_CN orders are never auto-approved. A human must decide whether auto-approval is a real business rule for the rebuild, what the thresholds are, and whether zh_CN needs one.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/LocaleUtil.java
    description: |
      LocaleUtil.getLocaleFromString mishandles three-part locale strings: when a second underscore exists, country is never assigned (stays null) and variantIndex is never updated, so new Locale(language, null) is called and fails. Only two-part locales work. The rebuild should not reproduce this; confirm whether variant locales are ever stored.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/rsrc/xsl/PartialInvoice_zh_CN.xsl
    description: |
      The zh_CN email templates format prices with a dollar sign and two decimals, identical to en_US, while ja_JP uses a yen sign. Whether Chinese-locale prices are in USD or the currency symbol is a translation omission needs a decision from the localization owner.
