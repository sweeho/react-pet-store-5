  - record_key: ORDER-FULFILLMENT-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: |
      WHEN the order processing centre receives a purchase order from the storefront, the system SHALL persist the purchase order and SHALL start its fulfilment workflow with status PENDING before any approval decision is taken.
    confidence: medium
    confidence_basis: |
      Explicit and unconditional in code, single source in this module (the purchase-order and process-manager entities are defined outside this shard).
    risk_class: operational
    basis: |
      doWork() parses the XML purchase order, calls poHome.create(purchaseOrder) and then processManager.createManager(orderId, OrderStatusNames.PENDING) before evaluating auto-approval.
    traces:
