  - record_key: ORDER-APPROVAL-BUSINESS-RULE-0003
    kind: business-rule
    capability_key: order-approval
    requirement: |
      WHEN a batch of order approval decisions (APPROVED or DENIED) is processed, the system SHALL apply a decision only to orders whose current status is PENDING, and SHALL silently skip any order already APPROVED, DENIED or further along, neither changing its status, nor sending a supplier purchase order, nor notifying the customer again for it.
    confidence: medium
    confidence_basis: |
      Explicit check with an explanatory comment, but enforced in only one place in this module; no schema constraint backs it.
    risk_class: financial
    basis: |
      OrderApprovalMDB.doWork() reads processManager.getStatus(orderId) and 'continue's when it is not PENDING (comment: 'only PENDING orders can be updated ... already processed so dont process again'). Only orders that pass are added to the customer mail list and have their status updated.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 199
        line_end: 216
        excerpt: |2
              while(it!= null && it.hasNext()) {
                ChangedOrder co = (ChangedOrder) it.next();
                // only PENDING orders can be updated
                //if order alreay APPROVED or DENIED or COMPLETED, then order
                //already processed so dont process again
                String curStatus = processManager.getStatus(co.getOrderId());
                if(!curStatus.equals(OrderStatusNames.PENDING)) {
                  continue;
                }
                //generate list of valid orders to return
                //list contains orders to notify the customer of
