    description: |
      method-permission for OPCAdminFacadeEJB (getOrdersByStatus, getChartInfo) is <unchecked/>: no role restriction at the service level. Administrator-only access must be enforced by the calling admin client/transport (not in this shard). Confirm where admin-only access is enforced (capability sign-on).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/rsrc/xsl/PartialInvoice.xsl
    description: |
      The shipment email template displays categoryId, productId and unitPrice attributes of invoice line items, but TPAInvoiceXDE extracts only itemId and quantity. Whether the supplier invoice actually carries category, product and price depends on the TPAInvoice schema outside this shard; if not, those columns render empty.
  - kind: ambiguity
