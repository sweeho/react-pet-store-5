  - record_key: ORDER-APPROVAL-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: order-approval
    requirement: |
      GIVEN an order whose locale is neither en_US nor ja_JP (for example zh_CN)
      WHEN the order is received
      THEN the system SHALL NOT auto-approve it, regardless of its total, and SHALL leave it PENDING for administrator review.
    confidence: low
    confidence_basis: |
      Derived from the absence of a branch rather than an explicit statement; it may be an oversight in demo code rather than intent. Single source.
    risk_class: financial
    basis: |
      canIApprove() only has branches for Locale.US and Locale.JAPAN and falls through to 'return false' for any other locale, although zh_CN is otherwise a supported locale (zh_CN mail templates exist in this module).
    traces:
