      The system SHALL provide the administrator with a sales report for orders placed between a start and an end date: for request type REVENUE it SHALL total quantity x unit price, and for any other request type it SHALL total quantity; with no category given the totals SHALL be grouped by category, and with a category given only that category's lines SHALL be included, grouped by item.
