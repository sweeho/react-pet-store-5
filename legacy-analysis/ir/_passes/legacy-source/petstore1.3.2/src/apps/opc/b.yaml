  - record_key: LOCALIZATION-REQUIREMENT-0001
    kind: requirement
    capability_key: localization
    requirement: |
      The system SHALL render every customer email (approval status, shipment, order completed) in the locale recorded on the order, with template variants for en_US, ja_JP and zh_CN; GIVEN an order with no resolvable locale THEN the default (English) template SHALL be used; GIVEN a locale for which no template exists THEN the email SHALL fail to be produced rather than fall back.
    confidence: medium
    confidence_basis: |
      The resolution logic is explicit; the no-fallback behaviour is read from code paths (an exception is thrown) rather than from any stated intent.
    risk_class: presentational
    basis: |
      MailContentXDE builds '<base>_<locale>.xsl' when a locale is set and throws FormatterException('No style sheet found for locale') if the resource is missing; with a null locale it uses the base stylesheet. Templates exist for _en_US, _ja_JP and _zh_CN.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/customerrelations/ejb/MailContentXDE.java
        line_start: 136
        line_end: 165
        excerpt: |2
            private Transformer getTransformer(Locale locale) throws FormatterException {
              Transformer transformer = (Transformer) transformers.get(locale);
              if (transformer == null) {
                InputStream stream = getClass().getResourceAsStream(getStyleSheetPath(styleSheetPath, locale));
                if (stream != null) {
                  try {
                    transformer = transformerFactory.newTransformer(new StreamSource(stream));
                    transformers.put(locale, transformer);
                  } catch (Exception exception) {
                    throw new FormatterException(exception);
                  }
                } else {
                  throw new FormatterException("No style sheet found for locale: " + locale);
                }
              }
              return transformer;
            }

            private String getStyleSheetPath(String styleSheetPath, Locale locale) {
              if (locale != null) {
                int i = styleSheetPath.lastIndexOf('.');
                if (i >= 0) {
                  String suffix = styleSheetPath.substring(i);
                  String base = styleSheetPath.substring(0, i);
                  return base + "_" + locale.toString() + suffix;
                }
                return styleSheetPath + "_" + locale.toString();
              }
              return styleSheetPath;
            }
