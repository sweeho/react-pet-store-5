  - record_key: ORDER-FULFILLMENT-WORKFLOW-0002
    kind: workflow
    capability_key: order-fulfillment
    requirement: |
      WHEN an order is approved, the system SHALL record the new status for the order and SHALL send exactly one supplier purchase order for it; WHEN an order is denied, the system SHALL record the DENIED status and SHALL NOT send a supplier purchase order. In either case the customer SHALL be included in a single batched status notification for all orders changed by that batch, which is dispatched after the supplier purchase orders.
    confidence: medium
    confidence_basis: |
      Clear in code across two cooperating classes, but both are in the same programmatic layer; no declarative confirmation.
    risk_class: operational
    basis: |
      doWork() calls processManager.updateStatus(orderId, status) and for APPROVED builds a supplier PO via getXmlPO; OrderApprovalTD.doTransition sends each supplier PO to the supplier queue and then sends the whole mail list as one message to the customer-relations queue.
    traces:
