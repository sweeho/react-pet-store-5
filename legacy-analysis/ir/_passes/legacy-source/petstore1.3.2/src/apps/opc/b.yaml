  - record_key: B2B-DOCUMENT-EXCHANGE-INTEGRATION-0001
    kind: integration
    capability_key: b2b-document-exchange
    requirement: |
      The supplier purchase order sent for an approved order SHALL carry the order id, the order date, the ship-to contact (given name, family name, first street line, city, state, country, postal code, email, telephone) and, for every line item of the order, its category id, product id, item id, line number, quantity and unit price.
    confidence: medium
    confidence_basis: |
      Field list is explicit in code; the document schema (TPASupplierOrder) lives outside this shard so its constraints could not be checked.
    risk_class: operational
    basis: |
      getXmlPO() populates TPASupplierOrderXDE with these fields; only street line 1 is sent (street line 2 is not). Line items come from po.getData().getLineItems() (the commented-out getAllItems() call shows an earlier alternative).
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/OrderApprovalMDB.java
        line_start: 248
        line_end: 268
        excerpt: |2
            private String getXmlPO(PurchaseOrderLocal po, TPASupplierOrderXDE supplierOrderXDE) throws XMLDocumentException{
              supplierOrderXDE.newDocument();
              supplierOrderXDE.setOrderId(po.getPoId());
              Date tmpDate = new Date(po.getPoDate());
              supplierOrderXDE.setOrderDate(tmpDate);
              ContactInfoLocal cinfo = po.getContactInfo();
              AddressLocal addr = cinfo.getAddress();
              supplierOrderXDE.setShippingAddress(cinfo.getGivenName(), cinfo.getFamilyName(),
                                                  addr.getStreetName1(), addr.getCity(),
                                                  addr.getState(), addr.getCountry(),
                                                  addr.getZipCode(), cinfo.getEmail(), cinfo.getTelephone());
              //Collection liColl = po.getAllItems();
              Collection liColl = po.getData().getLineItems();
              Iterator liIt = liColl.iterator();
              while((liIt != null) && (liIt.hasNext())) {
                LineItem li = (LineItem) liIt.next();
                supplierOrderXDE.addLineItem(li.getCategoryId(), li.getProductId(), li.getItemId(),
                                             li.getLineNumber(), li.getQuantity(), li.getUnitPrice());
              }
              return supplierOrderXDE.getDocumentAsString();
            }
    stack_metadata:
      ejb.bean: OrderApprovalMDB
      db.object: TPASupplierOrder document
  - record_key: ORDER-FULFILLMENT-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: |
      WHEN a supplier invoice for an order is received, the system SHALL record the shipped line items against the order; IF all items of the order have now been shipped THEN the system SHALL set the order status to COMPLETED and SHALL trigger the order-completed customer notification, OTHERWISE it SHALL set the order status to SHIPPED_PART.
    confidence: medium
    confidence_basis: |
      Explicit in code; the 'all items shipped' calculation itself (PurchaseOrderHelper.processInvoice) is outside this shard, so the exact completeness rule could not be read here.
    risk_class: operational
    basis: |
      InvoiceMDB.doWork() locates the PO by invoice order id, calls poHelper.processInvoice(po, lineItemIds) and branches on its boolean result to COMPLETED (and returns the order id for the completed-order transition) or SHIPPED_PART.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 157
        line_end: 173
        excerpt: |2
            private String doWork(String xmlInvoice) throws XMLDocumentException, FinderException {
              String completedOrder = null;
              PurchaseOrderHelper poHelper = new PurchaseOrderHelper();
              invoiceXDE.setDocument(xmlInvoice);
              PurchaseOrderLocal po = poHome.findByPrimaryKey(invoiceXDE.getOrderId());
              boolean orderDone = poHelper.processInvoice(po, invoiceXDE.getLineItemIds());

              //update process manager if this order is completely done, or partially done
              //for this purchase order
              if(orderDone) {
                processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.COMPLETED);
                completedOrder = invoiceXDE.getOrderId();
              } else {
                processManager.updateStatus(invoiceXDE.getOrderId(), OrderStatusNames.SHIPPED_PART);
              }
              return completedOrder;
            }
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/InvoiceMDB.java
        line_start: 126
        line_end: 129
