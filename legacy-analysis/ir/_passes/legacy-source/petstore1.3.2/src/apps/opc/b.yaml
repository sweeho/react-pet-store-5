              if(canIApprove(purchaseOrder)) {
                ChangedOrder co = new ChangedOrder(purchaseOrder.getOrderId(), OrderStatusNames.APPROVED);
                OrderApproval oa = new OrderApproval();
                oa.addOrder(co);
                ret = oa.toXML();
              }
              return ret;
      - path: legacy-source/petstore1.3.2/src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java
        line_start: 123
