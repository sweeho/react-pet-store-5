    risk_class: financial
    basis: |
      OPCAdminFacadeEJB.getChartInfo() uses findPOBetweenDates(start, end) and aggregates line items into a map keyed by categoryId or itemId, summing in single-precision float for revenue and Integer for quantity. It counts all orders in the window regardless of status (including DENIED).
