  - record_key: SI-WF-0006
    kind: workflow
    capability_key: supplier-inventory
    requirement: The supplier inventory application SHALL offer a home screen explaining that updating inventory lets back-ordered items be filled, with actions to display inventory and to log out; a plain (non-form) request to the application entry point SHALL land on that home screen.
    confidence: medium
    confidence_basis: Navigation is explicit in the dispatcher and page. Single source. The GET/POST switch uses a shared servlet field (fromDoGet), which is not thread-safe, so concurrent requests could be misrouted; the intended behaviour is still clear.
    risk_class: presentational
    basis: doGet sets fromDoGet and forwards to /index.jsp; POST routes on currentScreen to logout.jsp, displayinventory.jsp or the update flow. index.jsp describes the purpose and offers the two actions.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 159
        line_end: 178
        excerpt: |2
            public void doGet(HttpServletRequest req, HttpServletResponse resp)
              throws java.io.IOException, javax.servlet.ServletException {
                fromDoGet = true;
                doPost(req, resp);
                fromDoGet = false;
            }

            public void doPost(HttpServletRequest req, HttpServletResponse resp)
              throws java.io.IOException, javax.servlet.ServletException {

                if(fromDoGet) {
                  getServletConfig().getServletContext().getRequestDispatcher("/index.jsp").forward(req, resp);
                } else {
                  String curScreen = req.getParameter("currentScreen").trim();
                  if(curScreen.equals("logout")) {
                    getServletConfig().getServletContext().getRequestDispatcher("/logout.jsp").forward(req, resp);
                  }
                  if(curScreen.equals("displayinventory")) {
                    getServletConfig().getServletContext().getRequestDispatcher("/displayinventory.jsp").forward(req, resp);
                  }
