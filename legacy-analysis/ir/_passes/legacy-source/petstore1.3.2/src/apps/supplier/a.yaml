  - record_key: SI-BR-0007
    kind: business-rule
    capability_key: supplier-inventory
    requirement: The system SHALL provide an initial-load operation that creates stock records from a seed data set, skipping the load when any stock record already exists unless the load is explicitly forced; when a seeded item already exists it SHALL be replaced by the seed value. The shipped seed data SHALL set items EST-1 to EST-29 to a quantity of 10000 each.
    confidence: low
    confidence_basis: Operational seeding, not end-user behaviour (discovery report says to file it under supplier-inventory and flag it). The 10000 figure and the EST-1..EST-29 range are bare data values with no stated rationale. The endpoint also has no access control (see finding).
    risk_class: operational
    basis: PopulateServlet checks InventoryPopulator.check() (true when findAllInventoryItems is non-empty) and only parses the seed file when forcefully=true or not yet populated. createInventory removes any existing record for the id before creating it. Populate-UTF8.xml lists 29 items at quantity 10000.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/tools/populate/PopulateServlet.java
        line_start: 98
        line_end: 124
        excerpt: |2
            private boolean populate(boolean forcefully) throws PopulateException {
              XMLReader reader = null;
              boolean alreadyPopulated = false;
              try {
                SAXParserFactory parserFactory = SAXParserFactory.newInstance();
                //parserFactory.setValidating(true);
                parserFactory.setNamespaceAware(true);
                reader = parserFactory.newSAXParser().getXMLReader();
                InventoryPopulator inventoryPopulator = new InventoryPopulator();
                if (!forcefully) {
                  try {
                    alreadyPopulated = inventoryPopulator.check();
                  } catch (PopulateException exception) {}
                  //System.err.println("Already populated: " + alreadyPopulated);
                }
                if (forcefully || !alreadyPopulated) {
                  try {
                    inventoryPopulator.setup(reader).parse(new InputSource(getResource(populateDataPath)));
                  } catch (Exception exception) {
                    throw new PopulateException(exception);
                  }
                }
              } catch (Exception exception) {
                throw new PopulateException(exception);
              }
              return forcefully || !alreadyPopulated;
            }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/tools/populate/InventoryPopulator.java
        line_start: 83
        line_end: 113
        excerpt: |2
            public boolean check() throws PopulateException {
              try {
                    InitialContext context = new InitialContext();
                    inventoryHome = (InventoryLocalHome) context.lookup(JNDI_INVENTORY_HOME);
                    Collection inventoryItems = inventoryHome.findAllInventoryItems();
                    if ((inventoryItems == null) || (inventoryItems.size() == 0)) {
                  return false;
                }
              } catch (Exception e) {
                    return false;
              }
              return true;
            }

            private InventoryLocal createInventory(String id, int quantity) throws PopulateException {
              try {
                if (inventoryHome == null) {
                  InitialContext context = new InitialContext();
                  inventoryHome = (InventoryLocalHome) context.lookup(JNDI_INVENTORY_HOME);
                }
                InventoryLocal inventory;
                try {
                  inventory = inventoryHome.findByPrimaryKey(id);
                  inventory.remove();
                } catch (Exception exception) {}
                inventory = inventoryHome.create(id, quantity);
                return inventory;
              } catch (Exception exception) {
                throw new PopulateException ("Could not create: " + exception.getMessage(), exception);
              }
            }
