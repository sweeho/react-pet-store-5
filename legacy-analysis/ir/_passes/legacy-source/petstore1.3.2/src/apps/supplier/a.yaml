  - record_key: SI-BR-0004
    kind: business-rule
    capability_key: supplier-inventory
    requirement: WHEN supplier staff submit inventory changes THEN the system SHALL, for each item whose update selector is ticked and whose new quantity is non-empty and greater than or equal to zero, replace the item's on-hand quantity with the entered value; items not ticked, left blank, or given a negative value SHALL be left unchanged.
    confidence: medium
    confidence_basis: "The rule is explicit in one handler. The quantity is set absolutely, not incremented (the increment method is commented out). Not high: single source, and the behaviour for non-numeric input and unknown item ids is unhandled (see findings)."
    risk_class: operational
    basis: updateInventory iterates request parameters beginning with 'item_' (present only when the checkbox is ticked), reads the matching 'qty_' value, skips null/empty, and calls setQuantity when the integer is >= 0. InventoryEJB.addQuantity is commented out, so there is no additive receipt path.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 110
        line_end: 137
        excerpt: |2
            private void updateInventory(HttpServletRequest req) {

              String itemId;
              InventoryLocal inventory;

              try {
                Enumeration e = req.getParameterNames();
                while ((e != null) && e.hasMoreElements()) {
                  String param = ((String)e.nextElement()).trim();
                  if ((param != null) && param.startsWith("item_")) {
                    // get the item id number from the parameter
                    itemId = param.substring("item_".length(),param.length());
                    if(itemId != null) {
                      String newQty = req.getParameter("qty_" + itemId);
                      if((newQty == null) || (newQty.length() <= 0))
                        continue;
                      Integer qty = new Integer(newQty);
                      if(qty.intValue() >= 0 ) {
                        inventory = inventoryHomeRef.findByPrimaryKey(itemId);
                        inventory.setQuantity(qty.intValue());
                      }
                    }
                  }
                }
              } catch (FinderException ne) {
                ne.printStackTrace();
              }
            }
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/ejb/InventoryEJB.java
