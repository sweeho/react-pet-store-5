  - record_key: OF-BR-0003
    kind: business-rule
    capability_key: order-fulfillment
    requirement: The system SHALL set a supplier order's status to COMPLETED only when every line that was outstanding at the start of a fulfilment attempt was shipped in that attempt; GIVEN at least one line could not be shipped WHEN the attempt ends THEN the order SHALL stay PENDING and lines already shipped SHALL stay shipped (partial shipment).
    confidence: medium
    confidence_basis: Explicit flag logic in one method. Medium for single source.
    risk_class: operational
    basis: allItemsAvailable starts true and is cleared when any outstanding line fails checkInventory; only then po.setPoStatus(COMPLETED). Shipped lines are updated in place regardless.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
        line_start: 176
        line_end: 198
        excerpt: |2
            private String processAnOrder(SupplierOrderLocal po)
              throws XMLDocumentException  {
                boolean allItemsAvailable = true;
                boolean invoiceReqd = false;
                String invoiceXml = null;

                HashMap items = new HashMap();
                Collection liColl = po.getLineItems();
                Iterator liIt = liColl.iterator();
                while((liIt != null) && (liIt.hasNext())) {
                  LineItemLocal li = (LineItemLocal) liIt.next();
                  if(li.getQuantity() == li.getQuantityShipped())
                    continue;
                  if(!checkInventory(li)) {
                    allItemsAvailable = false;
                    continue;
                  }
                  li.setQuantityShipped(li.getQuantity());
                  items.put(li.getItemId(), OrderStatusNames.COMPLETED);
                  invoiceReqd = true;
                }//end while
                if(allItemsAvailable)
                  po.setPoStatus(OrderStatusNames.COMPLETED);
