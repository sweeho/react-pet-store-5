findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/WEB-INF/web.xml
    description: The seed/initial-load endpoint (/Populate) and populating.jsp are not covered by any security-constraint (only /RcvrRequestProcessor is). Anyone can call /Populate?forcefully=true and reset every seeded stock record to 10000, and success_page/error_page are open redirect parameters. A human must decide whether the rebuild keeps an initial-load operation at all and who may run it. (web.xml lines 63-70 vs 91-104; PopulateServlet.java 74-96.)
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: "Lines 199-207: if invoice building fails, processAnOrder returns null with the comment 'po is persisted and can be fullfilled later', but stock has already been reduced and the lines marked quantityShipped inside the same Required transaction, which is not rolled back. The order will not be re-fulfilled for those lines and no invoice is ever sent. Intended behaviour (roll back vs. retry invoice) needs a decision."
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: "Lines 139-157 and 185-188: sendInvoices swallows ServiceLocator/Transition exceptions and the user transaction still commits, so after a stock update pending orders can be marked COMPLETED and stock decremented while their invoices were never published. Conversely, invoices are published on a non-transacted topic session before the commit, so a failing commit leaves invoices sent for shipments that were rolled back. Decide the required atomicity between stock/order update and invoice emission."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: "Lines 110-137: updateInventory does not handle a non-numeric quantity (new Integer throws NumberFormatException, uncaught; the begun user transaction is left without explicit rollback) and a FinderException for an unknown item id is caught outside the loop, silently stopping all remaining updates while the transaction still commits and the success page is shown. The required validation and error messaging for inventory entry are unstated."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: "Lines 158 and 194: shipped lines are tracked in a map keyed by itemId, and the invoice includes every order line whose itemId is in that map. If an order has two lines for the same item, a line that did not ship in this attempt (or shipped in an earlier attempt and was already invoiced) is included in the invoice again. Whether duplicate items per order are possible upstream, and whether invoices must list only this attempt's lines, needs confirming."
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/rsrc/xsl/TPASupplierOrder.xsl
    description: "Lines 26-27: the TPA mapping writes tpaso:FirstName into FamilyName and tpaso:LastName into GivenName — first and last names are swapped (or the internal field names are misleading). A human must decide the correct mapping before it is carried into the rebuild."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/TPASupplierOrderXDE.java
    description: "Line 89: setSupportingXSD(Boolean.getBoolean(supportingXSD)) reads a JVM system property named by the catalog value ('true'/'false') instead of parsing it, so XSD support is effectively always off regardless of the catalog's '.XSDSupport: true'. Whether TPA purchase orders were meant to be XSD-validated is unresolved; the configured validation flags and schema id in ejb-jar.xml (lines 145-164) and the transition-delegate class name (lines 95-99) are redacted in this copy of the source and could not be read."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/login.jsp
    description: "Lines 61 and 67: the sign-in form pre-fills user ID and password with 'supplier'/'supplier'. Treated as demo convenience and not emitted as a requirement; confirm it must not be carried forward. Also RcvrRequestProcessor.java line 82 says the user is 'logged in as supplier' while access is by the administrator role; the vendor role mapping (sun-j2ee-ri.xml 45-56) reconciles the two, but the rebuild needs an explicit supplier-staff role decision."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
