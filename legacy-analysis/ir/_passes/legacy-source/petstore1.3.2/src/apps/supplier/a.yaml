    kind: entity
    capability_key: supplier-inventory
    requirement: The system SHALL hold one supplier stock record per catalogue item, identified uniquely by the item identifier, carrying a mandatory integer on-hand quantity.
    confidence: medium
    confidence_basis: "Declared twice: the persistent-field/primary-key declaration and the generated table DDL (primary key on itemId, quantity NOT NULL). Graded medium, not high, because pass B has not been compared yet and the DDL is container-generated rather than hand-written. No CHECK constraint exists, so a lower bound on quantity is not declared anywhere."
    risk_class: operational
    basis: The Inventory entity declares exactly two persistent fields, itemId (primary key) and quantity. The deployed table is created with itemId as PRIMARY KEY and quantity INTEGER NOT NULL.
