findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: "processAnOrder swallows an XMLDocumentException from invoice creation and returns null (comment: 'po is persisted and can be fulfilled later'), but by then stock has already been reduced and the lines marked fully shipped in the same Required transaction, which commits. Re-fulfilment skips lines where quantity == quantityShipped, so those goods are recorded as shipped with no invoice ever sent. A human must decide whether an invoice-generation failure should roll back the stock reduction (lines 189-207)."
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: "The inventory-update flow wraps update + pending-order fulfilment + invoice sending in one UserTransaction, but sendInvoices catches and only prints TransitionException/ServiceLocatorException, so the transaction still commits: stock is decremented and lines marked shipped while the invoice publish may have failed. Also the invoice topic session is non-transacted, so a published invoice survives a later rollback. Decide the intended atomicity (lines 139-157, 179-206)."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: Non-numeric new-quantity input (e.g. 'abc') makes new Integer(newQty) throw NumberFormatException, which is not caught; the request fails with a server error after ut.begin() and the transaction is never committed or rolled back explicitly. Missing currentScreen parameter on POST causes a NullPointerException. Intended validation feedback for bad input is unspecified (lines 123-127, 172).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: Failures in the updateinventory branch (FinderException for an unknown item id, RollbackException, etc.) are only printStackTrace'd and no response is forwarded, so the user gets a blank page with no success or error message. Also FinderException in updateInventory aborts processing of the remaining items in the batch. Intended error UX is unknown.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
    description: The GET-vs-POST routing uses an instance field fromDoGet on a servlet shared across threads; a concurrent GET can make a simultaneous POST be treated as a GET (forwarded to index.jsp, update silently not applied). Treated as a defect, not a requirement; intended behaviour is 'GET shows home page' (lines 85, 159-171).
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/rsrc/xsl/TPASupplierOrder.xsl
    description: TPASupplierOrder.xsl maps tpaso:FirstName to FamilyName and tpaso:LastName to GivenName, i.e. first and last names appear swapped in the stored supplier order contact. Confirm whether the trading-partner format actually carries names in that order or this is a defect (lines 26-27).
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/TPASupplierOrderXDE.java
    description: "Supporting-XSD flag is computed as Boolean.getBoolean(supportingXSD), which reads a JVM system property NAMED by the catalogue value ('true'/'false') rather than parsing it, so XSD support is effectively always false regardless of the catalogue entry 'http://blueprints.j2ee.sun.com/TPASupplierOrder.XSDSupport: true'. Decide whether XSD validation of inbound supplier orders was intended (line 89; catalogue lines 5-6)."
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: Invoice recipient is hard-coded to 'Dear PetStore Customer' (line 149) rather than a customer/user id. Unclear whether downstream consumers rely on this field; needs a decision for the rebuild.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/orderfulfillment/ejb/OrderFulfillmentFacadeEJB.java
    description: The initial status of a newly persisted supplier order (assumed PENDING, required for processPendingPO to retry it) is set in the supplierpo component outside this shard; ORDFUL-RULE-0003's 'remains pending' clause depends on it and should be cross-checked with that shard.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/WEB-INF/web.xml
    description: The /Populate servlet (initial stock load, including forcefully=true which deletes and recreates inventory rows) has no security constraint and the EJB method permissions are all <unchecked/>, so any unauthenticated caller can reset supplier stock. Decide whether this bootstrap function is in scope for the rebuild and who may run it (web.xml lines 52-70, 91-104; ejb-jar.xml 220-240).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/login.jsp
    description: The supplier login form pre-fills user ID and password with 'supplier'/'supplier' (lines 61, 67). Almost certainly demo convenience, but it discloses working credentials; must not be carried into the rebuild without an explicit decision.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/displayinventory.jsp
    description: The not-authorised message reads 'You are not authorised to update the status of orders.' on the inventory page, and the empty-state message only appears when the inventory lookup fails (returns null), not when inventory is empty. Copy and empty-state trigger need an owner decision (lines 114-125).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/supplier/src/docroot/populating.jsp
    description: populating.jsp redirects to Populate with success_page=//petstore/main.screen, i.e. supplier population is chained from the storefront's population flow; reachability of the standalone supplier populate page from any supplier screen could not be established in this shard (line 47).
  - kind: ambiguity
    path: legacy-analysis
    description: No legacy-analysis/sources/**/extracted.md documents exist in the tree, so no document trace pointers could be cited for this module; all records are code-traced only.
