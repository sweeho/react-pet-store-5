  - record_key: ORDFUL-RULE-0001
    kind: business-rule
    capability_key: order-fulfillment
    requirement: "The system SHALL ship an order line only in full: a line SHALL be shipped when the item's stock on hand is at least the line quantity, in which case stock SHALL be reduced by the line quantity and the whole line quantity recorded as shipped; otherwise nothing of that line SHALL be shipped or reserved. GIVEN a line for 5 units and 3 units on hand WHEN fulfilment is attempted THEN no units SHALL ship and stock SHALL remain 3."
    confidence: medium
