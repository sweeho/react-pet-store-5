  - record_key: ORDFUL-WF-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: WHEN the supplier receives a purchase order from the order processing centre, the system SHALL persist the order, then immediately attempt to fulfil it from current stock, and SHALL send an invoice back to the order processing centre only if at least one line was shipped; otherwise the order SHALL wait until new stock arrives.
    confidence: medium
    confidence_basis: Consistent across the message listener, the facade and the facade's class comment; single implementation path. Not high because no schema or declarative rule independently enforces the sequence.
    risk_class: operational
    basis: onMessage -> doWork -> processPO (parse XML, create SupplierOrder, processAnOrder); if the returned invoice is non-null doTransition publishes it; the else-branch comment says to wait for inventory at the receiver.
