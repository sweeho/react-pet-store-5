  - record_key: SUPINV-WF-0001
    kind: workflow
    capability_key: supplier-inventory
    requirement: WHEN supplier staff submit an inventory update, the system SHALL, as one atomic unit of work, apply the stock changes, then re-attempt fulfilment of every supplier order still in PENDING status against the new stock, then dispatch an invoice for each order from which anything was shipped, and on success SHALL show a confirmation that inventory was updated successfully.
    confidence: medium
    confidence_basis: Ordering and the transaction boundary are explicit in one servlet; the index page copy corroborates intent (updating inventory lets the supplier fill back-ordered items). Graded medium because error paths inside the unit swallow failures (see findings) so atomicity is weaker than the begin/commit suggests.
    risk_class: operational
    basis: doPost for updateinventory begins a UserTransaction, calls updateInventory, then processPendingPO (finds PENDING orders and processes each), then sendInvoices, commits, and forwards to back.jsp ('Inventory was updated successfully').
    traces:
