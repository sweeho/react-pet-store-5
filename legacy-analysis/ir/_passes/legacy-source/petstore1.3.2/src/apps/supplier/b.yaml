  - record_key: SUPINV-RULE-0001
    kind: business-rule
    capability_key: supplier-inventory
    requirement: The system SHALL change an item's stock level only when that item is selected for update AND a non-empty new quantity is supplied for it, and SHALL replace (not add to) the existing quantity with the supplied value. GIVEN an item has a new quantity entered but is not selected WHEN the batch is submitted THEN its stock level SHALL remain unchanged.
    confidence: medium
    confidence_basis: Single programmatic source, consistent with the on-screen instruction to enter a quantity and tick the box. Replacement semantics are explicit (setQuantity); the additive alternative exists only as commented-out code, which reinforces rather than disputes it.
    risk_class: operational
    basis: updateInventory iterates only request parameters beginning with item_ (i.e. ticked checkboxes), skips when qty_<id> is missing or empty, and calls setQuantity with the parsed value. The addQuantity method is commented out.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/supplier/src/com/sun/j2ee/blueprints/supplier/inventory/web/RcvrRequestProcessor.java
        line_start: 116
        line_end: 130
        excerpt: |2
                Enumeration e = req.getParameterNames();
                while ((e != null) && e.hasMoreElements()) {
                  String param = ((String)e.nextElement()).trim();
                  if ((param != null) && param.startsWith("item_")) {
                    // get the item id number from the parameter
                    itemId = param.substring("item_".length(),param.length());
                    if(itemId != null) {
                      String newQty = req.getParameter("qty_" + itemId);
                      if((newQty == null) || (newQty.length() <= 0))
                        continue;
                      Integer qty = new Integer(newQty);
                      if(qty.intValue() >= 0 ) {
                        inventory = inventoryHomeRef.findByPrimaryKey(itemId);
                        inventory.setQuantity(qty.intValue());
                      }
