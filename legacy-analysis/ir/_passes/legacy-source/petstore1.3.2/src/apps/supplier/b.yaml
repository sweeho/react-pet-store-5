  - record_key: SUPINV-RULE-0002
    kind: business-rule
    capability_key: supplier-inventory
    requirement: The system SHALL reject a negative new stock quantity for an item by leaving that item's stock level unchanged, while still applying the other items in the same batch. GIVEN a selected item with new quantity -5 WHEN the batch is submitted THEN that item's stock SHALL remain unchanged AND no error SHALL be shown for it.
    confidence: medium
    confidence_basis: The >= 0 guard is explicit in code; single source, no schema CHECK backs it (quantity is only NOT NULL). The silent-skip behaviour (no user feedback) is observed, not necessarily intended.
    risk_class: operational
    basis: Only qty.intValue() >= 0 reaches setQuantity; negatives fall through with no message. Non-numeric input is not handled here (see findings).
    traces:
