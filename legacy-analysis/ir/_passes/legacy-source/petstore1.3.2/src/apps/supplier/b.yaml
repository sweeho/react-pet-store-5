  - record_key: SUPINV-RULE-0003
    kind: business-rule
    capability_key: supplier-inventory
    requirement: The system SHALL provide an initial stock-loading function that, when the supplier inventory is empty, creates inventory for items EST-1 through EST-29 at 10000 units each, and SHALL skip loading when any inventory already exists unless loading is explicitly forced, in which case each listed item SHALL be replaced with the seeded quantity.
    confidence: low
    confidence_basis: The 29 items and the 10000 figure are bare literals in seed data with no comment or configuration explaining them; this is demo/bootstrapping data and may not be a business requirement at all. The skip/force logic is explicit in code.
    risk_class: operational
    basis: PopulateServlet.populate checks InventoryPopulator.check() (true when findAllInventoryItems is non-empty) and parses Populate-UTF8.xml only when forcefully or not already populated; createInventory removes any existing row for the id before creating it. The seed file lists EST-1..EST-29 each with quantity 10000.
