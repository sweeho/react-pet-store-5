    kind: business-rule
    capability_key: order-approval
    requirement: WHEN the administrator commits pending-order changes THEN the system SHALL submit orders marked APPROVED as one approval batch and orders marked DENIED as a separate denial batch, SHALL submit nothing if no order was changed, and SHALL then reload the order lists from the server.
    confidence: medium
    confidence_basis: Single client-side source; statement order (approved batch before denied batch) is only implicit in statement sequence.
    risk_class: financial
    basis: commit() partitions rows by status, returns early when both sets are empty, calls updateStatus for approved then denied, then re-fetches order data.
