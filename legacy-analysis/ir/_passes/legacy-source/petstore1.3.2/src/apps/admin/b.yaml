                      bd.updateOrders(oa);
                      return replyHeader + "<Type>UPDATEORDERS</Type>\n"
                          + "<Status>SUCCESS</Status>\n"
                          + "</Response>\n";
                  } catch (AdminBDException e) {
                      return replyHeader
