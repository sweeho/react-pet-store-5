findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: The data service that lists orders, applies approve/deny decisions and returns revenue is NOT under the administrator security constraint (web.xml lines 75-88 protect only /AdminRequestProcessor). It only checks that some session exists (lines 88-99). JSPs such as login.jsp create a session before authentication, so an unauthenticated caller holding any session in the admin context could appear authorised. A human must decide whether the rebuild requires the administrator role on every data-service operation (recommended) — the legacy code comment claims this but the descriptor does not enforce it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
    description: Transport guarantee is NONE and the launch descriptor hard-codes an http:// codebase (AdminRequestProcessor.java line 68), so admin credentials, the session id and approval decisions travel unencrypted. Decide whether the rebuild must require TLS.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/login.jsp
    description: The login form pre-fills user id jps_admin and a password (lines 60, 66). Almost certainly demo convenience; it must not be carried into the rebuild, and no requirement was emitted for it.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/HttpPostPetStoreProxy.java
    description: updateStatus ignores a non-SUCCESS reply ("// throw an exception" placeholder, lines 415-417), and the server replies SUCCESS as soon as the approval document is queued. Nothing tells the administrator if order processing later rejects or fails to apply a decision. Decide whether the rebuild needs confirmation or failure feedback.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: getOrders and getChartInfo return null on a back-end failure (lines 199-202, 301-304), so the servlet writes the literal "null" rather than an <Error> element. The client then fails to parse the reply and exits through the fatal-error path. The intended error contract for listing and report failures is unstated.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
    description: ChartModel.viewMode is initialised to null and never assigned (lines 530-531, 590-592), so the client never sends a category and the per-item breakdown the server supports (ApplRequestProcessor.java lines 249-264) cannot be reached from this client. Decide whether category-to-item drill-down is a required feature; OA-REQ-0014/0015 record it as server capability only.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
    description: 'The default chart dates conflict with their comments: the comment says the start defaults to 1/12/2001 but the code uses 1/1/2001, and the comment says the end is "the present day" but the code uses 12/31/2002 (lines 522-528). A TODO says the real default should be today. Decide the intended default range.'
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/PetStoreProxy.java
    description: Order.checkStatus is a no-op ("// throw an illegal arg exception", lines 82-89), and parseOrderStatus maps any unknown status to null (HttpPostPetStoreProxy.java lines 266-282), so orders in other statuses silently drop out of both views. Other modules may define more order statuses than these four; reconcile with the order-fulfillment lifecycle.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: Revenue is summed in single-precision float (lines 266-279) with no rounding rule, and the order-count total is emitted in an element named TotalSales (lines 294-296). Money precision and rounding for the revenue report are unspecified; the rebuild should use exact decimal arithmetic, but a human must confirm how totals are rounded.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/PieChartPanel.java
    description: No check that the start date is on or before the end date (lines 111-133). The server date parser uses the deprecated local-time Date constructor (ApplRequestProcessor.java lines 319-326), so whether the end date is inclusive depends on the facade outside this shard. Inclusivity of the range is unresolved.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/resources/petstore_de.properties
    description: The admin client ships English and German bundles, but the capability list names English, Japanese and Chinese as supported locales, and there is no Japanese or Chinese admin bundle. Decide which locales the admin console must support.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
    description: Non-numeric order ids are shown as -1 in the order tables (lines 345-349), which implies order ids are numeric but does not enforce it. The order-id format is owned by another module.
