findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
    description: >-
      Only /AdminRequestProcessor is under the administrator security constraint; /ApplRequestProcessor (which lists
      orders, submits approve/deny decisions and returns revenue reports) is not. ApplRequestProcessor only checks
      that SOME session exists (getSession(false) != null). JSPs create sessions by default, so a session obtained
      by merely loading login.jsp appears sufficient to call it unauthenticated. A human must decide whether the
      rebuild requires the administrator role on every order-data and approval operation (almost certainly yes) and
      record the legacy gap as a defect rather than a rule.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >-
      The server-side status update accepts any OrderStatus value for any order id and forwards it to the
      order-approval queue; only the client restricts choices to PENDING/APPROVED/DENIED and only for PENDING
      orders. It is unresolved whether the order centre rejects illegal transitions (e.g. re-approving a DENIED or
      COMPLETED order). Decide whether the rebuild must validate transitions server-side.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/HttpPostPetStoreProxy.java
    description: >-
      The client ignores a non-SUCCESS update response ('// throw an exception' is an empty block), and the server
      reports SUCCESS as soon as the approval document is queued, not when the order centre applies it. Whether the
      administrator must be told of a failed or rejected approval is undocumented.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >-
      getOrders and getChartInfo return null on a back-end failure, and doPost prints it, so the client receives the
      literal text 'null' instead of an <Error> response; the client then fails to parse and exits via the
      fatal-error dialog. Intended error behaviour for back-end failures is not stated.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
    description: >-
      Category drill-down (per-item report breakdown) is supported by the server and the proxy, but
      ChartModel.viewMode is initialised to null and never assigned anywhere in the client, so the client can only
      ever request the top-level per-category view. Reachability of the per-item report from the UI is unresolved;
      order-approval-REQ-0010 records it with that caveat.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/com/sun/j2ee/blueprints/admin/client/DataSource.java
    description: >-
      Default report date range is hard-coded to 1/1/2001-12/31/2002 while the comments say the default start is
      1/12/2001 and the end is 'the present day', with a TODO to default to today in a released application. A human
      should confirm the intended default (likely the current date).
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/login.jsp
    description: >-
      The administrator sign-in form pre-fills user ID 'jps_admin' and password 'admin', and sun-j2ee-ri.xml carries
      a (redacted) JMS resource password. These are demo conveniences and a security exposure, not requirements;
      none was emitted. Confirm they must not carry into the rebuild.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/client/resources/petstore_de.properties
    description: >-
      The admin client ships English and German catalogues, while the localization capability lists English,
      Japanese and Chinese. Whether German is a supported admin locale, and whether Japanese/Chinese admin
      catalogues are expected, is unresolved from this module.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/apps/admin/src/admin/com/sun/j2ee/blueprints/admin/web/ApplRequestProcessor.java
    description: >-
      Report dates are sent from the client and parsed on the server as month/day/year with no timezone and no check
      that start <= end or whether the end date is inclusive; the inclusive/exclusive semantics live in the
      order-centre facade outside this shard and must be confirmed there.
