  - record_key: sign-on-BR-0002
    kind: business-rule
    capability_key: sign-on
    requirement: >-
      GIVEN a user submits the administrator sign-in form WHEN the credentials cannot be authenticated THEN the
      system SHALL show a sign-in error stating that the user could not be authenticated and asking them to check
      their username and password, with a link back to the sign-in page.
    confidence: medium
    confidence_basis: >-
      Single source: the declared form-error page and its static content. Behaviour is fully visible, but only in
      one place.
    risk_class: presentational
    basis: >-
      web.xml declares error.jsp as the form-error page; error.jsp renders 'Login Error' text and a link to
      /admin/AdminRequestProcessor, which triggers the sign-in form again.
    traces:
