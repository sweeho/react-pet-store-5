    kind: business-rule
    capability_key: order-approval
    requirement: >-
      GIVEN the administrator order-data service receives a request WHEN the request type is not one of order
      retrieval, status update, revenue report or order-count report, or the request cannot be parsed THEN the
      system SHALL return an error response naming the problem and asking the administrator to try again.
