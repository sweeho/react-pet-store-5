    kind: integration
    capability_key: order-approval
    requirement: >-
      WHEN the administrator submits status changes THEN the system SHALL convert them into an order-approval
      document listing each order identifier with its new status and hand it to the order centre asynchronously
      through the order-approval message queue, and SHALL report success to the administrator once the document has
      been queued. Orders in the submission lacking an identifier or a status SHALL be skipped.
    confidence: medium
    confidence_basis: >-
      Server conversion, sender call and queue binding are all visible in this module (code plus vendor descriptor);
      what the order centre then does with the document is outside this shard.
    risk_class: financial
    basis: >-
      ApplRequestProcessor.updateOrders builds an OrderApproval of ChangedOrder(orderId, orderStatus) for each Order
      element with non-null id and status, calls AdminRequestBD.updateOrders which sends oa.toXML() via AsyncSender,
      and returns Status SUCCESS. The AsyncSender queue reference resolves to jms/opc/OrderApprovalQueue.
