    requirement: >-
      The system SHALL represent an order for administrator review with: order identifier, customer user identifier,
      order date, order amount, and order status, where status is one of PENDING, APPROVED, DENIED or COMPLETED.
    confidence: medium
    confidence_basis: >-
      The same five fields appear in the server response builder and the client model; the status set is stated in
      constants and in the client parser. The status check in the model constructor is a no-op stub, so the set is
      not enforced.
    risk_class: financial
