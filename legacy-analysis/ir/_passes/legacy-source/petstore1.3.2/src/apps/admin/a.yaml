records:
  - record_key: sign-on-REQ-0001
    kind: requirement
    capability_key: sign-on
    requirement: >-
      The system SHALL restrict the administration console entry point (the page from which an administrator
      launches the order-management client or signs out) to authenticated users holding the administrator role, and
      SHALL authenticate them through a sign-in form (user ID and password) before granting access. GIVEN an
      unauthenticated user WHEN they request the administration console THEN the system SHALL present the
      administrator sign-in form instead.
    confidence: medium
    confidence_basis: >-
      Declared once in the web deployment descriptor and corroborated by the role declaration in the application
      descriptor and the vendor role mapping; no programmatic role check exists to make it two independent
      enforcement points, and the other pass has not been compared yet.
    risk_class: regulated
    basis: >-
      The security constraint covers GET and POST on the admin console request processor with an auth constraint of
      role 'administrator', form login with login.jsp and error.jsp. The vendor descriptor maps the administrator
      role to principal jps_admin and group administrator_group.
    traces:
      - path: legacy-source/petstore1.3.2/src/apps/admin/src/docroot/WEB-INF/web.xml
        line_start: 75
        line_end: 101
        excerpt: |2
            <security-constraint>
              <web-resource-collection>
                <web-resource-name>MySecureBit0</web-resource-name>
                <url-pattern>/AdminRequestProcessor</url-pattern>
                <http-method>GET</http-method>
                <http-method>POST</http-method>
              </web-resource-collection>
              <auth-constraint>
                <role-name>administrator</role-name>
              </auth-constraint>
              <user-data-constraint>
                <transport-guarantee>NONE</transport-guarantee>
              </user-data-constraint>
            </security-constraint>

            <login-config>
              <auth-method>FORM</auth-method>
              <realm-name>default</realm-name>
              <form-login-config>
                <form-login-page>/login.jsp</form-login-page>
                <form-error-page>/error.jsp</form-error-page>
              </form-login-config>
            </login-config>

            <security-role>
              <role-name>administrator</role-name>
            </security-role>
