  - record_key: sign-on-INT-0006
    kind: integration
    capability_key: sign-on
    requirement: >-
      WHEN a signed-in administrator chooses to launch the order-management client THEN the system SHALL deliver a
      client launch descriptor bound to the administrator's current authenticated session, so that the client's
      subsequent order and sales requests are made under that session without a second sign-in.
    confidence: medium
    confidence_basis: >-
      The behaviour is explicit in code on both sides (descriptor builder passes the session ID; client appends it
      to every request URL), but it is one mechanism in one module with no declarative statement.
    risk_class: operational
    basis: >-
      index.jsp posts currentScreen=manageorders; AdminRequestProcessor returns a launch descriptor whose arguments
      are the proxy class, server host, port and req.getSession().getId(). HttpPostPetStoreProxy.setup builds the
      data URL /admin/ApplRequestProcessor;jsessionid=<sessionID>.
