  - record_key: sign-on-REQ-0003
    kind: requirement
    capability_key: sign-on
    requirement: >-
      The system SHALL let a signed-in administrator sign out from the administration console, and signing out SHALL
      end the administrator's session and return them to the public admin landing page.
    confidence: medium
    confidence_basis: >-
      Two code points agree (dispatcher routes 'logout' to the logout page; logout page invalidates the session) but
      both are in one layer; no declarative statement.
    risk_class: operational
    basis: >-
      index.jsp posts currentScreen=logout; AdminRequestProcessor.doPost forwards 'logout' to logout.jsp, which
      calls request.getSession().invalidate() and includes index.html (the 'Click here to enter Admin' landing
      page).
