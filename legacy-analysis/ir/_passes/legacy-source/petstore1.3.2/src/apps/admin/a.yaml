  - record_key: sign-on-BR-0005
    kind: business-rule
    capability_key: sign-on
    requirement: >-
      GIVEN a request arrives at the administrator order-data service WHEN no session exists for the caller THEN the
      system SHALL NOT process the request and SHALL return an error telling the administrator the session has timed
      out and to exit and sign in again from the sign-in page.
    confidence: low
    confidence_basis: >-
      The check is present in code, but it only tests that a session exists, not that it belongs to an authenticated
      administrator, and the service is not covered by the declared security constraint; what access rule is
      actually intended is unresolved (see findings).
    risk_class: regulated
    basis: >-
      ApplRequestProcessor.doPost calls getSession(false) and, when null, writes an <Error>Session Timed Out; Please
      exit and login as admin from the login page</Error> response. The comment states the session implies the
      client was authorised by form-based login.
