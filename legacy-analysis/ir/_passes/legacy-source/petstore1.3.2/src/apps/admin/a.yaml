      ApplRequestProcessor.getOrders emits OrderId, UserId, OrderDate, OrderAmount, OrderStatus per order;
      PetStoreProxy.Order declares the four status constants and the same fields;
      HttpPostPetStoreProxy.parseOrderStatus maps any other value to null.
