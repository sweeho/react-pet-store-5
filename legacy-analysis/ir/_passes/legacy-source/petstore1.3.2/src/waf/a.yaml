records:
  - record_key: localization-requirement-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The system SHALL assign every new session a default locale when the session
      has no locale yet, and that default SHALL be US English (en_US) unless
      deployment configuration says otherwise.
    confidence: medium
    confidence_basis: >
      Declared in configuration and applied in code, so the behaviour is clear. Not
      high because this is the framework's own sample deployment descriptor; the
      storefront supplies its own default_locale value, which this pass did not
      compare. Only one pass so far.
    risk_class: presentational
    basis: >
      The front controller reads a default_locale init parameter and, on every
      request, stores it in the session when no locale is present. The WAF sample
      deployment descriptor sets it to en_US.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 108
        line_end: 113
        excerpt: |2
              private void doProcess(HttpServletRequest request, HttpServletResponse response)
                             throws IOException, ServletException {
                  // set the locale of the user to default if not set
                  if (request.getSession().getAttribute(WebKeys.LOCALE) == null) {
                      request.getSession().setAttribute(WebKeys.LOCALE, defaultLocale);
                  }
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/web.xml
        line_start: 56
        line_end: 60
        excerpt: |2
              <servlet-class>com.sun.j2ee.blueprints.waf.controller.web.MainServlet</servlet-class>
              <init-param>
                <param-name>default_locale</param-name>
                <param-value>en_US</param-value>
              </init-param>
    stack_metadata:
