      session.scope: com.sun.j2ee.blueprints.waf.LOCALE

  - record_key: localization-business-rule-0001
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL let a user change their locale by submitting a locale code
      of the form language_COUNTRY (for example ja_JP), and SHALL store the chosen
      locale for the rest of the session.
      GIVEN a locale value with no underscore separator (for example "ja")
      WHEN the user requests a locale change
      THEN the system SHALL reject the change with an error and SHALL leave the
      session locale unchanged.
      GIVEN the locale value "default" (any case)
      WHEN the user requests a locale change
      THEN the system SHALL use the server's default locale.
    confidence: medium
    confidence_basis: >
      Behaviour is read directly from the parsing and action code. The storefront
      maps this same action, so it is reachable. Not high because only code
      enforces the format (no declarative validator), and the rejection path ends
      in an exception whose user-facing screen depends on the host application's
      exception mappings.
    risk_class: presentational
    basis: >
      The change-locale action reads the "locale" request parameter and parses it
      with getLocaleFromString. That parser returns null when there is no '_',
      returns the JVM default for "default", and otherwise builds
      Locale(language, country). A null result makes the action throw
      HTMLActionException "Unable to change language to ...". Any segment after a
      second underscore (the variant) is folded into the country code, because
      variantIndex is never assigned. See the findings.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 70
        line_end: 84
        excerpt: |2
              public Event perform(HttpServletRequest request)
                  throws HTMLActionException {
                  // Extract attributes we will need
                  String localeString = request.getParameter("locale");
                  Locale locale = I18nUtil.getLocaleFromString(localeString);
                  //MessageResources messages = getResources();
                  HttpSession session = request.getSession();

                  if (locale != null) {
                      session.setAttribute(LOCALE,locale);
                      return new ChangeLocaleEvent(locale);
                  } else {
                      throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
                  }
              }
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 181
        excerpt: |2
              public static Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                      if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                      } else {
                          return null;
                      }
                  }
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 48
        line_end: 50
        excerpt: |2
              <url-mapping url="changelocale.do" screen="locale_change_success.screen" >
                  <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
             </url-mapping>
    stack_metadata:
      framework: WAF
      struts.action: com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction
      session.scope: com.sun.j2ee.blueprints.waf.LOCALE
      url: changelocale.do

