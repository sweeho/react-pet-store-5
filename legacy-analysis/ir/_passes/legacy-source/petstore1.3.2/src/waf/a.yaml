findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
    description: >
      The WAF sample event mapping (line 44) names
      com.sun.j2ee.blueprints.waf.event.events.ChangeLocaleEvent, but the class is
      com.sun.j2ee.blueprints.waf.event.impl.ChangeLocaleEvent. RequestProcessor
      looks mappings up by the event's real class name, so the WAF sample never
      invokes ChangeLocaleEJBAction and the back-end locale is never updated. The
      storefront's own mappings.xml uses the correct impl package. A human needs to
      confirm whether back-end locale propagation is a required behaviour (see
      localization-workflow-0001).
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
    description: >
      The WAF sample exception mapping (line 57) names
      com.sun.j2ee.blueprints.petstore.controller.exceptions.GeneralFailureException,
      while WAF's own class is com.sun.j2ee.blueprints.waf.exceptions.GeneralFailureException
      (thrown by DefaultComponentManager). In the stand-alone WAF sample the class
      cannot be loaded, so WAF's GeneralFailureException falls through to a generic
      ServletException rather than error.screen. Also, no "error" screen is defined in
      screendefinitions_en_US.xml.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
    description: >
      getLocaleFromString (lines 168-196) never assigns variantIndex. When a code
      has a second underscore (for example "ja_JP_TRAD"), country stays null and
      Locale(language, null) is built, which would throw at runtime. Codes like
      "en" with no country are rejected. A human should decide whether the rebuild
      must accept language-only or variant locale codes.
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/waf/src/docroot/changelocale.jsp
    description: >
      The WAF demo locale picker offers German (de_DE). The capability list names
      only English, Japanese and Chinese, and the WAF TemplateServlet loads only
      en_US screen definitions, so a de_DE request silently falls back to en_US
      content while the session records de_DE. Confirm whether German is ever in
      scope.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/handlers/ClientStateFlowHandler.java
    description: >
      Security. The locale-change flow deserializes Java objects from client-supplied
      Base64 hidden fields (lines 80-90) with no integrity check, and takes the
      next screen from the client-supplied "referring_screen" parameter. The
      storefront maps its changelocale.do to this handler. This is unsafe
      deserialization and client-controlled forward-target handling. The rebuild
      must restore the previous page without trusting client-serialized state; a
      human should confirm no other behaviour depends on round-tripping request
      attributes through the client.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/xml/requestmappings.xml
    description: >
      WEB-INF/xml/requestmappings.xml and WEB-INF/xml/screendefinitions.xml use an
      older schema (request-handler-class, requiresSignin, signin-screen, petstore
      .control.* handlers). No WAF code reads these paths: MainServlet and
      ScreenFlowManager read /WEB-INF/mappings.xml, and TemplateServlet reads
      /WEB-INF/screendefinitions_<locale>.xml. They appear to be dead leftovers from
      an earlier Pet Store version, so no requirements were emitted from them. Their
      sign-in-required URL list (editaccount, placeorder, commitorder, and so on) may
      still be useful to compare against the sign-on capability.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/ClientStateTag.java
    description: >
      setEncodeRequestParameters (lines 111-113) assigns encodeRequestAttributes
      instead of encodeRequestParameters, so pages cannot turn off parameter
      re-posting, and setting the flag toggles attribute serialization instead.
      Whether any page depends on this behaviour is not determinable here.
