  - record_key: localization-workflow-0002
    kind: workflow
    capability_key: localization
    requirement: >
      WHEN a user changes locale from any page, the system SHALL return the user to
      the page they came from, re-rendered in the new locale, with that page's
      request state restored.
    confidence: medium
    confidence_basis: >
      The flow handler code is clear, and the storefront maps its changelocale.do
      to this same handler, so it is reachable. Not high because the referring
      screen comes from a hidden form field that the client supplies, and only one
      pass exists.
    risk_class: presentational
    basis: >
      ClientStateFlowHandler returns the "referring_screen" request parameter as the
      next screen. It restores request attributes by decoding each
      "<cacheId>_attribute_*" parameter. ClientStateTag writes the previous screen
      and the serialized request attributes into hidden fields.
    traces:
