  - record_key: checkout-workflow-0001
    kind: workflow
    capability_key: checkout
    requirement: >
      WHEN processing a user request raises an error, the system SHALL show the
      error page configured for that error type or its nearest configured parent
      type. WHEN no error page is configured for it, the system SHALL fail the
      request with a generic server error.
    confidence: medium
    confidence_basis: >
      The mechanism is clear in code. The storefront relies on it for the
      empty-cart order rejection screen, so it is reachable. Filed under checkout
      only as the closest capability (see basis). The WAF sample's single mapping
      names a class that does not exist in WAF (see findings).
    risk_class: operational
    basis: >
      MainServlet catches any Throwable from request processing and asks
      ScreenFlowManager for a screen. The lookup matches configured exception
      classes by isAssignableFrom (so subclasses match), puts the exception in the
      request as javax.servlet.jsp.jspException and forwards. When nothing matches
      it throws ServletException "unknown exception". This is a cross-cutting
      mechanism. It is filed under checkout because the storefront's empty-cart
      order rejection is delivered through it; no capability covers generic error
      handling.
    traces:
