      framework: WAF
      disputed: true
      reachability: unresolved

  - record_key: localization-business-rule-0004
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL accept Japanese text submitted in Shift-JIS or JIS encoding
      and convert it to Unicode by automatic encoding detection.
    confidence: low
    confidence_basis: >
      No caller found outside the WAF module; reachability is unresolved.
    risk_class: presentational
    basis: >
      I18nUtil.convertJISEncoding re-reads the characters as bytes and decodes them
      with the "JISAutoDetect" charset. An unsupported encoding is silently
      swallowed and null is returned.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 63
        line_end: 77
        excerpt: |2
              public static String convertJISEncoding(String target) {
                  ByteArrayOutputStream bos = new ByteArrayOutputStream();
                  if (target == null) return null;
                  String paramString = target.trim();

                  for (int loop =0; loop < paramString.length(); loop++) {
                      int i = (int)paramString.charAt(loop);
                      bos.write(i);
                  }
                  String convertedString = null;
                  try {
                      convertedString =  new String(bos.toByteArray(), "JISAutoDetect");
                  } catch (java.io.UnsupportedEncodingException uex) {}
                  return convertedString;
              }
    stack_metadata:
      framework: WAF
      disputed: true
      reachability: unresolved

  - record_key: customer-account-business-rule-0001
