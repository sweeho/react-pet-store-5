      tokens.
    confidence: low
    confidence_basis: >
      A utility with no caller found outside the WAF module, so reachability is
      unresolved. The catalog search may tokenise keywords itself in a module this
      pass did not read.
    risk_class: presentational
    basis: >
      I18nUtil.parseKeywords(String, Locale) walks a locale-specific word
      BreakIterator and keeps each non-blank segment.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 136
        line_end: 150
        excerpt: |2
              public static Vector parseKeywords(String keywordString, Locale locale){
                  if (keywordString != null){
                      Vector keywords = new Vector();
                      BreakIterator breakIt = BreakIterator.getWordInstance(locale);
                      int index=0;
                      int previousIndex =0;
                      breakIt.setText(keywordString);
                      try{
                          while(index < keywordString.length()){
                              previousIndex = index;
                              index = breakIt.next();
                              String word = keywordString.substring(previousIndex, index);
                              if (!word.trim().equals("")) keywords.addElement(word);
                          }
                          return keywords;
