      struts.action: ChangeLocaleHTMLAction (changelocale.do)
      ejb.bean: EJBController / ChangeLocaleEJBAction
      event: com.sun.j2ee.blueprints.waf.event.impl.ChangeLocaleEvent
      session.scope: com.sun.j2ee.blueprints.waf.LOCALE

  - record_key: LOCALIZATION-BUSINESS-RULE-0004
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL render each screen using the screen definition for the visitor's
      locale, resolved in this order: a locale given explicitly on the request (for that
      request only), otherwise the session locale.
      GIVEN a resolved locale for which no screen definitions are installed WHEN a screen is
      rendered THEN the default locale's definitions SHALL be used.
      GIVEN a screen not defined for the resolved locale WHEN it is rendered THEN the
      default locale's definition of that screen SHALL be used.
      GIVEN a screen defined in neither WHEN it is requested THEN the system SHALL show
      "Error: Definition for screen <name> not found".
      The storefront SHALL install screen definitions for en_US, ja_JP and zh_CN with en_US
      as the default.
    confidence: medium
    confidence_basis: >
      The resolution order and both fall-backs are explicit statements in one class; the
      supported-locale list and default are declared in the storefront deployment descriptor,
      so value and mechanism come from two places that agree. Held at medium because the
      explicit request override is not written back to the session (the precedence is clear,
      the persistence intent is not) and only one pass is visible to me.
    risk_class: presentational
    basis: >
      TemplateServlet.process prefers the "locale" request parameter over the session LOCALE,
      falls back to defaultLocale when allScreens has no entry, falls back per screen to the
      default-locale Screens, and prints an error when still not found. init loads one
      screendefinitions_<locale>.xml per entry in the comma-separated "locales" parameter.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 157
        line_end: 166
        excerpt: |
          String languageParam = request.getParameter("locale");
          // The language when specified as a parameter overrides the language set in the session
          if (languageParam != null) {
              localeString = languageParam;
          } else if (request.getSession().getAttribute(WebKeys.LOCALE) != null) {
              localeString = ((Locale)request.getSession().getAttribute(WebKeys.LOCALE)).toString();
          }
          if (allScreens.get(localeString) == null) {
             localeString = defaultLocale;
          }
      - path: legacy-source/petstore1.3.2/src/waf/src/view/template/com/sun/j2ee/blueprints/waf/view/template/TemplateServlet.java
        line_start: 234
        line_end: 252
        excerpt: |
          Screens localeScreens = (Screens)allScreens.get(localeString);
          if (localeScreens != null) screen = (Screen)localeScreens.getScreen(screenName);
          // default to the default locale screen if it was not defined in the locale specific definitions
          if (screen == null) {
              System.err.println("Screen not Found loading default from " + defaultLocale);
              localeScreens = (Screens)allScreens.get(defaultLocale);
              screen = (Screen)localeScreens.getScreen(screenName);
          }
          if (screen != null) {
              request.setAttribute(WebKeys.CURRENT_SCREEN, screen);
              String templateName = localeScreens.getTemplate(screenName);
              if (templateName != null) {
                  insertTemplate(request, response, templateName);
              }
          } else {
              response.setContentType("text/html;charset=8859_1");
              PrintWriter out = response.getWriter();
              out.println("<font size=+4>Error:</font><br>Definition for screen " + screenName + " not found");
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/WEB-INF/web.xml
        line_start: 108
        line_end: 115
        excerpt: |
          <init-param>
