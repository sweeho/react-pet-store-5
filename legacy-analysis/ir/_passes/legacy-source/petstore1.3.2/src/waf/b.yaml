  - record_key: CHECKOUT-BUSINESS-RULE-0003
    kind: business-rule
    capability_key: checkout
    requirement: >
      The system SHALL attempt to render each screen within a single transaction so that all
      data read while producing the page is read consistently; if a transaction cannot be
      started the page SHALL still be rendered without one, and a failure to commit SHALL NOT
      prevent the page from being delivered.
    confidence: low
    confidence_basis: >
