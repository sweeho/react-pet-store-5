  - record_key: CHECKOUT-WORKFLOW-0001
    kind: workflow
    capability_key: checkout
    requirement: >
      The system SHALL route a failed request to an error screen chosen by the kind of
      failure, where a configured failure kind also covers all of its more specific kinds.
      The storefront SHALL show a dedicated screen when an order is placed with an empty
      cart, a dedicated screen when account creation hits a duplicate account, and a
      general error screen for general failures.
      GIVEN a failure whose kind matches no configured entry WHEN it occurs THEN the request
      SHALL fail with a generic server error naming the failure kind.
    confidence: medium
    confidence_basis: >
      The routing mechanism is in the framework and the concrete failure-to-screen table is
      declared in the storefront configuration; the two agree. Medium rather than high
      because only one pass is visible and because precedence between two matching entries
      is not deterministic in the code (see findings). Filed under checkout because the
      empty-cart rejection is the most business-significant consumer; the mechanism is
      cross-cutting and also serves sign-on (duplicate account).
    risk_class: operational
    basis: >
      MainServlet.doProcess catches any Throwable, asks ScreenFlowManager.getExceptionScreen
      which returns the mapped screen for the first configured exception class assignable
      from the thrown one, stores the exception on the request, and forwards; with no match
      it throws ServletException("MainServlet: unknown exception: <class>").
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 117
        line_end: 128
        excerpt: |2
                  } catch (Throwable ex) {
                      String className = ex.getClass().getName();
                      String nextScreen = getScreenFlowManager().getExceptionScreen(ex);
                      // put the exception in the request
                      request.setAttribute("javax.servlet.jsp.jspException", ex);
                      if (nextScreen == null) {
                          // send to general error screen
                          ex.printStackTrace();
                          throw new ServletException("MainServlet: unknown exception: " + className);
                      }
                      context.getRequestDispatcher(nextScreen).forward(request, response);
                }
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java
        line_start: 164
        line_end: 183
        excerpt: |
          public String getExceptionScreen(Throwable e) {
              Iterator it = exceptionMappings.keySet().iterator();
              while (it.hasNext()) {
                  String exceptionName = (String)it.next();
                  Class targetExceptionClass = null;
                  try {
                      targetExceptionClass = this.getClass().getClassLoader().loadClass(exceptionName);
                  } catch (ClassNotFoundException cnfe) {
                      System.err.println("ScreenFlowManager: Could not load exception " + exceptionName);
                  }
                  System.err.println("Checking exception: " + exceptionName + " against " + e.getClass().getName());
                  // check if the exception is a sub class of matches the exception
                  if ((targetExceptionClass != null) &&
                      targetExceptionClass.isAssignableFrom(e.getClass())) {
                      System.err.println("ScreenFlowManager: found exception for " + exceptionName + " matches");;
                      return "/" + (String)exceptionMappings.get(exceptionName);
                  }
              }
              return null;
          }
