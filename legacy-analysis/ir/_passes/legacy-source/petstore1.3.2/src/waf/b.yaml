  - record_key: LOCALIZATION-BUSINESS-RULE-0002
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL interpret a locale identifier as "<language>_<COUNTRY>" (for example
      en_US, ja_JP, zh_CN), and SHALL treat the identifier "default" (case-insensitive) as
      the server's own default locale.
      GIVEN a locale identifier with no "_" separator (for example "en") WHEN it is
      interpreted THEN it is rejected as not a locale.
      GIVEN no locale identifier WHEN it is interpreted THEN no locale results.
      The same interpretation SHALL apply to the configured default locale, to a customer's
      locale-change request, and to a customer's stored preferred language.
    confidence: medium
    confidence_basis: >
      The parsing code is explicit and has three independent callers outside this module
      (sign-on, sign-on notification and profile update read the stored preferred language
      through it), so the format is load-bearing. Not high: the parser has defects (variant
      never parsed; a three-part identifier produces a missing country) that make its
      behaviour beyond the two-part form unclear, raised as a finding rather than encoded here.
    risk_class: presentational
    basis: >
      I18nUtil.getLocaleFromString returns null for null input, Locale.getDefault() for
      "default", null when there is no underscore, and otherwise new Locale(language, country).
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 181
        excerpt: |
          public static Locale getLocaleFromString(String localeString) {
              if (localeString == null) return null;
              if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
              int languageIndex = localeString.indexOf('_');
              if (languageIndex  == -1) return null;
              int countryIndex = localeString.indexOf('_', languageIndex +1);
              String country = null;
              if (countryIndex  == -1) {
                  if (localeString.length() > languageIndex) {
                      country = localeString.substring(languageIndex +1, localeString.length());
                  } else {
                      return null;
                  }
              }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 87
        line_end: 87
        excerpt: |
          Locale locale = I18nUtil.getLocaleFromString(profile.getPreferredLanguage());
    stack_metadata:
      framework: WAF
      helper: com.sun.j2ee.blueprints.waf.util.I18nUtil#getLocaleFromString

  - record_key: LOCALIZATION-WORKFLOW-0003
    kind: workflow
    capability_key: localization
    requirement: >
      The system SHALL let a visitor change their locale by submitting a locale identifier.
      WHEN the identifier is valid THEN the visitor's session locale SHALL be replaced by it
      and the change SHALL be propagated to the visitor's server-side business state, after
      which the visitor is shown a locale-change confirmation screen.
      GIVEN an identifier that cannot be interpreted as a locale WHEN the change is requested
      THEN the session locale SHALL be left unchanged and the request SHALL fail with the
      error "Unable to change language to <identifier>".
    confidence: medium
    confidence_basis: >
      The web action, the event it emits and the business-tier handler are all present and
      consistent, and the storefront maps the same event to its own handler. Not high: the
      framework's own URL/event mapping for this flow names an event class that does not
      exist (see findings), so the framework-level wiring as shipped is broken; the
      confirmation screen name comes from the framework demo mapping only.
    risk_class: presentational
    basis: >
      ChangeLocaleHTMLAction reads the "locale" request parameter, stores the parsed Locale
      in the session and returns a ChangeLocaleEvent, otherwise throws HTMLActionException.
      ChangeLocaleEJBAction stores the locale in the per-session state machine. The demo
      mappings.xml maps changelocale.do to locale_change_success.screen.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 73
        line_end: 83
        excerpt: |
          String localeString = request.getParameter("locale");
          Locale locale = I18nUtil.getLocaleFromString(localeString);
          //MessageResources messages = getResources();
          HttpSession session = request.getSession();

          if (locale != null) {
              session.setAttribute(LOCALE,locale);
              return new ChangeLocaleEvent(locale);
          } else {
              throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
          }
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/ejb/action/actions/ChangeLocaleEJBAction.java
        line_start: 52
        line_end: 56
        excerpt: |
          public EventResponse perform(Event e) throws EventException {
              ChangeLocaleEvent ce = (ChangeLocaleEvent)e;
              machine.setAttribute("locale", ce.getLocale());
              return null;
          }
      - path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
        line_start: 48
        line_end: 50
        excerpt: |2
              <url-mapping url="changelocale.do" screen="locale_change_success.screen" >
                  <web-action-class>com.sun.j2ee.blueprints.waf.controller.web.action.actions.ChangeLocaleHTMLAction</web-action-class>
             </url-mapping>
    stack_metadata:
