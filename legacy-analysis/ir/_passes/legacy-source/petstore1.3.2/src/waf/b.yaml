  - record_key: CHECKOUT-WORKFLOW-0002
    kind: workflow
    capability_key: checkout
    requirement: >
      The system SHALL process each user action as: resolve the action from the last path
      segment of the requested address; let the action turn the request into a business
      event; apply the event to the visitor's own server-side business state inside a single
      transaction; then select the next screen, either fixed for that address or chosen from
      the outcome of a flow decision.
      GIVEN an address with a flow decision WHEN the decision's outcome names no configured
      screen THEN the outcome itself SHALL be used as the next screen.
    confidence: medium
    confidence_basis: >
      Declared (transaction attribute on the event-processing method) and programmatic
      (request processor, state machine, screen flow manager) sources agree. Not high: only
      one pass is visible, and failure paths inside flow selection are swallowed rather than
      reported (see findings). Filed under checkout as closest capability: this is the
      request pipeline through which order placement, cart and sign-on events all flow;
      no cross-cutting key exists.
    risk_class: operational
    basis: >
      RequestProcessor.processRequest maps the URI's last segment to a URLMapping, runs the
      HTMLAction, attaches the EJB action class from the event mapping, and hands the event to
      the per-session WebController -> EJBController. ejb-jar.xml marks processEvent
      Required. ScreenFlowManager.forwardToNextScreen uses the mapped screen or the flow
      handler result.
