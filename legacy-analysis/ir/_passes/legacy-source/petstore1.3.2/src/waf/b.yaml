records:
  - record_key: LOCALIZATION-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: localization
    requirement: >
      The system SHALL assign every visitor session a default locale when the session has
      no locale yet, before any request is processed. The default locale SHALL be a
      deployment setting; the storefront deployment sets it to English (United States).
      GIVEN a new session with no locale WHEN any action request arrives THEN the session
      locale is set to the configured default and the request continues.
    confidence: medium
    confidence_basis: >
      The defaulting logic is a single, unconditional statement in the front controller
      and the configured value is visible in both the framework demo deployment descriptor
      and the storefront deployment descriptor. Not high: this pass cannot see pass A, and
      the rule is enforced in only one code path (the screen renderer applies its own,
      separate default without writing it to the session; see LOCALIZATION-BUSINESS-RULE-0004).
    risk_class: presentational
    basis: >
      MainServlet.init reads the default_locale init parameter and parses it; doProcess
      writes it into the session under the LOCALE key when absent. Both web.xml files set
      default_locale to en_US.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 79
        line_end: 81
        excerpt: |
          public void init(ServletConfig config) throws ServletException {
              String defaultLocaleString = config.getInitParameter("default_locale");
              defaultLocale = I18nUtil.getLocaleFromString(defaultLocaleString);
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/MainServlet.java
        line_start: 110
        line_end: 113
