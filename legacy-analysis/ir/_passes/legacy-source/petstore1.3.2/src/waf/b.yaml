  - record_key: CATALOG-BROWSING-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: catalog-browsing
    requirement: >
      The system SHALL be able to reuse a rendered page fragment for a configured time
      window instead of regenerating it. A cached fragment SHALL be identified by the full
      request address, the fragment name and the query string, and SHALL be regenerated once
      the time elapsed since it was produced exceeds its window. The storefront's category
      and product listings are cached application-wide (shared by all visitors) for
      300000 ms (5 minutes).
    confidence: low
    confidence_basis: >
      The expiry and keying mechanism is clear in the tag implementation, but the
      5-minute window is a bare literal in the storefront pages with no comment,
      configuration or test, and whether shared caching of catalog content across locales
      and visitors is intended cannot be established (see findings). Rubric requires low
      for an unexplained literal.
    risk_class: operational
    basis: >
      CacheTag.doStartTag skips the body when a non-expired Entry exists under
      URL#name?query in the chosen scope; Entry.isExpired compares elapsed ms to duration.
      category.jsp and product.jsp wrap their content in waf:cache scope="context"
      duration="300000".
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CacheTag.java
        line_start: 65
        line_end: 80
        excerpt: |
          public int doStartTag() throws JspTagException {
              entry = getEntry();
              if ((entry != null) && entry.isExpired()) {
                  entry = null;
                  removeEntry();
              }
              return (entry == null) ? EVAL_BODY_BUFFERED : SKIP_BODY;
          }

          private String getKey() {
                  HttpServletRequest req =
                  ((HttpServletRequest) pageContext.getRequest());
                  return  (req.getRequestURL().toString()
                                  + '#' + name
                                  + '?' + req.getQueryString());
          }
      - path: legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CacheTag.java
        line_start: 169
        line_end: 172
        excerpt: |
          public boolean isExpired() {
              long currentTime = System.currentTimeMillis();
              return ((currentTime - timestamp) > duration);
          }
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/category.jsp
        line_start: 47
        line_end: 47
        excerpt: |
          <waf:cache name="page" scope="context" duration="300000">
      - path: legacy-source/petstore1.3.2/src/apps/petstore/src/docroot/product.jsp
        line_start: 48
        line_end: 48
        excerpt: |
          <waf:cache name="product_en_US" scope="context" duration="300000">
    stack_metadata:
      framework: WAF smart tags
      jsp.tag: waf:cache (CacheTag)
      cache.scope: context (application)

  - record_key: SIGN-ON-BUSINESS-RULE-0001
    kind: business-rule
    capability_key: sign-on
    requirement: >
      The system SHALL prevent submission of a form while any field marked as required is
      empty, informing the user with the message "<field name> is empty." for each empty
      required field. GIVEN one or more required fields are empty WHEN the user submits
      THEN the form is not submitted and one message per empty field is shown.
    confidence: medium
    confidence_basis: >
      The generated check is explicit, and its use on the sign-on and new-customer forms
      (and on the order-entry form) is visible in the storefront pages. Medium, not high:
      the check is client-side only; no server-side counterpart exists in this module, so
      the rule is enforced in one place and can be bypassed. Filed under sign-on because
      the sign-on page is the principal user; the same mechanism also guards checkout's
      order-information form (closest-capability choice, no cross-cutting "form validation"
      key exists).
    risk_class: operational
    basis: >
      InputTag registers a field with its enclosing FormTag when a validation attribute is
      present; FormTag emits a validate_<form>() script that alerts "<field> is empty." for
      each registered field whose value is "" and wires it to onSubmit.
