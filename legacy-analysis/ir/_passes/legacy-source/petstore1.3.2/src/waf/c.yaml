  - record_key: localization-workflow-0005
    kind: workflow
    capability_key: localization
    requirement: >-
      The system SHALL return the user to the screen they were viewing after a locale change, re-displayed in
      the new locale with that screen's request data restored, rather than to a fixed landing screen.
    confidence: medium
    confidence_basis: >-
      The WAF flow handler and the petstore URL mapping that binds it to changelocale.do agree. The
      state-restoring half depends on a page-embedded client-state form whose use on petstore pages I did not
      verify in this shard.
    risk_class: presentational
    basis: >-
      In petstore, changelocale.do uses the client-state flow handler. That handler forwards to the
      'referring_screen' request parameter and restores request attributes that the client-state form
      serialized into hidden '<cacheId>_attribute_<name>' fields. The form records the session's previous
      screen as referring_screen.
    traces:
      - path: >-
          legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/handlers/ClientStateFlowHandler.java
        line_start: 66
        line_end: 101
        excerpt: |2
              public String processFlow(HttpServletRequest request)
                  throws FlowHandlerException {


                  String forwardScreen = request.getParameter("referring_screen");
                  // de-serialize the request attributes.
                  Map params = (Map)request.getParameterMap();
                  HashMap newParams = new HashMap();
                  String cacheId= request.getParameter("cacheId");
                  if (!params.isEmpty()) {
                      Iterator it = params.keySet().iterator();
                      // put the request attributes stored in the session in the request
                      while (it.hasNext()) {
                          String key = (String)it.next();
                          if (key.startsWith(cacheId + "_attribute_")) {
                              String[] values = (String[])params.get(key);
                              String valueString = values[0];
                              byte[] bytes  = Base64.decode(valueString.getBytes());
                              try {
                                  ObjectInputStream ois = new ObjectInputStream(new ByteArrayInputStream(bytes));
                                  Object requestObject = requestObject = ois.readObject();
                                  ois.close();
                                  // put the de-serialized object back into the request
                                  String requestObjectKey = key.substring((cacheId + "_attribute_").length(), key.length());
                                  request.setAttribute(requestObjectKey, requestObject);
                              } catch (java.io.OptionalDataException ode) {
                                  System.err.println("ClientCacheLinkFlowHandler caught: " + ode);
                              } catch (java.lang.ClassNotFoundException cnfe) {
                                  System.err.println("ClientCacheLinkFlowHandler caught: " + cnfe);
                              } catch (java.io.IOException iox) {
                                  System.err.println("ClientCacheLinkFlowHandler caught: " + iox);
                              }
                          }
                      }
                  }
                  return forwardScreen;
