  - record_key: localization-requirement-0001
    kind: requirement
    capability_key: localization
    requirement: >-
      The system SHALL assign every new visitor session the configured default locale (en_US) when no locale
      has yet been chosen for that session.
    confidence: medium
    confidence_basis: >-
      Enforced in one code path and declared in one configuration value (declarative + programmatic), but the
      petstore application re-declares the value in its own deployment descriptor, and I cannot see whether
      the earlier passes agree, so high is not justified.
    risk_class: operational
    basis: >-
      The front controller reads the default_locale init parameter at startup and, on every request, stores it
      in the session when no session locale exists. The WAF descriptor sets it to en_US and the petstore
      descriptor sets the same value.
    traces:
