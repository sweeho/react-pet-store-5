  - record_key: localization-business-rule-0003
    kind: business-rule
    capability_key: localization
    requirement: >-
      The system SHALL interpret a locale code as follows. GIVEN the code 'default' (any case) THEN the
      server's own default locale SHALL be used. GIVEN a code with no underscore (for example 'en') THEN the
      code SHALL be treated as invalid. GIVEN a code language_COUNTRY THEN the language and country SHALL be
      taken from the two parts. GIVEN a code with a third variant part (language_COUNTRY_VARIANT) THEN the
      observed legacy behaviour does not yield a usable locale (see findings) and the rebuild SHALL NOT rely
      on it.
    confidence: low
    confidence_basis: >-
      The parsing rules are only implicit in string-index code with no comment, test or configuration. The
      variant branch cannot run because variantIndex is never assigned, and the three-part case leaves country
      null. Whether that is intended cannot be told from the source.
    risk_class: operational
    basis: >-
      The locale parser returns null for null input and for input without '_', returns Locale.getDefault() for
      'default', and otherwise builds Locale(language, country). The same parser is used for the startup
      default, the locale-change action and, in petstore, for the customer's preferred language at sign-on.
    traces:
      - path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
        line_start: 168
        line_end: 196
        excerpt: |2
              public static Locale getLocaleFromString(String localeString) {
                  if (localeString == null) return null;
                  if (localeString.toLowerCase().equals("default")) return Locale.getDefault();
                  int languageIndex = localeString.indexOf('_');
                  if (languageIndex  == -1) return null;
                  int countryIndex = localeString.indexOf('_', languageIndex +1);
                  String country = null;
                  if (countryIndex  == -1) {
                      if (localeString.length() > languageIndex) {
                          country = localeString.substring(languageIndex +1, localeString.length());
                      } else {
                          return null;
                      }
                  }
                  int variantIndex = -1;
                  if (countryIndex != -1) countryIndex = localeString.indexOf('_', countryIndex +1);
                  String language = localeString.substring(0, languageIndex);
                  String variant = null;
                  if (variantIndex  != -1) {

                      variant = localeString.substring(variantIndex +1, localeString.length());
                  }
                  if (variant != null) {
                      return new Locale(language, country, variant);
                  } else {
                      return new Locale(language, country);
                  }

              }
      - path: >-
          legacy-source/petstore1.3.2/src/apps/petstore/src/com/sun/j2ee/blueprints/petstore/controller/ejb/actions/SignOnEJBAction.java
        line_start: 87
        line_end: 87
