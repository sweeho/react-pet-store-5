  - record_key: localization-business-rule-0002
    kind: business-rule
    capability_key: localization
    requirement: >-
      The system SHALL let a user change the session locale by submitting a locale code of the form
      language_COUNTRY; GIVEN a locale code that cannot be parsed WHEN the change is submitted THEN the system
      SHALL reject it with an error and leave the session locale unchanged.
    confidence: medium
    confidence_basis: >-
      Single source (one action class) for both the success and the rejection path; reachability into the
      petstore is confirmed through petstore mappings.xml. Not two independent enforcement points, so not
      high.
    risk_class: operational
    basis: >-
      The change-locale action reads the 'locale' request parameter, converts it to a Locale, stores it in the
      session and raises an event to the business tier. A null parse result throws an action exception
      carrying 'Unable to change language to <value>' before any session write.
    traces:
      - path: >-
          legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/action/actions/ChangeLocaleHTMLAction.java
        line_start: 70
        line_end: 84
        excerpt: |2
              public Event perform(HttpServletRequest request)
                  throws HTMLActionException {
                  // Extract attributes we will need
                  String localeString = request.getParameter("locale");
                  Locale locale = I18nUtil.getLocaleFromString(localeString);
                  //MessageResources messages = getResources();
                  HttpSession session = request.getSession();

                  if (locale != null) {
                      session.setAttribute(LOCALE,locale);
                      return new ChangeLocaleEvent(locale);
                  } else {
                      throw new HTMLActionException("ChangeLocaleAction: Unable to change language to " + localeString);
                  }
              }
