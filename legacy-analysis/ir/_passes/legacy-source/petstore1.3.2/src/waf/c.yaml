findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/src/waf/src/docroot/WEB-INF/mappings.xml
    description: >-
      The WAF sample event-mapping names com.sun.j2ee.blueprints.waf.event.events.ChangeLocaleEvent, but the
      class is in package ...waf.event.impl. The request processor matches on the exact class name, so in the
      sample the business-tier locale action is never selected. The petstore mappings.xml uses the correct
      .impl name. A human should confirm this is a sample-only defect and does not reflect intended behaviour.
  - kind: conflict
    path: >-
      legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/DefaultComponentManager.java
    description: >-
      getEJBController (lines 96-108) creates a new stateful controller when none is in the session, but never
      stores it in the session. Every event therefore goes to a fresh bean, and state such as the locale saved
      by the change-locale business action is lost, contrary to the class comment about a per-session
      controller. PetstoreComponentManager inherits this method. Decide whether business-tier per-user state
      is required behaviour.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
    description: >-
      getLocaleFromString never assigns variantIndex, so a variant is never parsed. For a three-part code the
      country stays null and new Locale(language, null) throws NullPointerException. It is unclear whether
      variants were ever meant to be supported. The rebuild needs a decision on accepted locale-code formats.
      The same parser is used for customer preferred language at sign-on.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java
    description: >-
      forwardToNextScreen initialises currentScreen to "", so the 'Screen not found' error (line 153) never
      fires for an unmapped *.do URL; the request is forwarded to '/'. If a flow handler fails to load, the
      exception is swallowed with the same result. The intended behaviour for an unknown action URL (error vs
      home) needs a human decision.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/ScreenFlowManager.java
    description: >-
      Unhandled exceptions are routed to a configured error screen by exception type, including subclasses
      (lines 164-183, MainServlet 117-127); unmapped exceptions become a generic server error. No capability
      in capabilities.csv covers cross-cutting error handling, so no record was filed. The WAF sample maps a
      petstore-package exception class (mappings.xml line 57) that is not in this module. A human should
      decide which capability owns error-screen behaviour.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/controller/web/flow/handlers/ClientStateFlowHandler.java
    description: >-
      Deserializes arbitrary Java objects from client-supplied Base64 request parameters
      (ObjectInputStream.readObject, line 86) and forwards to a client-supplied 'referring_screen' (line 70).
      Petstore reaches this on changelocale.do. The rebuild must not reproduce this. Keep client-side state as
      plain data and validate the return screen against known screens. Flagged for security review.
  - kind: ambiguity
    path: >-
      legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CheckboxTag.java
    description: >-
      The checkbox tag writes the 'checked' attribute when checked is false (line 82), and
      ClientStateTag.setEncodeRequestParameters sets encodeRequestAttributes instead (line 112). Both look
      like defects. The HTML-generating tags (Input, Select, Checkbox, ClientState, Form) also emit attribute
      values without escaping. Check whether any petstore screen depends on the inverted checkbox behaviour.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/FormTag.java
    description: >-
      The form tag generates client-side validation that alerts '<field> is empty.' and blocks submit for
      every nested input carrying a validation attribute (lines 87-111; InputTag 82-84). This is a generic
      required-field mechanism. The fields it applies to are declared in petstore JSPs outside this shard, so
      no record was filed here.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/controller/com/sun/j2ee/blueprints/waf/util/I18nUtil.java
    description: >-
      formatCurrency/formatNumber (fixed min/max fraction digits per locale) and parseKeywords (locale-aware
      word-break keyword split for search) have no caller anywhere in the petstore1.3.2 tree outside this
      class. I treated them as unreachable and emitted no record. If a caller exists outside the source tree
      (for example in a JSP compiled elsewhere), currency precision and search tokenisation rules live here.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/src/waf/src/view/taglibs/com/sun/j2ee/blueprints/taglibs/smart/CacheTag.java
    description: >-
