  - record_key: localization-requirement-0004
    kind: requirement
    capability_key: localization
    requirement: >-
      The system SHALL render each screen using the screen definition for the requested locale, where a
      'locale' request parameter overrides the session locale. GIVEN a locale for which no screen definitions
      are loaded WHEN a screen is requested THEN the default locale's definitions SHALL be used. GIVEN a
      screen that is not defined for the chosen locale THEN the default locale's definition of that screen
      SHALL be used. GIVEN a screen defined in neither THEN an error stating the screen definition was not
      found SHALL be shown.
    confidence: medium
    confidence_basis: >-
      One programmatic source that is directly configured by the locales/default_locale init parameters in
      both the WAF and petstore descriptors. The fallback ordering is explicit in code. Only one enforcement
      layer, so medium.
    risk_class: presentational
    basis: >-
      The template servlet loads one screen-definition file per configured locale. When processing a request
      it takes the locale from the request parameter first, then from the session, and falls back to
      default_locale when no definitions exist for that locale. It then looks up the screen, retries in the
      default locale's definitions, and writes a 'Definition for screen X not found' message if the screen is
      still missing. Petstore configures locales en_US, ja_JP and zh_CN.
