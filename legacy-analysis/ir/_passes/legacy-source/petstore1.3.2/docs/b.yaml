records:
  - record_key: order-approval-RULE-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve, without administrator review, an order whose total value does not exceed the auto-approval threshold of 500 US dollars. GIVEN an order totalling less than $500 WHEN it is received by order processing THEN it SHALL be approved automatically and SHALL NOT appear among pending orders.
    confidence: medium
    confidence_basis: >
      The threshold value is stated consistently in three places in the English usage guide, but documentation is a single, non-executable source; no code or configuration was read in this shard, so the enforcing layer and the exact boundary (exactly $500) cannot be confirmed here. Not high because only one source class is visible; not low because the value is stated explicitly and repeatedly rather than being an uncommented literal.
    risk_class: financial
    basis: >
      using.html states that an order under $500 is approved automatically by the OPC and that all orders under $500 are automatically approved, and that an order appears as pending only when its total value is greater than $500. The docs give one threshold with no locale qualification; the capability list says thresholds vary by locale, which the docs neither confirm nor deny (see findings).
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 201
        line_end: 202
        excerpt: |2-
          <p>When you complete the order, the Storefront sends the order info asyncronously 
           to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 219
        line_end: 222
        excerpt: |2-
          <p>When the client appears, you will see two panes for displaying pending 
           and non-pending orders. The bulldog order from the previous section would 
           be non-pending, because it was less than $500, and all orders under $500 
          are automatically approved.<br>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 239
        line_end: 240
        excerpt: |2-
            <p>You approve or deny pending orders using the Process Pending Orders  
          panel.  An order appears as pending if its total value is greater than $500.</p>
    stack_metadata:
      doc.section: "Using the Demo > Placing an Order / Using the Admin Client"
      doc.anchor: "place_order; admin; approve_deny_orders"
  - record_key: order-approval-REQ-0001
    kind: requirement
    capability_key: order-approval
    requirement: >
      The system SHALL hold any order whose total value is greater than $500 in a pending state until an administrator approves or denies it. The administrator SHALL be able to select one or more pending orders, set each to a new status (approved or denied), and save all such changes together in a single commit action; uncommitted status changes SHALL NOT take effect.
    confidence: medium
    confidence_basis: >
      Described explicitly in the usage guide's step-by-step procedure; single documentary source with no code visible in this shard to confirm enforcement or the full set of selectable statuses.
    risk_class: financial
    basis: >
      using.html "Approving/Denying Orders": pending orders are handled in the Process Pending Orders panel; an order is pending if its total value is greater than $500; the admin clicks the Status cell, selects a new status, can approve or deny as many orders as wished, and saves changes by clicking Commit.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 129
        line_end: 132
        excerpt: |2-
            <li>               
              <p>The Admin presents the administrator interface in a JFC/Swing 	front-end. 
           Administrators use the Admin to examine pending orders 	and approve or deny 
           them.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 239
        line_end: 240
        excerpt: |2-
            <p>You approve or deny pending orders using the Process Pending Orders  
          panel.  An order appears as pending if its total value is greater than $500.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 242
        line_end: 265
        excerpt: |2-
            <p>To approve or deny an order:</p>
                   
            <ol>
              	     
              <li>                 
                <p><b>Click the Process Pending Orders tab.</b></p>
              	</li>
                    
              <li>                 
                <p><b>Click the row of the order.</b></p>
              	</li>
                    
              <li>                 
                <p><b>Click its Status cell.</b></p>
              	</li>
                    
              <li>                 
                <p><b>Select a new status.</b></p>
              </li>
                 
            </ol>
                   
            <p>You can approve or deny as many orders as you wish. To save your changes, 
           click Commit. To see your changes, click the Refresh button.</p>
    stack_metadata:
      framework: "JFC/Swing rich client via Java Web Start"
      doc.anchor: "approve_deny_orders"
  - record_key: order-approval-SCREEN-0001
    kind: screen
    capability_key: order-approval
    requirement: >
      The system SHALL provide administrators with two order views: a pending-orders view for approving or denying orders, and a non-pending-orders view listing orders that have been approved, denied, or committed (fulfilled). Each view SHALL be reloadable on demand so that the administrator sees the latest order statuses, including changes the administrator has just committed.
    confidence: medium
    confidence_basis: >
      Screen layout and statuses are described directly in the usage guide; single documentary source, and the admin client source is outside this shard.
    risk_class: operational
    basis: >
      using.html describes two panes for pending and non-pending orders, that non-pending orders have been approved, denied, or committed (fulfilled), and that a Refresh button loads orders / shows committed changes.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 208
        line_end: 208
        excerpt: |2-
          <p>Orders are reviewed and modified using a Java administrator client.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 219
        line_end: 222
        excerpt: |2-
          <p>When the client appears, you will see two panes for displaying pending 
           and non-pending orders. The bulldog order from the previous section would 
           be non-pending, because it was less than $500, and all orders under $500 
          are automatically approved.<br>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 230
        line_end: 232
        excerpt: |2-
            <p>The View Non-Pending Orders panel shows non-pending orders. Each of these
           orders has been approved, denied, or committed (fulfilled). To load the
          orders,  click the Refresh button.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 264
        line_end: 265
        excerpt: |2-
            <p>You can approve or deny as many orders as you wish. To save your changes, 
           click Commit. To see your changes, click the Refresh button.</p>
    stack_metadata:
      framework: "JFC/Swing rich client via Java Web Start"
      doc.anchor: "open_admin; view_non_pending_orders"
  - record_key: checkout-WORKFLOW-0001
    kind: workflow
    capability_key: checkout
    requirement: >
      WHEN a customer submits an order at checkout, the system SHALL accept the order in the storefront and hand it to order processing asynchronously, so that order approval and fulfillment happen after, and independently of, the customer's checkout response.
    confidence: medium
    confidence_basis: >
      The asynchronous hand-off is stated explicitly once in the usage guide; the messaging mechanism itself is not visible in this shard.
    risk_class: operational
    basis: >
      using.html: "When you complete the order, the Storefront sends the order info asyncronously to the OPC." The component overview says the OPC receives orders from the Storefront.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 120
        line_end: 121
        excerpt: |2-
            <li>               
              <p>The Order Processing Center (OPC) receives orders from the 	Storefront.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 201
        line_end: 202
        excerpt: |2-
          <p>When you complete the order, the Storefront sends the order info asyncronously 
           to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>
    stack_metadata:
      doc.anchor: "place_order"
  - record_key: checkout-SCREEN-0001
