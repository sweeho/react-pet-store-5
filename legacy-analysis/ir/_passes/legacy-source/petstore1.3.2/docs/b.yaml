  - record_key: sign-on-WORKFLOW-0001
    kind: workflow
    capability_key: sign-on
    requirement: >
      The system SHALL let a first-time visitor create a customer account from the sign-in page: the sign-in page SHALL offer a sign-up option alongside sign-in, which leads to an account information form; submitting that form SHALL create the account. The account SHALL be created before the visitor can make a purchase.
    confidence: medium
    confidence_basis: >
      The steps are explicit in the usage guide; that an account is REQUIRED before purchase is stated only as advice ("create a new user before making a purchase"), and the enforcing code is outside this shard.
    risk_class: operational
    basis: >
      using.html "Creating a New User": click Sign In, fill the form titled "I would like to sign up for an account", click Create New Account, enter account info and Submit.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 150
        line_end: 165
        excerpt: |2-
          <p>If this is your first time visiting the store, create a new user before 
           making a purchase.</p>
                 
          <ol>
              	   
            <li>               
              <p>Click Sign In on the home page.</p>
              	</li>
                  
            <li>               
              <p>Fill out the form titled, "I would like to sign up 	for an account", 
           and click Create New Account.</p>
              	</li>
                  
            <li>               
              <p>Enter your account info, and click Submit.</p>
    stack_metadata:
