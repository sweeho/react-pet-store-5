  - record_key: supplier-inventory-SCREEN-0001
    kind: screen
    capability_key: supplier-inventory
    requirement: >
      The system SHALL provide supplier staff with a web inventory screen listing the current quantity of every inventory item. For each item the user SHALL be able to enter a new quantity and mark the item for update; on submit, the system SHALL persist the new quantity only for items marked for update, applying all marked changes in one submission.
    confidence: medium
    confidence_basis: >
      Explicit in the usage guide; single documentary source. That unmarked rows are ignored is implied by the separate "Update" checkbox rather than stated outright.
    risk_class: operational
    basis: >
      using.html "Viewing and Editing Inventory": Display Inventory shows a table of quantities; edit New Quantity, check the Update box, then Submit to commit to the database.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 269
        line_end: 272
        excerpt: |2-
            <h3><a name="open_supplier"></a>Opening the Supplier Client</h3>
                   
            <p>The supplier and its inventory are managed using a simple Web interface.
           Make sure to first logout of the admin client, before using the supplier.&nbsp;</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 283
        line_end: 288
        excerpt: |2-
            <p>To view and edit inventory, click Display Inventory at the home screen.</p>
                   
            <p>A table shows the quantity for each item in the inventory. To edit that 
           item's quantity, edit the New Quantity cell in the item's entry, and check 
           the Update box. After making all your changes, commit your edits to the database
           by clicking Submit.</p>
    stack_metadata:
      doc.anchor: "open_supplier; view_edit_inventory"
  - record_key: order-fulfillment-WORKFLOW-0001
    kind: workflow
    capability_key: order-fulfillment
    requirement: >
      The system SHALL fulfill approved orders from supplier inventory and SHALL invoice order processing for what is shipped. WHEN supplier inventory quantities are updated THEN the system SHALL re-examine orders that previously could not be fulfilled, and SHALL mark as completed any order that can now be fulfilled.
    confidence: medium
    confidence_basis: >
      Stated explicitly in the usage guide; single documentary source. Whether partial fulfillment changes status before completion is only implied (see customer-notifications record), so not high.
    risk_class: operational
    basis: >
      using.html: "The Supplier fulfills orders from the OPC from inventory and invoices the OPC." and "Any time you update the database, the Supplier notifies the OPC about the changes to the inventory. The OPC examines these changes to see if it can fulfill any orders that it previously could not. If it can fullill an order, it will mark the order as completed."
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        line_start: 125
        line_end: 126
        excerpt: |2-
              <p>The Supplier fulfills orders from the OPC from inventory and 	invoices 
           the OPC.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
