  - record_key: localization-REQ-0001
    kind: requirement
    capability_key: localization
    requirement: >
      The storefront SHALL be internationalized and SHALL ship with English (en) and Japanese (ja) localizations, each with its own set of localized pages. Catalog category, product and item descriptive details SHALL be stored per locale, so that the catalog can be displayed in the customer's language, and adding a locale SHALL require only new localized pages, screen definitions and catalog data.
    confidence: medium
    confidence_basis: >
      Explicit in the configuring guide. Medium, not high: single documentary source, and the capability list names Chinese as a supported locale which this guide does not (see findings).
    risk_class: presentational
    basis: >
      configuring.html "Adding a New Localization": en and ja localizations; locale pages under docroot/<locale.code>/; screendefinitions_<locale.code>.xml; CategoryDetails, ProductDetails and ItemDetails take an xml:lang locale attribute.
