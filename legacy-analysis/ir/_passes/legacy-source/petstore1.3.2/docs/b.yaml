findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >
      Auto-approval boundary at exactly $500 is not stated. The English guide says orders "less than $500" / "under $500" are auto-approved and orders "greater than $500" are pending (lines 201-202, 219-222, 239-240), leaving exactly $500 undefined. The Chinese translation (zh/using.html lines 190, 209-210, 224-225, GB2312-encoded) says orders "not exceeding 500 dollars" are auto-approved, i.e. $500 is auto-approved. A human must confirm against the OPC approval code which side $500 falls on.
  - kind: conflict
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >
      The docs state a single $500 auto-approval threshold with no locale qualification, while the capability list describes "automatic approval thresholds by locale". The docs also do not say what currency the threshold is in for non-US locales (e.g. Japanese yen prices). Resolve against the OPC approval rule source.
  - kind: conflict
    path: legacy-source/petstore1.3.2/docs/configuring.html
    description: >
      configuring.html lines 206-207 say the storefront ships with English (en) and Japanese (ja) localizations only, while the capability list and the presence of docs/zh/ suggest Chinese is also supported. Confirm from the storefront docroot / screen definitions which locales actually ship.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >
