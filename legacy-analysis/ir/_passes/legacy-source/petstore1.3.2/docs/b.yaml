    capability_key: checkout
    requirement: >
      WHEN a signed-in customer proceeds to checkout from the cart, the system SHALL present a billing and shipping information form that is pre-populated with values, which the customer submits to place the order.
    confidence: low
    confidence_basis: >
      The docs say only that the form is "already filled out" for convenience; they do not say where the values come from (the customer's stored profile or fixed demo data), so the rule behind the pre-fill is unresolved.
    risk_class: presentational
    basis: >
      using.html "Placing an Order": after Check Out, "A form for your billing and shipping info appears. For your convenience, it's already filled out." then Submit.
    traces:
