    stack_metadata:
      doc.anchor: "view_edit_inventory"
  - record_key: customer-notifications-REQ-0001
    kind: requirement
    capability_key: customer-notifications
    requirement: >
      The system SHALL be able to e-mail customers about the status of their orders in three independently switchable kinds: (1) on order approval, (2) an order confirmation/shipment e-mail each time part of the order is fulfilled, and (3) one final e-mail when the order is completely fulfilled. Each kind SHALL be disabled by default and enabled by configuration at deployment.
    confidence: medium
    confidence_basis: >
      The three switches and the default-off behaviour are stated explicitly in the configuring guide; the guide's test paragraph confirms when each fires. Single documentary source; the notification code is outside this shard. Note the example descriptor snippet shows value true, which is the value to set, not the default.
    risk_class: operational
    basis: >
      configuring.html: notifications "By default ... are disabled, but you can enable them at deployment time"; env entries param/SendApprovalMail (MailOrderApprovalMDB), param/SendConfirmationMail (MailInvoiceMDB), param/SendCompletedOrderMail (MailCompletedOrderMDB); "If the order is approved, you will receive an e-mail. You will receive one or more e-mails as parts of the order are fulfilled. When the order is completely fulfilled, you will receive one final e-mail."
