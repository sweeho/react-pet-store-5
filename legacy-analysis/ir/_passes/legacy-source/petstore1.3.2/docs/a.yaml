  - record_key: order-fulfillment-BR-0002
    kind: business-rule
    capability_key: order-fulfillment
    requirement: >
      The system SHALL, whenever supplier inventory quantities are updated, re-examine orders that previously could not be fulfilled, fulfil any that can now be fulfilled, and mark an order completed once it is fully fulfilled.
      GIVEN an approved order that could not be shipped for lack of stock WHEN the supplier increases stock sufficiently THEN the order SHALL be fulfilled and marked completed without further administrator action.
    confidence: medium
    confidence_basis: >
      Explicitly stated once in the docs; partial fulfilment is corroborated by configuring.html ("one or more e-mails as parts of the order are fulfilled"). Code path not verified in this pass.
    risk_class: operational
    basis: >
      using.html "Viewing and Editing Inventory": any time the supplier updates the database it notifies the OPC, which checks whether it can now fulfil orders it previously could not and marks them completed. configuring.html says parts of an order can be fulfilled separately.
    traces:
