findings:
  - kind: conflict
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >
      Auto-approval threshold. The docs state a single $500 rule ("less than $500" auto-approved; "greater than $500" pending) with no locale qualification and no rule for exactly $500. The OPC code (PurchaseOrderMDB.canIApprove, lines 183-191) approves only when locale is US and total < 500, or locale is JAPAN and total < 50000 (yen), and never auto-approves any other locale (e.g. zh_CN). So (a) an order of exactly 500 goes to pending in code but is unspecified in docs, and (b) Japanese and Chinese orders follow different rules than the docs describe. The code comment calls this "just a stub for converting currency". A human must decide the intended per-locale/per-currency thresholds and the boundary.
  - kind: conflict
    path: legacy-source/petstore1.3.2/docs/configuring.html
    description: >
      E-mail notification default. configuring.html lines 48-51 say notifications are disabled by default, but the descriptor excerpts it quotes (lines 145-157) already show env-entry-value true for all three switches, and tell the reader to "ensure" they are true. Which default the rebuild should ship with needs a decision (and the actual ejb-jar.xml values should be checked by the src/apps/opc pass; they were redacted in this workspace).
  - kind: conflict
    path: legacy-source/petstore1.3.2/docs/configuring.html
    description: >
      Supported locales. configuring.html lines 205-207 say the storefront comes with English and Japanese only, while the capability list, the docs/zh translation set and src/apps/petstore/src/docroot/WEB-INF/screendefinitions_zh_CN.xml show a Chinese localization. The English docs appear stale; confirm Chinese is in scope.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >
      using.html line 272: "Make sure to first logout of the admin client, before using the supplier." The reason is not given. It may indicate a shared sign-on/session between the admin and supplier applications, or a role conflict (one principal cannot hold both). A human should decide whether admin and supplier access must be mutually exclusive in the rebuild.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >
      using.html lines 230-231 describe non-pending orders as "approved, denied, or committed (fulfilled)", while lines 290-293 say fulfilled orders are marked "completed". It is unclear whether "committed" and "completed" are the same status. The order status lifecycle should be taken from the OPC code, not these docs.
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/docs/configuring.html
    description: >
      configuring.html "Configuring the Database" (lines 244 onward) documents per-database SQL dialect configuration (Cloudscape default, PopulateSQL.xml, CatalogDAOSQL.xml). This is deployment/infrastructure behaviour with no matching capability and no business rule beyond category ordering (captured as catalog-browsing-BR-0002); not emitted as requirements. Confirm it is out of scope for the rebuild (the rebuild uses a single SQLite store).
