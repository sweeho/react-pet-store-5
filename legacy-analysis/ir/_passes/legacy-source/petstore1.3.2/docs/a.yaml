# Spec extraction SX-0001 · extract-a · legacy-source/petstore1.3.2/docs
# Sources: English HTML docs (using.html, configuring.html). ja/ and zh/ are translations of the same
# pages in legacy encodings (EUC-JP / GB2312); they repeat the same content and are not cited verbatim.
# index.html, installing.html, building.html, whatsnew.html, copyright.html, README carry no business rules.
records:
  - record_key: order-approval-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >
      The system SHALL automatically approve, without administrator review, an order whose total value is below 500 US dollars, and SHALL place an order whose total value is above 500 US dollars in a pending state for administrator review.
      GIVEN an order placed in the US-dollar storefront with a total of less than $500 WHEN it is received for processing THEN it SHALL be approved automatically and SHALL NOT appear among pending orders.
    confidence: medium
    confidence_basis: >
      The documentation states the threshold three times (and the ja/zh translations repeat it), and OPC code corroborates it for the US locale only (PurchaseOrderMDB.canIApprove: < 500). Not high because the docs are silent on the exactly-$500 boundary and on non-US locales, where the code uses a different threshold (see findings); the rule as documented is incomplete.
    risk_class: financial
    basis: >
      using.html "Placing an Order" says an order under $500 is approved automatically by the OPC; "Opening the Admin Client" repeats that all orders under $500 are automatically approved; "Approving/Denying Orders" says an order appears as pending if its total value is greater than $500.
    traces:
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "using.html#place_order — Placing an Order"
        line_start: 201
        line_end: 202
        excerpt: |2-
          <p>When you complete the order, the Storefront sends the order info asyncronously
           to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "using.html#open_admin — Opening the Admin Client"
        line_start: 219
        line_end: 222
        excerpt: |2-
          <p>When the client appears, you will see two panes for displaying pending
           and non-pending orders. The bulldog order from the previous section would
           be non-pending, because it was less than $500, and all orders under $500
          are automatically approved.<br>
      - kind: document
        path: legacy-source/petstore1.3.2/docs/using.html
        anchor: "using.html#approve_deny_orders — Approving/Denying Orders"
        line_start: 239
        line_end: 240
        excerpt: |2-
            <p>You approve or deny pending orders using the Process Pending Orders
          panel.  An order appears as pending if its total value is greater than $500.</p>
    stack_metadata:
      framework: "j2ee-1.3"
      source_type: "html-documentation"
      doc.set: "Java Pet Store Demo 1.3.2 docs (en)"
      corroborated_by: "src/apps/opc/src/com/sun/j2ee/blueprints/opc/ejb/PurchaseOrderMDB.java:183-191 (canIApprove)"
