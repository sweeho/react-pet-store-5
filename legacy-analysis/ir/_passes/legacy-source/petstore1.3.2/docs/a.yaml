      Single documentary source describing the admin client procedure; the admin client code was not examined in this pass. The batch-commit behaviour is stated explicitly ("as many orders as you wish ... click Commit").
    risk_class: financial
    basis: >
      using.html "Approving/Denying Orders": the Process Pending Orders panel, choose a row, click its Status cell, select a new status; approve or deny as many orders as wished, click Commit to save and Refresh to see the changes. "Demo at a Glance" states administrators examine pending orders and approve or deny them.
