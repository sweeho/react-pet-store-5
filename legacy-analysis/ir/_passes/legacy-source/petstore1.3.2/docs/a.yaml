            <h3><a name="approve_deny_orders"></a>Approving/Denying Orders</h3>

            <p>You approve or deny pending orders using the Process Pending Orders
          panel.  An order appears as pending if its total value is greater than $500.</p>

            <p>To approve or deny an order:</p>

            <ol>

              <li>
                <p><b>Click the Process Pending Orders tab.</b></p>
              	</li>

              <li>
                <p><b>Click the row of the order.</b></p>
              	</li>

              <li>
                <p><b>Click its Status cell.</b></p>
              	</li>

              <li>
                <p><b>Select a new status.</b></p>
              </li>

            </ol>

            <p>You can approve or deny as many orders as you wish. To save your changes,
           click Commit. To see your changes, click the Refresh button.</p>
