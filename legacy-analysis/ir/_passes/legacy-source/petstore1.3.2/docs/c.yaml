      change, SHALL re-evaluate orders that previously could not be fulfilled for lack of stock, and
      SHALL mark an order completed once it can be fully fulfilled.
    confidence: medium
    confidence_basis: >-
      Stated directly in one documentation paragraph. The docs do not say whether re-evaluation is
      per order line (partial shipment) or per whole order, though configuring.html implies partial
      shipments exist.
    risk_class: operational
    basis: >-
      using.html "Viewing and Editing Inventory" final paragraph; "Demo at a Glance" says the
      Supplier fulfills orders from inventory and invoices the OPC.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
