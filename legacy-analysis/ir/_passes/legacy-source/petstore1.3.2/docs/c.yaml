  - record_key: CHECKOUT-WF-0001
    kind: workflow
    capability_key: checkout
    requirement: >-
      WHEN a customer checks out a non-empty cart THEN the system SHALL present a billing and
      shipping information form pre-populated with the customer's details, and on submission SHALL
      hand the order to order processing asynchronously, so that order approval is not part of the
      customer's request.
    confidence: medium
    confidence_basis: >-
      The flow is documented in one walkthrough. "Already filled out" does not say which data source
      pre-fills the form (profile or demo defaults), so that part is weaker than the asynchronous
      hand-off.
    risk_class: operational
    basis: >-
      using.html "Placing an Order": Check Out shows a pre-filled billing/shipping form; on Submit
      "the Storefront sends the order info asyncronously to the OPC".
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        kind: document
        anchor: Using the Storefront > Placing an Order
        line_start: 189
        line_end: 202
        excerpt: "    <p>Click Check Out.</p>\n    \t               \n    <p>A form for your billing and shipping info appears. For your \tconvenience, \n it's already filled out.</p>\n    \t</li>\n        \n  <li>               \n    <p>Click Submit.</p>\n    </li>\n     \n</ol>\n       \n<p>When you complete the order, the Storefront sends the order info asyncronously \n to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>\n"
