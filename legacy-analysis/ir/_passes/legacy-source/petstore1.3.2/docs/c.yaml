      The system SHALL let a customer navigate from the home page to a category, from a category to
      a product, and from a product to its list of items (variants such as "Male Adult"), and SHALL
      offer an add-to-cart action on each item row.
    confidence: medium
    confidence_basis: >-
      Taken from a single worked example (bulldog purchase). The category > product > item hierarchy
      is clear, and add-to-cart per item row is stated directly.
    risk_class: presentational
    basis: using.html "Placing an Order" steps 1-3.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        kind: document
        anchor: Using the Storefront > Placing an Order
        line_start: 172
        line_end: 185
        excerpt: "<p>To purchase a bulldog, for example, follow these steps:</p>\n       \n<ol>\n    \t   \n  <li>               \n    <p>On the home page, select Dogs.</p>\n    \t</li>\n        \n  <li>               \n    <p>Click Bulldog.</p>\n    \t</li>\n        \n  <li>               \n    <p>Click Add to Cart in the row for the Male Adult Bulldog.</p>\n"
    stack_metadata:
      framework: j2ee-1.3
      source_type: product documentation (HTML)
  - record_key: CATALOG-BROWSING-BR-0001
