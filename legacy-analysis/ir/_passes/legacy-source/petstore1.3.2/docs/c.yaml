      jsp.page: docroot/<locale>/
findings:
  - kind: ambiguity
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >-
      Approval boundary at exactly $500 is not defined. The docs say orders "less than $500" are
      auto-approved and orders "greater than $500" are pending. A human must decide how an order of
      exactly 500 is treated (a quick look at PurchaseOrderMDB.canIApprove, outside this shard, uses
      "< 500", which would make it pending).
  - kind: conflict
    path: legacy-source/petstore1.3.2/docs/using.html
    description: >-
      The docs describe a single $500 auto-approval threshold with no currency or locale qualifier.
      The capability list says "automatic approval thresholds by locale", and PurchaseOrderMDB
      (outside this shard) has a separate Japan threshold (< 50000) and auto-approves nothing for
      other locales. The docs are incomplete; the rebuild should take the per-locale thresholds from
      code and have an SME confirm them.
  - kind: conflict
    path: legacy-source/petstore1.3.2/docs/configuring.html
    description: >-
      The e-mail notification default contradicts itself. The deployment-tool section says
      notifications are "disabled" by default; the descriptor-editing section shows each env-entry
      value as true and says "ensure" it is true. The shipped ejb-jar.xml values are redacted in
