      The evidence is an example configuration fragment reproduced in documentation, which may be
      abridged or out of date relative to the shipped CatalogDAOSQL.xml. The ordering rule is shown
      only for GET_CATEGORIES.
    risk_class: presentational
    basis: >-
      configuring.html states Category/Product/ItemDetails carry an xml:lang locale attribute; the
      documented DAO fragment filters by "locale = ?" and orders categories "order by name".
    traces:
