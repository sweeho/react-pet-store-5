records:
  - record_key: ORDER-APPROVAL-BR-0001
    kind: business-rule
    capability_key: order-approval
    requirement: >-
      The system SHALL automatically approve a submitted order whose total value is less than 500
      (US dollars), without administrator review, and SHALL hold an order whose total value is
      greater than 500 as pending for administrator review.

      GIVEN an order totalling exactly 500 WHEN it is received for approval THEN the documentation
      does not state the outcome (see findings).
    confidence: medium
    confidence_basis: >-
      The documentation states the $500 threshold three times in one page, with consistent wording.
      It is still a single source (user-facing docs), and it never covers the exact-500 boundary or
      any non-US currency. I did not grade it high because I cannot see whether the other passes
      agree. The documentation also mentions no locale-dependent threshold, although a glance at the
      OPC source (outside this shard) suggests one exists.
    risk_class: financial
    basis: >-
      using.html "Placing an Order" says an order under $500 is auto-approved by the OPC; "Opening
      the Admin Client" repeats "all orders under $500 are automatically approved";
      "Approving/Denying Orders" says an order is pending if its total is greater than $500.
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        kind: document
        anchor: Using the Storefront > Placing an Order
        line_start: 201
        line_end: 202
        excerpt: |
          <p>When you complete the order, the Storefront sends the order info asyncronously 
           to the OPC. Because the order is less than $500, the OPC approves it automatically.</p>
      - path: legacy-source/petstore1.3.2/docs/using.html
        kind: document
        anchor: Using the Admin Client > Opening the Admin Client
        line_start: 219
        line_end: 222
        excerpt: |
          <p>When the client appears, you will see two panes for displaying pending 
           and non-pending orders. The bulldog order from the previous section would 
           be non-pending, because it was less than $500, and all orders under $500 
          are automatically approved.<br>
      - path: legacy-source/petstore1.3.2/docs/using.html
        kind: document
        anchor: Using the Admin Client > Approving/Denying Orders
        line_start: 239
        line_end: 240
        excerpt: |2
            <p>You approve or deny pending orders using the Process Pending Orders  
          panel.  An order appears as pending if its total value is greater than $500.</p>
    stack_metadata:
      framework: j2ee-1.3
      source_type: product documentation (HTML)
      doc.threshold_literal: $500
  - record_key: ORDER-APPROVAL-WF-0001
    kind: workflow
    capability_key: order-approval
    requirement: >-
      The system SHALL let an administrator list pending orders, change the status of one or more
      pending orders to approved or denied, and save all changed statuses together in a single
      explicit commit action; changes SHALL NOT take effect until committed.
    confidence: medium
    confidence_basis: >-
      Documented step-by-step in one place. The batch-commit semantics are clear from the text, but
      the docs do not say what happens to uncommitted edits or whether a commit is partially applied
      on failure.
    risk_class: operational
    basis: >-
      using.html "Approving/Denying Orders": select row, click Status cell, select new status; "You
      can approve or deny as many orders as you wish. To save your changes, click Commit."
    traces:
      - path: legacy-source/petstore1.3.2/docs/using.html
        kind: document
        anchor: Using the Admin Client > Approving/Denying Orders
        line_start: 239
        line_end: 265
        excerpt: "  <p>You approve or deny pending orders using the Process Pending Orders  \npanel.  An order appears as pending if its total value is greater than $500.</p>\n         \n  <p>To approve or deny an order:</p>\n         \n  <ol>\n    \t     \n    <li>                 \n      <p><b>Click the Process Pending Orders tab.</b></p>\n    \t</li>\n          \n    <li>                 \n      <p><b>Click the row of the order.</b></p>\n    \t</li>\n          \n    <li>                 \n      <p><b>Click its Status cell.</b></p>\n    \t</li>\n          \n    <li>                 \n      <p><b>Select a new status.</b></p>\n    </li>\n       \n  </ol>\n         \n  <p>You can approve or deny as many orders as you wish. To save your changes, \n click Commit. To see your changes, click the Refresh button.</p>\n"
      - path: legacy-source/petstore1.3.2/docs/using.html
        kind: document
        anchor: Demo at a Glance
        line_start: 130
        line_end: 132
        excerpt: "    <p>The Admin presents the administrator interface in a JFC/Swing \tfront-end. \n Administrators use the Admin to examine pending orders \tand approve or deny \n them.</p>\n"
    stack_metadata:
      framework: j2ee-1.3
      source_type: product documentation (HTML)
      ui.client: rich desktop client (JFC/Swing, Java Web Start)
