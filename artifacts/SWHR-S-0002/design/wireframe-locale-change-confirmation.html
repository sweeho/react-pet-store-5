<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font:13px/1.4 system-ui,sans-serif;color:#27272a;background:#fff;padding:16px;width:720px}
.frame{border:1px solid #d4d4d8;border-radius:6px;overflow:hidden}
.util{height:30px;background:#f4f4f5;border-bottom:1px solid #e4e4e7;font-size:11px;display:flex;align-items:center;padding:0 12px;gap:6px;color:#52525b}.on{border:1px solid #71717a;background:#fff;border-radius:99px;padding:1px 8px;color:#18181b;font-weight:600}
.hdr{height:44px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;gap:12px;padding:0 12px}.logo{width:80px;height:14px;background:#71717a}.sb{flex:1;height:26px;border:1px solid #d4d4d8;border-radius:4px}
.body{display:flex;gap:12px;padding:12px;min-height:260px}.side{width:120px;border:1px solid #e4e4e7;border-radius:4px;font-size:11px;padding:6px;color:#52525b}
.card{flex:1;border:1px solid #d4d4d8;border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:10px;align-self:flex-start}
.kv{display:flex;gap:12px;border:1px solid #e4e4e7;border-radius:4px;padding:10px;width:320px}.kv span:first-child{color:#52525b;width:130px}
.btn{border:1px solid #71717a;border-radius:4px;padding:6px 12px;font-size:12px}
.ftr{height:22px;background:#f4f4f5;border-top:1px solid #e4e4e7}
</style></head><body>
<div class="frame">
 <div class="util">[Language] · English · <span class="on">日本語</span> · 中文</div>
 <div class="hdr"><span class="logo"></span><span class="sb"></span></div>
 <div class="body"><div class="side"><b>[Pets]</b><br>…</div>
  <div class="card"><b style="font-size:18px">✓ [Language changed]</b>
   <div class="kv"><span>[Locale in effect]</span><b>ja_JP</b></div>
   <div style="display:flex;gap:8px"><span class="btn">[Change again]</span><span class="btn">[Back to home]</span></div></div></div>
 <div class="ftr"></div>
</div>
</body></html>
