<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font:13px/1.4 system-ui,sans-serif;color:#27272a;background:#fff;padding:16px;width:720px}
.frame{border:1px solid #d4d4d8;border-radius:6px;overflow:hidden}
.util{height:30px;background:#f4f4f5;border-bottom:1px solid #e4e4e7;font-size:11px;display:flex;align-items:center;padding:0 12px;color:#52525b}
.hdr{height:44px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;gap:12px;padding:0 12px}.logo{width:80px;height:14px;background:#71717a}.sb{flex:1;height:26px;border:1px solid #d4d4d8;border-radius:4px}
.body{display:flex;gap:12px;padding:12px;min-height:240px}.side{width:120px;border:1px solid #e4e4e7;border-radius:4px;font-size:11px;padding:6px;color:#52525b}
.err{flex:1;border:1px dashed #a1a1aa;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.btn{border:1px solid #71717a;border-radius:4px;padding:6px 12px;font-size:12px}.pri{background:#3f3f46;color:#fff}
.ftr{height:22px;background:#f4f4f5;border-top:1px solid #e4e4e7}.note{font-size:11px;color:#52525b;margin-top:8px}
</style></head><body>
<div class="frame">
 <div class="util">Language · English · 日本語 · 中文</div>
 <div class="hdr"><span class="logo"></span><span class="sb"></span></div>
 <div class="body"><div class="side"><b>Pets</b><br>…</div>
  <div class="err"><b style="font-size:16px">Definition for screen &lt;name&gt; not found</b>
   <div style="display:flex;gap:8px"><span class="btn pri">Try again</span><span class="btn">Back to home</span></div></div></div>
 <div class="ftr"></div>
</div>
<div class="note">This page appears only when neither the current locale nor en_US defines the page. If only the current locale is missing it, the en_US version is shown and this error does not appear.</div>
</body></html>
