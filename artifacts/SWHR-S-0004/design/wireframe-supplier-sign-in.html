<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}body{font:13px/1.4 system-ui,sans-serif;color:#27272a;background:#fff;width:720px}
.u{display:flex;justify-content:space-between;padding:6px 16px;border-bottom:1px solid #e4e4e7;background:#fafafa;font-size:11px;color:#52525b}.u span{margin-right:8px}.fl{display:inline-block;width:14px;height:9px;background:#d4d4d8;border:1px solid #a1a1aa;margin-right:3px;vertical-align:middle}.on{font-weight:700;text-decoration:underline}
.h{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #e4e4e7}.logo{width:90px;height:24px;background:#d4d4d8;border:1px solid #a1a1aa;font-size:10px;display:grid;place-items:center}
.s{flex:1;display:flex}.s div{flex:1;height:28px;border:1px solid #a1a1aa;border-radius:4px 0 0 4px}.s b{border:1px solid #71717a;padding:5px 10px;border-radius:0 4px 4px 0;background:#e4e4e7;font-size:12px}
.a{display:flex;gap:10px;font-size:12px;align-items:center}.ob{border:1px solid #71717a;border-radius:4px;padding:4px 10px}
.b{display:flex;gap:16px;padding:16px;min-height:330px}.side{width:130px;border:1px solid #e4e4e7;border-radius:6px;padding:8px;font-size:12px;align-self:flex-start}.side h4{font-size:10px;color:#71717a;margin-bottom:4px}.side div{padding:5px 4px}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:16px}
.card{width:300px;border:1px solid #d4d4d8;border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px}
h1{font-size:16px}.sub{font-size:11px;color:#71717a}label{font-size:11px;color:#52525b}.in{height:28px;border:1px solid #a1a1aa;border-radius:4px;padding:5px 8px;font-size:12px}
.btn{border:1px solid #3f3f46;border-radius:4px;padding:6px 14px;font-weight:600;background:#d4d4d8;text-align:center}
.f{border-top:1px solid #e4e4e7;padding:12px 16px;display:flex;justify-content:space-between}.bar{height:8px;background:#e4e4e7;border-radius:4px}
</style></head><body>
<div class="u"><div><span>Language</span><span><i class="fl"></i>English</span><span><i class="fl"></i>日本語</span><span><i class="fl"></i>中文</span></div><div>Store staff: <span>Administration</span><span class="on">Supplier</span></div></div>
<div class="h"><div class="logo">Pet Store logo</div><div class="s"><div></div><b>Search</b></div><div class="a"><span>Account</span><span>Cart (0)</span><span class="ob">Sign in</span></div></div>
<div class="b"><div class="side"><h4>PETS</h4><div>Birds</div><div>Cats</div><div>Dogs</div><div>Fish</div><div>Reptiles</div></div>
<main><div class="card">
<h1>Supplier sign-in</h1><p class="sub">Warehouse and stock staff.</p>
<label>User name</label><div class="in"></div>
<label>Password</label><div class="in"></div>
<span class="btn">Sign In</span></div>
<p style="font-size:11px;color:#71717a;margin-top:10px">Success → Supplier home. Failure → Supplier sign-in error.</p>
</main></div>
<div class="f"><div class="bar" style="width:180px"></div><div class="bar" style="width:220px"></div></div>
</body></html>
